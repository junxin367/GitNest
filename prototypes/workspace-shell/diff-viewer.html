<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitNest Diff Viewer</title>
  <link rel="stylesheet" href="./button.css" />
  <link rel="stylesheet" href="./input.css" />
  <link rel="stylesheet" href="./diff-search-popover.css" />
  <style>
    :root {
      color-scheme: dark;
      --font-size-caption: 12px;
      --font-size-emphasis: 16px;
      --line-height-body: 1.5;
      --font-weight-semibold: 600;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --radius-small: 4px;
      --radius-regular: 8px;
      --radius-large: 12px;
      --control-compact: 32px;
      --icon-small: 16px;
      --icon-regular: 20px;
      --motion-micro: 180ms;
      --color-text-disabled: #657486;
      --color-focus: #7de3d7;
      --canvas: #090d12;
      --surface: #101721;
      --surface-2: #151e2a;
      --surface-3: #1a2532;
      --surface-hover: #1d2937;
      --border: #2a3747;
      --border-soft: #202b38;
      --text: #ecf2f8;
      --text-soft: #b9c5d2;
      --muted: #7f8c9b;
      --accent: #61a8ff;
      --accent-soft: rgba(97, 168, 255, 0.14);
      --green: #52d49a;
      --green-soft: rgba(50, 190, 125, 0.14);
      --green-gutter: rgba(50, 190, 125, 0.2);
      --red: #ff7c86;
      --red-soft: rgba(238, 83, 96, 0.14);
      --red-gutter: rgba(238, 83, 96, 0.2);
      --yellow: #f2c766;
      --purple: #b69cff;
      --code-bg: #0c1219;
      --code-border: #1c2733;
      --selection: rgba(97, 168, 255, 0.22);
      --shadow: 0 18px 44px rgba(0, 0, 0, 0.34);
      --shadow-popover: 0 14px 38px rgba(0, 0, 0, 0.28);
      --font-sans: Inter, "Segoe UI", "Microsoft YaHei UI", sans-serif;
      --font-mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--text);
      background: var(--canvas);
      font-family: var(--font-sans);
      font-size: 13px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
      touch-action: manipulation;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible {
      outline: 1px solid var(--color-focus);
      outline-offset: 2px;
    }

    .icon {
      display: block;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .app {
      display: grid;
      grid-template-rows: 42px minmax(0, 1fr) 24px;
      width: 100vw;
      height: 100vh;
      min-width: 920px;
      background: var(--canvas);
    }

    .titlebar {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 0 14px;
      background: #080c11;
      border-bottom: 1px solid var(--border-soft);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-weight: 650;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      color: #081019;
      background: linear-gradient(145deg, #7dc0ff, #4d93ed);
      border-radius: 7px;
      box-shadow: 0 5px 16px rgba(52, 126, 220, 0.3);
    }

    .title-separator {
      width: 1px;
      height: 18px;
      background: var(--border);
    }

    .title-context {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      color: var(--text-soft);
    }

    .title-context strong {
      overflow: hidden;
      font-family: var(--font-mono);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 0 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .toolbar-divider {
      width: 1px;
      height: 22px;
      margin: 0 2px;
      background: var(--border);
    }

    .toolbar-spacer {
      flex: 1;
      min-width: 10px;
    }

    .segmented {
      display: flex;
      align-items: center;
      padding: 2px;
      background: var(--canvas);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .segmented .gn-button[data-variant="toolbar"] {
      border-radius: calc(var(--radius-regular) - 2px);
    }

    .hunk-navigation {
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }

    .diff-search-placement {
      position: absolute;
      top: 52px;
      right: 12px;
      width: min(360px, calc(100% - 24px));
    }

    .search-count {
      min-width: 42px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
      text-align: center;
    }

    .workspace {
      display: grid;
      grid-template-columns: 286px minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
    }

    .content {
      display: grid;
      grid-template-rows: 48px minmax(0, 1fr);
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar {
      display: grid;
      grid-template-rows: 48px minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
    }

    .sidebar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      min-width: 0;
      padding: 0 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .sidebar-head strong {
      flex: 0 0 4em;
      min-width: 4em;
      overflow: hidden;
      color: var(--text);
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
    }

    .sidebar-tools {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      min-width: 0;
    }

    .file-filter-mount {
      flex: 1 1 132px;
      width: 132px;
      max-width: 152px;
      min-width: 96px;
    }

    .file-filter-mount > .gn-input-field {
      width: 100%;
    }

    .file-filter-mount .gn-input {
      min-width: 0;
      background: var(--surface-2);
      border-color: var(--border-soft);
      font-size: var(--font-size-caption);
    }

    .file-filter-mount .gn-input__clear[hidden] {
      display: none;
    }

    .file-view-menu {
      position: relative;
      display: flex;
      flex: 0 0 var(--control-compact);
      align-items: center;
    }

    .file-view-menu > .gn-button[aria-expanded="true"] {
      color: var(--text);
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .menu-surface {
      z-index: 200;
      display: grid;
      width: 222px;
      padding: var(--space-2);
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow-popover);
    }

    .menu-surface[hidden] {
      display: none;
    }

    .file-view-popover {
      width: 184px;
    }

    .menu-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      gap: var(--space-2);
      width: 100%;
      min-height: 34px;
      padding: 0 var(--space-2);
      color: var(--text-soft);
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: var(--radius-regular);
      cursor: pointer;
      font-size: var(--font-size-caption);
      line-height: 1;
    }

    .menu-item[data-has-leading="true"] {
      grid-template-columns: 22px minmax(0, 1fr);
    }

    .menu-item:hover:not(:disabled),
    .menu-item:focus-visible:not(:disabled) {
      color: var(--text);
      background: var(--surface-hover);
    }

    .menu-item:disabled {
      color: var(--color-text-disabled);
      cursor: not-allowed;
      opacity: 0.72;
    }

    .menu-item-leading {
      display: grid;
      place-items: center;
      width: 22px;
      min-width: 0;
      line-height: 0;
    }

    .menu-item-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-list {
      min-height: 0;
      overflow: auto;
      padding: 0;
    }

    .file-group {
      min-width: 0;
    }

    .file-group-header {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      height: 28px;
      padding-right: 8px;
      padding-left: 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border-soft);
    }

    .file-group-header:hover,
    .file-group-header:focus-within {
      background: var(--surface-hover);
    }

    .file-group-title {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      gap: 8px;
      height: 100%;
      min-width: 0;
      padding: 0;
      color: var(--muted);
      text-align: left;
      background: transparent;
      border: 0;
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .file-group-title:hover {
      color: var(--text-soft);
    }

    .file-group-tail {
      position: relative;
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      min-width: calc(var(--icon-small) * 2 + 4px);
      min-height: var(--control-compact);
    }

    .file-group-header .group-count {
      position: absolute;
      right: 0;
      min-width: 20px;
      height: 18px;
      padding: 0 var(--space-1);
      color: var(--muted);
      background: var(--surface-3);
      border-radius: 999px;
      transition: opacity var(--motion-micro) ease;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      line-height: 18px;
      text-align: center;
    }

    .file-group-actions {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--motion-micro) ease;
    }

    .file-group-header.has-actions:hover .file-group-actions,
    .file-group-header.has-actions:focus-within .file-group-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .file-group-header.has-actions:hover .group-count,
    .file-group-header.has-actions:focus-within .group-count {
      opacity: 0;
    }

    .file-group-actions .gn-button {
      width: var(--gn-button-icon-size, 14px);
      min-width: var(--gn-button-icon-size, 14px);
      height: var(--gn-button-icon-size, 14px);
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .file-group-actions .gn-button:hover:not(:disabled),
    .file-group-actions .gn-button:active:not(:disabled),
    .file-group-actions .gn-button:disabled,
    .file-group-actions .gn-button[data-selected="true"] {
      color: var(--text);
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }

    .file-group-actions .gn-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .file-item {
      --diff-workspace-file-backdrop: transparent;
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 44px;
      padding: 4px 8px 4px 12px;
      color: var(--text-soft);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
    }

    .file-item:hover,
    .file-item:focus-within {
      --diff-workspace-file-backdrop: var(--surface-hover);
      background: var(--surface-hover);
    }

    .file-item.active {
      --diff-workspace-file-backdrop: color-mix(
        in srgb,
        var(--accent) 13%,
        var(--surface)
      );
      color: var(--text);
      background: var(--diff-workspace-file-backdrop);
      box-shadow: inset 2px 0 0 var(--accent);
    }

    .file-select {
      display: grid;
      gap: 2px;
      min-width: 0;
      padding: 0;
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .file-select .file-name,
    .file-select .file-dir {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-select .file-name {
      direction: rtl;
      color: inherit;
      font-size: 12px;
      font-weight: 500;
      text-align: left;
    }

    .file-meta {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .file-status {
      display: grid;
      place-items: center;
      width: 14px;
      height: 14px;
      color: var(--yellow);
      background: rgba(242, 199, 102, 0.12);
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
    }

    .file-status.untracked {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .file-dir {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-change-stats {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
      margin-left: 4px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .file-change-stats .additions {
      color: var(--green);
    }

    .file-change-stats .deletions {
      color: var(--red);
    }

    .stage-toggle {
      color: var(--muted);
    }

    .stage-toggle:hover:not(:disabled) {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 28%, transparent);
    }

    .file-actions {
      position: absolute;
      top: 0;
      right: 8px;
      bottom: 0;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      padding-left: var(--space-5);
      opacity: 0;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        transparent,
        var(--diff-workspace-file-backdrop) var(--space-5)
      );
      transition: opacity var(--motion-micro) ease;
    }

    .file-item:hover .file-actions,
    .file-item:focus-within .file-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .file-actions .gn-button {
      width: var(--gn-button-icon-size, 14px);
      min-width: var(--gn-button-icon-size, 14px);
      height: var(--gn-button-icon-size, 14px);
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .file-actions .gn-button:hover:not(:disabled),
    .file-actions .gn-button:active:not(:disabled),
    .file-actions .gn-button:disabled,
    .file-actions .gn-button[data-selected="true"] {
      color: var(--text);
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }

    .file-actions .gn-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .file-tree-directory {
      display: grid;
      grid-template-columns: 16px 16px minmax(0, 1fr);
      align-items: center;
      gap: var(--space-1);
      width: 100%;
      min-width: 0;
      min-height: var(--control-compact);
      padding-top: 0;
      padding-right: var(--space-2);
      padding-bottom: 0;
      color: var(--muted);
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
      font-size: var(--font-size-caption);
      font-weight: 500;
    }

    .file-tree-directory:hover {
      color: var(--text-soft);
      background: var(--surface-hover);
    }

    .file-tree-directory-chevron,
    .file-tree-directory-folder {
      display: grid;
      place-items: center;
      line-height: 0;
    }

    .file-tree-directory-chevron {
      transition: transform var(--motion-micro) ease;
    }

    .file-tree-directory:not(.collapsed) .file-tree-directory-chevron {
      transform: rotate(90deg);
    }

    .file-tree-directory-folder {
      color: var(--accent);
    }

    .file-tree-directory-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .main {
      position: relative;
      display: grid;
      grid-template-rows: 44px minmax(0, 1fr);
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--code-bg);
    }

    .file-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      overflow: hidden;
      padding: 0 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .file-heading {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      gap: 4px;
      min-width: 0;
      overflow: hidden;
    }

    .file-path-copy-button {
      flex: 0 0 var(--control-compact);
    }

    .file-path-copy-button.copied {
      color: var(--green);
      background: var(--green-soft);
      border-color: color-mix(in srgb, var(--green) 28%, transparent);
    }

    .file-path-copy-button.failed {
      color: var(--red);
      background: var(--red-soft);
      border-color: color-mix(in srgb, var(--red) 28%, transparent);
    }

    .file-heading-path {
      display: -webkit-box;
      flex: 1 1 auto;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      overflow-wrap: anywhere;
      color: var(--text-soft);
      font-family: var(--font-mono);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: normal;
      word-break: break-word;
      line-height: 1.35;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .diff-change-summary {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 10px;
      min-height: 24px;
      font-size: 11px;
      white-space: nowrap;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .diff-change-summary strong {
      color: var(--green);
      font-weight: 700;
    }

    .diff-change-summary em {
      color: var(--red);
      font-style: normal;
      font-weight: 700;
    }

    .diff-viewport {
      position: relative;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow-x: auto;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      background: var(--code-bg);
    }

    .diff-table {
      min-width: 100%;
      width: max-content;
      padding: 8px 0 24px;
      color: #c8d3df;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 20px;
    }

    .diff-table.split {
      min-width: max(100%, 1040px);
    }

    .diff-table.split-panes {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      width: 100%;
      min-width: 0;
      padding: 0;
    }

    .diff-viewport.split-nowrap {
      overflow: hidden;
    }

    .diff-viewport.split-nowrap #diffMount {
      height: 100%;
      min-height: 0;
    }

    .split-shell {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }

    .split-scroll-region {
      min-width: 0;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .split-pane {
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-inline: contain;
      scrollbar-width: none;
    }

    .split-pane::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .split-pane + .split-pane {
      border-left: 1px solid var(--border);
    }

    .split-pane-content {
      width: max-content;
      min-width: 100%;
      padding: 8px 0 24px;
    }

    .split-pane-row {
      display: grid;
      grid-template-columns: 48px 22px minmax(420px, 1fr);
      width: 100%;
      min-width: 520px;
      min-height: 20px;
    }

    .split-scrollbar {
      width: 100%;
      min-width: 0;
      height: 14px;
      overflow-x: auto;
      overflow-y: hidden;
      background: var(--surface-2);
      border-top: 1px solid var(--border-soft);
      outline: none;
    }

    .split-scrollbar:focus-visible {
      box-shadow: inset 0 0 0 1px var(--color-focus);
    }

    .split-scrollbar-track {
      height: 1px;
    }

    .diff-table.unified {
      min-width: max(100%, 760px);
    }

    .split-row {
      display: grid;
      grid-template-columns:
        48px 22px minmax(420px, 1fr)
        48px 22px minmax(420px, 1fr);
      min-height: 20px;
    }

    .unified-row {
      display: grid;
      grid-template-columns: 48px 48px 22px minmax(610px, 1fr);
      min-height: 20px;
    }

    .split-pane-row:hover .code-cell,
    .split-row:hover .code-cell,
    .unified-row:hover .code-cell {
      filter: brightness(1.08);
    }

    .line-number {
      padding: 0 8px 0 4px;
      color: #596777;
      background: #0b1118;
      border-right: 1px solid var(--code-border);
      font-variant-numeric: tabular-nums;
      text-align: right;
      user-select: none;
    }

    .change-marker {
      color: var(--muted);
      background: #0d141c;
      text-align: center;
      user-select: none;
    }

    .code-cell {
      min-width: 0;
      padding: 0 12px;
      background: var(--code-bg);
      border-right: 1px solid var(--code-border);
    }

    .code {
      display: block;
      min-height: 20px;
      white-space: pre;
      tab-size: 2;
    }

    body.wrap-lines .diff-table {
      width: 100%;
    }

    body.wrap-lines .diff-table.split,
    body.wrap-lines .diff-table.unified {
      min-width: 100%;
    }

    body.wrap-lines .split-row {
      grid-template-columns:
        48px 22px minmax(0, 1fr)
        48px 22px minmax(0, 1fr);
    }

    body.wrap-lines .unified-row {
      grid-template-columns: 48px 48px 22px minmax(0, 1fr);
    }

    body.wrap-lines .code {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .line-number.cell-delete,
    .change-marker.cell-delete {
      color: color-mix(in srgb, var(--red) 76%, var(--muted));
      background: var(--red-gutter);
    }

    .code-cell.cell-delete {
      background: var(--red-soft);
    }

    .line-number.cell-add,
    .change-marker.cell-add {
      color: color-mix(in srgb, var(--green) 76%, var(--muted));
      background: var(--green-gutter);
    }

    .code-cell.cell-add {
      background: var(--green-soft);
    }

    .line-number.empty-side,
    .change-marker.empty-side,
    .code-cell.empty-side {
      background:
        repeating-linear-gradient(
          -45deg,
          rgba(255, 255, 255, 0.012),
          rgba(255, 255, 255, 0.012) 4px,
          transparent 4px,
          transparent 8px
        );
    }

    .hunk-row {
      display: grid;
      grid-template-columns: 1fr;
      min-height: 30px;
      margin: 8px 0 3px;
      scroll-margin-top: 14px;
    }

    .hunk-row:first-child {
      margin-top: 0;
    }

    .hunk-content {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      color: color-mix(in srgb, var(--accent) 74%, var(--text-soft));
      background: rgba(50, 106, 169, 0.2);
      border-top: 1px solid rgba(97, 168, 255, 0.14);
      border-bottom: 1px solid rgba(97, 168, 255, 0.14);
    }

    .hunk-label,
    .hunk-trigger {
      flex: 1 1 auto;
      min-width: max-content;
    }

    .hunk-label {
      white-space: pre;
    }

    .hunk-trigger {
      display: inline-flex;
      align-items: center;
      padding: 0 2px;
      color: inherit;
      background: transparent;
      border: 0;
      border-radius: 2px;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .hunk-trigger > span {
      color: inherit;
      font: inherit;
      white-space: pre;
    }

    .hunk-trigger:hover {
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }

    .hunk-trigger:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .hunk-row.current .hunk-content {
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .syntax-comment {
      color: #758699;
      font-style: italic;
    }

    .syntax-string {
      color: #cfb780;
    }

    .syntax-keyword {
      color: #be9cf4;
    }

    mark.search-hit {
      padding: 0;
      color: inherit;
      background: rgba(242, 199, 102, 0.38);
      border-radius: 2px;
    }

    mark.search-hit.current {
      color: #17120a;
      background: var(--yellow);
      box-shadow: 0 0 0 1px rgba(255, 230, 145, 0.72);
    }

    .discard-confirm-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      display: grid;
      place-items: center;
      padding: var(--space-5);
      background: rgba(3, 7, 12, 0.72);
      backdrop-filter: blur(7px);
    }

    .discard-confirm-dialog {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: min(560px, calc(100vw - 48px));
      max-height: min(640px, calc(100vh - 64px));
      overflow: hidden;
      background: var(--surface);
      border: 1px solid color-mix(in srgb, var(--red) 44%, var(--border));
      border-radius: var(--radius-large);
      box-shadow: var(--shadow);
    }

    .discard-confirm-header {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-4);
      border-bottom: 1px solid var(--border-soft);
    }

    .discard-confirm-header > div {
      min-width: 0;
    }

    .discard-confirm-icon {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 40px;
      height: 40px;
      color: var(--red);
      background: var(--red-soft);
      border-radius: var(--radius-large);
    }

    .discard-confirm-eyebrow {
      color: var(--red);
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .discard-confirm-dialog h2,
    .discard-confirm-dialog p {
      margin: 0;
    }

    .discard-confirm-dialog h2 {
      margin-top: var(--space-1);
      font-size: var(--font-size-emphasis);
    }

    .discard-confirm-header p {
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .discard-confirm-body {
      display: grid;
      gap: var(--space-4);
      padding: var(--space-4);
      overflow: auto;
    }

    .discard-confirm-warning {
      display: flex;
      align-items: flex-start;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      color: var(--red);
      background: var(--red-soft);
      border: 1px solid color-mix(in srgb, var(--red) 32%, transparent);
      border-radius: var(--radius-regular);
      font-size: var(--font-size-caption);
    }

    .discard-confirm-target {
      display: grid;
      gap: var(--space-1);
      min-width: 0;
    }

    .discard-confirm-target > span {
      color: var(--muted);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .discard-confirm-target code {
      overflow: hidden;
      color: var(--text-soft);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .discard-confirm-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-3) var(--space-4);
      background: var(--surface-2);
      border-top: 1px solid var(--border-soft);
    }

    .discard-confirm-footer > p {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .discard-confirm-footer > div {
      display: flex;
      flex: 0 0 auto;
      gap: var(--space-2);
    }

    .notice {
      position: absolute;
      top: 12px;
      left: 50%;
      z-index: 5;
      max-width: min(560px, calc(100% - 32px));
      padding: 9px 12px;
      color: var(--text);
      background: color-mix(in srgb, var(--surface-3) 94%, black);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -8px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .notice.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 100%;
      color: var(--muted);
      text-align: center;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text-soft);
    }

    .statusbar {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      padding: 0 10px;
      color: var(--muted);
      background: #080c11;
      border-top: 1px solid var(--border-soft);
      font-size: 10px;
    }

    .statusbar span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .statusbar .status-spacer {
      flex: 1;
    }

    kbd {
      padding: 1px 4px;
      color: var(--text-soft);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-bottom-color: #36465a;
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 9px;
    }

    @media (max-width: 1100px) {
      .workspace {
        grid-template-columns: 248px minmax(0, 1fr);
      }

      .wrap-button .gn-button__label {
        display: none;
      }

      .wrap-button {
        width: var(--control-compact);
        min-width: var(--control-compact);
        padding: 0;
      }
    }
  </style>

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    function filteredFiles() {

      if (!query) return repository.files;
      return repository.files.filter((file) =>

      );
    }

    function currentFile() {

    function fileName(path) {
      return String(path).split(/[\\/]/).pop() || path;
    }

    function fileDirectory(path) {
      const parts = String(path).split(/[\\/]/);
      parts.pop();
      return parts.join("/") || ".";

    function fileStatusLabel(file) {
      if (file.status === "untracked") return "未跟踪";

    function expandedRows(file) {
      if (!file || file.status === "untracked") return file?.rows || [];
      if (file.fullRows) return file.fullRows;

      const contextBefore = [
        `public final class ${fileName(file.path).replace(/\.[^.]+$/, "")} {`,
        "    private final RepositoryClient repositoryClient;",
        "    private final Clock clock;",
        "",
        "    // 当前变更所在类的字段与构造函数",
        "    public WorkspaceSnapshot load(Path root) {",
        "        requireReadableDirectory(root);",
        "        GitStatus status = repositoryClient.status(root);",
        "",
        "        // 进入当前变更位置",
        "        List<ChangedFile> files = status.changedFiles();",
        ""
      ];
      const contextAfter = [
        "",
        "        return WorkspaceSnapshot.builder()",
        "            .root(root)",
        "            .changedFiles(files)",
        "            .build();",
        "    }",
        "",
        "    private void requireReadableDirectory(Path root) {",
        "        if (!Files.isReadable(root)) {",
        "            throw new IllegalArgumentException(\"Workspace is not readable\");",
        "        }",
        "    }"
      ];
      const groups = [];
      let current = null;
      file.rows.forEach((row) => {
        if (row.kind === "hunk") {
          current = { header: row, body: [] };
          groups.push(current);
        } else if (current) {
          current.body.push(row);
        }
      });
      file.fullRows = groups.flatMap((group) => {
        const firstNumber = group.body
          .map((row) => Number(row.oldNo ?? row.newNo))
          .find((value) => Number.isFinite(value)) || 1;
        const lastNumber = [...group.body]
          .reverse()
          .map((row) => Number(row.oldNo ?? row.newNo))
          .find((value) => Number.isFinite(value)) || firstNumber;
        const prefix = contextBefore.map((text, index) => {
          const lineNumber = Math.max(
            1,
            firstNumber - contextBefore.length + index
          );
          return {
            kind: "context",
            oldNo: lineNumber,
            newNo: lineNumber,
            text
          };
        });
        const suffix = contextAfter.map((text, index) => ({
          kind: "context",
          oldNo: lastNumber + index + 1,
          newNo: lastNumber + index + 1,
          text
        }));
        return [
          group.header,
          ...prefix,
          ...group.body,
          ...suffix
        ];
      });
      return file.fullRows;
    }

    function rowsForContext(file) {
      const rows = expandedRows(file);
      if (!file || file.status === "untracked") {
        return rows;
      }

      const hunks = [];
      let current = null;
      rows.forEach((row) => {
        if (row.kind === "hunk") {
          current = { header: row, body: [] };
          hunks.push(current);
        } else if (current) {
          current.body.push(row);
        }
      });
      return hunks.flatMap((hunk, hunkIndex) => {
        const context = state.hunkContexts[hunkIndex] || {
          beforeLines: defaultDiffContextLines,
          afterLines: defaultDiffContextLines,
          full: false
        };
        const changedIndexes = hunk.body
          .map((row, index) => row.kind === "context" ? -1 : index)
          .filter((index) => index >= 0);
        if (!changedIndexes.length || context.full) {
          return [hunk.header, ...hunk.body];
        }
        const start = Math.max(
          0,
          changedIndexes[0] - context.beforeLines
        );
        const end = Math.min(
          hunk.body.length,
          changedIndexes[changedIndexes.length - 1] +
            context.afterLines +
            1
        );
        return [
          hunk.header,
          ...hunk.body.slice(start, end)
        ];
      });
    }

    function canExpandContext(file) {
      return Boolean(
        file &&
        file.status !== "untracked" &&
        !file.binary &&
        !file.truncated &&
        expandedRows(file).length > file.rows.length
      );

    function fileStats(file) {
      return file.rows.reduce((stats, row) => {
        if (row.kind === "pair") {
          stats.additions += 1;
          stats.deletions += 1;
        } else if (row.kind === "add") {
          stats.additions += 1;
        } else if (row.kind === "delete") {
          stats.deletions += 1;
        } else if (row.kind === "hunk") {
          stats.hunks += 1;
        }
        return stats;
      }, { additions: 0, deletions: 0, hunks: 0 });
    }

    function searchableEntries(file) {
      const entries = [];
      rowsForContext(file).forEach((row, rowIndex) => {
        if (row.kind === "hunk") {
          entries.push({ key: `${rowIndex}:hunk`, text: row.text });
        } else if (row.kind === "pair") {
          entries.push({ key: `${rowIndex}:old`, text: row.oldText });
          entries.push({ key: `${rowIndex}:new`, text: row.newText });
        } else {
          entries.push({ key: `${rowIndex}:${row.kind}`, text: row.text });
        }
      });
      return entries;
    }

    function collectSearchMatches(file) {
      const query = state.searchQuery.trim().toLocaleLowerCase();
      if (!query) return [];

      let id = 0;
      return searchableEntries(file).flatMap((entry) => {
        const normalized = entry.text.toLocaleLowerCase();
        const matches = [];
        let start = normalized.indexOf(query);
        while (start >= 0) {
          matches.push({
            id: id++,
            key: entry.key,
            start,
            end: start + query.length
          });
          start = normalized.indexOf(query, start + query.length);
        }
        return matches;
      });
    }

    function syntaxMarkup(value) {
      const text = String(value || "");
      const trimmed = text.trimStart();
      if (trimmed.startsWith("//") || trimmed.startsWith("#")) {
        return `<span class="syntax-comment">${escapeHtml(text)}</span>`;
      }

      const tokens = [];
      const pattern = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(public|private|protected|class|return|new|final|void|boolean|if|throw|extends|implements|static)\b/g;
      let cursor = 0;
      let match;
      while ((match = pattern.exec(text))) {
        tokens.push(escapeHtml(text.slice(cursor, match.index)));
        tokens.push(
          match[1]
            ? `<span class="syntax-string">${escapeHtml(match[0])}</span>`
            : `<span class="syntax-keyword">${escapeHtml(match[0])}</span>`
        );
        cursor = match.index + match[0].length;
      }
      tokens.push(escapeHtml(text.slice(cursor)));
      return tokens.join("");
    }

    function textMarkup(value, key) {
      const text = String(value || "");
      const matches = state.searchMatches.filter((match) => match.key === key);
      if (!matches.length) return syntaxMarkup(text);

      let cursor = 0;
      const parts = [];
      matches.forEach((match) => {
        parts.push(syntaxMarkup(text.slice(cursor, match.start)));
        parts.push(
          `<mark class="search-hit${match.id === state.activeMatch ? " current" : ""}" data-match-id="${match.id}">${escapeHtml(text.slice(match.start, match.end))}</mark>`
        );
        cursor = match.end;
      });
      parts.push(syntaxMarkup(text.slice(cursor)));
      return parts.join("");
    }

    function emptySplitCells() {
      return `

      `;

    function splitCell(type, lineNumber, text, key) {
      const marker = type === "delete" ? "−" : type === "add" ? "+" : "";
      const className = type === "delete"
        ? "cell-delete"
        : type === "add"
          ? "cell-add"
          : "";
      return `
        <span class="line-number ${className}">${lineNumber ?? ""}</span>
        <span class="change-marker ${className}">${marker}</span>
        <span class="code-cell ${className}"><span class="code">${textMarkup(text, key)}</span></span>
      `;
    }

    function renderSplitRow(row, rowIndex) {
      if (row.kind === "hunk") {
        return renderHunk(row, rowIndex);
      }
      if (row.kind === "context") {
        return `
          <div class="split-row">
            ${splitCell("context", row.oldNo, row.text, `${rowIndex}:context`)}
            ${splitCell("context", row.newNo, row.text, `${rowIndex}:context`)}
          </div>
        `;
      }
      if (row.kind === "pair") {
        return `
          <div class="split-row">
            ${splitCell("delete", row.oldNo, row.oldText, `${rowIndex}:old`)}
            ${splitCell("add", row.newNo, row.newText, `${rowIndex}:new`)}
          </div>
        `;
      }
      if (row.kind === "delete") {
        return `
          <div class="split-row">
            ${splitCell("delete", row.oldNo, row.text, `${rowIndex}:delete`)}
            ${emptySplitCells()}
          </div>
        `;
      }
      return `
        <div class="split-row">
          ${emptySplitCells()}
          ${splitCell("add", row.newNo, row.text, `${rowIndex}:add`)}
        </div>
      `;
    }

    function renderSplitPaneRow(row, rowIndex, side) {
      if (row.kind === "hunk") {
        return renderHunk(row, rowIndex);
      }

      let cellMarkup = emptySplitCells();
      if (row.kind === "context") {
        cellMarkup = splitCell(
          "context",
          side === "old" ? row.oldNo : row.newNo,
          row.text,
          `${rowIndex}:context`
        );
      } else if (row.kind === "pair") {
        cellMarkup = side === "old"
          ? splitCell("delete", row.oldNo, row.oldText, `${rowIndex}:old`)
          : splitCell("add", row.newNo, row.newText, `${rowIndex}:new`);
      } else if (row.kind === "delete" && side === "old") {
        cellMarkup = splitCell("delete", row.oldNo, row.text, `${rowIndex}:delete`);
      } else if (row.kind === "add" && side === "new") {
        cellMarkup = splitCell("add", row.newNo, row.text, `${rowIndex}:add`);
      }

      return `<div class="split-pane-row">${cellMarkup}</div>`;
    }

    function renderSplitPanes(rows) {
      const renderPane = (side, label) => `
        <div class="split-pane ${side}" aria-label="${label}">
          <div class="split-pane-content">
            ${rows
              .map((row, rowIndex) => renderSplitPaneRow(row, rowIndex, side))
              .join("")}

        </div>
      `;

      return `
        <div class="split-shell">
          <div class="split-scroll-region">
            <div class="diff-table split split-panes">
              ${renderPane("old", "原文件")}
              ${renderPane("new", "新文件")}
            </div>
          </div>
          <div class="split-scrollbar" tabindex="0" aria-label="并排 Diff 水平滚动">
            <div class="split-scrollbar-track"></div>
          </div>
        </div>
      `;
    }

    function updateSplitScrollMetrics() {
      const panes = Array.from(elements.diffMount.querySelectorAll(".split-pane"));
      const contents = Array.from(elements.diffMount.querySelectorAll(".split-pane-content"));
      const scrollbar = elements.diffMount.querySelector(".split-scrollbar");
      const track = elements.diffMount.querySelector(".split-scrollbar-track");
      if (panes.length !== 2 || contents.length !== 2 || !scrollbar || !track) return;

      contents.forEach((content) => content.style.removeProperty("min-width"));
      const paneWidth = Math.min(...panes.map((pane) => pane.clientWidth));
      const contentWidth = Math.max(
        paneWidth,
        ...panes.map((pane) => pane.scrollWidth)
      );
      contents.forEach((content) => {
        content.style.minWidth = `${contentWidth}px`;
      });
      track.style.width = `${
        contentWidth + Math.max(0, scrollbar.clientWidth - paneWidth)
      }px`;
    }

    function syncSplitScroll(source, scrollLeft) {
      [
        ...elements.diffMount.querySelectorAll(".split-pane"),
        elements.diffMount.querySelector(".split-scrollbar")
      ].forEach((element) => {
        if (element && element !== source && element.scrollLeft !== scrollLeft) {
          element.scrollLeft = scrollLeft;
        }
      });
    }

    function setupSplitScrollSync() {
      const panes = Array.from(elements.diffMount.querySelectorAll(".split-pane"));
      const scrollbar = elements.diffMount.querySelector(".split-scrollbar");
      if (panes.length !== 2 || !scrollbar) return;

      panes.forEach((pane) => {
        pane.addEventListener("scroll", () => {
          syncSplitScroll(pane, pane.scrollLeft);
        });
      });
      scrollbar.addEventListener("scroll", () => {
        syncSplitScroll(scrollbar, scrollbar.scrollLeft);
      });
      updateSplitScrollMetrics();
    }

    function renderUnifiedLine(type, oldNo, newNo, text, key) {
      const marker = type === "delete" ? "−" : type === "add" ? "+" : "";
      const className = type === "delete"
        ? "cell-delete"
        : type === "add"
          ? "cell-add"
          : "";
      return `
        <div class="unified-row">
          <span class="line-number ${className}">${oldNo ?? ""}</span>
          <span class="line-number ${className}">${newNo ?? ""}</span>
          <span class="change-marker ${className}">${marker}</span>
          <span class="code-cell ${className}"><span class="code">${textMarkup(text, key)}</span></span>
        </div>
      `;
    }

    function renderUnifiedRow(row, rowIndex) {
      if (row.kind === "hunk") {
        return renderHunk(row, rowIndex);
      }
      if (row.kind === "context") {
        return renderUnifiedLine("context", row.oldNo, row.newNo, row.text, `${rowIndex}:context`);
      }
      if (row.kind === "pair") {
        return `
          ${renderUnifiedLine("delete", row.oldNo, null, row.oldText, `${rowIndex}:old`)}
          ${renderUnifiedLine("add", null, row.newNo, row.newText, `${rowIndex}:new`)}
        `;
      }
      if (row.kind === "delete") {
        return renderUnifiedLine("delete", row.oldNo, null, row.text, `${rowIndex}:delete`);
      }
      return renderUnifiedLine("add", null, row.newNo, row.text, `${rowIndex}:add`);
    }

    function renderHunk(row, rowIndex) {
      const file = currentFile();
      const hunkIndex = rowsForContext(file)
        .slice(0, rowIndex + 1)
        .filter((item) => item.kind === "hunk").length - 1;
      const context = state.hunkContexts[hunkIndex] || {
        beforeLines: defaultDiffContextLines,
        afterLines: defaultDiffContextLines,
        full: false
      };
      const expanded =
        context.full ||
        context.beforeLines > defaultDiffContextLines ||
        context.afterLines > defaultDiffContextLines;
      const hunkLabel = canExpandContext(file)
        ? `
            <button
              class="hunk-trigger"
              type="button"
              onclick="expandDiffContext('${expanded ? "reset" : "around"}', ${hunkIndex})"
              aria-label="${expanded ? `收起第 ${hunkIndex + 1} 个变更块上下文` : `展开第 ${hunkIndex + 1} 个变更块上下各 ${diffContextStep} 行`}"
              aria-expanded="${expanded}"
              title="${expanded ? "点击收起当前变更块，恢复默认 3 行上下文" : `点击查看当前变更块上方和下方各 ${diffContextStep} 行代码`}"
            >
              <span>${textMarkup(row.text, `${rowIndex}:hunk`)}</span>
            </button>
          `
        : `<span class="hunk-label">${textMarkup(row.text, `${rowIndex}:hunk`)}</span>`;
      return `
        <div class="hunk-row${hunkIndex === state.activeHunk ? " current" : ""}" data-hunk-index="${hunkIndex}">
          <div class="hunk-content">
            ${icon("diff", 14)}
            ${hunkLabel}
          </div>
        </div>
      `;
    }

    function renderDiff() {
      const file = currentFile();
      updateSearchVisibility();
      elements.diffViewport.classList.toggle(
        "split-nowrap",
        state.view === "split" && !state.wrap
      );
      if (!file) {
        state.searchMatches = [];
        state.activeMatch = 0;
        state.activeHunk = 0;
        elements.diffMount.innerHTML = `
          <div class="empty-state">
            <div><strong>没有匹配的变更</strong><span>清除筛选后恢复全部变更文件。</span></div>
          </div>
        `;
        updateSearchControls();
        updateHunkControls();
        return;
      }
      const rows = rowsForContext(file);

      state.searchMatches = collectSearchMatches(file);
      if (!state.searchMatches.length) {
        state.activeMatch = 0;
      } else {
        state.activeMatch =
          ((state.activeMatch % state.searchMatches.length) + state.searchMatches.length) %
          state.searchMatches.length;
      }

      if (state.view === "split" && !state.wrap) {
        elements.diffMount.innerHTML = renderSplitPanes(rows);
      } else {
        const rowMarkup = rows
          .map((row, rowIndex) =>
            state.view === "split"
              ? renderSplitRow(row, rowIndex)
              : renderUnifiedRow(row, rowIndex)
          )
          .join("");

        elements.diffMount.innerHTML = `
          <div class="diff-table ${state.view}">
            ${rowMarkup}
          </div>
        `;
      }
      setupSplitScrollSync();
      updateSearchControls();
      updateHunkControls();
    }

    function fileGroups(files = filteredFiles()) {
      return [
        {
          mode: "staged",
          label: "已暂存",
          files: files.filter((file) => file.staged && file.status !== "untracked")
        },
        {
          mode: "unstaged",
          label: "未暂存",
          files: files.filter((file) => !file.staged && file.status !== "untracked")
        },
        {
          mode: "untracked",
          label: "未跟踪",
          files: files.filter((file) => file.status === "untracked")
        }
      ].filter((group) => group.files.length);
    }

    function renderFileRow(file, depth = 0) {
      const untracked = file.status === "untracked";
      const stats = fileStats(file);
      const displayName = depth
        ? fileName(file.path)
        : file.path;
      const action = file.staged ? "取消暂存" : "暂存";
      const indent = depth > 0
        ? ` style="padding-left:calc(var(--space-2) + ${depth} * var(--space-4))"`
        : "";
      return `
        <div
          class="file-item${file.path === state.selectedPath ? " active" : ""}"
          ${indent}
        >
          <button
            class="file-select"
            type="button"
            data-file-path="${escapeHtml(file.path)}"
            aria-current="${file.path === state.selectedPath ? "true" : "false"}"
          >
            <span class="file-name" title="${escapeHtml(file.path)}">${escapeHtml(displayName)}</span>
            <span class="file-meta">
              <span class="file-status${untracked ? " untracked" : ""}">${untracked ? "?" : "M"}</span>
              <span class="file-change-stats" aria-label="新增 ${stats.additions} 行，删除 ${stats.deletions} 行">
                <span class="additions">+${stats.additions}</span>
                <span class="deletions">-${stats.deletions}</span>
              </span>
            </span>
          </button>
          <div class="file-actions">
            ${file.staged ? "" : renderButton({
              label: `放弃更改 ${file.path}`,
              ariaLabel: `放弃更改 ${file.path}`,
              title: "放弃更改",
              size: "small",
              variant: "icon",
              icon: icon("undo", 14),
              className: "stage-toggle",
              attributes: `data-file-path="${escapeHtml(file.path)}" data-stage-action="放弃更改"`
            })}
            ${renderButton({
              label: action,
              ariaLabel: `${action} ${file.path}`,
              title: action,
              size: "small",
              variant: "icon",
              icon: icon(file.staged ? "x" : "plus", 14),
              className: "stage-toggle",
              attributes: `data-file-path="${escapeHtml(file.path)}" data-stage-action="${action}"`
            })}
          </div>
        </div>
      `;
    }

    function buildFileTree(files) {
      const root = [];
      files.forEach((file) => {
        const segments = file.path.replaceAll("\\", "/").split("/").filter(Boolean);
        let children = root;
        let path = "";
        segments.forEach((segment, index) => {
          path = path ? `${path}/${segment}` : segment;
          if (index === segments.length - 1) {
            children.push({ directory: false, file, name: segment, path });
            return;
          }
          let directory = children.find((node) => node.directory && node.name === segment);
          if (!directory) {
            directory = { directory: true, name: segment, path, children: [] };
            children.push(directory);
          }
          children = directory.children;
        });
      });
      return sortFileTree(root);
    }

    function sortFileTree(nodes) {
      return [...nodes]
        .sort((left, right) => {
          if (left.directory !== right.directory) return left.directory ? -1 : 1;
          return left.name.localeCompare(
            right.name,
            undefined,
            { numeric: true, sensitivity: "base" }
          );
        })
        .map((node) => ({
          ...node,
          children: sortFileTree(node.children || [])
        }));
    }

    function compactFileTreeNodes(nodes) {
      return nodes.map((node) => {
        if (!node.directory) return node;

        let terminal = node;
        const names = [node.name];
        while (
          terminal.children.length === 1 &&
          terminal.children[0]?.directory
        ) {
          terminal = terminal.children[0];
          names.push(terminal.name);
        }

        return {
          ...terminal,
          name: names.join(" \\ "),
          children: compactFileTreeNodes(terminal.children)
        };
      });
    }

    function renderFileTree(files, mode) {
      return renderFileTreeNodes(
        compactFileTreeNodes(buildFileTree(files)),
        mode
      );
    }

    function renderFileTreeNodes(nodes, mode, depth = 0) {
      return nodes.map((node) => {
        if (!node.directory) return renderFileRow(node.file, depth);
        const key = `${mode}:${node.path}`;
        const collapsed = state.collapsedTreeDirectories.has(key);
        return `
          <div>
            <button
              class="file-tree-directory${collapsed ? " collapsed" : ""}"
              type="button"
              data-tree-key="${escapeHtml(key)}"
              aria-expanded="${!collapsed}"
              style="padding-left:calc(var(--space-2) + ${depth} * var(--space-4))"
            >
              <span class="file-tree-directory-chevron">${icon("chevronRight", 13)}</span>
              <span class="file-tree-directory-folder">${icon("folder", 13)}</span>
              <span class="file-tree-directory-label" title="${escapeHtml(node.path)}">${escapeHtml(node.name)}</span>
            </button>
            ${collapsed ? "" : renderFileTreeNodes(node.children, mode, depth + 1)}
          </div>
        `;
      }).join("");
    }

    function collectTreeDirectoryKeys(files, mode) {
      const keys = new Set();
      files.forEach((file) => {
        const segments = file.path.replaceAll("\\", "/").split("/").filter(Boolean);
        let path = "";
        segments.slice(0, -1).forEach((segment) => {
          path = path ? `${path}/${segment}` : segment;
          keys.add(`${mode}:${path}`);
        });
      });
      return [...keys].sort();
    }

    function visibleTreeDirectoryKeys() {
      return fileGroups().flatMap((group) =>
        collectTreeDirectoryKeys(group.files, group.mode)
      );
    }

    function updateSidebarControls() {
      elements.fileFilterClear.hidden = !state.fileFilter;
      const treeMode = state.fileViewMode === "tree";
      elements.fileViewModeIcon.innerHTML = icon(treeMode ? "file" : "folder", 14);
      elements.fileViewModeLabel.textContent = treeMode
        ? "以列表形式查看"
        : "以树形式查看";

      const directoryKeys = visibleTreeDirectoryKeys();
      const canToggleDirectories = treeMode && directoryKeys.length > 0;
      const willCollapse = directoryKeys.some(
        (key) => !state.collapsedTreeDirectories.has(key)
      );
      elements.toggleTreeDirectoriesButton.disabled = !canToggleDirectories;
      elements.treeDirectoriesIcon.innerHTML = icon(
        willCollapse ? "chevronRight" : "arrowDown",
        14
      );
      elements.treeDirectoriesLabel.textContent = willCollapse
        ? "收起目录"
        : "展开目录";
    }

    function renderFileList() {
      const groups = fileGroups();
      if (!groups.length) {
        elements.fileList.innerHTML = `
          <div class="empty-state">
            <div><strong>没有匹配的变更</strong><span>尝试文件名、目录或状态。</span></div>
          </div>
        `;
        updateSidebarControls();
        return;
      }

      elements.fileList.innerHTML = groups.map((group) => {
        const collapsed = state.collapsedFileGroups.has(group.mode);
        const rows = state.fileViewMode === "tree"
          ? renderFileTree(group.files, group.mode)
          : group.files.map((file) => renderFileRow(file)).join("");
        return `
          <section class="file-group">
            <div class="file-group-header has-actions">
              <button
                class="file-group-title"
                type="button"
                data-file-group="${group.mode}"
                aria-expanded="${!collapsed}"
              >
                ${icon(collapsed ? "chevronRight" : "arrowDown", 12)}
                <span>${group.label}</span>
              </button>
              <span class="file-group-tail">
                <span class="group-count">${group.files.length}</span>
                <span class="file-group-actions">
                  ${group.mode === "staged" ? "" : renderButton({
                    label: `放弃${group.label}分组的更改`,
                    ariaLabel: `放弃${group.label}分组的更改`,
                    title: `放弃更改（${group.files.length} 个文件）`,
                    size: "small",
                    variant: "icon",
                    className: "group-stage-toggle",
                    icon: icon("undo", 14),
                    attributes: `data-group-action="discard" data-file-group="${group.mode}"`
                  })}
                  ${renderButton({
                    label: `${group.mode === "staged" ? "取消暂存" : "暂存"}${group.label}分组的文件`,
                    ariaLabel: `${group.mode === "staged" ? "取消暂存" : "暂存"}${group.label}分组的文件`,
                    title: `${group.mode === "staged" ? "取消暂存" : "暂存"}（${group.files.length} 个文件）`,
                    size: "small",
                    variant: "icon",
                    className: "group-stage-toggle",
                    icon: icon(group.mode === "staged" ? "minus" : "plus", 14),
                    attributes: `data-group-action="toggle-stage" data-file-group="${group.mode}"`
                  })}
                </span>
              </span>
            </div>
            ${collapsed ? "" : `<div>${rows}</div>`}
          </section>
        `;
      }).join("");

      elements.fileList.querySelectorAll(".file-group-title").forEach((button) => {
        button.addEventListener("click", () => {
          const mode = button.dataset.fileGroup;
          if (state.collapsedFileGroups.has(mode)) {
            state.collapsedFileGroups.delete(mode);
          } else {
            state.collapsedFileGroups.add(mode);
          }
          renderFileList();
        });
      });
      elements.fileList.querySelectorAll(".file-select").forEach((button) => {
        button.addEventListener("click", () => selectFile(button.dataset.filePath));
      });
      elements.fileList.querySelectorAll(".stage-toggle").forEach((button) => {
        button.addEventListener("click", () => {
          if (button.dataset.stageAction === "放弃更改") {
            const file = repository.files.find(
              (candidate) =>
                candidate.path === button.dataset.filePath
            );
            if (file) {
              openDiscardConfirmation(
                [file],
                () => discardFiles([file]),
                "file"
              );
            }
            return;
          }
          showNotice(
            `${button.dataset.stageAction}：${button.dataset.filePath}（原型预览，不执行 Git 命令）`
          );
        });
      });
      elements.fileList
        .querySelectorAll("[data-group-action]")
        .forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            const group = fileGroups().find(
              (candidate) => candidate.mode === button.dataset.fileGroup
            );
            if (!group || group.files.length === 0) return;
            if (button.dataset.groupAction === "discard") {
              const files = [...group.files];
              openDiscardConfirmation(
                files,
                () => discardFiles(files),
                "group"
              );
              return;
            }
            const nextStaged = group.mode !== "staged";
            group.files.forEach((file) => {
              file.staged = nextStaged;
            });
            renderFileList();
            updatePanel();
            showNotice(
              `${nextStaged ? "暂存" : "取消暂存"}：${group.files.length} 个文件（原型预览，不执行 Git 命令）`
            );
          });
        });
      elements.fileList.querySelectorAll(".file-tree-directory").forEach((button) => {
        button.addEventListener("click", () => {
          const key = button.dataset.treeKey;
          if (state.collapsedTreeDirectories.has(key)) {
            state.collapsedTreeDirectories.delete(key);
          } else {
            state.collapsedTreeDirectories.add(key);
          }
          renderFileList();
        });
      });
      updateSidebarControls();
    }

    function renderFileHeader() {
      const file = currentFile();
      elements.filePathCopyButton.classList.remove("copied", "failed");
      elements.fileIcon.innerHTML = icon("file", 14);
      if (!file) {
        elements.filePath.textContent = "没有匹配的文件";
        elements.filePathCopyButton.disabled = true;
        elements.fileDiffSummary.textContent = "筛选结果为空";
        elements.fileDiffSummary.setAttribute("aria-label", "筛选结果为空");
        elements.statusLanguage.textContent = "—";
        document.title = "GitNest Diff";
        return;
      }
      const stats = fileStats(file);
      elements.filePath.textContent = file.path;
      elements.filePathCopyButton.disabled = false;
      elements.fileDiffSummary.innerHTML = `
        <strong>+${stats.additions}</strong>
        <em>-${stats.deletions}</em>
      `;
      elements.fileDiffSummary.setAttribute(
        "aria-label",
        `新增 ${stats.additions} 行，删除 ${stats.deletions} 行`
      );
      elements.statusLanguage.textContent = file.language;
      document.title = `${fileName(file.path)} — GitNest Diff`;
    }

    function updateSearchControls() {
      const count = state.searchMatches.length;
      diffSearchPopover.update({
        countLabel: state.searchQuery.trim()
          ? `${count ? state.activeMatch + 1 : 0} / ${count}`
          : "0 / 0",
        hasMatches: Boolean(count)
      });
    }

    function updateSearchVisibility() {
      diffSearchPopover.update({
        open: state.searchOpen && Boolean(currentFile())
      });
    }

    function openSearch() {
      if (!currentFile()) return;
      state.searchOpen = true;
      updateSearchVisibility();
      requestAnimationFrame(() => {
        diffSearchPopover.focus({ selectAll: true });
      });
    }

    function closeSearch() {
      state.searchOpen = false;
      state.searchQuery = "";
      state.searchMatches = [];
      state.activeMatch = 0;
      diffSearchPopover.update({ value: "" });
      updateSearchVisibility();
      renderDiff();
    }

    function updateHunkControls() {
      const file = currentFile();
      const count = file ? fileStats(file).hunks : 0;
      if (!count) {
        state.activeHunk = 0;
      } else {
        state.activeHunk = ((state.activeHunk % count) + count) % count;
      }
      elements.hunkCount.textContent = `${count ? state.activeHunk + 1 : 0} / ${count}`;
      elements.previousHunkButton.disabled = !count;
      elements.nextHunkButton.disabled = !count;
    }

    function selectFile(path) {
      if (!repository.files.some((file) => file.path === path)) return;
      if (state.selectedPath !== path) {
        state.hunkContexts = {};
      }
      state.selectedPath = path;
      state.searchQuery = "";
      state.searchMatches = [];
      state.activeMatch = 0;
      state.activeHunk = 0;
      diffSearchPopover.update({ value: "" });
      elements.diffViewport.scrollTo({ top: 0, left: 0 });

      const nextUrl = new URL(window.location.href);
      nextUrl.searchParams.set("repo", repository.id);
      nextUrl.searchParams.set("file", path);
      try {
        history.replaceState({}, "", nextUrl.href);
      } catch {
        // file:// 预览环境下即使无法更新地址，也不影响查看交互。
      }

      renderFileList();
      renderFileHeader();
      renderDiff();
    }

    function applyFileFilter(value) {
      state.fileFilter = value;
      const files = filteredFiles();
      if (!files.some((file) => file.path === state.selectedPath)) {
        state.selectedPath = files[0]?.path || "";
        state.hunkContexts = {};
        state.searchQuery = "";
        state.searchMatches = [];
        state.activeMatch = 0;
        state.activeHunk = 0;
        diffSearchPopover.update({ value: "" });
      }
      renderFileList();
      renderFileHeader();
      renderDiff();
    }

    function toggleFileView() {
      state.fileViewMode = state.fileViewMode === "tree" ? "list" : "tree";
      fileViewDropdown.close();
      renderFileList();
    }

    function toggleTreeDirectories() {
      const keys = visibleTreeDirectoryKeys();
      if (state.fileViewMode !== "tree" || !keys.length) return;
      const collapse = keys.some(
        (key) => !state.collapsedTreeDirectories.has(key)
      );
      if (collapse) {
        keys.forEach((key) => state.collapsedTreeDirectories.add(key));
      } else {
        keys.forEach((key) => state.collapsedTreeDirectories.delete(key));
      }
      fileViewDropdown.close();
      renderFileList();
    }

    function setButtonSelected(button, selected) {
      button.dataset.selected = String(selected);
      button.setAttribute("aria-pressed", String(selected));
    }

    function setView(view) {
      if (state.view === view) return;
      state.view = view;
      setButtonSelected(elements.splitButton, view === "split");
      setButtonSelected(elements.unifiedButton, view === "unified");
      renderDiff();
    }

    function toggleWrap() {
      state.wrap = !state.wrap;
      document.body.classList.toggle("wrap-lines", state.wrap);
      setButtonSelected(elements.wrapButton, state.wrap);
      renderDiff();
    }

    function updateSearch() {
      state.searchQuery = elements.diffSearch.value;
      state.activeMatch = 0;
      renderDiff();
      scrollToActiveMatch();
    }

    function moveSearchMatch(direction) {
      if (!state.searchMatches.length) return;
      state.activeMatch =
        (state.activeMatch + direction + state.searchMatches.length) %
        state.searchMatches.length;
      renderDiff();
      scrollToActiveMatch();
      diffSearchPopover.focus();
    }

    function scrollToActiveMatch() {
      requestAnimationFrame(() => {
        document
          .querySelector("mark.search-hit.current")
          ?.scrollIntoView({ block: "center", inline: "nearest", behavior: "smooth" });
      });
    }

    function moveHunk(direction) {
      const file = currentFile();
      const count = file ? fileStats(file).hunks : 0;
      if (!count) return;
      state.activeHunk = (state.activeHunk + direction + count) % count;
      renderDiff();
      requestAnimationFrame(() => {
        document
          .querySelector(`.hunk-row[data-hunk-index="${state.activeHunk}"]`)
          ?.scrollIntoView({ block: "start", inline: "nearest", behavior: "smooth" });
      });
    }

    function expandDiffContext(direction, hunkIndex) {
      const file = currentFile();
      if (!canExpandContext(file)) return;

      const current = state.hunkContexts[hunkIndex] || {
        beforeLines: defaultDiffContextLines,
        afterLines: defaultDiffContextLines,
        full: false
      };
      if (direction === "reset") {
        delete state.hunkContexts[hunkIndex];
      } else if (direction === "around") {
        state.hunkContexts[hunkIndex] = {
          beforeLines: diffContextStep,
          afterLines: diffContextStep,
          full: false
        };
      } else if (direction === "all") {
        state.hunkContexts[hunkIndex] = {
          beforeLines: Number.MAX_SAFE_INTEGER,
          afterLines: Number.MAX_SAFE_INTEGER,
          full: true
        };
      } else if (direction === "up") {
        state.hunkContexts[hunkIndex] = {
          ...current,
          beforeLines: current.beforeLines + diffContextStep,
          full: false
        };
      } else if (direction === "down") {
        state.hunkContexts[hunkIndex] = {
          ...current,
          afterLines: current.afterLines + diffContextStep,
          full: false
        };
      }
      state.activeHunk = hunkIndex;
      renderDiff();
      requestAnimationFrame(() => {
        document
          .querySelector(`.hunk-row[data-hunk-index="${hunkIndex}"]`)
          ?.scrollIntoView({
            block: "center",
            inline: "nearest"
          });
      });
    }

    async function copyText(value) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(value);
        return;
      }
      const textarea = document.createElement("textarea");
      textarea.value = value;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      const copied = document.execCommand("copy");
      textarea.remove();
      if (!copied) throw new Error("copy failed");
    }

    async function copyCurrentFilePath() {
      const file = currentFile();
      if (!file) return;
      const path = file.path;
      elements.filePathCopyButton.classList.remove("copied", "failed");
      try {
        await copyText(path);
        elements.filePathCopyButton.classList.add("copied");
        elements.fileIcon.innerHTML = icon("check", 14);
        showNotice(`已复制文件路径：${path}`);
      } catch {
        elements.filePathCopyButton.classList.add("failed");
        elements.fileIcon.innerHTML = icon("x", 14);
        showNotice("复制文件路径失败，请重试。");
      }
      window.setTimeout(() => {
        if (currentFile()?.path !== path) return;
        elements.filePathCopyButton.classList.remove("copied", "failed");
        elements.fileIcon.innerHTML = icon("file", 14);
      }, 1600);
    }

    function showNotice(message) {
      if (!message) return;
      elements.notice.textContent = message;
      elements.notice.classList.add("show");
      window.setTimeout(() => elements.notice.classList.remove("show"), 3200);
    }

    function openDiscardConfirmation(files, onConfirm, scope = "file") {
      const previousFocus =
        document.activeElement instanceof HTMLElement
          ? document.activeElement
          : null;
      const untrackedCount = files.filter(
        (file) => file.status === "untracked"
      ).length;
      const singleFile = scope === "file" ? files[0] : null;
      const title = singleFile
        ? untrackedCount > 0
          ? "永久删除未跟踪文件？"
          : `放弃对“${singleFile.path}”的更改？`
        : `放弃 ${files.length} 个文件的更改？`;
      const targetSummary = singleFile
        ? singleFile.path
        : `${files.length} 个文件${
            untrackedCount > 0
              ? ` · ${untrackedCount} 个未跟踪文件`
              : ""
          }`;
      const warning = untrackedCount > 0
        ? `正式应用中，其中 ${untrackedCount} 个未跟踪文件将从磁盘永久删除，不会移入回收站，且无法撤销。`
        : "正式应用中，工作区中的修改将被还原，此操作无法撤销。";
      const overlay = document.createElement("div");
      overlay.className = "discard-confirm-overlay";
      overlay.innerHTML = `
        <section
          class="discard-confirm-dialog"
          role="alertdialog"
          aria-modal="true"
          aria-labelledby="discardConfirmTitle"
          aria-describedby="discardConfirmDescription"
        >
          <header class="discard-confirm-header">
            <span class="discard-confirm-icon">${icon("warning", 20)}</span>
            <div>
              <span class="discard-confirm-eyebrow">危险操作</span>
              <h2 id="discardConfirmTitle">${escapeHtml(title)}</h2>
              <p id="discardConfirmDescription">确认后将立即处理当前工作区内容。</p>
            </div>
          </header>
          <div class="discard-confirm-body">
            <div class="discard-confirm-warning">
              ${icon("warning", 15)}
              <span>${escapeHtml(warning)}</span>
            </div>
            <div class="discard-confirm-target">
              <span>${singleFile ? "目标文件" : "影响范围"}</span>
              <code title="${escapeHtml(targetSummary)}">${escapeHtml(targetSummary)}</code>
            </div>
          </div>
          <footer class="discard-confirm-footer">
            <p>当前为原型预览，不执行 Git 命令。</p>
            <div>
              ${renderButton({
                label: "取消",
                size: "small",
                attributes: 'data-discard-confirm-action="cancel"'
              })}
              ${renderButton({
                label:
                  untrackedCount > 0
                    ? "永久删除并放弃"
                    : "确认放弃",
                size: "small",
                variant: "danger",
                emphasis: "strong",
                icon: icon("warning", 14),
                attributes: 'data-discard-confirm-action="confirm"'
              })}
            </div>
          </footer>
        </section>
      `;

      const close = ({ restoreFocus = true } = {}) => {
        document.removeEventListener("keydown", handleKeyDown, true);
        overlay.remove();
        if (restoreFocus && previousFocus?.isConnected) {
          previousFocus.focus();
        }
      };
      const handleKeyDown = (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          event.stopPropagation();
          close();
          return;
        }
        if (event.key !== "Tab") return;
        const focusable = [
          ...overlay.querySelectorAll("button:not([disabled])")
        ];
        const first = focusable[0];
        const last = focusable.at(-1);
        if (!first || !last) return;
        if (
          event.shiftKey &&
          (document.activeElement === first ||
            !overlay.contains(document.activeElement))
        ) {
          event.preventDefault();
          last.focus();
        } else if (
          !event.shiftKey &&
          (document.activeElement === last ||
            !overlay.contains(document.activeElement))
        ) {
          event.preventDefault();
          first.focus();
        }
      };

      overlay.addEventListener("pointerup", (event) => {
        if (event.target === overlay) {
          close();
        }
      });
      overlay
        .querySelector('[data-discard-confirm-action="cancel"]')
        ?.addEventListener("click", () => close());
      overlay
        .querySelector('[data-discard-confirm-action="confirm"]')
        ?.addEventListener("click", () => {
          close({ restoreFocus: false });
          onConfirm();
        });
      document.addEventListener("keydown", handleKeyDown, true);
      document.body.append(overlay);
      overlay
        .querySelector('[data-discard-confirm-action="cancel"]')
        ?.focus();
    }

    function discardFiles(files) {
      const discarded = new Set(
        files.map((file) => file.path)
      );
      repository.files = repository.files.filter(
        (file) => !discarded.has(file.path)
      );
      if (discarded.has(state.selectedPath)) {
        state.selectedPath = repository.files[0]?.path || "";
      }
      renderFileList();
      updatePanel();
      showNotice(
        files.length === 1
          ? `放弃更改：${files[0].path}（原型预览，不执行 Git 命令）`
          : `放弃更改：${discarded.size} 个文件（原型预览，不执行 Git 命令）`
      );
    }

    function bindEvents() {
      elements.splitButton.addEventListener("click", () => setView("split"));
      elements.unifiedButton.addEventListener("click", () => setView("unified"));
      elements.wrapButton.addEventListener("click", toggleWrap);
      elements.previousHunkButton.addEventListener("click", () => moveHunk(-1));
      elements.nextHunkButton.addEventListener("click", () => moveHunk(1));
      elements.filePathCopyButton.addEventListener("click", () => void copyCurrentFilePath());
      elements.fileFilter.addEventListener("input", () => {
        applyFileFilter(elements.fileFilter.value);
      });
      elements.toggleFileViewButton.addEventListener("click", toggleFileView);
      elements.toggleTreeDirectoriesButton.addEventListener("click", toggleTreeDirectories);
      window.addEventListener("resize", updateSplitScrollMetrics);

      document.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLocaleLowerCase() === "f") {
          event.preventDefault();
          openSearch();
        } else if (event.key === "Escape" && state.searchOpen) {
          event.preventDefault();
          closeSearch();
        }
      });
    }

    function hydrateIcons() {
      document.getElementById("brandIcon").innerHTML = icon("diff", 15);
    }

    function renderApp() {
      const repositoryContext = `${repository.name}/${repository.branch}`;
      elements.repositoryName.textContent = repositoryContext;
      elements.repositoryName.title = repositoryContext;
      renderFileList();
      renderFileHeader();
      renderDiff();
      if (state.notice) {
        requestAnimationFrame(() => showNotice(state.notice));
      }
    }

    hydrateIcons();
    bindEvents();
    renderApp();
  </script>
</body>
</html>
