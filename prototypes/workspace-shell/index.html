            "    String repositoryRoot = repositoryClient.root();"
          ];
      const afterContext = isMarkdown
        ? [
            "变更仅用于当前原型交互演示。",
            "",
            "展开上下文可以继续查看相邻段落。",
            "",
            "### 搜索",
            "",
            "使用 Ctrl+F 在当前 Diff 中搜索。",
            "",
            "### 说明",
            "",
            "该页面不会执行真实 Git 命令。",
            "",
            "返回变更文件列表。"
          ]
        : [
            "    return sourcePath;",
            "  }",
            "",
            "  boolean isDiffSearchEnabled() {",
            "    return includeDiffSearch;",
            "  }",
            "",
            "  String repositoryRoot() {",
            "    return repositoryClient.root();",
            "  }",
            "",
            "  // 文件级上下文结束",
            "}"
          ];

      return [
        { kind: "hunk", oldLine: "", newLine: "", code: "@@ -8,25 +8,27 @@" },
        ...beforeContext.map((code, index) => ({
          kind: "context",
          oldLine: String(index + 8),
          newLine: String(index + 8),
          code
        })),
        { kind: "deleted", oldLine: "19", newLine: "", code: isMarkdown ? "仅展示 Git 状态。" : "const includeDiffSearch = false;" },
        { kind: "added", oldLine: "", newLine: "19", code: isMarkdown ? "展示原型 Diff 预览，可用 Ctrl+F 搜索。" : "const includeDiffSearch = true;" },
        { kind: "added", oldLine: "", newLine: "20", code: isMarkdown ? `来源文件：${path}` : `const sourcePath = "${path}";` },
        ...afterContext.map((code, index) => ({
          kind: "context",
          oldLine: String(index + 20),
          newLine: String(index + 21),
          code
        }))
      ];
    }

    function diffPreviewLines(file) {
      const fullLines = diffPreviewFullLines(file);
      if (file.status === "untracked") {
        return fullLines;
      }

      const hunks = [];
      let current = null;
      fullLines.forEach((line) => {
        if (line.kind === "hunk") {
          current = { header: line, body: [] };
          hunks.push(current);
        } else if (current) {
          current.body.push(line);
        }
      });
      return hunks.flatMap((hunk, hunkIndex) => {
        const context = state.diffHunkContexts[hunkIndex] || {
          beforeLines: defaultDiffContextLines,
          afterLines: defaultDiffContextLines,
          full: false
        };
        const changedIndexes = hunk.body
          .map((line, index) => line.kind === "context" ? -1 : index)
          .filter((index) => index >= 0);
        if (!changedIndexes.length || context.full) {
          return [hunk.header, ...hunk.body];
        }

        const start = Math.max(
          0,
          changedIndexes[0] - context.beforeLines
        );
        const end = Math.min(
          hunk.body.length,
          changedIndexes[changedIndexes.length - 1] +
            context.afterLines +
            1
        );
        return [hunk.header, ...hunk.body.slice(start, end)];
      });
    }

    function canExpandDiffPreview(file) {
      return Boolean(
        file &&
        file.status !== "untracked" &&
        repositoryDiffWorkspaceConfiguration.document
          .allowContextExpansion &&
        diffPreviewFullLines(file).length > 10
      );
    }

    function diffPreviewStats(file) {
      return diffPreviewLines(file).reduce(
        (stats, line) => {
          if (line.kind === "added") stats.additions += 1;
          if (line.kind === "deleted") stats.deletions += 1;
          return stats;
        },
        { additions: 0, deletions: 0 }
      );
    }

    function collectDiffSearchMatches(lines, query) {
      const keyword = String(query || "").trim().toLocaleLowerCase();
      if (!keyword) return [];

      let matchIndex = 0;
      return lines.flatMap((line, lineIndex) => {
        const text = String(line.code || "");
        const normalized = text.toLocaleLowerCase();
        const matches = [];
        let start = normalized.indexOf(keyword);

        while (start >= 0) {
          matches.push({
            index: matchIndex++,
            lineIndex,
            start,
            end: start + keyword.length
          });
          start = normalized.indexOf(keyword, start + keyword.length);
        }

        return matches;
      });
    }

    function normalizeDiffSearchActiveMatch(matches) {
      if (!matches.length) {
        state.diffSearchActiveMatch = 0;
        return -1;
      }

      state.diffSearchActiveMatch =
        ((state.diffSearchActiveMatch % matches.length) + matches.length) %
        matches.length;
      return state.diffSearchActiveMatch;
    }

    function renderDiffSearchText(value, lineIndex, matches, activeMatch) {
      const text = String(value || "");
      const lineMatches = matches.filter((match) => match.lineIndex === lineIndex);
      if (!lineMatches.length) return escapeHtml(text);

      let cursor = 0;
      return `${lineMatches.map((match) => {
        const before = escapeHtml(text.slice(cursor, match.start));
        const highlighted = escapeHtml(text.slice(match.start, match.end));
        cursor = match.end;
        return `${before}<mark class="diff-search-match${match.index === activeMatch ? " current" : ""}" data-diff-match="${match.index}">${highlighted}</mark>`;
      }).join("")}${escapeHtml(text.slice(cursor))}`;
    }

    function renderDiffPreviewLine(
      line,
      lineIndex,
      matches,
      activeMatch,
      selected
    ) {
      const code = renderDiffSearchText(
        line.code,
        lineIndex,
        matches,
        activeMatch
      );
      if (line.kind === "hunk") {
        const hunkIndex = diffPreviewLines(selected)
          .slice(0, lineIndex + 1)
          .filter((item) => item.kind === "hunk").length - 1;
        const context = state.diffHunkContexts[hunkIndex] || {
          beforeLines: defaultDiffContextLines,
          afterLines: defaultDiffContextLines,
          full: false
        };
        const expanded =
          context.full ||
          context.beforeLines > defaultDiffContextLines ||
          context.afterLines > defaultDiffContextLines;
        const hunkLabel = canExpandDiffPreview(selected)
          ? `
              <button
                class="diff-viewer-hunk-trigger"
                type="button"
                onclick="expandDiffContext('${expanded ? "reset" : "around"}', ${hunkIndex})"
                oncontextmenu="openDiffHunkContextMenu(event, ${hunkIndex})"
                aria-label="${expanded ? `收起第 ${hunkIndex + 1} 个变更块上下文` : `展开第 ${hunkIndex + 1} 个变更块上下各 ${diffContextStep} 行`}"
                aria-expanded="${expanded}"
                title="${expanded ? "点击收起当前变更块，恢复默认 3 行上下文" : `点击查看当前变更块上方和下方各 ${diffContextStep} 行代码`}"
              >
                <code>${code}</code>
              </button>
            `
          : `<code>${code}</code>`;
        return `
          <div class="diff-viewer-wide-row hunk" data-hunk-index="${hunkIndex}">
            ${icon("diff", 14)}
            ${hunkLabel}
          </div>
        `;
      }

      const kind =
        line.kind === "deleted"
          ? "removed"
          : line.kind === "added"
            ? "added"
            : "context";
      const marker =
        kind === "removed" ? "−" : kind === "added" ? "+" : "";
      return `
        <div class="diff-viewer-unified-line ${kind}">
          <span class="diff-viewer-line-number ${kind}">${escapeHtml(line.oldLine)}</span>
          <span class="diff-viewer-line-number ${kind}">${escapeHtml(line.newLine)}</span>
          <span class="diff-viewer-change-marker ${kind}">${marker}</span>
          <span class="diff-viewer-code-cell ${kind}"><code>${code}</code></span>
        </div>
      `;
    }

    function renderDiffSearchPopover(matches, activeMatch) {
      const hasQuery = Boolean(state.diffSearchQuery.trim());
      const countLabel = hasQuery
        ? `${activeMatch >= 0 ? activeMatch + 1 : 0} / ${matches.length}`
        : "0 / 0";
      const hasMatches = matches.length > 0;

      return `
        <div class="diff-search-popover" role="search" aria-label="在 Diff 中搜索">
          <span class="diff-search-symbol">${icon("search", 14)}</span>
          <input
            id="diffSearchInput"
            class="diff-search-input"
            type="search"
            aria-label="在 Diff 中搜索"
            autocomplete="off"
            spellcheck="false"
            placeholder="在 Diff 中搜索"
            value="${escapeHtml(state.diffSearchQuery)}"
            oninput="updateDiffSearch(this.value, this.selectionStart ?? this.value.length)"
            onkeydown="handleDiffSearchKeydown(event)"
          />
          <span class="diff-search-count" aria-live="polite">${countLabel}</span>
          <button type="button" class="diff-search-action" aria-label="上一个匹配" title="上一个匹配" onclick="moveDiffSearchMatch(-1)" ${hasMatches ? "" : "disabled"}>${icon("arrowUp", 13)}</button>
          <button type="button" class="diff-search-action" aria-label="下一个匹配" title="下一个匹配" onclick="moveDiffSearchMatch(1)" ${hasMatches ? "" : "disabled"}>${icon("arrowDown", 13)}</button>
          <button type="button" class="diff-search-action" aria-label="关闭 Diff 搜索" title="关闭 Diff 搜索" onclick="closeDiffSearch()">${icon("x", 13)}</button>
        </div>
      `;
    }

    function renderDiffContentSkeleton() {
      const widths = [
        "short",
        "medium",
        "long",
        "medium",
        "short",
        "long",
        "medium",
        "long",
        "short",
        "medium"
      ];

      return `
        <div class="diff-content-skeleton" aria-hidden="true">
          <div class="diff-content-skeleton-hunk">
            <span class="diff-content-skeleton-block diff-content-skeleton-hunk-line"></span>
          </div>
          <div class="diff-content-skeleton-code">
            ${widths.map((width) => `
              <div class="diff-content-skeleton-row is-${width}">
                <span class="diff-content-skeleton-block diff-content-skeleton-line-number"></span>
                <span class="diff-content-skeleton-block diff-content-skeleton-code-line"></span>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderDiffPreview(selected) {
      const lines = selected ? diffPreviewLines(selected) : [];
      const matches = collectDiffSearchMatches(lines, state.diffSearchQuery);
      const activeMatch = normalizeDiffSearchActiveMatch(matches);

      return `
        ${state.diffSearchOpen && !state.diffLoading && !state.diffSkeletonVisible ? renderDiffSearchPopover(matches, activeMatch) : ""}
        <div class="diff-viewer-code" tabindex="0" role="region" aria-label="文件 Diff" aria-busy="${state.diffLoading || state.diffSkeletonVisible}">
          ${state.diffLoading || state.diffSkeletonVisible
            ? state.diffSkeletonVisible
              ? renderDiffContentSkeleton()
              : ""
            : selected ? `
            <div class="diff-viewer-unified">
              ${lines.map((line, lineIndex) => renderDiffPreviewLine(line, lineIndex, matches, activeMatch, selected)).join("")}
            </div>
          ` : `
            <div class="change-filter-empty">
              ${icon("search", 20)}
              <strong>没有匹配的变更</strong>
              <span>清除筛选后恢复全部变更文件。</span>
            </div>
          `}
        </div>
      `;
    }

    function renderRepositoryDiffPanel(
      selected,
      standaloneDiffUrl,
      config = repositoryDiffWorkspaceConfiguration
    ) {
      const stats = selected ? diffPreviewStats(selected) : null;
      const openStandaloneAction =
        selected && config.extensions.openStandaloneDiff
          ? `
              <span class="diff-viewer-header-action-slot">
                <a
                  class="icon-button diff-open-external"
                  href="${escapeHtml(standaloneDiffUrl.href)}"
                  target="_blank"
                  rel="noopener"
                  aria-label="在独立 Diff 查看器中打开"
                  title="在新标签页打开独立 Diff 查看器"
                >${icon("external", 14)}</a>
              </span>
            `
          : "";

      return `
        <section
          class="diff-viewer-panel repository-diff-panel"
          data-diff-layout="${escapeHtml(config.document.defaultLayout)}"
          data-diff-layouts="${escapeHtml(config.document.layouts.join(","))}"
          data-diff-wrap="${config.document.allowWrap}"
          data-diff-hunk-navigation="${config.document.showHunkNavigation}"
        >
          <main class="diff-viewer-main">
            <header class="diff-viewer-file-header">
              <div class="diff-viewer-file-heading">
                <button
                  type="button"
                  class="diff-viewer-path-copy-button"
                  data-copy-path="${escapeHtml(selected?.path || "")}"
                  aria-label="${selected ? "复制文件路径" : "没有可复制的文件路径"}"
                  title="${selected ? "复制完整文件路径" : "没有可复制的文件路径"}"
                  onclick="copyDiffPath(this)"
                  ${selected ? "" : "disabled"}
                >${icon("fileCode", 14)}</button>
                <span>${escapeHtml(selected?.path || "没有匹配的文件")}</span>
              </div>
              <div class="diff-viewer-header-actions">
                ${stats ? `
                  <span class="diff-viewer-stats" aria-label="新增 ${stats.additions} 行，删除 ${stats.deletions} 行">
                    <strong>+${stats.additions}</strong>
                    <em>-${stats.deletions}</em>
                  </span>
                ` : ""}
                ${stats && openStandaloneAction ? `<span class="diff-viewer-file-header-separator" aria-hidden="true"></span>` : ""}
                ${openStandaloneAction}
              </div>
            </header>
            ${renderDiffPreview(selected)}
          </main>
        </section>
      `;
    }

    function focusDiffSearchInput(cursorPosition, selectAll = false) {
      const input = document.getElementById("diffSearchInput");
      if (!input) return;
      input.focus({ preventScroll: true });
      if (selectAll) {
        input.select();
      } else if (typeof cursorPosition === "number" && typeof input.setSelectionRange === "function") {
        const nextPosition = Math.min(cursorPosition, input.value.length);
        input.setSelectionRange(nextPosition, nextPosition);
      }
    }

    function scrollToCurrentDiffSearchMatch() {
      document
        .querySelector(".diff-search-match.current")
        ?.scrollIntoView({ block: "center", inline: "nearest" });
    }

    function resetDiffSearch() {
      state.diffSearchOpen = false;
      state.diffSearchQuery = "";
      state.diffSearchActiveMatch = 0;
    }

    function openDiffSearch() {
      if (
        state.view !== "repository" ||
        state.tab !== "changes" ||
        !state.selectedFile
      ) {
        return;
      }

      state.diffSearchOpen = true;
      renderChanges();
      focusDiffSearchInput(state.diffSearchQuery.length, true);
      scrollToCurrentDiffSearchMatch();
    }

    function closeDiffSearch() {
      if (!state.diffSearchOpen) return;
      resetDiffSearch();
      renderChanges();
      document.querySelector(".file-select-button[aria-current='true']")?.focus({
        preventScroll: true
      });
    }

    function updateDiffSearch(value, cursorPosition = value.length) {
      state.diffSearchQuery = value;
      state.diffSearchActiveMatch = 0;
      renderChanges();
      focusDiffSearchInput(cursorPosition);
      scrollToCurrentDiffSearchMatch();
    }

    function moveDiffSearchMatch(direction) {
      const selected = currentChangedFiles().find(
        (file) => file.path === state.selectedFile
      );
      const matches = collectDiffSearchMatches(
        selected ? diffPreviewLines(selected) : [],
        state.diffSearchQuery
      );
      if (!matches.length) return;

      state.diffSearchActiveMatch += direction;
      renderChanges();
      focusDiffSearchInput();
      scrollToCurrentDiffSearchMatch();
    }

    function expandDiffContext(direction, hunkIndex) {
      const selected = currentChangedFiles().find(
        (file) => file.path === state.selectedFile
      );
      if (!canExpandDiffPreview(selected)) return;

      const current = state.diffHunkContexts[hunkIndex] || {
        beforeLines: defaultDiffContextLines,
        afterLines: defaultDiffContextLines,
        full: false
      };
      if (direction === "reset") {
        delete state.diffHunkContexts[hunkIndex];
      } else if (direction === "around") {
        state.diffHunkContexts[hunkIndex] = {
          beforeLines: diffContextStep,
          afterLines: diffContextStep,
          full: false
        };
      } else if (direction === "all") {
        state.diffHunkContexts[hunkIndex] = {
          beforeLines: Number.MAX_SAFE_INTEGER,
          afterLines: Number.MAX_SAFE_INTEGER,
          full: true
        };
      } else if (direction === "up") {
        state.diffHunkContexts[hunkIndex] = {
          ...current,
          beforeLines: current.beforeLines + diffContextStep,
          full: false
        };
      } else if (direction === "down") {
        state.diffHunkContexts[hunkIndex] = {
          ...current,
          afterLines: current.afterLines + diffContextStep,
          full: false
        };
      }

      renderChanges();
      requestAnimationFrame(() => {
        document
          .querySelector(`.diff-viewer-wide-row.hunk[data-hunk-index="${hunkIndex}"]`)
          ?.scrollIntoView({
            block: "center",
            inline: "nearest"
          });
      });
    }

    function handleDiffSearchKeydown(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        event.stopPropagation();
        moveDiffSearchMatch(event.shiftKey ? -1 : 1);
      } else if (event.key === "Escape") {
        event.preventDefault();
        event.stopPropagation();
        closeDiffSearch();
      }
    }

    function historyRefDisplayName(ref) {
      return String(ref || "")
        .replace(/^refs\/heads\//, "")
        .replace(/^refs\/remotes\//, "");
    }

    function historyBranchOptions(repo = currentRepo()) {
      const localNames = branchSwitchOptions(repo).map((branch) => branch.name);
      const local = localNames.map((name) => ({
        fullName: `refs/heads/${name}`,
        name,
        remote: false,
        current: name === repo.branch,
        upstream: `origin/${name}`
      }));
      const remoteNames = [
        repo.upstream,
        ...localNames.map((name) => `origin/${name}`)
      ].filter(Boolean);
      const remote = [...new Set(remoteNames)].map((name) => ({
        fullName: `refs/remotes/${name}`,
        name,
        remote: true,
        merged:
          name === repo.upstream ||
          /\/(?:main|master)$/.test(name),
        current: false,
        upstream: ""
      }));
      return [...local, ...remote];
    }

    function defaultHistoryRef() {
      return `refs/heads/${currentRepo().branch}`;
    }

    function currentHistorySingleRef() {
      return state.historyScope?.kind === "ref"
        ? state.historyScope.ref
        : state.historyLastSingleRef || defaultHistoryRef();
    }

    function historyUpstreamRef(ref) {
      const branches = historyBranchOptions();
      const selected = branches.find((branch) => branch.fullName === ref);
      if (!selected || selected.remote || !selected.upstream) return "";
      return branches.find(
        (branch) => branch.remote && branch.name === selected.upstream
      )?.fullName || "";
    }

    function currentCommits() {
      if (state.historyScope?.kind === "compare") {
        return comparedHistoryCommits(state.historyScope);
      }
      return commitsForHistoryRef(
        state.historyScope?.kind === "ref"
          ? state.historyScope.ref
          : defaultHistoryRef()
      );
    }

    function commitsForHistoryRef(ref) {
      const repo = currentRepo();
      const branchName = historyRefDisplayName(ref);
      const isCurrent = branchName === repo.branch;
      const seed = [...branchName].reduce(
        (total, character) => total + character.charCodeAt(0),
        0
      );
      const branchRepo = isCurrent
        ? repo
        : {
            ...repo,
            branch: branchName,
            head: `${repo.head.slice(0, 4)}${(seed % 0xfff)
              .toString(16)
              .padStart(3, "0")}`,
            lastSubject: `feat(${branchName}): 更新分支功能`
          };
      const overrides = recentCommitOverrides[repo.id];
      const seededCommits = overrides
        ? overrides.map((override) =>
            repoCommit(branchRepo, {
              ...override,
              refs: [branchName]
            })
          )
        : [
            repoCommit(branchRepo, {
              refs: [branchName]
            }),
            repoCommit(branchRepo, {
              hash: `${branchRepo.head.slice(0, 5)}a1`,
              subject: `chore(${repo.name}): 更新 ${branchName} 配置`,
              date: "2026-09-01T10:20:00+08:00",
              refs: [branchName]
            }),
            repoCommit(branchRepo, {
              hash: `${branchRepo.head.slice(0, 5)}b2`,
              subject: `fix(${repo.name}): 补充 ${branchName} 状态检查`,
              date: "2026-08-30T16:45:00+08:00",
              refs: [branchName]
            })
          ];
      const subjects = [
        `refactor(${repo.name}): 优化 ${branchName} 模块边界`,
        `docs(${repo.name}): 更新 ${branchName} 开发说明`,
        `feat(${repo.name}): 完善 ${branchName} 工作流`,
        `test(${repo.name}): 补充 ${branchName} 回归用例`,
        `chore(${repo.name}): 同步 ${branchName} 依赖版本`
      ];
      const authors = [
        repo.lastAuthor,
        "niliang",
        "hls",
        "刘俊鑫",
        "jakcychen"
      ];

      return [
        ...seededCommits,
        ...Array.from(
          { length: Math.max(0, 50 - seededCommits.length) },
          (_, offset) => {
            const index = seededCommits.length + offset;
            const date = new Date(branchRepo.lastDate);
            date.setDate(date.getDate() - index);
            return repoCommit(branchRepo, {
              hash: `${branchRepo.head.slice(0, 4)}${String(index + 1).padStart(3, "0")}`,
              author: authors[offset % authors.length],
              date: date.toISOString(),
              subject: subjects[offset % subjects.length],
              refs: [branchName]
            });
          }
        )
      ];
    }

    function comparedHistoryCommits(scope) {
      const repo = currentRepo();
      const leftName = historyRefDisplayName(scope.leftRef);
      const rightName = historyRefDisplayName(scope.rightRef);
      const left = commitsForHistoryRef(scope.leftRef)
        .slice(0, 4)
        .map((commit) => ({
          ...commit,
          refs: [leftName],
          color: "var(--purple)",
          comparisonSide: "left"
        }));
      const right = commitsForHistoryRef(scope.rightRef)
        .slice(0, 3)
        .map((commit) => ({
          ...commit,
          refs: [rightName],
          color: "var(--blue)",
          comparisonSide: "right"
        }));
      const interleaved = [];
      for (let index = 0; index < Math.max(left.length, right.length); index += 1) {
        if (right[index]) interleaved.push(right[index]);
        if (left[index]) interleaved.push(left[index]);
      }
      interleaved.push(
        repoCommit(repo, {
          hash: `${repo.head.slice(0, 4)}000`,
          subject: `${leftName} 与 ${rightName} 的共同历史基点`,
          date: "2026-08-25T09:30:00+08:00",
          refs: ["共同基点"],
          color: "var(--muted)",
          comparisonSide: "base"
        })
      );
      return interleaved;
    }

    function filteredHistoryCommits(commits = currentCommits()) {
      const query = (state.historyFilter || "").trim().toLowerCase();
      if (!query) return commits;

      return commits.filter((commit) => [
        commit.subject,
        commit.author,
        commit.hash,
        commit.refs.join(" "),
        commit.time
      ].join(" ").toLowerCase().includes(query));
    }

    function filterHistory(value, cursorPosition = value.length) {
      state.historyFilter = value;
      renderHistory();
      const input = document.getElementById("historyFilter");
      if (!input) return;
      input.focus();
      if (typeof input.setSelectionRange === "function") {
        const nextPosition = Math.min(cursorPosition, input.value.length);
        input.setSelectionRange(nextPosition, nextPosition);
      }
    }

    function toggleHistoryFilter() {
      state.historyFilterOpen = !state.historyFilterOpen;
      if (!state.historyFilterOpen) {
        state.historyFilter = "";
      }
      renderHistory();
    }

    function historyScopeCaption(commits) {
      const scope = state.historyScope;
      if (!scope) {
        return `只读快照 · 最近 ${commits.length} 条 ${currentRepo().branch} 提交`;
      }
      if (scope.kind === "ref") {
        return `只读快照 · 最近 ${commits.length} 条 ${historyRefDisplayName(scope.ref)} 提交`;
      }
      return `只读对比 · ${historyRefDisplayName(scope.leftRef)} ↔ ${historyRefDisplayName(scope.rightRef)}`;
    }

    function renderHistoryRefPicker(
      label,
      selectedRef,
      side,
      disabledRef = ""
    ) {
      const branches = historyBranchOptions();

    function updateHistoryRefMenu(menu) {
      if (!menu) return;
      const input = menu.querySelector(".history-ref-search");
      if (!input) return;
      const query = input.value.trim().toLowerCase();
      const activeGroup = menu.dataset.activeGroup || "local";
      const showMergedRemote =
        menu.dataset.showMergedRemote === "true";
      const options = [...menu.querySelectorAll(".history-ref-option")];
      let visible = 0;
      const mergedRemoteCount = options.filter(
        (option) =>
          option.dataset.branchGroup === "remote" &&
          option.dataset.merged === "true" &&
          option.dataset.selected !== "true"
      ).length;
      const groupMatches = {
        local: 0,
        remote: 0
      };
      options.forEach((option) => {
        const matches = query
          ? option.dataset.searchText.includes(query)
          : option.dataset.branchGroup === activeGroup &&
            (
              option.dataset.branchGroup !== "remote" ||
              showMergedRemote ||
              option.dataset.merged !== "true" ||
              option.dataset.selected === "true"
            );
        option.hidden = !matches;
        if (matches) {
          visible += 1;
          groupMatches[option.dataset.branchGroup] += 1;
        }
      });
      menu.querySelectorAll(".history-ref-group").forEach((group) => {
        const groupName = group.dataset.historyRefGroup;
        group.hidden = groupMatches[groupName] === 0;
        const heading = group.querySelector(".history-ref-group-heading");
        if (heading) heading.hidden = !query;
      });
      menu.querySelectorAll(".history-ref-breadcrumb button").forEach((button) => {
        const selected =
          button.dataset.historyRefGroup === activeGroup;
        button.classList.toggle("is-active", selected);
        button.setAttribute("aria-selected", String(selected));
      });
      const separator = menu.querySelector(".history-ref-group-separator");
      if (separator) {
        separator.hidden = !query
          || groupMatches.local === 0
          || groupMatches.remote === 0;
      }
      const mergedToggle = menu.querySelector(
        ".history-ref-merged-toggle"
      );
      if (mergedToggle) {
        mergedToggle.hidden =
          activeGroup !== "remote" ||
          Boolean(query) ||
          mergedRemoteCount === 0;
        mergedToggle.setAttribute(
          "aria-pressed",
          String(showMergedRemote)
        );
        mergedToggle.textContent = showMergedRemote
          ? "隐藏已合并"
          : `显示已合并 ${mergedRemoteCount}`;
      }
      const empty = menu.querySelector(".history-ref-empty");
      if (empty) empty.hidden = visible > 0;
    }

    function filterHistoryRefOptions(input) {
      updateHistoryRefMenu(input.closest(".history-ref-menu"));
    }

    function selectHistoryRefGroup(button, group) {
      const menu = button.closest(".history-ref-menu");
      if (!menu) return;
      menu.dataset.activeGroup = group;
      const input = menu.querySelector(".history-ref-search");
      if (input) input.value = "";
      updateHistoryRefMenu(menu);
    }

    function toggleHistoryMergedRemote(button) {
      const menu = button.closest(".history-ref-menu");
      if (!menu) return;
      menu.dataset.showMergedRemote = String(
        menu.dataset.showMergedRemote !== "true"
      );
      updateHistoryRefMenu(menu);
    }

    function onHistoryRefPickerToggle(details) {
      positionDetailsMenu(details, { side: "bottom", align: "end" });
      if (!details.open) return;
      const menu = details.querySelector(".history-ref-menu");
      if (!menu) return;
      menu.dataset.activeGroup = "local";
      menu.dataset.showMergedRemote = "false";
      const input = menu.querySelector(".history-ref-search");
      if (input) input.value = "";
      updateHistoryRefMenu(menu);
      requestAnimationFrame(() => input?.focus());
    }

    function resetHistoryScopeView() {
      state.historyFilter = "";

    function selectHistoryRef(side, ref) {
      if (side === "single") {
        state.historyLastSingleRef = ref;
        state.historyScope = { kind: "ref", ref };
        resetHistoryScopeView();
        return;
      }
      const current = state.historyScope?.kind === "compare"
        ? state.historyScope
        : {
            kind: "compare",
            leftRef: historyUpstreamRef(currentHistorySingleRef()),
            rightRef: currentHistorySingleRef()
          };
      if (!current.leftRef) return;
      const next = {
        ...current,
        [side === "left" ? "leftRef" : "rightRef"]: ref
      };
      if (next.leftRef === next.rightRef) return;
      state.historyScope = next;
      resetHistoryScopeView();
    }

    function beginHistoryComparison() {
      const targetRef = currentHistorySingleRef();
      const upstreamRef = historyUpstreamRef(targetRef);
      if (!upstreamRef) {
        showToast(
          "请选择比较基准",
          "当前查看范围没有可用的上游跟踪分支。",
          "branch"
        );
        return;
      }
      state.historyLastSingleRef = targetRef;
      state.historyScope = {
        kind: "compare",
        leftRef: upstreamRef,
        rightRef: targetRef
      };
      resetHistoryScopeView();
    }

    function exitHistoryComparison() {
      state.historyScope = state.historyLastSingleRef
        ? {
            kind: "ref",
            ref: state.historyLastSingleRef
          }
        : null;
      resetHistoryScopeView();
    }

        .replace(/\s+/g, " ");
    function applyTapdKeywordToCommitMessage(message, keyword) {
      const normalizedKeyword = normalizeTapdKeyword(keyword);
      if (!normalizedKeyword) {
        return message;
      }

      const normalizedMessage = String(message || "").trim();
      if (!normalizedMessage) {
        return message;
      }

      const lines = normalizedMessage.split(/\r?\n/);
      if (lines.some((line) => line.trim() === normalizedKeyword)) {
        return normalizedMessage;
      }
      if (lines.length === 1) {
        return `${lines[0]}\n${normalizedKeyword}`;
      }
      return [
        lines[0],
        normalizedKeyword,
        ...lines.slice(1)
      ].join("\n");
    }

    function currentWorkspaceSnapshot() {
      const entry = currentWorkspaceEntryDetails();
      const scopedRepositories = currentWorkspaceRepositories();
      const repositoryNames = new Set(
        scopedRepositories.flatMap((repository) => [
          repository.id,
          repository.name
        ])
      );
      const recordedWorktreeEntries = workspaceSnapshot.worktreeEntries.filter(
        (worktree) => repositoryNames.has(worktree.repo)
      );
      const worktreeEntries = recordedWorktreeEntries.length
        ? recordedWorktreeEntries
        : scopedRepositories
            .filter((repository) => repository.standalone)
            .map((repository) => ({
              repo: repository.name,
              path: repoAbsolutePath(repository).replace(/\\/g, "/"),
              head: repository.head,
              branch: repository.branch,
              primary: true,
              detached: false,
              prunable: false,
              exists: true,
              changes: repository.changes
            }));
      const rootScope = entry.id === "workspace-root";
      const totalRepositories = scopedRepositories.length;
      const configuredRepositories = rootScope
        ? Math.min(workspaceSnapshot.configuredRepositories, totalRepositories)
        : scopedRepositories.filter((repository) => repository.listed).length;
      const fallbackWorktrees = scopedRepositories.reduce(
        (total, repository) => total + (repository.worktrees || 0),
        0
      );
      const fallbackPrunableWorktrees = scopedRepositories.reduce(
        (total, repository) => total + (repository.prunable || 0),
        0
      );
      const fallbackDetachedWorktrees = scopedRepositories.reduce(
        (total, repository) => total + (repository.detached || 0),
        0
      );
      const branches = [...new Set(
        scopedRepositories.map((repository) => repository.branch).filter(Boolean)
      )];

      return {
        ...workspaceSnapshot,
        name: entry.displayName,
        rootPath: entry.path,
        configuredRepositories,
        localExtraRepositories: Math.max(
          0,
          totalRepositories - configuredRepositories
        ),
        totalRepositories,
        dirtyRepositories: scopedRepositories.filter(
          (repository) => repository.changes > 0 || repository.conflicts > 0
        ).length,
        totalChanges: scopedRepositories.reduce(
          (total, repository) => total + repository.changes,
          0
        ),
        stagedChanges: scopedRepositories.reduce(
          (total, repository) => total + repository.staged,
          0
        ),
        unstagedTrackedChanges: scopedRepositories.reduce(
          (total, repository) => total + repository.unstaged,
          0
        ),
        untrackedChanges: scopedRepositories.reduce(
          (total, repository) => total + repository.untracked,
          0
        ),
        conflicts: scopedRepositories.reduce(
          (total, repository) => total + repository.conflicts,
          0
        ),
        behindRepositories: scopedRepositories.filter(
          (repository) => repository.behind > 0
        ).length,
        behindCommits: scopedRepositories.reduce(
          (total, repository) => total + repository.behind,
          0
        ),
        aheadRepositories: scopedRepositories.filter(
          (repository) => repository.ahead > 0
        ).length,
        aheadCommits: scopedRepositories.reduce(
          (total, repository) => total + repository.ahead,
          0
        ),
        worktrees: worktreeEntries.length || fallbackWorktrees,
        prunableWorktrees: worktreeEntries.length
          ? worktreeEntries.filter((worktree) => worktree.prunable).length
          : fallbackPrunableWorktrees,
        detachedWorktrees: worktreeEntries.length
          ? worktreeEntries.filter((worktree) => worktree.detached).length
          : fallbackDetachedWorktrees,
        branchDistribution: branches.map((branch) => ({
          name: branch,
          count: scopedRepositories.filter(
            (repository) => repository.branch === branch
          ).length
        })),
        worktreeEntries
      };
    }

    function startGroupDrag(event, trigger) {
      const group = trigger.dataset.group;
      if (!group) return;

      state.draggedGroup = group;
      state.dragOverGroup = "";
      state.dragOverPosition = "";
      state.groupDragSuppressUntil = Date.now() + 800;
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", group);
      clearGroupDragClasses();
      trigger.classList.add("dragging");
    }

    function dragOverGroup(event, trigger) {
      const source = state.draggedGroup;
      const target = trigger.dataset.group;
      if (!source || !target || source === target) return;

      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      const bounds = trigger.getBoundingClientRect();
      const position = event.clientY < bounds.top + bounds.height / 2
        ? "before"
        : "after";
      state.dragOverGroup = target;
      state.dragOverPosition = position;
      clearGroupDragClasses();
      document.querySelector(
        `.group-header[data-group="${CSS.escape(source)}"]`
      )?.classList.add("dragging");
      trigger.classList.add(`drag-over-${position}`);
    }

    function endGroupDrag() {
      clearGroupDragClasses();
      state.draggedGroup = "";
      state.dragOverGroup = "";
      state.dragOverPosition = "";
    }

    function dropGroup(event, trigger) {
      event.preventDefault();
      const source = state.draggedGroup;
      const target = trigger.dataset.group;
      if (!source || !target || source === target) {
        endGroupDrag();
        return;
      }

      const groups = sidebarGroupNames(
        repositories.filter(
          (repo) =>
            repo.id !== "workspace-root" &&
            !repo.standalone &&
            !state.removedRepositoryIds.has(repo.id)
        )
      );
      const nextGroups = groups.filter((group) => group !== source);
      const targetIndex = nextGroups.indexOf(target);
      if (targetIndex < 0) {
        endGroupDrag();
        return;
      }

      const insertIndex = targetIndex +
        (state.dragOverPosition === "after" ? 1 : 0);
      nextGroups.splice(insertIndex, 0, source);
      state.groupOrder = nextGroups;
      endGroupDrag();
      renderSidebar();
    }

      const entryMatches = !query || entrySearchText.includes(query);
      const sidebarRepositories = repositories.filter((repo) =>

      const standaloneRepositories = repositories.filter((repo) =>

      const groups = sidebarGroupNames(sidebarRepositories);
      const groupsHtml = groups.map((group, groupIndex) => {
          const repos = sidebarRepositories.filter((repo) =>
          repositoryGroupName(repo) === group && (entryMatches || `${repo.name} ${repo.branch} ${repo.path}`.toLowerCase().includes(query))
        );
        if (
          !repos.length
          && (query || showChangedRootRepositoriesOnly)
        ) return "";
        const isCollapsed = rootCollapsedGroups.has(group);
        const groupBodyId = `repo-group-body-${groupIndex}`;
        return `
          <section class="repo-group ${isCollapsed ? "collapsed" : ""}">
            <button type="button" class="group-header" draggable="true" aria-expanded="${!isCollapsed}" aria-controls="${groupBodyId}" data-group="${escapeHtml(group)}" data-workspace-entry="workspace-root" onclick="toggleRepoGroup(event.currentTarget)" oncontextmenu="openGroupContextMenu(event, '${escapeHtml(group)}')" ondragstart="startGroupDrag(event, event.currentTarget)" ondragover="dragOverGroup(event, event.currentTarget)" ondrop="dropGroup(event, event.currentTarget)" ondragend="endGroupDrag()">
              ${icon("chevronDown")}
              <span>${escapeHtml(groupDisplayName(group))}</span>
              <span class="group-count">${repos.length}</span>
            </button>
            <div class="repo-group-body" id="${groupBodyId}" aria-hidden="${isCollapsed}" ${isCollapsed ? "inert" : ""}>
              <div class="repo-group-inner">
                ${repos.length
                  ? repos.map((repo) => renderRepoRow(repo, "workspace-root", repo.id)).join("")
                  : `<div class="repo-group-empty">暂无仓库</div>`}
              </div>
            </div>
          </section>
        `;
      }).join("");

      const workspaceRootVisible = !state.removedEntryIds.has("workspace-root");
      const workspaceRootSelected =
        currentWorkspaceEntryId() === "workspace-root";
      const workspaceRootHtml = workspaceRootVisible && (entryMatches || groupsHtml)
        ? `
          <section class="workspace-root ${workspaceRootSelected ? "selected" : ""} ${state.workspaceRootCollapsed ? "collapsed" : ""}">
            <button type="button" class="workspace-root-heading" ${workspaceRootSelected ? 'aria-current="true"' : ""} aria-expanded="${!state.workspaceRootCollapsed}" aria-haspopup="menu" aria-controls="workspace-root-body" onclick="toggleWorkspaceRoot()" oncontextmenu="openWorkspaceContextMenu(event, 'workspace-root')">
              <span class="workspace-root-icon">${icon("folder", 15)}</span>
              <span class="workspace-root-copy">
                <strong>${workspaceEntryDisplayName("workspace-root")}</strong>
                <small title="${workspaceSnapshot.rootPath}">${workspaceSnapshot.rootPath}</small>
              </span>
              <span class="workspace-root-toggle" aria-hidden="true">${icon(state.workspaceRootCollapsed ? "chevronRight" : "chevronDown", 14)}</span>
            </button>
            <div class="workspace-root-body" id="workspace-root-body" aria-hidden="${state.workspaceRootCollapsed}" ${state.workspaceRootCollapsed ? "inert" : ""}>
              <div class="workspace-root-body-inner">
                ${groupsHtml}
              </div>
            </div>
          </section>
        `
        : "";

      const standaloneHtml = standaloneRepositories
        .filter((repo) => !state.removedEntryIds.has(repo.id))
        .filter((repo) => {
          const text = `${workspaceEntryDisplayName(repo.id)} ${repo.name} ${repo.branch} ${repo.path}`.toLowerCase();
          return !query || text.includes(query);
        })
        .map((repo) => {
          const selected = currentWorkspaceEntryId() === repo.id;
          const repositoryPreferences =
            sidebarRepositoryPreferencesForEntry(repo.id);
          const repositoryVisible =
            !repositoryPreferences.changedRepositoriesOnly
            || hasLocalRepositoryChanges(repo);
          const bodyId = `standalone-repo-body-${repo.id}`;
          return `
            <section class="workspace-root standalone-workspace-root ${selected ? "selected" : ""}">
              <button type="button" class="workspace-root-heading" ${selected ? 'aria-current="true"' : ""} aria-expanded="true" aria-haspopup="menu" aria-controls="${bodyId}" onclick="openStandaloneEntry('${repo.id}')" oncontextmenu="openWorkspaceContextMenu(event, '${repo.id}')">
                <span class="workspace-root-icon">${icon("repository", 15)}</span>
                <span class="workspace-root-copy">
                  <strong>${workspaceEntryDisplayName(repo.id)}</strong>
                  <small title="${repoAbsolutePath(repo)}">${repoAbsolutePath(repo)}</small>
                </span>
                <span class="workspace-root-toggle" aria-hidden="true">${icon("chevronDown", 14)}</span>
              </button>
              <div class="workspace-root-body" id="${bodyId}">
                <div class="workspace-root-body-inner">
                  <div class="repo-group">
                    <div class="repo-group-body">
                      <div class="repo-group-inner">
                        ${repositoryVisible
                          ? renderRepoRow(repo, repo.id)
                          : `<div class="repo-group-empty">暂无变更仓库</div>`}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          `;
        })
        .join("");

      const html = `${workspaceRootHtml}${standaloneHtml}`;
      document.getElementById("repositoryList").innerHTML = html || `
        <div class="empty-state">
          <div>
            <div class="empty-state-icon">${icon("search", 22)}</div>
            <div class="empty-state-title">没有匹配的仓库</div>
            <div class="empty-state-description">当前筛选条件未匹配仓库，请修改关键词或清除筛选。</div>
            <div class="empty-state-actions">
              ${renderButton({
                label: "清除筛选",
                size: "small",
                variant: "default",
                attributes: 'onclick="clearRepositoryFilter()"'
              })}
            </div>
          </div>
        </div>
      `;
      renderWorkspaceSwitcherMenu();
      renderWorkspaceContextMenu();
    }

    function hasLocalRepositoryChanges(repo) {
      return repo.changes > 0 || repo.conflicts > 0;
    }

    function setAllRepoGroupsCollapsed(collapsed) {
      const groups = sidebarRepositoryGroupNames();
      state.collapsedGroups.clear();
      if (collapsed) {
        groups.forEach((group) => state.collapsedGroups.add(group));
      }
      persistSidebarRepositoryPreferences();
      closeSidebarRepositoryMenu();
      renderSidebar();
    }

    function toggleWorkspaceRoot() {
      withCommitDraftGuard(() => {
        state.repoId = "workspace-root";
        setCurrentWorkspaceEntryId("workspace-root");
        state.view = "workspace";
        state.tab = "overview";
        state.workspaceRootCollapsed = !state.workspaceRootCollapsed;
        renderMain();
      });
    }

    function toggleRepoGroup(trigger) {
      if (Date.now() < state.groupDragSuppressUntil) {
        state.groupDragSuppressUntil = 0;
        return;
      }
      const section = trigger.closest(".repo-group");
      const group = trigger.dataset.group;
      if (!section || !group) return;
      const entryId =
        trigger.dataset.workspaceEntry || currentWorkspaceEntryId();
      const preferences =
        sidebarRepositoryPreferencesForEntry(entryId);
      const collapsedGroups = preferences.collapsedGroups;

      const nextCollapsed = !section.classList.contains("collapsed");
      const body = section.querySelector(".repo-group-body");
      section.classList.toggle("collapsed", nextCollapsed);
      trigger.setAttribute("aria-expanded", String(!nextCollapsed));
      if (body) {
        body.setAttribute("aria-hidden", String(nextCollapsed));
        body.inert = nextCollapsed;
      }

      if (nextCollapsed) collapsedGroups.add(group);
      else collapsedGroups.delete(group);
      persistSidebarRepositoryPreferences(entryId, {
        changedRepositoriesOnly:
          preferences.changedRepositoriesOnly,
        collapsedGroups
      });
    }

    function renderRepoRow(repo, entryId = "workspace-root", targetRepoId = null) {
      const status = repo.conflicts
        ? `<span class="repo-status conflict">${icon("alert", 11)}${repo.conflicts}</span>`
        : repo.changes
          ? `<span class="repo-status dirty">M ${repo.changes}</span>`
        : repo.behind
          ? `<span class="repo-status behind">↓ ${repo.behind}</span>`
          : repo.ahead
            ? `<span class="repo-status ahead">↑ ${repo.ahead}</span>`
              : "";

      return `
        <button type="button" class="repo-row ${state.view === "repository" && state.repoId === repo.id ? "active" : ""}" aria-label="打开仓库 ${repo.name}" aria-haspopup="menu" ${state.view === "repository" && state.repoId === repo.id ? 'aria-current="page"' : ""} onclick="openRepository('${repo.id}')" oncontextmenu="openWorkspaceContextMenu(event, '${entryId}', '${escapeHtml(repo.name)}', ${targetRepoId ? `'${targetRepoId}'` : "null"})">
          <span class="repo-icon ${repo.status}">${icon("repository", 14)}</span>
          <span class="repo-main">
            <span class="repo-name">${repo.name}</span>
            <span class="repo-branch">${icon("branch", 11)}<span>${repo.branch}</span></span>
          </span>
          ${status}
        </button>
      `;
    }

    function getWorkspaceContextMenuPosition(event, menuWidth, menuHeight) {
      const viewportPadding = 8;
      const maxX = Math.max(viewportPadding, window.innerWidth - menuWidth - viewportPadding);
      const maxY = Math.max(viewportPadding, window.innerHeight - menuHeight - viewportPadding);

      return {
        x: Math.max(viewportPadding, Math.min(event.clientX, maxX)),
        y: Math.max(viewportPadding, Math.min(event.clientY, maxY))
      };
    }

    function openWorkspaceContextMenu(event, entryId, targetName = "", targetRepoId = null) {
      event.preventDefault();
      event.stopPropagation();

      const entry = workspaceEntryDetails(entryId);
      if (!entry || state.removedEntryIds.has(entryId)) return;

      const menuWidth = 222;
      const menuHeight = entryId === "workspace-root" ? 176 : 136;
      const position = getWorkspaceContextMenuPosition(event, menuWidth, menuHeight);
      state.contextMenuReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      state.contextMenu = {
        entryId,
        targetName: targetName || "",
        targetRepoId,
        ...position
      };
      renderWorkspaceContextMenu();
    }

    function openGroupContextMenu(event, groupName) {
      event.preventDefault();
      event.stopPropagation();

      const menuWidth = 222;
      const menuHeight = 104;
      const position = getWorkspaceContextMenuPosition(event, menuWidth, menuHeight);
      state.contextMenuReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      state.contextMenu = {
        entryId: "workspace-root",
        groupName,
        ...position
      };
      renderWorkspaceContextMenu();
    }

    function openRepositoryPanelContextMenu(event) {
      if (event.target !== event.currentTarget) return;

      event.preventDefault();
      event.stopPropagation();

      const menuWidth = 222;
      const menuHeight = 50;
      const position = getWorkspaceContextMenuPosition(
        event,
        menuWidth,
        menuHeight
      );
      state.contextMenuReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      state.contextMenu = {
        entryId: "workspace-root",
        panel: true,
        ...position
      };
      renderWorkspaceContextMenu();
    }

    function openDiffHunkContextMenu(event, hunkIndex) {
      event.preventDefault();
      event.stopPropagation();

      const selected = currentChangedFiles().find(
        (file) => file.path === state.selectedFile
      );
      if (
        !Number.isInteger(hunkIndex) ||
        hunkIndex < 0 ||
        !canExpandDiffPreview(selected)
      ) {
        return;
      }

      const position = getWorkspaceContextMenuPosition(event, 222, 52);
      state.contextMenuReturnFocus =
        event.currentTarget instanceof HTMLElement
          ? event.currentTarget
          : document.activeElement instanceof HTMLElement
            ? document.activeElement
            : null;
      state.contextMenu = {
        diffHunkIndex: hunkIndex,
        filePath: selected.path,
        repoId: currentRepo().id,
        ...position
      };
      renderWorkspaceContextMenu();
    }

    function openChangeFileContextMenu(event, filePath) {
      event.preventDefault();
      event.stopPropagation();

      const repo = currentRepo();
      const file = (changedFilesByRepo[repo.id] || []).find(
        (item) => item.path === filePath
      );
      if (!file) return;

      const menuWidth = 222;
      const menuHeight = 52;
      const position = getWorkspaceContextMenuPosition(
        event,
        menuWidth,
        menuHeight
      );
      state.selectedFile = file.path;
      state.contextMenuReturnFocus =
        document.activeElement instanceof HTMLElement
          ? document.activeElement
          : null;
      state.contextMenu = {
        filePath: file.path,
        repoId: repo.id,
        ...position
      };
      renderChanges();
      renderWorkspaceContextMenu();
    }

    function openRepositoryStashContextMenu(event, hash) {
      event.preventDefault();
      event.stopPropagation();
      const stash = visibleRepositoryStashes().find(
        (candidate) => candidate.hash === hash
      );
      if (!stash) return;
      const position = getWorkspaceContextMenuPosition(
        event,
        222,
        118
      );
      state.selectedStashHash = hash;
      state.stashFileFilter = "";
      const stashView = document.querySelector(".repository-stash-view");
      if (stashView) {
        stashView.innerHTML = renderRepositoryStashBrowser();
      }
      state.contextMenuReturnFocus = [
        ...document.querySelectorAll(
          ".repository-stash-item[data-stash-hash]"
        )
      ].find((item) => item.dataset.stashHash === hash) || null;
      state.contextMenu = {
        stashHash: hash,
        ...position
      };
      renderWorkspaceContextMenu();
    }

    let contextOpenInCloseTimer = null;

    function openContextOpenInSubmenu(container) {
      if (contextOpenInCloseTimer !== null) {
        clearTimeout(contextOpenInCloseTimer);
        contextOpenInCloseTimer = null;
      }
      container?.classList.add("submenu-open");
      positionAnchoredMenu(
        container?.querySelector(
          ".workspace-context-open-in-submenu"
        ),
        container?.closest(".workspace-context-menu")
      );
    }

    function scheduleContextOpenInSubmenuClose(container) {
      if (contextOpenInCloseTimer !== null) {
        clearTimeout(contextOpenInCloseTimer);
      }
      contextOpenInCloseTimer = setTimeout(() => {
        contextOpenInCloseTimer = null;
        container?.classList.remove("submenu-open");
      }, 120);
    }

    function renderWorkspaceContextMenu() {
      const mount = document.getElementById("workspaceContextMenuMount");
      if (!mount) return;

      const context = state.contextMenu;
      if (Number.isInteger(context?.diffHunkIndex)) {
        const selected = currentChangedFiles().find(
          (file) => file.path === context.filePath
        );
        if (
          !selected ||
          currentRepo().id !== context.repoId ||
          state.selectedFile !== context.filePath ||
          !canExpandDiffPreview(selected)
        ) {
          closeWorkspaceContextMenu({ restoreFocus: false });
          return;
        }
        const full =
          state.diffHunkContexts[context.diffHunkIndex]?.full === true;
        mount.innerHTML = `
          <div class="workspace-context-menu menu-surface" role="menu" aria-label="第 ${context.diffHunkIndex + 1} 个变更块上下文" style="left:${context.x}px;top:${context.y}px">
            ${renderMenuItem({
              label: full ? "恢复精简" : "展开全部",
              leading: icon(full ? "undo" : "maximize", 14),
              attributes: 'onclick="toggleContextDiffHunkExpansion()"'
            })}
          </div>
        `;
        requestAnimationFrame(() => {
          mount.querySelector("button")?.focus({ preventScroll: true });
        });
        return;
      }
      if (context?.stashHash) {
        const stash = visibleRepositoryStashes().find(
          (candidate) => candidate.hash === context.stashHash
        );
        if (!stash) {
          closeWorkspaceContextMenu({ restoreFocus: false });
          return;
        }
        mount.innerHTML = `
          <div class="workspace-context-menu menu-surface" role="menu" aria-label="${escapeHtml(stash.ref)} 储藏操作" style="left:${context.x}px;top:${context.y}px">
            ${renderMenuItem({
              label: "恢复",
              leading: icon("refresh", 14),
              attributes: "onclick=\"confirmRepositoryStashAction('restore')\""
            })}
            ${renderMenuItem({
              label: "删除",
              leading: icon("alert", 14),
              className: "danger",
              attributes: "onclick=\"confirmRepositoryStashAction('delete')\""
            })}
            ${renderMenuItem({
              label: "恢复并删除",
              leading: icon("layers", 14),
              className: "danger",
              attributes: "onclick=\"confirmRepositoryStashAction('pop')\""
            })}
          </div>
        `;
        requestAnimationFrame(() => {
          mount.querySelector("button")?.focus();
        });
        return;
      }
      if (context?.filePath) {
        mount.innerHTML = `
          <div class="workspace-context-menu menu-surface" role="menu" aria-label="${escapeHtml(context.filePath)} 文件操作" style="left:${context.x}px;top:${context.y}px">
            <div class="workspace-context-open-in" onmouseenter="openContextOpenInSubmenu(event.currentTarget)" onmouseleave="scheduleContextOpenInSubmenuClose(event.currentTarget)" onfocusin="openContextOpenInSubmenu(event.currentTarget)" onfocusout="scheduleContextOpenInSubmenuClose(event.currentTarget)">
              ${renderMenuItem({
                label: "打开方式",
                leading: icon("external", 14),
                trailing: icon("chevronRight", 14),
                className: "workspace-context-open-in-trigger",
                title: "选择用于打开此文件的应用",
                attributes: 'aria-haspopup="menu"'
              })}
              <div class="workspace-context-open-in-submenu menu-surface" role="menu" aria-label="选择用于打开此文件的应用">
                ${renderMenuHeading("Open in")}
                ${openInApplications.map((application) =>
                  renderMenuItem({
                    label: application.label,
                    leading: openInApplicationIcon(application.kind),
                    attributes: `onclick="openContextFileWithApplication('${application.kind}')"`
                  })
                ).join("")}
              </div>
            </div>
          </div>
        `;
        requestAnimationFrame(() => {
          mount.querySelector("button")?.focus();
        });
        return;
      }

      if (context?.groupName) {
        const title = groupDisplayName(context.groupName);
        const repositoryCount = getGroupRepositoryCount(
          context.groupName
        );
        const canDelete = repositoryCount === 0;
        mount.innerHTML = `
          <div class="workspace-context-menu menu-surface" role="menu" aria-label="${escapeHtml(title)} 分组操作" style="left:${context.x}px;top:${context.y}px">
            ${renderMenuItem({
              label: "重命名分组",
              leading: icon("settings", 14),
              attributes: 'onclick="renameContextGroup()"'
            })}
            ${renderMenuSeparator()}
            ${renderMenuItem({
              label: "删除分组",
              leading: icon("alert", 14),
              className: "danger",
              disabled: !canDelete,
              title: canDelete
                ? "删除空分组"
                : "分组中仍有仓库，无法删除",
              attributes: 'onclick="removeContextGroup()"'
            })}
          </div>
        `;
        requestAnimationFrame(() => {
          mount.querySelector("button")?.focus();
        });
        return;
      }

      if (context?.panel) {
        mount.innerHTML = `
          <div class="workspace-context-menu menu-surface" role="menu" aria-label="仓库面板操作" style="left:${context.x}px;top:${context.y}px">
            ${renderMenuItem({
              label: "添加分组",
              leading: icon("plus", 14),
              attributes:
                'onclick="addRepositoryGroupFromContext()"'
            })}
          </div>
        `;
        requestAnimationFrame(() => {
          mount.querySelector("button")?.focus();
        });
        return;
      }

      const entry = context ? workspaceEntryDetails(context.entryId) : null;
      if (!context || !entry) {
        mount.innerHTML = "";
        return;
      }

      const title = context.targetName || entry.displayName;
      mount.innerHTML = `
        <div class="workspace-context-menu menu-surface" role="menu" aria-label="${escapeHtml(title)} 操作" style="left:${context.x}px;top:${context.y}px">
          ${renderMenuItem({
            label: "修改显示名称",
            leading: icon("settings", 14),
            attributes: 'onclick="renameContextWorkspaceEntry()"'
          })}
          ${context.entryId === "workspace-root" ? renderMenuItem({
            label: "设置 TAPD 关键字",
            leading: icon("tag", 14),
            title: state.tapdKeyword
              ? `当前关键字：${state.tapdKeyword}`
              : "为当前 Workspace 配置 TAPD 关键字",
            attributes: 'onclick="configureTapdKeywordFromContext()"'
          }) : ""}
          ${renderMenuItem({
            label: "重新扫描",
            leading: icon("refresh", 14),
            attributes: 'onclick="rescanContextWorkspaceEntry()"'
          })}
          ${renderMenuSeparator()}
          ${renderMenuItem({
            label: "移出 Workspace",
            leading: icon("alert", 14),
            className: "danger",
            attributes: 'onclick="removeContextWorkspaceEntry()"'
          })}
        </div>
      `;
      requestAnimationFrame(() => {
        mount.querySelector("button")?.focus();
      });
    }

    function closeWorkspaceContextMenu({ restoreFocus = true } = {}) {
      const returnFocus = state.contextMenuReturnFocus;
      state.contextMenu = null;
      state.contextMenuReturnFocus = null;
      renderWorkspaceContextMenu();
      if (restoreFocus && returnFocus?.isConnected) returnFocus.focus();
    }

    function toggleContextDiffHunkExpansion() {
      const context = state.contextMenu;
      if (!Number.isInteger(context?.diffHunkIndex)) return;

      const hunkIndex = context.diffHunkIndex;
      const filePath = context.filePath;
      const selected = currentChangedFiles().find(
        (file) => file.path === filePath
      );
      if (
        !selected ||
        currentRepo().id !== context.repoId ||
        state.selectedFile !== filePath ||
        !canExpandDiffPreview(selected)
      ) {
        closeWorkspaceContextMenu({ restoreFocus: false });
        return;
      }

      const direction =
        state.diffHunkContexts[hunkIndex]?.full === true
          ? "reset"
          : "all";
      closeWorkspaceContextMenu({ restoreFocus: false });
      expandDiffContext(direction, hunkIndex);
      requestAnimationFrame(() => {
        document
          .querySelector(
            `.diff-viewer-wide-row.hunk[data-hunk-index="${hunkIndex}"] .diff-viewer-hunk-trigger`
          )
          ?.focus({ preventScroll: true });
      });
    }

    function removeRepositoryStashPreview(hash) {
      const before = visibleRepositoryStashes();
      const index = before.findIndex((stash) => stash.hash === hash);
      if (index < 0) return;
      state.removedStashHashes.add(hash);
      const after = visibleRepositoryStashes();
      const next = after[index] || after[index - 1] || null;
      state.selectedStashHash = next?.hash || "";
      state.stashFileFilter = "";
      const count = document.querySelector(".repository-stash-count");
      if (count) count.textContent = String(after.length);
      const stashView = document.querySelector(".repository-stash-view");
      if (stashView) stashView.innerHTML = renderRepositoryStashBrowser();
    }

    function confirmRepositoryStashAction(action) {
      const context = state.contextMenu;
      const stash = context?.stashHash
        ? visibleRepositoryStashes().find(
            (candidate) => candidate.hash === context.stashHash
          )
        : null;
      if (!stash) return;
      closeWorkspaceContextMenu({ restoreFocus: false });
      const definitions = {
        restore: {
          title: `恢复 ${stash.ref}？`,
          description:
            "会把这个储藏的内容应用到当前工作区，并保留原储藏记录；如有冲突，需要在工作区中继续处理。",
          actionLabel: "确认恢复"
        },
        delete: {
          title: `删除 ${stash.ref}？`,
          description:
            "这个储藏记录及其变更将被永久删除，删除后无法恢复。当前原型不会执行真实 Git 命令。",
          actionLabel: "确认删除"
        },
        pop: {
          title: `恢复并删除 ${stash.ref}？`,
          description:
            "会先把内容应用到当前工作区；只有恢复成功才移除储藏，发生冲突时会保留储藏记录。",
          actionLabel: "恢复并删除"
        }
      };
      const definition = definitions[action];
      if (!definition) return;
      openConfirmDialog({
        ...definition,
        onConfirm: () => {
          if (action === "restore") {
            showToast(
              "恢复预览完成",
              `${stash.ref} 的内容将应用到工作区并保留储藏；原型未执行 Git。`,
              "refresh"
            );
            return;
          }
          removeRepositoryStashPreview(stash.hash);
          showToast(
            action === "delete"
              ? "删除预览完成"
              : "恢复并删除预览完成",
            action === "delete"
              ? `${stash.ref} 已从本地 mock 列表移除；正式删除不可恢复，原型未执行 Git。`
              : `${stash.ref} 按恢复成功预览从 mock 列表移除；真实操作若发生冲突会保留储藏。`,
            action === "delete" ? "alert" : "layers"
          );
        }
      });
    }

    function addRepositoryGroupFromContext() {
      closeWorkspaceContextMenu({ restoreFocus: false });
      showToast("添加分组", "将在当前 Workspace 中创建新的仓库分组。", "plus");
    }

    function openContextFileWithApplication(kind) {
      const context = state.contextMenu;
      if (!context?.filePath) return;

      const application = openInApplications.find(
        (candidate) => candidate.kind === kind
      );
      if (!application) {
        showErrorToast("无法打开本地应用", "所选应用当前不可用。");
        return;
      }

      const repo =
        repositories.find((item) => item.id === context.repoId) ||
        currentRepo();
      const filePath = context.filePath;
      const absolutePath =
        `${repoAbsolutePath(repo)}\\${filePath.replace(/\//g, "\\")}`;
      setOpenInPreference(application.kind, "file");
      closeWorkspaceContextMenu({ restoreFocus: false });
      renderCommandbar();
      showToast(
        `已使用 ${application.label} 打开`,
        `${absolutePath}（交互原型，不会实际启动本地程序）`,
        application.kind === "file-explorer"
          ? "folder"
          : application.kind === "terminal" ||
              application.kind === "git-bash"
            ? "terminal"
            : "external"
      );
    }

    function renameContextGroup() {
      const context = state.contextMenu;
      if (!context?.groupName) return;

      const returnFocus = state.contextMenuReturnFocus || document.activeElement;
      closeWorkspaceContextMenu({ restoreFocus: false });
      openRenameGroupDialog(context.groupName, returnFocus);
    }

    function getGroupRepositoryCount(groupName) {
      return repositories.filter(
        (repo) =>
          !repo.standalone &&
          !state.removedEntryIds.has(repo.id) &&
          !state.removedRepositoryIds.has(repo.id) &&
          repositoryGroupName(repo) === groupName
      ).length;
    }

    function removeContextGroup() {
      const context = state.contextMenu;
      if (!context?.groupName) return;

      const groupName = context.groupName;
      const title = groupDisplayName(groupName);
      if (getGroupRepositoryCount(groupName) > 0) return;

      closeWorkspaceContextMenu({ restoreFocus: false });
      state.removedEmptyGroupNames.add(groupName);
      const rootPreferences =
        sidebarRepositoryPreferencesForEntry("workspace-root");
      rootPreferences.collapsedGroups.delete(groupName);
      state.groupOrder = state.groupOrder.filter(
        (group) => group !== groupName
      );
      delete state.groupDisplayNames[groupName];
      persistSidebarRepositoryPreferences("workspace-root", rootPreferences);
      renderSidebar();
      showToast(
        "分组已删除",
        `“${title}”已从当前 Workspace 的本地视图中移除。`,
        "check"
      );
    }

    function renameContextWorkspaceEntry() {
      const context = state.contextMenu;
      const entry = context ? workspaceEntryDetails(context.entryId) : null;
      if (!context || !entry) return;

      const returnFocus = state.contextMenuReturnFocus || document.activeElement;
      closeWorkspaceContextMenu({ restoreFocus: false });
      openRenameEntryDialog(entry.id, returnFocus);
    }

    function rescanContextWorkspaceEntry() {
      const context = state.contextMenu;
      if (!context) return;
      closeWorkspaceContextMenu({ restoreFocus: false });
      runOperation("scan");
    }

    function configureTapdKeywordFromContext() {
      const context = state.contextMenu;
      if (!context || context.entryId !== "workspace-root") return;

      const returnFocus =
        state.contextMenuReturnFocus || document.activeElement;
      closeWorkspaceContextMenu({ restoreFocus: false });
      openTapdKeywordDialog(returnFocus);
    }

    function removeContextWorkspaceEntry() {
      const context = state.contextMenu;
      const entry = context ? workspaceEntryDetails(context.entryId) : null;
      if (!context || !entry) return;

      closeWorkspaceContextMenu({ restoreFocus: false });
      const targetRepository = context.targetRepoId
        ? repositories.find((repo) => repo.id === context.targetRepoId)
        : null;
      const targetName = targetRepository?.name || entry.displayName;
      const targetPath = targetRepository
        ? repoAbsolutePath(targetRepository)
        : entry.path;
      openConfirmDialog({
        title: `移出 ${targetName}？`,
        description: `设计预览只会将“${targetName}”从 Workspace 配置中移除，不会删除磁盘上的目录、仓库或提交。`,
        actionLabel: "确认移出",
        onConfirm: () => {
          if (targetRepository) {
            state.removedRepositoryIds.add(targetRepository.id);
          } else {
            state.removedEntryIds.add(entry.id);
          }
          if (state.repoId === targetRepository?.id || state.repoId === entry.id || entry.id === "workspace-root") {
            state.repoId = "workspace-root";
            setCurrentWorkspaceEntryId("workspace-root");
            state.view = "workspace";
            state.tab = "overview";
          }
          renderSidebar();
          renderMain();
          showToast("已移出 Workspace", `${targetName} 已从设计预览配置中移除。`, "check");
        }
      });
    }

    function persistTapdKeyword() {
      try {
        if (state.tapdKeyword) {
          localStorage.setItem(tapdKeywordStorageKey, state.tapdKeyword);
        } else {
          localStorage.removeItem(tapdKeywordStorageKey);
        }
      } catch {
        // 文件预览环境可能禁用持久化。
      }
    }

    function openTapdKeywordDialog(returnFocus = null) {
      const overlay = document.getElementById("tapdKeywordOverlay");
      const input = document.getElementById("tapdKeywordInput");
      if (!overlay || !input) return;
      const activeWorkspaceSnapshot = currentWorkspaceSnapshot();

      state.tapdKeywordReturnFocus =
        returnFocus instanceof HTMLElement ? returnFocus : null;
      document.getElementById("tapdKeywordDescription").textContent =
        `${activeWorkspaceSnapshot.name} · ${activeWorkspaceSnapshot.rootPath}`;
      document.getElementById("tapdKeywordIcon").innerHTML = icon("tag", 22);
      input.value = state.tapdKeyword;
      document.querySelector(".app-shell").inert = true;
      overlay.inert = false;
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
      focusAfterInertSettles(input, state.tapdKeywordReturnFocus);
    }

    function rememberTapdKeywordBackdropPointer(event) {
      state.tapdKeywordPointerDownOnBackdrop =
        event.target === event.currentTarget;
    }

    function closeTapdKeywordFromBackdrop(event) {
      const shouldClose =
        state.tapdKeywordPointerDownOnBackdrop &&
        event.target === event.currentTarget;
      state.tapdKeywordPointerDownOnBackdrop = false;
      if (shouldClose) closeTapdKeywordDialog();
    }

    function closeTapdKeywordDialog({ restoreFocus = true } = {}) {
      const overlay = document.getElementById("tapdKeywordOverlay");
      if (!overlay || !overlay.classList.contains("open")) return;

      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      overlay.inert = true;
      document.querySelector(".app-shell").inert = false;
      document.body.classList.remove("modal-open");
      const returnFocus = state.tapdKeywordReturnFocus;
      state.tapdKeywordReturnFocus = null;
      if (restoreFocus && returnFocus?.isConnected) returnFocus.focus();
    }

    function saveTapdKeyword(event) {
      event.preventDefault();
      const input = document.getElementById("tapdKeywordInput");
      if (!input) return;

      const value = normalizeTapdKeyword(input.value);
      if (value.length > 120) {
        showErrorToast("TAPD 关键字无效", "请输入不超过 120 个字符的单行关键字。");
        input.focus();
        return;
      }

      state.tapdKeyword = value;
      persistTapdKeyword();
      const returnFocus = state.tapdKeywordReturnFocus;
      closeTapdKeywordDialog({ restoreFocus: false });
      renderSidebar();
      showToast(
        value ? "TAPD 关键字已保存" : "TAPD 关键字已清除",
        value
          ? `AI 生成提交信息时将自动添加“${value}”。`
          : "AI 生成提交信息时不再自动添加关键字。",
        "check"
      );
      if (returnFocus?.isConnected) returnFocus.focus();
    }

    function openStandaloneEntry(repoId) {
      const repository = repositories.find((repo) => repo.id === repoId && repo.standalone);
      if (!repository || state.removedEntryIds.has(repoId)) return;

      withCommitDraftGuard(() => {
        state.repoId = repoId;
        setCurrentWorkspaceEntryId(
          repositoryWorkspaceEntryId(repository)
        );
        state.view = "repository";
        state.tab = state.repositoryTab;
        renderSidebar();
        renderMain();
      });
    }

    function openRenameEntryDialog(entryId, returnFocus = null) {
      const entry = workspaceEntryDetails(entryId);

      if (!entry || !overlay) return;

      state.renameEntryId = entryId;
      state.renameGroupName = null;
      state.renameReturnFocus = returnFocus instanceof HTMLElement ? returnFocus : null;
      document.getElementById("renameEntryTitle").textContent = "修改显示名称";
      document.getElementById("renameEntryDescription").textContent = `${entry.kind} · ${entry.path}`;

      document.getElementById("renameEntryFieldLabel").textContent = "显示名称";

      const input = document.getElementById("renameEntryInput");

      document.querySelector(".app-shell").inert = true;
      overlay.inert = false;
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");

    function openRenameGroupDialog(groupName, returnFocus = null) {

      const input = document.getElementById("renameEntryInput");
      input.value = groupDisplayName(groupName);
      document.querySelector(".app-shell").inert = true;
      overlay.inert = false;
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");

    function rememberRenameBackdropPointer(event) {

      if (shouldClose) closeRenameEntryDialog();

    function closeRenameEntryDialog({ restoreFocus = true } = {}) {
      const overlay = document.getElementById("renameEntryOverlay");
      if (!overlay || !overlay.classList.contains("open")) return;

      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      overlay.inert = true;
      document.querySelector(".app-shell").inert = false;
      document.body.classList.remove("modal-open");
      const returnFocus = state.renameReturnFocus;
      state.renameEntryId = null;
      state.renameGroupName = null;
      state.renameReturnFocus = null;
      if (restoreFocus && returnFocus?.isConnected) returnFocus.focus();

    function saveWorkspaceEntryName(event) {
      event.preventDefault();
      const entryId = state.renameEntryId;
      const groupName = state.renameGroupName;
      const input = document.getElementById("renameEntryInput");
      const entry = entryId ? workspaceEntryDetails(entryId) : null;
      const value = input.value.trim();
      if (!entry && !groupName) return;
      if (!value || value.length > 120) {
        showErrorToast("显示名称无效", "请输入 1 到 120 个字符。");
        input.focus();
        return;
      }

      if (groupName) {
        state.groupDisplayNames[groupName] = value;
        const returnFocus = state.renameReturnFocus;
        closeRenameEntryDialog({ restoreFocus: false });
        renderSidebar();
        showToast("分组名称已更新", `${groupName} 已更新为 ${value}。`, "check");
        if (returnFocus?.isConnected) returnFocus.focus();
        return;
      }

      state.entryDisplayNames[entry.id] = value;
      const returnFocus = state.renameReturnFocus;
      closeRenameEntryDialog({ restoreFocus: false });
      document.getElementById("statusWorkspace").innerHTML = `${icon("workspace")}${currentWorkspaceSnapshot().name}`;
      renderSidebar();
      renderMain();
      showToast("显示名称已更新", `${entry.displayName} 已更新为 ${value}。`, "check");
      if (returnFocus?.isConnected) returnFocus.focus();
    }

    function renderCommandbar() {

      }

      const commandbar = document.getElementById("commandbar");

      commandbar.innerHTML = isWorkspace ? `
        <div class="context-identity">
          <span class="context-icon">${icon("workspace", 18)}</span>
          <span>
            <div class="context-title">${escapeHtml(activeWorkspaceSnapshot.name)}</div>
            <div class="context-subtitle" title="${escapeHtml(activeWorkspaceSnapshot.rootPath)}">${icon("folder", 11)}<span>${escapeHtml(activeWorkspaceSnapshot.rootPath)}</span></div>
          </span>
        </div>
        <div class="toolbar-actions-group">
          <div class="toolbar-divider"></div>
          ${renderOpenInControl("workspace")}
          <div class="toolbar-actions">

            <button class="toolbar-button" aria-label="预览 Pull 当前 Workspace 条目全部仓库" onclick="runOperation('pull-all', event.currentTarget)">${icon("arrowDown")}<span>Pull</span><span class="toolbar-count">${activeWorkspaceSnapshot.totalRepositories}</span></button>
            <button class="toolbar-button" aria-label="预览 Push 全部仓库" onclick="runOperation('push-all', event.currentTarget)">${icon("arrowUp")}<span>Push</span></button>

          </span>

          <button class="branch-selector" aria-haspopup="dialog" onclick="openBranchSwitchDialog(event.currentTarget)">${icon("branch")}<span>${repo.branch}</span>${icon("chevronDown", 12)}</button>

            <button class="toolbar-button" aria-label="预览 Push ${repo.name}${repo.ahead ? `，领先 ${repo.ahead} 个提交` : ""}" onclick="runOperation('push', event.currentTarget)">${icon("arrowUp")}<span>Push</span>${repo.ahead ? `<span class="toolbar-count">${repo.ahead}</span>` : ""}</button>
            <button class="toolbar-button" aria-label="预览 Fetch ${repo.name}" onclick="runOperation('fetch', event.currentTarget)">${icon("download")}<span>Fetch</span></button>
