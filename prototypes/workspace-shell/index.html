    }

    .button.is-loading,
    .icon-button.is-loading,
    .toolbar-button.is-loading,
    .quick-button.is-loading,
    .bulk-sync.is-loading {
      position: relative;
      color: transparent;
      pointer-events: none;
    }

    .button.is-loading > *,
    .icon-button.is-loading > *,
    .toolbar-button.is-loading > *,
    .quick-button.is-loading > *,
    .bulk-sync.is-loading > * {
      visibility: hidden;
    }

    .button.is-loading::after,
    .icon-button.is-loading::after,
    .toolbar-button.is-loading::after,
    .quick-button.is-loading::after,
    .bulk-sync.is-loading::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--icon-small);
      height: var(--icon-small);
      margin: -8px 0 0 -8px;
      border: 2px solid color-mix(in srgb, var(--text) 24%, transparent);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: control-spin 700ms linear infinite;
    }

    .button.primary.is-loading::after {
      border-top-color: #071411;
    }

    html[data-theme="light"] .button.primary.is-loading::after {
      border-top-color: #fff;
    }

    @keyframes control-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .metric-value,
    .repo-status,
    .tab-count,
    .toolbar-count,
    .mini-count,
    .commit-hash,
    .commit-time,
    .diff-stats,
    .line-no,
    .detail-value,
    .operation-state,
    .statusbar {
      font-variant-numeric: tabular-nums;
    }

    .button:active,
    .icon-button:active,
    .toolbar-button:active,
    .rail-button:active,
    .quick-button:active,
    .bulk-sync:active,
    .context-tab:active,
    .repo-row:active,
    .attention-item:active,
    .worktree-card:active,
    .command-result:active,
    .branch-name-button:active,
    .stage-toggle:active,
    .menu-button:active,
    .global-search:active,
    .workspace-switcher:active,
    .workspace-overview-button:active,
    .window-control:active,
    .branch-selector:active,
    .panel-action:active {
      transform: translateY(1px);
    }

    @media (max-width: 1500px) and (min-width: 1241px) {
      .workspace-frame {
        grid-template-columns: 64px 240px minmax(0, 1fr);
      }

      .content-frame {
        grid-template-columns: minmax(0, 1fr) clamp(320px, 26vw, 400px);
      }

      .metric-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 1240px) {
      .workspace-frame {
        grid-template-columns: 64px 240px minmax(0, 1fr);
      }

      .content-frame {
        grid-template-columns: minmax(0, 1fr) minmax(280px, 330px);
      }

      .page-scroll {
        padding: var(--page-safe-margin-narrow);
      }

      .metric-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .commit-row {
        grid-template-columns: var(--control-large) minmax(0, 1fr);
      }

      .commit-author,
      .commit-time {
        display: none;
      }

      body:not(.inspector-open) .content-frame {
        grid-template-columns: minmax(0, 1fr);
      }

      .inspector {
        position: relative;
        z-index: var(--z-content);
        display: block;
        width: auto;
        min-width: 0;
        box-shadow: none;
        transform: none;
        visibility: visible;
        pointer-events: auto;
        transition: none;
      }

      body:not(.inspector-open) .inspector {
        display: none;
      }

      .inspector-backdrop,
      body.inspector-open .inspector-backdrop {
        display: none !important;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        backdrop-filter: none;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .context-title {
        max-width: 192px;
      }

      .toolbar-button span:not(.toolbar-count) {
        display: none;
      }
    }

    @media (max-width: 1120px) {
      .menu-strip {
        display: none;
      }

      .workspace-frame {
        grid-template-columns: 64px 240px minmax(0, 1fr);
      }

      .global-search {
        width: min(300px, 40vw);
      }

      .page-scroll {
        padding: var(--page-safe-margin-narrow);
      }
    }

    @media (max-width: 1040px) {
      .statusbar-item:nth-last-child(-n + 2) {
        display: none;
      }

      .page-heading {
        gap: var(--space-4);
      }

      .page-actions {
        justify-content: flex-start;
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#mainContent">跳到主内容</a>
  <div class="app-shell">
    <header class="titlebar">
      <div class="brand">
        <span class="brand-mark" id="brandMark"></span>
        <span>GitNest</span>
      </div>
      <div class="menu-strip">
        <button class="menu-button" onclick="showToast('文件菜单', '新建 Workspace、打开目录和导入配置。', 'folder')">文件</button>
        <button class="menu-button" onclick="showToast('Workspace 菜单', '切换、扫描、分组和批量同步。', 'workspace')">Workspace</button>
        <button class="menu-button" onclick="showToast('仓库菜单', '分支、远程、Worktree 和高级 Git 操作。', 'repository')">仓库</button>
        <button class="menu-button" onclick="showToast('视图菜单', '切换面板、主题和显示密度。', 'panel')">视图</button>
        <button class="menu-button" onclick="showToast('帮助菜单', '快捷键、诊断信息和版本说明。', 'sparkle')">帮助</button>
      </div>
      <div class="title-spacer"></div>
      <button class="global-search" aria-haspopup="dialog" aria-controls="commandOverlay" onclick="openCommandPalette()">
        <span class="search-label" id="globalSearchLabel"></span>
        <kbd>Ctrl K</kbd>
      </button>
      <div class="window-controls">
        <button class="window-control" aria-label="最小化" id="minimizeButton"></button>
        <button class="window-control" aria-label="最大化" id="maximizeButton"></button>
        <button class="window-control close" aria-label="关闭" id="closeButton"></button>
      </div>
    </header>

      section.classList.toggle("collapsed", nextCollapsed);
      trigger.setAttribute("aria-expanded", String(!nextCollapsed));

    function metricCard(iconName, label, value, foot, color, bg) {
      return `
        <article class="metric-card" style="--metric-color:${color};--metric-bg:${bg}">
          <div class="metric-label"><span>${label}</span><span class="metric-icon">${icon(iconName)}</span></div>
          <div class="metric-value">${value}</div>
          <div class="metric-foot">${foot}</div>
        </article>
      `;
    }

    function attentionItem(id, tone, iconName, name, detail, label, pillTone) {
      return `
        <button type="button" class="attention-item" onclick="openRepository('${id}')">

          "commit",
          `<strong>${escapeHtml(repo.name)}</strong> 的 HEAD 最近提交`,
          `${repo.head} · ${escapeHtml(repo.lastSubject)}`,
          formatSnapshotDate(repo.lastDate)

      ).join("");

      return `

      return `

          <span class="repo-hero-icon">${icon("repository", 25)}</span>
          <span class="repo-hero-copy">
            <div class="repo-hero-title">${repo.name}</div>
            <div class="repo-hero-path">${repoAbsolutePath(repo)}</div>
            <div class="repo-hero-status">
              <span class="status-pill ${statusTone}">${repo.conflicts ? icon("alert", 12) : repo.changes ? "M" : icon("check", 12)}${statusText}</span>
              <span class="status-pill neutral">${icon("branch", 12)}${repo.branch}</span>
              ${repo.behind ? `<span class="status-pill blue">${icon("arrowDown", 12)}本地引用显示落后 ${repo.behind}</span>` : ""}

            </div>

      document.getElementById("inspector").innerHTML = `

        </div>

            <div class="detail-row"><span class="detail-label">HEAD</span><span class="detail-value">${repo.head}</span></div>

            </div>

        </section>
        <section class="inspector-section">
          <div class="inspector-section-title">快捷操作</div>

      if (!changedFiles.length) {
        document.getElementById("mainContent").innerHTML = `
          <div class="page-scroll">

                  <div class="empty-state-description">${repoAbsolutePath(repo)}</div>

        renderChangesInspector();

            ${renderFileSection("未暂存", changedFiles.filter((file) => !file.staged && file.status !== "untracked"))}

    function updateCommitSubjectCount() {
      const input = document.getElementById("commitSubject");
      const counter = document.getElementById("commitSubjectCount");
      if (input && counter) {
        counter.textContent = `${[...input.value].length} / 72`;
      }
    }

    function updateCommitDraft() {
      const subject = document.getElementById("commitSubject");
      const body = document.getElementById("commitBody");
      const amend = document.querySelector('[name="commit-amend"]');
      const push = document.querySelector('[name="commit-push"]');
      if (subject) state.commitDraft.subject = subject.value;
      if (body) state.commitDraft.body = body.value;
      if (amend) state.commitDraft.amend = amend.checked;
      if (push) state.commitDraft.push = push.checked;
      state.commitDirty = JSON.stringify(state.commitDraft) !== state.commitBaseline;
      updateCommitSubjectCount();
      const subjectError = document.getElementById("commitSubjectError");
      if (subject?.value.trim()) {
        subject.removeAttribute("aria-invalid");
        if (subjectError) subjectError.textContent = "";
      }
      const draftStatus = document.querySelector(".inspector-head > .status-pill");
      if (state.commitDirty && !draftStatus) {
        document.querySelector(".inspector-title")?.insertAdjacentHTML("afterend", '<span class="status-pill yellow">未保存</span>');
      } else if (!state.commitDirty && draftStatus?.textContent.trim() === "未保存") {
        draftStatus.remove();
      }
    }

    function completePreviewCommit(trigger) {
      const subject = document.getElementById("commitSubject");
      const subjectError = document.getElementById("commitSubjectError");
      if (!subject?.value.trim()) {
        subject?.setAttribute("aria-invalid", "true");
        if (subjectError) subjectError.textContent = "请输入提交摘要，例如：feat(scope): 描述本次变更。";
        subject?.focus();
        return;
      }
      startButtonLoading(trigger);
      setTimeout(() => {
        state.commitBaseline = JSON.stringify(state.commitDraft);
        state.commitDirty = false;
        stopButtonLoading(trigger);
        renderChangesInspector();
        showToast("提交信息已就绪", "当前是设计预览，不会执行本地 Git 命令。", "commit");
      }, 900);
    }

    function discardCommitDraft() {
      state.commitDraft = JSON.parse(state.commitBaseline);
      state.commitDirty = false;
    }

    function shouldConfirmDiscardCommit() {
      return state.view === "repository" && state.tab === "changes" && state.commitDirty;
    }

    function withCommitDraftGuard(action) {
      if (!shouldConfirmDiscardCommit()) {
        action();
        return;
      }
      openConfirmDialog({
        title: "放弃未保存的提交信息？",
        description: "提交摘要、详细说明和提交选项尚未保存。离开后这些修改会被丢弃。",
        actionLabel: "放弃并离开",
        onConfirm: () => {
          discardCommitDraft();
          action();
        }
      });
    }

        </section>
      `;
      syncAccessibleHints();
    }

    function selectFile(path) {
      state.selectedFile = path;
      renderChanges();
    }

    function selectBranch(name) {
      state.selectedBranch = name;
      renderBranches();
    }

    function clearRepositoryFilter() {
      const input = document.getElementById("repoSearch");
      if (!input) return;
      input.value = "";
      renderSidebar();
      input.focus();
    }

    function clearCommandSearch() {
      const input = document.getElementById("commandInput");
      if (!input) return;
      input.value = "";
      renderCommandResults();
      input.focus();
    }

    function handleContextTabKeydown(event) {
      if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
      const tabs = [...document.querySelectorAll(".context-tab")];
      const currentIndex = tabs.indexOf(event.currentTarget);
      if (currentIndex < 0) return;
      event.preventDefault();
      const nextIndex = event.key === "Home"
        ? 0
        : event.key === "End"
          ? tabs.length - 1
          : event.key === "ArrowLeft"
            ? (currentIndex - 1 + tabs.length) % tabs.length
            : (currentIndex + 1) % tabs.length;
      tabs[nextIndex]?.click();
      requestAnimationFrame(() => document.querySelector(".context-tab.active")?.focus());
    }

    function activateOnKey(event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        event.currentTarget.click();
      }
    }

    function syncAccessibleHints() {
      document.querySelectorAll("button.icon-button[aria-label], button.rail-button[aria-label], button.window-control[aria-label], button.stage-toggle[aria-label], button.toolbar-button[aria-label]").forEach((button) => {
        if (!button.title) button.title = button.getAttribute("aria-label");
      });
    }

    function selectCommit(hash) {
      state.selectedCommit = hash;
      if (state.tab === "history") renderHistory();
      else renderRepositoryOverview();
    }

    function openWorkspace() {
      withCommitDraftGuard(() => {
        state.view = "workspace";
        state.tab = "overview";
        renderMain();
      });
    }

    function openRepository(id) {
      withCommitDraftGuard(() => {
        const repo = repositories.find((item) => item.id === id) || repositories[0];
        state.view = "repository";
        state.repoId = repo.id;
        state.tab = "overview";
        state.selectedCommit = repo.head;
        state.selectedFile = (changedFilesByRepo[repo.id] || [])[0]?.path || "";
        state.selectedBranch = repo.branch;
        renderMain();
      });
    }

    function openLastRepository() {
      withCommitDraftGuard(() => {
        state.view = "repository";
        state.tab = "overview";
        renderMain();
      });
    }

    function setWorkspaceTab(tab) {
      withCommitDraftGuard(() => {
        state.view = "workspace";
        state.tab = tab;
        renderMain();
      });
    }

    function setRepoTab(tab) {
      if (state.view === "repository" && state.tab === tab) return;
      withCommitDraftGuard(() => {
        state.view = "repository";
        state.tab = tab;
        renderMain();
      });
    }

    function showOperationCenter() {
      withCommitDraftGuard(() => {
        if (state.view !== "workspace") {
          state.view = "workspace";
          state.tab = "overview";
          renderMain();
        }
        state.inspectorOpen = true;
        updateInspectorState();
        showToast("Workspace 详情", "右侧独立详情列已显示本地只读快照摘要。", "operations");
      });
    }

    function startButtonLoading(button) {
      if (!(button instanceof HTMLButtonElement) || button.disabled) return null;
      const width = button.getBoundingClientRect().width;
      button.dataset.loadingLabel = button.getAttribute("aria-label") || "";
      button.style.inlineSize = `${width}px`;
      button.classList.add("is-loading");
      button.setAttribute("aria-busy", "true");
      button.setAttribute("aria-label", `${button.innerText.trim() || button.title || "操作"}，处理中`);
      button.disabled = true;
      return button;
    }

    function stopButtonLoading(button) {
      if (!(button instanceof HTMLButtonElement)) return;
      button.classList.remove("is-loading");
      button.removeAttribute("aria-busy");
      button.disabled = false;
      button.style.inlineSize = "";
      if (button.dataset.loadingLabel) button.setAttribute("aria-label", button.dataset.loadingLabel);
      else button.removeAttribute("aria-label");
      delete button.dataset.loadingLabel;
    }

    function runOperation(kind, trigger = null) {
      const config = {
        "fetch-all": ["Fetch 全部（设计预览）", `不会执行 Git 命令；当前仍是 ${workspaceSnapshot.totalRepositories} 个仓库的本地快照。`, "download"],
        "scan": ["重新扫描（设计预览）", `不会重新读取或修改 ${workspaceSnapshot.rootPath}。`, "refresh"],
        "pull-all": ["批量 Pull（设计预览）", `${workspaceSnapshot.behindRepositories} 个仓库的本地跟踪引用显示落后；不会执行更新。`, "arrowDown"],
        "fetch": ["Fetch（设计预览）", `${currentRepo().name} 不会获取远程引用。`, "download"],
        "pull": ["Pull（设计预览）", `${currentRepo().name} 不会更新工作目录或分支。`, "arrowDown"],
        "push": ["Push（设计预览）", `${currentRepo().name} 不会向远程发送任何提交。`, "arrowUp"]
      };
      const [title, message, iconName] = config[kind] || ["设计预览", "不会执行真实 Git 操作。", "operations"];
      const activeTrigger = startButtonLoading(trigger);
      showToast(title, message, iconName);
      if (activeTrigger) {
        clearTimeout(state.transientLoadingTimer);
        state.transientLoadingTimer = setTimeout(() => {
          stopButtonLoading(activeTrigger);
          state.transientLoadingTimer = null;
        }, 650);
      }
    }

    function showToast(title, message, iconName = "check") {
      const toast = document.getElementById("toast");
      document.getElementById("toastTitle").textContent = title;
      document.getElementById("toastMessage").textContent = message;
      document.getElementById("toastSymbol").innerHTML = icon(iconName);
      toast.classList.add("show");
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => toast.classList.remove("show"), 3100);
    }

    async function copyText(value, label) {
      try {
        await navigator.clipboard.writeText(value);
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = value;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      }
      showToast(`${label} 已复制`, value, "copy");
    }

    function applyTheme() {
      document.documentElement.dataset.theme = state.theme;
      document.getElementById("themeColorMeta").setAttribute("content", state.theme === "dark" ? "#090d12" : "#e9eef4");
      try {
        localStorage.setItem("gitnest-theme", state.theme);
      } catch {
        // 文件预览环境可能禁用持久化；主题切换本身仍然有效。
      }
    }

    function toggleTheme() {
      state.theme = state.theme === "dark" ? "light" : "dark";
      applyTheme();
      updateThemeIcon();
      showToast(state.theme === "dark" ? "已切换为深色主题" : "已切换为浅色主题", "布局、层级与状态颜色保持一致。", state.theme === "dark" ? "moon" : "sun");
    }

    function updateThemeIcon() {
      const button = document.getElementById("themeRail");
      if (button) button.innerHTML = icon(state.theme === "dark" ? "sun" : "moon");
    }

    function setInspectorBackgroundInert(inert) {
      [
        ".titlebar",
        ".activity-rail",
        ".workspace-sidebar",
        ".commandbar",
        ".context-tabs",
        ".main-content",
        ".statusbar"
      ].forEach((selector) => {
        const element = document.querySelector(selector);
        if (element) element.inert = inert;
      });
    }

    function updateInspectorState() {
      const compactLayout = window.innerWidth <= inspectorOverlayBreakpoint;
      document.body.classList.toggle("inspector-open", state.inspectorOpen);
      document.querySelectorAll('[aria-label="切换详情面板"]').forEach((button) => {
        button.setAttribute("aria-pressed", String(state.inspectorOpen));
      });
      setInspectorBackgroundInert(compactLayout && state.inspectorOpen);
    }

    function toggleInspector(force) {
      const compactLayout = window.innerWidth <= inspectorOverlayBreakpoint;
      const nextOpen = typeof force === "boolean" ? force : !state.inspectorOpen;
      if (nextOpen && compactLayout) {
        state.inspectorReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      }
      state.inspectorOpen = nextOpen;
      updateInspectorState();
      if (nextOpen && compactLayout) {
        focusAfterInertSettles(
          document.querySelector(".inspector .inspector-close, .inspector button"),
          state.inspectorReturnFocus
        );
      } else if (!nextOpen && compactLayout && state.inspectorReturnFocus?.isConnected) {
        state.inspectorReturnFocus.focus();
        state.inspectorReturnFocus = null;
      }
    }

    function rememberInspectorBackdropPointer(event) {
      state.inspectorPointerDownOnBackdrop = event.target === event.currentTarget;
    }

    function closeInspectorFromBackdrop(event) {
      const shouldClose = state.inspectorPointerDownOnBackdrop && event.target === event.currentTarget;
      state.inspectorPointerDownOnBackdrop = false;
      if (shouldClose) toggleInspector(false);
    }

    function openCommandPalette() {
      const overlay = document.getElementById("commandOverlay");
      state.paletteReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      document.querySelector(".app-shell").inert = true;
      overlay.inert = false;
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      const input = document.getElementById("commandInput");
      input.value = "";
      renderCommandResults();
      focusAfterInertSettles(input, state.paletteReturnFocus);
    }

    function closeCommandPalette() {
      const overlay = document.getElementById("commandOverlay");
      if (!overlay.classList.contains("open")) return;
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      overlay.inert = true;
      document.querySelector(".app-shell").inert = false;
      updateInspectorState();
      if (state.paletteReturnFocus?.isConnected) {
        state.paletteReturnFocus.focus();
      }
      state.paletteReturnFocus = null;
    }

    function rememberPaletteBackdropPointer(event) {
      state.palettePointerDownOnBackdrop = event.target === event.currentTarget;
    }

    function closePaletteFromBackdrop(event) {
      const shouldClose = state.palettePointerDownOnBackdrop && event.target === event.currentTarget;
      state.palettePointerDownOnBackdrop = false;
      if (shouldClose) closeCommandPalette();
    }

    function rememberConfirmBackdropPointer(event) {
      state.confirmPointerDownOnBackdrop = event.target === event.currentTarget;
    }

    function closeConfirmFromBackdrop(event) {
      const shouldClose = state.confirmPointerDownOnBackdrop && event.target === event.currentTarget;
      state.confirmPointerDownOnBackdrop = false;
      if (shouldClose) closeConfirmDialog();
    }

    function openConfirmDialog({ title, description, actionLabel, onConfirm }) {
      closeCommandPalette();
      const overlay = document.getElementById("confirmOverlay");
      state.confirmReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      state.confirmAction = typeof onConfirm === "function" ? onConfirm : null;
      document.getElementById("confirmTitle").textContent = title;
      document.getElementById("confirmDescription").textContent = description;
      document.getElementById("confirmAction").textContent = actionLabel;
      document.getElementById("confirmIcon").innerHTML = icon("alert", 22);
      document.querySelector(".app-shell").inert = true;
      overlay.inert = false;
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
      focusAfterInertSettles(document.getElementById("confirmCancel"), state.confirmReturnFocus);
    }

    function closeConfirmDialog({ restoreFocus = true } = {}) {
      const overlay = document.getElementById("confirmOverlay");
      if (!overlay.classList.contains("open")) return;
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      overlay.inert = true;
      document.querySelector(".app-shell").inert = false;
      updateInspectorState();
      document.body.classList.remove("modal-open");
      const returnFocus = state.confirmReturnFocus;
      state.confirmReturnFocus = null;
      state.confirmAction = null;
      if (restoreFocus && returnFocus?.isConnected) returnFocus.focus();
    }

    function runConfirmAction() {
      const action = state.confirmAction;
      closeConfirmDialog({ restoreFocus: false });
      action?.();
    }

    function confirmBranchDelete(name) {
      openConfirmDialog({
        title: `删除分支 ${name}？`,
        description: "此操作会检查未合并提交、远程引用和关联 Worktree。设计预览不会执行真实 Git 删除。",
        actionLabel: "确认删除",
        onConfirm: () => showToast("删除检查已完成", `${name} 当前满足保护性检查；设计预览未执行删除。`, "alert")
      });
    }

    function handleCommandInputKeydown(event) {
      if (event.isComposing) return;
      const firstResult = document.querySelector(".command-result");
      if (event.key === "ArrowDown") {
        event.preventDefault();
        firstResult?.focus();
      } else if (event.key === "Enter" && firstResult) {
        event.preventDefault();
        firstResult.click();
      }
    }

    function handleCommandResultKeydown(event) {
      const results = [...document.querySelectorAll(".command-result")];
      const index = results.indexOf(event.currentTarget);
      if (event.key === "ArrowDown") {
        event.preventDefault();
        results[(index + 1) % results.length]?.focus();
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        (index <= 0 ? document.getElementById("commandInput") : results[index - 1])?.focus();
      } else if (event.key === "Home") {
        event.preventDefault();
        results[0]?.focus();
      } else if (event.key === "End") {
        event.preventDefault();
        results.at(-1)?.focus();
      }
    }

    function renderCommandResults() {
      const query = (document.getElementById("commandInput")?.value || "").toLowerCase();
      const repoResults = repositories.filter((repo) => !query || `${repo.name} ${repo.branch}`.toLowerCase().includes(query)).slice(0, 5);
      const commands = [
        { title: "Fetch 全部仓库", sub: "获取 Workspace 中所有远程引用", icon: "download", action: "runOperation('fetch-all')" },
        { title: "重新扫描 Workspace", sub: "发现新增、移动或移除的仓库", icon: "refresh", action: "runOperation('scan')" },
        { title: "切换深色 / 浅色主题", sub: "修改当前界面外观", icon: "sun", action: "toggleTheme()" }
      ].filter((command) => !query || `${command.title} ${command.sub}`.toLowerCase().includes(query));

      document.getElementById("commandResults").innerHTML = `
        ${repoResults.length ? '<div class="command-group-label">仓库</div>' : ""}
        ${repoResults.map((repo) => `
          <button type="button" class="command-result" onkeydown="handleCommandResultKeydown(event)" onclick="closeCommandPalette(); openRepository('${repo.id}')">
            <span class="command-result-icon">${icon("repository", 14)}</span>
            <span><span class="command-result-title">${repo.name}</span><span class="command-result-sub">${repo.branch} · ${repo.path}</span></span>
            <span class="command-status">${repo.changes ? `${repo.changes} 变更` : "干净"}</span>
          </button>
        `).join("")}
        ${commands.length ? '<div class="command-group-label">命令</div>' : ""}
        ${commands.map((command) => `
          <button type="button" class="command-result" onkeydown="handleCommandResultKeydown(event)" onclick="closeCommandPalette(); ${command.action}">
            <span class="command-result-icon">${icon(command.icon, 14)}</span>
            <span><span class="command-result-title">${command.title}</span><span class="command-result-sub">${command.sub}</span></span>
            <kbd class="command-key">Enter</kbd>
          </button>
        `).join("")}
        ${!repoResults.length && !commands.length ? `
          <div class="empty-state command-empty-state">
            <div>
              <div class="empty-state-icon">${icon("search", 22)}</div>
              <div class="empty-state-title">没有匹配结果</div>
              <div class="empty-state-description">当前关键词未匹配仓库或命令，请修改关键词或清除搜索。</div>
              <div class="empty-state-actions">
                <button type="button" class="button small" onclick="clearCommandSearch()">清除搜索</button>
              </div>
            </div>
          </div>
        ` : ""}
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function trapFocusWithin(event, container) {
      const focusable = [...container.querySelectorAll(
        'button:not(:disabled), input:not(:disabled), textarea:not(:disabled), select:not(:disabled), [tabindex]:not([tabindex="-1"])'
      )].filter((element) => !element.closest("[inert]"));
      if (!focusable.length) return;
      const currentIndex = focusable.indexOf(document.activeElement);
      const nextIndex = event.shiftKey
        ? (currentIndex <= 0 ? focusable.length - 1 : currentIndex - 1)
        : (currentIndex + 1) % focusable.length;
      event.preventDefault();
      focusable[nextIndex].focus();
    }

    function focusAfterInertSettles(target, previousFocus, frame = 0) {
      if (!(target instanceof HTMLElement) || !target.isConnected) return;
      const active = document.activeElement;
      const activeInsideInert = Boolean(active?.closest?.("[inert]"));
      const sourceReleased = !previousFocus || previousFocus === document.body || active !== previousFocus;
      if (activeInsideInert && active instanceof HTMLElement) active.blur();
      if (!activeInsideInert && sourceReleased) {
        target.focus({ preventScroll: true });
        if (document.activeElement === target) return;
      }
      if (frame >= 12) return;
      requestAnimationFrame(() => focusAfterInertSettles(target, previousFocus, frame + 1));
    }

    let compactInspectorLayout = window.innerWidth <= inspectorOverlayBreakpoint;

    window.addEventListener("beforeunload", (event) => {
      if (!state.commitDirty) return;
      event.preventDefault();
      event.returnValue = "";
    });

    window.addEventListener("resize", () => {
      const nextCompactLayout = window.innerWidth <= inspectorOverlayBreakpoint;
      if (nextCompactLayout !== compactInspectorLayout) {
        compactInspectorLayout = nextCompactLayout;
        state.inspectorOpen = !nextCompactLayout;
        updateInspectorState();
      }
    });

    document.addEventListener("keydown", (event) => {
      const confirmOverlay = document.getElementById("confirmOverlay");
      const confirmOpen = confirmOverlay.classList.contains("open");
      if (confirmOpen) {
        if (event.key === "Escape") {
          event.preventDefault();
          closeConfirmDialog();
        } else if (event.key === "Tab") {
          trapFocusWithin(event, confirmOverlay);
        }
        return;
      }

      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
        event.preventDefault();
        openCommandPalette();
      }
      const commandOverlay = document.getElementById("commandOverlay");
      const paletteOpen = commandOverlay.classList.contains("open");
      if (event.key === "Escape" && paletteOpen) {
        event.preventDefault();
        closeCommandPalette();
        return;
      }
      if (event.key === "Tab" && paletteOpen) {
        trapFocusWithin(event, commandOverlay);
        return;
      }

      const compactInspectorOpen = window.innerWidth <= inspectorOverlayBreakpoint && state.inspectorOpen;
      if (compactInspectorOpen && event.key === "Escape") {
        event.preventDefault();
        toggleInspector(false);
        return;
      }
      if (compactInspectorOpen && event.key === "Tab") {
        trapFocusWithin(event, document.getElementById("inspector"));
      }
    });

    hydrateStaticIcons();
    renderSidebar();
    renderMain();
  </script>
</body>
</html>
