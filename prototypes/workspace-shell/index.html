    }

    function persistToolPreferences() {
      try {
        localStorage.setItem(
          toolPreferencesStorageKey,
          JSON.stringify({
            defaultTerminal: state.toolPreferences.defaultTerminal,
            workspaceApplication: state.toolPreferences.workspaceApplication,
            repositoryApplication: state.toolPreferences.repositoryApplication,
            fileApplication: state.toolPreferences.fileApplication,
            commitPanelHeight: state.commitPanelHeight
          })
        );
      } catch {
        // 文件预览环境可能禁用持久化。
      }
    }

    function applyCommitPanelHeightToDom(height) {
      const composer = document.querySelector(".commit-composer");
      if (!composer) return;
      composer.style.height = `${height}px`;
      composer
        .querySelector(".commit-resize-handle")
        ?.setAttribute("aria-valuenow", String(height));
    }

    function setCommitPanelHeightPreference(value) {
      const nextHeight = clampDiffCommitPanelHeight(value);
      if (nextHeight === state.commitPanelHeight) {
        applyCommitPanelHeightToDom(nextHeight);
        return nextHeight;
      }
      state.commitPanelHeight = nextHeight;
      persistToolPreferences();
      applyCommitPanelHeightToDom(nextHeight);
      return nextHeight;
    }

    let commitPanelResizeSession = null;

    function startCommitPanelResize(event) {
      if (event.button !== 0) return;
      const handle = event.currentTarget;
      const composer = handle?.closest(".commit-composer");
      if (!composer) return;
      commitPanelResizeSession = {
        composer,
        handle,
        pointerId: event.pointerId,
        startY: event.clientY,
        startHeight: state.commitPanelHeight
      };
      handle.setPointerCapture?.(event.pointerId);
      document.body.classList.add("is-resizing-commit-panel");
      event.preventDefault();
    }

    function moveCommitPanelResize(event) {
      const session = commitPanelResizeSession;
      if (!session || event.pointerId !== session.pointerId) return;
      const nextHeight = clampDiffCommitPanelHeight(
        session.startHeight + session.startY - event.clientY
      );
      session.composer.style.height = `${nextHeight}px`;
      session.handle.setAttribute("aria-valuenow", String(nextHeight));
      event.preventDefault();
    }

    function finishCommitPanelResize(event) {
      const session = commitPanelResizeSession;
      if (
        !session ||
        (event?.pointerId != null && event.pointerId !== session.pointerId)
      ) {
        return;
      }
      const renderedHeight = Number.parseFloat(session.composer.style.height);
      const nextHeight = clampDiffCommitPanelHeight(
        Number.isFinite(renderedHeight)
          ? renderedHeight
          : state.commitPanelHeight
      );
      if (session.handle.hasPointerCapture?.(session.pointerId)) {
        session.handle.releasePointerCapture(session.pointerId);
      }
      commitPanelResizeSession = null;
      document.body.classList.remove("is-resizing-commit-panel");
      setCommitPanelHeightPreference(nextHeight);
    }

    function handleCommitPanelResizeKeydown(event) {
      const step = event.shiftKey ? 32 : 8;
      let nextHeight = state.commitPanelHeight;
      if (event.key === "ArrowUp") {
        nextHeight += step;
      } else if (event.key === "ArrowDown") {
        nextHeight -= step;
      } else if (event.key === "Home") {
        nextHeight = diffCommitPanelHeightMin;
      } else if (event.key === "End") {
        nextHeight = diffCommitPanelHeightMax;
      } else {
        return;
      }
      event.preventDefault();
      setCommitPanelHeightPreference(nextHeight);
    }

    function openInPreferenceKey(scope) {
      return scope === "workspace"
        ? "workspaceApplication"
        : scope === "file"
          ? "fileApplication"
          : "repositoryApplication";
    }

    function preferredOpenInKind(scope) {
      const key = openInPreferenceKey(scope);
      return (
        state.toolPreferences?.[key] ||
        state.openInPreferred ||
        openInApplications[0].kind
      );
    }

    function setOpenInPreference(kind, scope) {
      if (!openInApplications.some((application) => application.kind === kind)) {
        return;
      }
      state.toolPreferences[openInPreferenceKey(scope)] = kind;
      if (scope === "repository") {
        state.openInPreferred = kind;
      }
      persistToolPreferences();
    }

    function allTerminalTools() {
      return terminalTools;
    }

    function terminalToolByKind(kind) {
      return allTerminalTools().find((tool) => tool.kind === kind);
    }

    function setDefaultTerminal(kind) {
      const tool = terminalToolByKind(kind);
      if (!tool) return;
      state.toolPreferences.defaultTerminal = kind;
      persistToolPreferences();
      renderSettingsPage();
      document
        .getElementById("settingsTerminalTrigger")
        ?.focus({ preventScroll: true });
      showToast("默认终端已更新", `${tool.label} 将用于打开新的终端会话。`, "terminal");
    }

    function mountSettingsTerminalDropdown() {
      dropdownManager.unregister("settings-terminal");
      const trigger = document.getElementById(
        "settingsTerminalTrigger"
      );
      const menu = document.getElementById(
        "settingsTerminalMenu"
      );
      if (!trigger || !menu) return;
      dropdownManager.register({
        id: "settings-terminal",
        trigger,
        menu,
        autoToggle: true,
        placement: {
          align: "start",
          side: "bottom"
        }
      });
    }

    function openSettingsTerminalDropdownFromKeyboard(event) {
      if (
        event.key !== "ArrowDown" &&
        event.key !== "ArrowUp"
      ) {
        return;
      }
      event.preventDefault();
      dropdownManager.get("settings-terminal")?.open();
    }

    function openDefaultTerminal(scope) {
      const tool = terminalToolByKind(state.toolPreferences.defaultTerminal);
      if (!tool) return;
      const targetPath =
        scope === "workspace"
          ? currentWorkspaceSnapshot().rootPath
          : repoAbsolutePath(currentRepo());
      showToast(
        `已准备使用 ${tool.label} 打开终端`,
        `${targetPath} · ${tool.path}（交互原型，不会实际启动本地程序）`,
        "terminal"
      );
    }

    function renderOpenInControl(scope) {
      const preferred = openInApplications.find((application) => application.kind === preferredOpenInKind(scope))
        || openInApplications[0];
      const contextLabel = scope === "workspace" ? "Workspace 根目录" : "当前 Worktree";
      return `
        <div class="open-in-control" data-open-in-control data-open-in-scope="${scope}">
          <button
            type="button"
            class="open-in-primary"
            aria-label="Open in ${preferred.label}"
            title="使用 ${preferred.label} 打开${contextLabel}"
            onclick="openPreferredExternalApplication('${scope}', event.currentTarget)"
          >
            ${openInApplicationIcon(preferred.kind)}
            <span class="open-in-label">Open in ${preferred.label}</span>
          </button>
          <button
            type="button"
            class="open-in-menu-trigger"
            aria-label="选择打开方式"
            aria-haspopup="menu"
            aria-expanded="${state.openInMenuOpen}"
            title="选择另一个本地应用"
            onclick="toggleOpenInMenu(event.currentTarget)"
          >${icon("chevronDown", 12)}</button>
        </div>
      `;
    }

    function openInApplicationIcon(kind) {
      const application = openInApplications.find((candidate) => candidate.kind === kind);
      if (application?.icon) {
        return `<img aria-hidden="true" class="open-in-app-icon" src="${application.icon}" alt="">`;
      }
      const icons = {
        vscode: `<svg aria-hidden="true" class="open-in-app-icon" viewBox="0 0 24 24"><path d="M17.25 2.8 7.57 11.6 3.4 8.43 1.5 9.5v5l1.9 1.08 4.17-3.18 9.68 8.8L22.5 19V5l-5.25-2.2Zm-.2 5.08v8.24L11.75 12l5.3-4.12Z" fill="#23a9f2"/></svg>`,
        cursor: `<svg aria-hidden="true" class="open-in-app-icon" viewBox="0 0 24 24"><rect fill="#f7f7f7" height="22" rx="5" width="22" x="1" y="1"/><path d="m12 3.5 8.5 8.5-8.5 8.5L3.5 12 12 3.5Z" fill="#111"/><path d="m12 8 4 4-4 4-4-4 4-4Z" fill="#f7f7f7"/></svg>`,
        "intellij-idea": `<svg aria-hidden="true" class="open-in-app-icon" viewBox="0 0 24 24"><rect fill="#ff2d8d" height="22" rx="4" width="22" x="1" y="1"/><path d="M1 14 14 1h9v8L9 23H1v-9Z" fill="#6b45ff"/><path d="m12 23 11-11v11H12Z" fill="#22c7e8"/><rect fill="#090909" height="14" width="14" x="5" y="5"/><path d="M8 8h1.6v6H8V8Zm3 0h4v1.4h-2.35v2.8c0 .45-.1.85-.3 1.18-.2.34-.48.6-.84.78-.35.18-.77.27-1.25.27H10v-1.4h.25c.25 0 .44-.07.57-.2.13-.14.2-.34.2-.61V8Z" fill="#fff"/><path d="M8 16h6" stroke="#fff" stroke-width="1.2"/></svg>`,
        "sublime-text": `<svg aria-hidden="true" class="open-in-app-icon" viewBox="0 0 24 24"><rect fill="#303030" height="22" rx="4" width="22" x="1" y="1"/><path d="m5 7.2 13-3v4.6l-8.6 2L18 13v4.6L5 20.6V16l8.7-2L5 11.8V7.2Z" fill="#ff9800"/></svg>`,
        "file-explorer": `<svg aria-hidden="true" class="open-in-app-icon" viewBox="0 0 24 24"><path d="M2 6.5A2.5 2.5 0 0 1 4.5 4H10l2 2h7.5A2.5 2.5 0 0 1 22 8.5V19H2V6.5Z" fill="#f8c642"/><path d="M2 9h20v10.5A2.5 2.5 0 0 1 19.5 22h-15A2.5 2.5 0 0 1 2 19.5V9Z" fill="#e7a91c"/><path d="M8 8h8v4H8z" fill="#52a8e8"/></svg>`,
        terminal: `<svg aria-hidden="true" class="open-in-app-icon" viewBox="0 0 24 24"><rect fill="#20242b" height="22" rx="4" width="22" x="1" y="1"/><path d="m6 8 4 4-4 4M12 16h6" fill="none" stroke="#f5f7fa" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/></svg>`
      };
      return icons[kind] || icon("external", 16);
    }

    function toggleOpenInMenu(trigger) {
      const control = trigger.closest("[data-open-in-control]");
      if (!control) return;
      if (state.openInMenuOpen) {
        closeOpenInMenu();
        return;
      }
      const scope = control.dataset.openInScope;
      const contextLabel = scope === "workspace" ? "Workspace 根目录" : "当前 Worktree";
      const menu = document.createElement("div");
      menu.id = "openInFloatingMenu";
      menu.className = "open-in-menu menu-surface";
      menu.setAttribute("role", "menu");
      menu.setAttribute("aria-label", `选择用于打开${contextLabel}的应用`);
      menu.innerHTML = [
        renderMenuHeading("Open in"),
        ...openInApplications.map((application) =>
          renderMenuItem({
            label: application.label,
            leading: openInApplicationIcon(application.kind),
            attributes: `onclick="openExternalApplication('${application.kind}', '${scope}')"`
          })
        )
      ].join("");
      menu.hidden = true;
      document.body.appendChild(menu);
      dropdownManager.register({
        id: "open-in",
        trigger,
        menu,
        placement: {
          align: "end",
          side: "bottom"
        },
        onOpen: () => {
          state.openInMenuOpen = true;
        },
        onClose: (controller) => {
          state.openInMenuOpen = false;
          controller.menu?.remove();
        }
      });
      dropdownManager.get("open-in")?.open();
    }

    function closeOpenInMenu({ restoreFocus = false } = {}) {
      dropdownManager.get("open-in")?.close({ restoreFocus });
      dropdownManager.unregister("open-in", { close: false });
      state.openInMenuOpen = false;
      document.getElementById("openInFloatingMenu")?.remove();
      document.querySelectorAll("[data-open-in-control]").forEach((control) => {
        const trigger = control.querySelector(".open-in-menu-trigger");
        if (trigger) trigger.setAttribute("aria-expanded", "false");
      });
    }

    function openPreferredExternalApplication(scope) {
      openExternalApplication(preferredOpenInKind(scope), scope);
    }

    function openExternalApplication(kind, scope) {
      const application = openInApplications.find((candidate) => candidate.kind === kind);
      if (!application) {
        showErrorToast("无法打开本地应用", "所选应用当前不可用。");
        return;
      }
      setOpenInPreference(application.kind, scope);
      closeOpenInMenu();
      renderCommandbar();
      const targetPath = scope === "workspace"
        ? currentWorkspaceSnapshot().rootPath
        : repoAbsolutePath(currentRepo());
      showToast(
        `已使用 ${application.label} 打开`,
        `${targetPath}（交互原型，不会实际启动本地程序）`,
        application.kind === "file-explorer"
          ? "folder"
          : application.kind === "terminal" || application.kind === "git-bash"
            ? "terminal"
            : "external"
      );
    }

    function renderTabs() {
      const contextTabs = document.getElementById("contextTabs");
      if (
        state.view === "settings" ||
        state.view === "operations" ||
        state.view === "analysis"
      ) {
        contextTabs.innerHTML = "";
        contextTabs.removeAttribute("role");
        return;
      }

      const activeWorkspaceSnapshot = currentWorkspaceSnapshot();
      const tabs = state.view === "workspace"
        ? [
            ["overview", "workspace", "概览", ""],
            ["repositories", "repository", "仓库", String(activeWorkspaceSnapshot.totalRepositories)],
            ["activity", "history", "活动", String(activeWorkspaceSnapshot.totalRepositories)],
            ["worktrees", "worktree", "Worktrees", String(activeWorkspaceSnapshot.worktrees)]
          ]
        : [
            ["overview", "workspace", "概览", ""],
            ["changes", "fileCode", "变更", String(currentRepo().changes || "")],
            ["history", "history", "历史", "1"],
            ["branches", "branch", "分支", "1"],
            ["worktrees", "worktree", "Worktrees", String(currentRepo().worktrees)]
          ];

      contextTabs.setAttribute("role", "tablist");
      contextTabs.innerHTML = tabs.map(([id, iconName, label, count]) => `
        <button type="button" id="contextTab-${id}" role="tab" aria-controls="mainContent" aria-selected="${state.tab === id}" tabindex="${state.tab === id ? "0" : "-1"}" class="context-tab ${state.tab === id ? "active" : ""}" onclick="${state.view === "workspace" ? `setWorkspaceTab('${id}')` : `setRepoTab('${id}')`}" onkeydown="handleContextTabKeydown(event)">
          ${icon(iconName)}
          <span>${label}</span>
          ${count ? `<span class="tab-count">${count}</span>` : ""}
        </button>
      `).join("");
    }

    function renderMain() {
      if (state.view !== "analysis") {
        destroyAnalysisNodeDiffPanel();
      }
      document.title = state.view === "workspace"
        ? `GitNest · ${currentWorkspaceSnapshot().name}`
        : state.view === "settings"
          ? "设置 · GitNest"
          : state.view === "operations"
            ? "操作中心 · GitNest"
            : state.view === "analysis"
              ? "代码分析 · GitNest"
          : `${currentRepo().name} · GitNest`;
      document.querySelector(".workbench").classList.toggle("settings-view", state.view === "settings");
      document.querySelector(".workbench").classList.toggle("operations-view", state.view === "operations");
      document.querySelector(".workbench").classList.toggle("analysis-view", state.view === "analysis");
      renderCommandbar();
      renderTabs();
      updateNavigationState();

      if (state.view === "workspace") {
        if (state.tab === "repositories") renderWorkspaceRepositories();
        else if (state.tab === "activity") renderWorkspaceActivity();
        else if (state.tab === "worktrees") renderWorkspaceWorktrees();
        else renderWorkspaceOverview();
      } else if (state.view === "settings") {
        renderSettingsPage();
      } else if (state.view === "operations") {
        renderOperationCenter();
      } else if (state.view === "analysis") {
        renderCodeAnalysis();
      } else {
        if (state.tab === "changes") renderChanges();
        else if (state.tab === "history") renderHistory();
        else if (state.tab === "branches") renderBranches();
        else if (state.tab === "worktrees") renderWorktrees();
        else renderRepositoryOverview();
      }

      renderSidebar();
      updateInspectorState();
      syncAccessibleHints();
    }

    function updateNavigationState() {
      const workspaceRail = document.getElementById("workspaceRail");
      const sidebarToggleRail = document.getElementById("sidebarToggleRail");
      const fullPageView =
        state.view === "operations" ||
        state.view === "settings" ||
        state.view === "analysis";
      const sidebarHidden =
        state.sidebarCollapsed || fullPageView;
      const sidebarLabel = sidebarHidden ? "展开仓库目录" : "折叠仓库目录";
      if (sidebarHidden && state.workspaceSwitcherOpen) {
        closeWorkspaceSwitcher();
      }
      workspaceRail.classList.toggle("active", state.view === "workspace");
      workspaceRail.setAttribute("aria-current", state.view === "workspace" ? "page" : "false");
      sidebarToggleRail.classList.remove("active");
      sidebarToggleRail.setAttribute("aria-label", sidebarLabel);
      sidebarToggleRail.setAttribute("aria-pressed", String(sidebarHidden));
      sidebarToggleRail.title = sidebarLabel;
      sidebarToggleRail.innerHTML = icon(
        sidebarHidden ? "sidebarExpand" : "sidebarCollapse",
        18
      );
      document.getElementById("operationRail").classList.toggle("active", state.view === "operations");
      document.getElementById("analysisRail").classList.toggle("active", state.view === "analysis");
      document.getElementById("settingsRail").classList.toggle("active", state.view === "settings");
      document.getElementById("operationRail").setAttribute("aria-current", state.view === "operations" ? "page" : "false");
      document.getElementById("analysisRail").setAttribute("aria-current", state.view === "analysis" ? "page" : "false");
      document.getElementById("settingsRail").setAttribute("aria-current", state.view === "settings" ? "page" : "false");
      const activeWorkspaceSnapshot = currentWorkspaceSnapshot();
      document.getElementById("statusWorkspace").innerHTML = `${icon("workspace")}${activeWorkspaceSnapshot.name}`;
      document.getElementById("statusOperation").innerHTML = `${icon("operations")}${activeWorkspaceSnapshot.totalRepositories} 个仓库 · ${activeWorkspaceSnapshot.totalChanges} 项变更`;
      document.querySelector(".workspace-frame").classList.toggle("sidebar-collapsed", sidebarHidden);
      document.querySelector(".workspace-frame").classList.toggle("operations-view", state.view === "operations");
      document.querySelector(".workspace-frame").classList.toggle("settings-view", state.view === "settings");
      document.querySelector(".workspace-frame").classList.toggle("analysis-view", state.view === "analysis");
    }

    const settingsSections = [
      { id: "general", label: "通用", subtitle: "应用行为与偏好", iconName: "settings" },
      { id: "ai", label: "AI 提交信息", subtitle: "生成提交信息", iconName: "sparkle" },
      { id: "git", label: "Git", subtitle: "运行环境与 Fetch", iconName: "branch" },
      { id: "analysis", label: "LSP 与代码分析", subtitle: "请求链与关系图", iconName: "graph" },
      { id: "account", label: "账号与认证", subtitle: "凭据与仓库绑定", iconName: "repository" }
    ];

    function openSettings() {
      withCommitDraftGuard(() => {
        state.view = "settings";
        state.settingsSection = state.settingsSection || "general";
        state.inspectorOpen = false;
        renderMain();
      });
    }

    function setSettingsSection(section) {
      if (!settingsSections.some((item) => item.id === section)) return;
      withCommitDraftGuard(() => {
        state.view = "settings";
        state.settingsSection = section;
        renderMain();
      });
    }

    function toggleSetting(key, label) {
      if (typeof state[key] !== "boolean") return;
      state[key] = !state[key];
      renderSettingsPage();
      showToast("设置已更新", `${label}已${state[key] ? "开启" : "关闭"}。`, state[key] ? "check" : "settings");
    }

    function selectSettingOption(key, value, label) {
      state[key] = value;
      renderSettingsPage();
      showToast("设置已更新", `${label}已切换。`, "check");
    }

    function saveSettings() {
      showToast("设置已保存", "界面偏好已更新。", "check");
    }

    function persistAiSettings() {
      try {
        localStorage.setItem(
          aiSettingsStorageKey,
          JSON.stringify({
            enabled: state.aiSettings.enabled,
            url: state.aiSettings.url,
            model: state.aiSettings.model,
            apiKey: state.aiSettings.apiKey,
            prompt: state.aiSettings.prompt
          })
        );
      } catch {
        // 文件预览环境可能禁用持久化。
      }
    }

    function captureAiSettings() {
      const url = document.getElementById("aiCommitUrl");
      const model = document.getElementById("aiCommitModel");
      const apiKey = document.getElementById("aiCommitApiKey");
      const prompt = document.getElementById("aiCommitPrompt");
      if (url) state.aiSettings.url = url.value;
      if (model) state.aiSettings.model = model.value;
      if (apiKey) state.aiSettings.apiKey = apiKey.value;
      if (prompt) state.aiSettings.prompt = prompt.value;
    }

    function toggleAiSettings() {
      captureAiSettings();
      state.aiSettings.enabled = !state.aiSettings.enabled;
      persistAiSettings();
      renderSettingsPage();
      showToast(
        "AI 提交信息设置已更新",
        state.aiSettings.enabled ? "提交区域将显示 AI 生成入口。" : "提交区域将隐藏 AI 生成入口。",
        state.aiSettings.enabled ? "sparkle" : "settings"
      );
    }

    function saveAiSettings() {
      captureAiSettings();
      persistAiSettings();
      showToast(
        "AI 设置已保存",
        state.aiSettings.apiKey
          ? "URL、模型、提示词和 API Key 已保存。"
          : "URL、模型和提示词已保存，请填写 API Key 后再测试连接。",
        "check"
      );
    }

    function toggleAiApiKeyVisibility() {
      captureAiSettings();
      state.aiKeyVisible = !state.aiKeyVisible;
      renderSettingsPage();
      requestAnimationFrame(() => {
        const apiKey = document.getElementById("aiCommitApiKey");
        if (!apiKey) return;
        apiKey.focus();
        apiKey.setSelectionRange(apiKey.value.length, apiKey.value.length);
      });
    }

    function clearAiApiKey() {
      captureAiSettings();
      if (!state.aiSettings.apiKey) {
        showToast("无需清空", "当前没有已保存的 AI API Key。", "settings");
        return;
      }
      openConfirmDialog({
        title: "清空 AI API Key？",
        description: "生成和连接测试将不可用，直到再次保存 Key。API URL、模型和提示词不会被删除。",
        actionLabel: "确认清空 Key",
        onConfirm: () => {
          state.aiSettings.apiKey = "";
          state.aiKeyVisible = true;
          persistAiSettings();
          renderSettingsPage();
          showToast("AI API Key 已清空", "其他 AI 设置已保留。", "check");
        }
      });
    }

    function confirmPreviewAccountRemoval() {
      openConfirmDialog({
        title: "删除 GitHub 账号？",
        description: "删除前会展示受影响的仓库绑定；正式应用始终要求确认。",
        actionLabel: "确认删除",
        onConfirm: () =>
          showToast(
            "账号删除预览完成",
            "原型未删除真实账号或凭据。",
            "alert"
          )
      });
    }

    function testAiConnection() {
      captureAiSettings();
      if (!state.aiSettings.url.trim()) {
        showErrorToast("无法测试 AI 连接", "请先填写 API URL。");
        return;
      }
      if (!state.aiSettings.model.trim()) {
        showErrorToast("无法测试 AI 连接", "请先填写模型。");
        return;
      }
      if (!state.aiSettings.apiKey.trim()) {
        showErrorToast("无法测试 AI 连接", "请先填写 API Key。");
        return;
      }
      showToast(
        "AI 连接测试完成",
        `${state.aiSettings.url.trim()} 已完成连接测试。`,
        "check"
      );
    }

    function generateCommitMessageWithAI() {
      updateCommitDraft();
      captureAiSettings();
      if (!state.aiSettings.enabled) {
        showErrorToast("AI 生成未启用", "请先在设置的“AI 提交信息”中启用。");
        return;
      }
      if (!state.aiSettings.url.trim() || !state.aiSettings.model.trim() || !state.aiSettings.apiKey.trim()) {
        showErrorToast("AI 配置不完整", "请先填写 API URL、模型和 API Key。");
        return;
      }
      if (
        currentRepo().staged <= 0 &&
        currentRepo().unstaged + currentRepo().untracked <= 0
      ) {
        showErrorToast("没有可提交变更", "请先修改、暂存或新增要提交的文件。");
        return;
      }
      const summary =
        currentRepo().staged > 0
          ? "feat: 更新已暂存变更"
          : "feat: 更新工作区变更";
      const details =
        currentRepo().staged > 0
          ? "根据当前提交范围和 AI 提交提示词生成的提交说明。"
          : "根据未暂存和未跟踪变更以及 AI 提交提示词生成的提交说明。";
      state.commitDraft.message = applyTapdKeywordToCommitMessage(
        `${summary}\n\n${details}`,
        state.tapdKeyword
      );
      state.commitDirty = true;
      renderChanges();
      showToast(
        "AI 提交信息已生成",
        "已填入提交信息。",
        "sparkle"
      );
    }

    function settingsToggle(label, description, key) {
      const enabled = Boolean(state[key]);
      return `
        <div class="settings-setting-row">
          <div>
            <div class="settings-setting-title">${label}</div>
            <div class="settings-setting-description">${description}</div>
          </div>
          <button type="button" class="settings-switch ${enabled ? "active" : ""}" aria-label="${label}" aria-pressed="${enabled}" onclick="toggleSetting('${key}', '${label}')">
            <span class="settings-switch-thumb"></span>
          </button>
        </div>
      `;
    }

    function settingsOption(key, value, iconName, title, description) {
      const selectedValue = state[key];
      const active = selectedValue === value;
      const action = `selectSettingOption('${key}', '${value}', '${title}')`;
      return `
        <button type="button" class="settings-option ${active ? "active" : ""}" aria-pressed="${active}" onclick="${action}">
          <span class="settings-option-head">
            <span class="settings-option-icon">${icon(iconName, 15)}</span>
            <span class="settings-option-title">${title}</span>
          </span>
          <span class="settings-option-description">${description}</span>
        </button>
      `;
    }

    function settingsNavItems(sections) {
      return sections.map((section) => `
        <button type="button" class="settings-nav-item ${state.settingsSection === section.id ? "active" : ""}" aria-current="${state.settingsSection === section.id ? "page" : "false"}" onclick="setSettingsSection('${section.id}')">
          ${icon(section.iconName, 16)}
          <span class="settings-nav-item-copy">
            <span class="settings-nav-item-title">${section.label}</span>
            <span class="settings-nav-item-subtitle">${section.subtitle}</span>
          </span>
        </button>
      `).join("");
    }

    function renderSettingsPage() {
      const activeSection = settingsSections.find((item) => item.id === state.settingsSection) || settingsSections[0];
      state.settingsSection = activeSection.id;
      document.getElementById("mainContent").innerHTML = `
        <div class="page-scroll settings-page-scroll">
          <div class="settings-page">
            <div class="page-heading">
              <div>
                <div class="eyebrow">${icon("settings", 14)}应用偏好</div>
                <h1 class="page-title">设置</h1>
                <p class="page-description">管理应用行为、AI、LSP 代码分析、Git 同步策略以及账号认证。</p>
              </div>
              <div class="page-actions">
                ${renderButton({
                  label: "保存设置",
                  size: "small",
                  variant: "primary",
                  icon: icon("check"),
                  attributes: 'onclick="saveSettings()"'
                })}
              </div>
            </div>

            <div class="settings-layout">
              <nav class="settings-nav panel" aria-label="设置分组">
                <div class="settings-nav-label">GitNest</div>
                ${settingsNavItems(settingsSections)}
              </nav>

              <section class="settings-content" aria-live="polite">
                ${renderSettingsSection(activeSection.id)}
              </section>
            </div>
          </div>
        </div>
      `;
      syncAccessibleHints();
      mountSettingsTerminalDropdown();
    }

              </button>
            </div>

          <section class="panel settings-card">

              <div>
                <div class="settings-card-title">TypeScript Language Server</div>
                <div class="settings-card-description">用于 JavaScript、TypeScript、TSX、JSX 和 Vue 的符号与调用层级增强。</div>
              </div>

                <span class="settings-switch-thumb"></span>

            <div class="settings-card-body">

          <section class="panel settings-card">
            <div class="settings-card-header">

    function workspaceHeader(title, description) {
      return `
        <div class="page-heading">
          <div>
            <h1 class="page-title">${title}</h1>
            <p class="page-description">${description}</p>
          </div>
        </div>
      `;
    }

    function analysisChainsInCurrentScope() {
      return analysisChains.filter(
        (chain) => state.analysisScope === "workspace" || chain.changed
      );
    }

    function analysisChainsForCurrentScope() {
      const normalizedFilter = state.analysisFilter.trim().toLocaleLowerCase("zh-CN");
      return analysisChainsInCurrentScope().filter((chain) => {
        if (state.analysisMethod !== "all" && chain.method !== state.analysisMethod) {
          return false;
        }
        if (!normalizedFilter) return true;
        return `${chain.method} ${chain.route} ${chain.nodes.map((node) => `${node.name} ${node.path}`).join(" ")}`
          .toLocaleLowerCase("zh-CN")
          .includes(normalizedFilter);
      });
    }

    function analysisAllNodesInCurrentScope() {
      const uniqueNodes = new Map();
      analysisChainsInCurrentScope().forEach((chain) => {
        chain.nodes.forEach((node) => uniqueNodes.set(node.id, node));
      });
      return [...uniqueNodes.values()];
    }

    function analysisNodesForCurrentScope() {
      const normalizedFilter = state.analysisNodeFilter.trim().toLocaleLowerCase("zh-CN");
      return analysisAllNodesInCurrentScope().filter((node) => {
        if (!normalizedFilter) return true;
        return `${node.name} ${node.qualifiedName} ${node.path} ${node.kindLabel}`
          .toLocaleLowerCase("zh-CN")
          .includes(normalizedFilter);
      });
    }

    function selectedAnalysisChain() {
      const scoped = analysisChainsInCurrentScope();
      const selected = scoped.find((chain) => chain.id === state.analysisSelectedChain);
      return selected || scoped[0] || null;
    }

    function analysisNodeById(nodeId) {
      for (const chain of analysisChainsInCurrentScope()) {
        const node = chain.nodes.find((candidate) => candidate.id === nodeId);
        if (node) return { chain, node };
      }
      return null;
    }

    function analysisNodeLocation(node) {
      const match = String(node?.path || "").match(/^(.*):(\d+)$/);
      return {
        path: match?.[1] || String(node?.path || ""),
        line: Number(match?.[2] || 1)
      };
    }

    function analysisNodeKindClass(node) {
      return {
        client: "client-request",
        endpoint: "server-endpoint",
        service: "method"
      }[node?.kind] || "function";
    }

    function renderAnalysisChainList(chains, selectedChain) {
      if (!chains.length) {
        return `
          <div class="analysis-list-empty">
            ${icon("search", 20)}
            <strong>没有匹配的请求链</strong>
            <p>可清除筛选、切换到函数搜索，或重新运行全部代码分析。</p>
          </div>
        `;
      }
      return chains.map((chain) => `
        <button type="button" class="${chain.id === selectedChain?.id ? "active" : ""}" ${chain.id === selectedChain?.id ? 'aria-current="true"' : ""} onclick="selectAnalysisChain('${chain.id}')">
          <span class="http-method method-${chain.method.toLocaleLowerCase("en-US")}">${chain.method}</span>
          <strong>${escapeHtml(chain.route)}</strong>
          <small>${chain.nodes.length} 个节点</small>
        </button>
      `).join("");
    }

    function renderAnalysisNodeList(nodes, selectedNode) {
      if (!nodes.length) {
        return `
          <div class="analysis-list-empty">
            ${icon("search", 20)}
            <strong>没有匹配的函数或接口</strong>
            <p>可按名称、限定名或文件路径搜索。</p>
          </div>
        `;
      }
      return nodes.map((node) => `
        <button
          type="button"
          class="analysis-symbol-result ${node.id === selectedNode?.id ? "active" : ""}"
          ${node.id === selectedNode?.id ? 'aria-current="true"' : ""}
          onclick="focusAnalysisNode('${node.id}')"
        >
          <span class="analysis-node-dot node-${analysisNodeKindClass(node)}"></span>
          <strong>${escapeHtml(node.name)}</strong>
          <small>${escapeHtml(node.kindLabel)} · ${escapeHtml(node.path)}</small>
        </button>
      `).join("");
    }

    function renderAnalysisNavigationPanel(chains, selectedChain) {
      const nodes = analysisNodesForCurrentScope();
      const searchableNodeCount = analysisAllNodesInCurrentScope().length;
      const selected = analysisNodeById(state.analysisSelectedNode)?.node || null;
      const chainsMode = state.analysisNavigationMode === "chains";
      const selectedMethodLabel = state.analysisMethod === "all"
        ? "全部方法"
        : state.analysisMethod;
      return `
        <header>
          <div>
            <strong>代码导航</strong>
            <span>${chainsMode ? `${chains.length} 条请求链` : `${nodes.length}/${searchableNodeCount} 个节点`}</span>
          </div>
          <div class="analysis-navigation-tabs" role="tablist" aria-label="代码导航类型">
            <button
              type="button"
              role="tab"
              class="${chainsMode ? "active" : ""}"
              aria-selected="${chainsMode}"
              onclick="setAnalysisNavigationMode('chains')"
            >
              请求链
              <span>${analysisChainsInCurrentScope().length}</span>
            </button>
            <button
              type="button"

    function analysisGraphLayout(chain) {

        node,
        x: graphPadding + index * (nodeWidth + columnGap),
        y: 58
      }));
      return {
        nodes,
        nodeWidth,
        nodeHeight,
        nodeTextInset,
        nodeTextTop,
        nodeTextHeight: nodeHeight - nodeTextTop - nodeTextBottomInset,
        width: graphPadding * 2 + Math.max(1, nodes.length) * nodeWidth + Math.max(0, nodes.length - 1) * columnGap,

      }
      const layout = analysisGraphLayout(chain);
      const edges = layout.nodes.slice(1).map((positioned, index) => {
        const from = layout.nodes[index];

        const startX = from.x + layout.nodeWidth;
        const startY = from.y + layout.nodeHeight / 2;
        const endX = to.x;

          <g>
            <path
              class="analysis-graph-edge edge-${http ? "http-request" : "calls"}"

    function analysisNodeDiffRows(node) {
      const location = analysisNodeLocation(node);
      const line = Math.max(1, location.line);
      const java = node.language === "Java";
      const memberName = String(
        node.kind === "client"
          ? node.qualifiedName
          : node.name.split(".").pop()
      ).replace(/[^\w$]/g, "") || (java ? "findById" : "loadUser");
      const ownerName = String(node.name).split(".")[0]
        .replace(/[^\w$]/g, "") || "UserService";
      const domainName = ownerName
        .replace(/(?:Controller|Service|Repository)$/, "") || "User";
      const javaResultType = `${domainName}Dto`;
      const beforeContext = java
        ? [
            "import org.springframework.stereotype.Service;",
            "import org.springframework.transaction.annotation.Transactional;",
            "",
            "@Service",
            `public class ${ownerName} {`,
            "  private final AuditService audit;",
            "",
            `  public ${ownerName}(AuditService audit) {`,
            "    this.audit = audit;",
            "  }",
            "",
            "  @Transactional(readOnly = true)"
          ]
        : [
            'import { api } from "@/lib/api";',
            'import type { User } from "@/types/user";',
            "",
            "const userCache = new Map<string, User>();",
            "",
            "function normalizeUserId(id: string) {",
            "  return id.trim();",
            "}",
            "",
            "// User detail data source",
            "",
            ""
          ];
      const afterContext = java
        ? [
            "",
            "  public void invalidateUser(String id) {",
            "    audit.recordCacheInvalidation(id);",
            "  }",
            "}"
          ]
        : [
            "",
            "export function invalidateUser(id: string) {",
            "  userCache.delete(id);",
            "}",
            ""
          ];
      const contextStart = Math.max(1, line - beforeContext.length);
      const before = java
        ? `return repository.findById(id).orElseThrow(UserNotFoundException::new);`
        : `const response = await api.get(\`/api/users/\${id}\`);`;
      const after = java
        ? `${javaResultType} result = repository.findById(id).map(UserMapper::toDto).orElseThrow(UserNotFoundException::new);`
        : `const response = await api.get<User>(\`/api/users/\${id}\`);`;
      const signature = java
        ? `  public ${javaResultType} ${memberName}(String id) {`
        : `export async function ${memberName}(id: string): Promise<User> {`;
      const beforeRows = beforeContext.map((text, index) => ({
        kind: "context",
        oldNo: contextStart + index,
        newNo: contextStart + index,
        text
      }));
      const afterRows = afterContext.map((text, index) => ({
        kind: "context",
        oldNo: line + 4 + index,
        newNo: line + 5 + index,
        text
      }));
      return [
        {
          kind: "hunk",
          text: `@@ -${contextStart},${beforeRows.length + afterRows.length + 4} +${contextStart},${beforeRows.length + afterRows.length + 5} @@ ${node.name}`
        },
        ...beforeRows,
        { kind: "context", oldNo: line, newNo: line, text: signature },
        { kind: "delete", oldNo: line + 1, text: `  ${before}` },
        { kind: "add", newNo: line + 1, text: `  ${after}` },
        { kind: "add", newNo: line + 2, text: java ? "  audit.recordUserLookup(id);" : "  userCache.set(id, response.data);" },
        { kind: "context", oldNo: line + 2, newNo: line + 3, text: java ? "    return result;" : "  return response.data;" },
        { kind: "context", oldNo: line + 3, newNo: line + 4, text: java ? "  }" : "}" },
        ...afterRows
      ];
    }

    function analysisNodeCodeRows(node) {
      const location = analysisNodeLocation(node);
      const source = analysisSourceFiles[location.path];
      if (!source) return [];
      const syntaxLines =
        window.GitNestDiffPanel.tokenizeSourceLines(
          source.lines,
          node.language,
          location.path
        );
      return source.lines.map((text, index) => {
        const lineNumber = source.startLine + index;
        return {
          kind: "context",
          oldNo: lineNumber,
          newNo: lineNumber,
          text,
          syntaxTokens: syntaxLines[index] || []
        };
      });
    }

    function openCodeAnalysis() {
      withCommitDraftGuard(() => {
        const enteringAnalysis = state.view !== "analysis";

          state.analysisLoading = true;

    function renderAnalysisLanguageServerState(language, label) {
      const installed = language === "typescript"
        ? state.analysisTypeScriptInstalled
        : state.analysisJavaInstalled;
      if (installed) {
        return `<span class="analysis-server-state connected">${label}：已连接</span>`;
      }
      const installing = state.analysisInstallingLanguage === language;
      const installDisabled = state.analysisRunning || (
        state.analysisInstallingLanguage &&
        !installing
      );
      return `
        <span class="analysis-server-state unavailable">
          <span>${label}：未安装</span>
          ${renderButton({
            label: installing ? "安装中…" : "安装",
            ariaLabel: `安装 ${label}`,
            size: "small",
            variant: "toolbar",
            icon: icon("download", 12),

            className: "analysis-server-install",
            attributes: `onclick="installAnalysisLanguageServer('${language}')"`
          })}
        </span>
      `;

    function installAnalysisLanguageServer(language) {
      if (
        !["typescript", "java"].includes(language) ||
        state.analysisRunning ||
        state.analysisInstallingLanguage
      ) {
        return;
      }
      state.analysisInstallingLanguage = language;
      renderCodeAnalysis();
      window.setTimeout(() => {
        if (language === "typescript") {
          state.analysisTypeScriptInstalled = true;
        } else {
          state.analysisJavaInstalled = true;
        }
        state.analysisInstallingLanguage = null;
        renderCodeAnalysis();
        showToast(
          "Language Server 安装完成",
          `${language === "typescript" ? "TypeScript" : "Java"} Language Server 已安装，正在重新分析。`,
          "check"

        runCodeAnalysisPrototype();
      }, 1200);

    function setAnalysisScope(scope) {
      if (state.analysisRunning || !["changed", "workspace"].includes(scope)) return;
      state.analysisScope = scope;
      state.analysisFilter = "";
      state.analysisNodeFilter = "";
      state.analysisMethod = "all";
      state.analysisNavigationMode = "chains";
      const chain = analysisChains.find((candidate) => scope === "workspace" || candidate.changed);
      state.analysisSelectedChain = chain?.id || "";
      state.analysisSelectedNode = "";
      state.analysisDiffExpanded = false;
      resetAnalysisGraphViewState(chain);
      renderCodeAnalysis();
    }

    function setAnalysisNavigationMode(mode) {
      if (!["chains", "symbols"].includes(mode) || state.analysisNavigationMode === mode) return;
      state.analysisNavigationMode = mode;
      syncAnalysisNodeInspection();
      const input = document.querySelector('[data-analysis-navigation-filter="true"]');
      if (input instanceof HTMLInputElement) input.focus();
    }

    function setAnalysisFilter(value) {
      state.analysisFilter = value;
      const input = document.activeElement;
      const selectionStart = input instanceof HTMLInputElement ? input.selectionStart : null;
      syncAnalysisNodeInspection();
      const nextInput = document.querySelector('[data-analysis-navigation-filter="true"]');
      if (nextInput instanceof HTMLInputElement) {
        nextInput.focus();
        if (selectionStart !== null) {
          nextInput.setSelectionRange(selectionStart, selectionStart);
        }
      }
    }

    function setAnalysisNodeFilter(value) {
      state.analysisNodeFilter = value;
      const input = document.activeElement;
      const selectionStart = input instanceof HTMLInputElement ? input.selectionStart : null;
      syncAnalysisNodeInspection();
      const nextInput = document.querySelector('[data-analysis-navigation-filter="true"]');
      if (nextInput instanceof HTMLInputElement) {
        nextInput.focus();
        if (selectionStart !== null) {
          nextInput.setSelectionRange(selectionStart, selectionStart);
        }
      }
    }

    function setAnalysisMethod(method) {
      if (!["all", "GET", "POST", "PUT", "DELETE", "PATCH"].includes(method)) return;
      state.analysisMethod = method;
      syncAnalysisNodeInspection();
      document.querySelector(".analysis-method-menu > summary")?.focus();

    function onAnalysisMethodMenuToggle(details) {
      positionDetailsMenu(details, {
        side: "bottom",
        align: "start"
      });
      if (!details.open) return;
      requestAnimationFrame(() => {
        const items = [
          ...details.querySelectorAll('[role="menuitemradio"]')
        ];
        const selected = items.find(
          (item) => item.getAttribute("aria-checked") === "true"
        );
        (selected || items[0])?.focus();
      });
    }

    function selectAnalysisChain(chainId) {
      const chain = analysisChainsInCurrentScope().find((candidate) => candidate.id === chainId);
      if (!chain) return;
      state.analysisNavigationMode = "chains";
      state.analysisSelectedChain = chain.id;
      state.analysisSelectedNode = "";
      state.analysisDiffExpanded = false;
      resetAnalysisGraphViewState(chain);
      renderCodeAnalysis();
    }

    function focusAnalysisNode(nodeId) {
      const match = analysisNodeById(nodeId);
      if (!match) return;
      state.analysisNavigationMode = "symbols";
      state.analysisSelectedChain = match.chain.id;
      state.analysisSelectedNode = match.node.id;
      state.analysisDiffExpanded = false;
      resetAnalysisGraphViewState(match.chain, nodeId);
      renderCodeAnalysis();
    }

    function inspectAnalysisNode(nodeId) {
      const match = analysisNodeById(nodeId);
      if (!match) return;
      if (state.analysisSelectedNode !== nodeId) {
        state.analysisDiffExpanded = false;
      }
      state.analysisSelectedNode = nodeId;
      syncAnalysisNodeInspection();
    }

    function clearAnalysisNodeInspection() {
      state.analysisSelectedNode = "";
      state.analysisDiffExpanded = false;
      syncAnalysisNodeInspection();
    }

    function toggleAnalysisNodeDiff() {
      const selected = analysisNodeById(state.analysisSelectedNode)?.node;
      if (!selected) {
        state.analysisDiffExpanded = false;
        return;
      }
      state.analysisDiffExpanded = !state.analysisDiffExpanded;
      syncAnalysisNodeInspection();
    }

    function closeAnalysisNodeDiff() {
      if (!state.analysisDiffExpanded) return;
      state.analysisDiffExpanded = false;
      syncAnalysisNodeInspection();
    }

    function syncAnalysisNodeInspection() {
      if (state.view !== "analysis") return;
      const panel = document.getElementById("analysisNavigationPanel");
      const workspace = document.getElementById("analysisGraphWorkspace");
      if (!panel || !workspace) return;
      const chain = selectedAnalysisChain();
      const selected = analysisNodeById(state.analysisSelectedNode)?.node || null;
      const graphSelected = selected || chain?.nodes[0] || null;
      const chains = analysisChainsForCurrentScope();
      panel.classList.toggle("is-node-detail", Boolean(selected));
      panel.innerHTML = selected
        ? renderAnalysisNodePanel(chain, selected)
        : renderAnalysisNavigationPanel(chains, chain);
      document.querySelectorAll("[data-analysis-node-id]").forEach((element) => {
        element.classList.toggle(
          "selected",
          element.getAttribute("data-analysis-node-id") === graphSelected?.id
        );
      });
      destroyAnalysisNodeDiffPanel();
      workspace.querySelector(".analysis-node-diff-drawer")?.remove();
      if (selected && state.analysisDiffExpanded) {
        workspace.insertAdjacentHTML("afterbegin", renderAnalysisNodeDiffDrawer(selected));
        mountAnalysisNodeDiffPanel(selected);
      }
      syncAccessibleHints();
    }

    function resetAnalysisGraphViewState(chain, nodeId = "") {
      const layout = analysisGraphLayout(chain);
      const target = layout.nodes.find((positioned) => positioned.node.id === nodeId)
        || layout.nodes[0];
      state.analysisGraphZoom = 1;
      state.analysisGraphPanX = target
        ? layout.width / 2 - (target.x + layout.nodeWidth / 2)
        : 0;
      state.analysisGraphPanY = target
        ? layout.height / 2 - (target.y + layout.nodeHeight / 2)
        : 0;
      state.analysisGraphPointer = null;
    }

    function syncAnalysisGraphTransform() {
      const canvas = document.getElementById("analysisGraphCanvas");
      const svg = document.querySelector(".analysis-graph-svg");
      const zoomLabel = document.getElementById("analysisGraphZoomLabel");
      const zoomInput = document.querySelector('.analysis-graph-controls input[type="range"]');
      if (canvas) {
        canvas.style.marginLeft = `${state.analysisGraphPanX}px`;
        canvas.style.marginTop = `${state.analysisGraphPanY}px`;
      }
      if (svg) {
        const baseWidth = Number(svg.getAttribute("data-base-width")) || 1;
        const baseHeight = Number(svg.getAttribute("data-base-height")) || 1;
        svg.setAttribute("width", String(baseWidth * state.analysisGraphZoom));
        svg.setAttribute("height", String(baseHeight * state.analysisGraphZoom));
      }
      if (zoomLabel) zoomLabel.textContent = `${Math.round(state.analysisGraphZoom * 100)}%`;
      if (zoomInput instanceof HTMLInputElement) {
        zoomInput.value = String(Math.round(state.analysisGraphZoom * 100));
      }
    }

    function setAnalysisGraphZoom(value, clientX = null, clientY = null) {
      const nextZoom = Math.min(3, Math.max(0.25, Number(value) || 1));
      const currentZoom = state.analysisGraphZoom;
      if (Math.abs(nextZoom - currentZoom) < 0.001) return;
      const viewport = document.getElementById("analysisGraphViewport");
      if (viewport) {
        const bounds = viewport.getBoundingClientRect();
        const pointerX = Number.isFinite(clientX)
          ? clientX - (bounds.left + bounds.width / 2)
          : 0;
        const pointerY = Number.isFinite(clientY)
          ? clientY - (bounds.top + bounds.height / 2)
          : 0;
        const ratio = nextZoom / currentZoom;
        state.analysisGraphPanX += (pointerX - state.analysisGraphPanX) * (1 - ratio);
        state.analysisGraphPanY += (pointerY - state.analysisGraphPanY) * (1 - ratio);
      }
      state.analysisGraphZoom = nextZoom;
      syncAnalysisGraphTransform();
    }

    function zoomAnalysisGraphBy(factor) {
      setAnalysisGraphZoom(state.analysisGraphZoom * factor);
    }

    function zoomAnalysisGraphFromWheel(event) {
      if (event.deltaY === 0) return;
      event.preventDefault();
      const factor = Math.exp(-event.deltaY * 0.0015);
      setAnalysisGraphZoom(
        state.analysisGraphZoom * factor,
        event.clientX,
        event.clientY
      );
    }

    function beginAnalysisGraphPan(event) {
      if (event.button !== 0 || event.target.closest("[data-graph-node]")) return;
      event.preventDefault();
      event.currentTarget.setPointerCapture?.(event.pointerId);
      state.analysisGraphPointer = {
        pointerId: event.pointerId,
        startClientX: event.clientX,
        startClientY: event.clientY,
        startPanX: state.analysisGraphPanX,
        startPanY: state.analysisGraphPanY,
        moved: false
      };
      event.currentTarget.classList.add("is-panning");
    }

    function moveAnalysisGraphPan(event) {
      const drag = state.analysisGraphPointer;
      if (!drag || drag.pointerId !== event.pointerId) return;
      event.preventDefault();
      const deltaX = event.clientX - drag.startClientX;
      const deltaY = event.clientY - drag.startClientY;
      if (!drag.moved && Math.hypot(deltaX, deltaY) >= 3) {
        drag.moved = true;
      }
      if (!drag.moved) return;
      state.analysisGraphPanX = drag.startPanX + deltaX;
      state.analysisGraphPanY = drag.startPanY + deltaY;
      syncAnalysisGraphTransform();
    }

    function endAnalysisGraphPan(event, cancelled = false) {
      const drag = state.analysisGraphPointer;
      if (!drag || drag.pointerId !== event.pointerId) return;
      if (event.currentTarget.hasPointerCapture?.(event.pointerId)) {
        event.currentTarget.releasePointerCapture?.(event.pointerId);
      }
      event.currentTarget.classList.remove("is-panning");
      state.analysisGraphPointer = null;
      if (!cancelled && !drag.moved) {
        clearAnalysisNodeInspection();
      }
    }

    function centerAnalysisGraphNode() {
      const chain = selectedAnalysisChain();
      const layout = analysisGraphLayout(chain);
      const target = layout.nodes.find(
        (positioned) => positioned.node.id === state.analysisSelectedNode
      ) || layout.nodes[0];
      if (!target) return;
      state.analysisGraphPanX = (
        layout.width / 2 - (target.x + layout.nodeWidth / 2)
      ) * state.analysisGraphZoom;
      state.analysisGraphPanY = (
        layout.height / 2 - (target.y + layout.nodeHeight / 2)
      ) * state.analysisGraphZoom;
      syncAnalysisGraphTransform();
    }

    function resetAnalysisGraphView() {
      resetAnalysisGraphViewState(selectedAnalysisChain());
      syncAnalysisGraphTransform();
    }

    function toggleAnalysisGraphFullscreen(force) {

          iconSlot.innerHTML = icon(
            state.analysisGraphFullscreen ? "collapse" : "expand",
            14
          );
        }
      }
    }

    function runCodeAnalysisPrototype() {
      if (!state.analysisEnabled || state.analysisRunning) return;
      clearInterval(state.analysisTimer);
      const steps = [
        [12, "正在发现 Workspace 源文件"],
        [35, "正在复用增量索引并读取变动文件"],
        [58, "正在连接 TypeScript 与 Java Language Server"],
        [78, "正在合并符号与调用层级"],
        [92, "正在匹配前端请求与 Spring 路由"],
        [100, "请求链与关系图已生成"]
      ];
      let index = 0;
      state.analysisRunning = true;
      state.analysisProgress = steps[0][0];
      state.analysisProgressLabel = steps[0][1];
      renderCodeAnalysis();
      state.analysisTimer = setInterval(() => {
        index += 1;
        const step = steps[index];
        if (!step) {
          clearInterval(state.analysisTimer);
          state.analysisTimer = null;
          state.analysisRunning = false;
          state.analysisGeneratedAt = new Date().toISOString();
          if (state.view === "analysis") renderCodeAnalysis();
          showToast("代码分析完成", "已更新请求链、关系图和 LSP 状态；原型未读取或写入真实项目。", "check");
          return;
        }
        state.analysisProgress = step[0];
        state.analysisProgressLabel = step[1];
        if (state.view === "analysis") renderCodeAnalysis();
      }, 420);
    }
