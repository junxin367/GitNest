<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090d12" id="themeColorMeta" />
  <title>GitNest · SC 代码聚合</title>
  <link rel="stylesheet" href="./button.css" />
  <link rel="stylesheet" href="./input.css" />
  <link rel="stylesheet" href="./textarea.css" />
  <link rel="stylesheet" href="./toast.css" />
  <style>
    :root {
      color-scheme: dark;

      /* DESIGN.md: typography */
      --font-sans: Inter, "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      --font-mono: "Cascadia Code", Consolas, monospace;
      --font-size-body: 14px;
      --font-size-caption: 12px;
      --font-size-emphasis: 16px;
      --font-size-title: 24px;
      --font-size-section: 18px;
      --line-height-body: 1.5;
      --line-height-title: 1.3;
      --font-weight-regular: 400;
      --font-weight-medium: 500;
      --font-weight-semibold: 600;

      /* DESIGN.md: spacing, sizing, radii and motion */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;
      --radius-small: 4px;
      --radius-regular: 8px;
      --radius-large: 12px;
      --control-compact: 32px;
      --control-default: 40px;
      --control-large: 48px;
      --icon-small: 16px;
      --icon-regular: 20px;
      --icon-large: 24px;
      --page-max-width: 1440px;
      --page-safe-margin: 24px;
      --page-safe-margin-narrow: 16px;
      --motion-exit: 140ms;
      --motion-micro: 180ms;
      --motion-layer: 240ms;
      --ease-enter: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-exit: ease-in;

      /* DESIGN.md: semantic colors */
      --color-primary: #36c7b5;
      --color-primary-strong: #23aa9b;
      --color-primary-soft: rgba(54, 199, 181, 0.13);
      --color-success: #56d18b;
      --color-success-soft: rgba(86, 209, 139, 0.13);
      --color-warning: #f0c66a;
      --color-warning-soft: rgba(240, 198, 106, 0.14);
      --color-danger: #ff737b;
      --color-danger-soft: rgba(255, 115, 123, 0.13);
      --color-info: #64a8ff;
      --color-info-soft: rgba(100, 168, 255, 0.13);
      --color-text-primary: #e8eef6;
      --color-text-secondary: #c1ccd8;
      --color-text-muted: #91a0b0;
      --color-text-disabled: #657486;
      --color-bg-page: #0d131b;
      --color-bg-surface: #131c27;
      --color-bg-subtle: #182330;
      --color-bg-muted: #1d2a38;
      --color-bg-hover: #223141;
      --color-border: #2b3b4d;
      --color-border-subtle: #1e2a37;
      --color-focus: #7de3d7;
      --color-overlay: rgba(4, 8, 12, 0.48);

      /* DESIGN.md: shared layer scale */
      --z-content: 0;
      --z-navigation: 100;
      --z-popover: 200;
      --z-tooltip: 300;
      --z-overlay: 400;
      --z-modal: 500;
      --z-toast: 600;

      /* Compatibility aliases used by the prototype components. */
      --titlebar: #090d12;
      --rail: #0c1118;
      --sidebar: #101721;
      --canvas: var(--color-bg-page);
      --surface: var(--color-bg-surface);
      --surface-2: var(--color-bg-subtle);
      --surface-3: var(--color-bg-muted);
      --surface-hover: var(--color-bg-hover);
      --border: var(--color-border);
      --border-soft: var(--color-border-subtle);
      --text: var(--color-text-primary);
      --text-soft: var(--color-text-secondary);
      --muted: var(--color-text-muted);
      --accent: var(--color-primary);
      --accent-strong: var(--color-primary-strong);
      --accent-soft: var(--color-primary-soft);
      --blue: var(--color-info);
      --blue-soft: var(--color-info-soft);
      --green: var(--color-success);
      --green-soft: var(--color-success-soft);
      --yellow: var(--color-warning);
      --yellow-soft: var(--color-warning-soft);
      --red: var(--color-danger);
      --red-soft: var(--color-danger-soft);
      --purple: #ae8cff;
      --shadow: 0 24px 64px rgba(0, 0, 0, 0.32);
      --scrollbar: #314154;
      --code-bg: #0b1118;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --color-primary: #087f75;
      --color-primary-strong: #06645d;
      --color-primary-soft: rgba(8, 127, 117, 0.1);
      --color-success: #177245;
      --color-success-soft: rgba(23, 114, 69, 0.1);
      --color-warning: #946100;
      --color-warning-soft: rgba(169, 110, 0, 0.11);
      --color-danger: #b82e3a;
      --color-danger-soft: rgba(184, 46, 58, 0.09);
      --color-info: #1f60a8;
      --color-info-soft: rgba(31, 96, 168, 0.1);
      --color-text-primary: #1b2733;
      --color-text-secondary: #3f4f61;
      --color-text-muted: #647588;
      --color-text-disabled: #98a5b2;
      --color-bg-page: #f2f5f8;
      --color-bg-surface: #ffffff;
      --color-bg-subtle: #f7f9fb;
      --color-bg-muted: #eef3f7;
      --color-bg-hover: #e8eff5;
      --color-border: #cfdae4;
      --color-border-subtle: #e4eaf0;
      --color-focus: #087f75;
      --color-overlay: rgba(24, 37, 49, 0.46);
      --titlebar: #e9eef4;
      --rail: #eef2f7;
      --sidebar: #f7f9fc;
      --purple: #7653d4;
      --shadow: 0 24px 64px rgba(37, 55, 72, 0.16);
      --scrollbar: #c2ced9;
      --code-bg: #f7f9fb;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--canvas);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-regular);
      line-height: var(--line-height-body);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
      touch-action: manipulation;
    }

    button:not(:disabled),
    [role="button"]:not([aria-disabled="true"]) {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    [tabindex="0"]:focus-visible {
      outline: 1px solid var(--color-focus);
      outline-offset: 2px;
    }

    h1,
    h2,
    h3 {
      text-wrap: balance;
    }

    p {
      text-wrap: pretty;
    }

    ::selection {
      background: color-mix(in srgb, var(--accent) 32%, transparent);
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar);
      border: 3px solid transparent;
      border-radius: 999px;
      background-clip: padding-box;
    }

    .icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .app-shell {
      display: grid;
      grid-template-rows: var(--control-default) minmax(0, 1fr) var(--space-5);
      width: 100vw;
      height: 100vh;
      min-width: 1060px;
      isolation: isolate;
      background: var(--canvas);
    }

    .skip-link {
      position: fixed;
      top: var(--space-2);
      left: 72px;
      z-index: var(--z-toast);
      padding: var(--space-2) var(--space-3);
      color: #071411;
      background: var(--accent);
      border-radius: var(--radius-regular);
      font-weight: var(--font-weight-semibold);
      text-decoration: none;
      transform: translateY(-160%);
      transition: transform var(--motion-micro) var(--ease-enter);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .titlebar {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-width: 0;
      padding-left: var(--space-3);
      background: var(--titlebar);
      border-bottom: 1px solid var(--border-soft);
      -webkit-app-region: drag;
      user-select: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 128px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.01em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: var(--icon-large);
      height: var(--icon-large);
      border-radius: var(--radius-regular);
      color: #071411;
      background: linear-gradient(145deg, #67ead8, #2eb7a7);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
    }

    .brand-mark .icon {
      width: 14px;
      height: 14px;
      stroke-width: 2.3;
    }

    .menu-strip {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      -webkit-app-region: no-drag;
    }

    .titlebar-file-menu {
      position: relative;
    }

    .titlebar-help-menu {
      position: relative;
    }

    .titlebar-file-menu > summary,
    .titlebar-help-menu > summary {
      display: flex;
      align-items: center;
      height: var(--control-compact);
      padding: 0 var(--space-2);
      color: var(--muted);
      border-radius: var(--radius-small);
      cursor: pointer;
      list-style: none;
    }

    .titlebar-file-menu > summary::-webkit-details-marker,
    .titlebar-help-menu > summary::-webkit-details-marker {
      display: none;
    }

    .titlebar-file-menu > summary:hover,
    .titlebar-file-menu[open] > summary,
    .titlebar-help-menu > summary:hover,
    .titlebar-help-menu[open] > summary {
      color: var(--text);
      background: var(--surface-hover);
    }

    .menu-surface {
      z-index: var(--z-popover);
      display: grid;
      width: 222px;
      padding: var(--space-2);
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow-popover);
    }

    .menu-heading {
      padding: var(--space-1) var(--space-2) var(--space-2);
      color: var(--muted);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .menu-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      gap: var(--space-2);
      width: 100%;
      min-height: 34px;
      padding: 0 var(--space-2);
      color: var(--text-soft);
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: var(--radius-regular);
      cursor: pointer;
      font-size: var(--font-size-caption);
      line-height: 1;
    }

    .menu-item[data-has-leading="true"] {
      grid-template-columns: 22px minmax(0, 1fr);
    }

    .menu-item[data-has-leading="true"][data-has-trailing="true"] {
      grid-template-columns: 22px minmax(0, 1fr) 16px;
    }

    .menu-item:hover:not(:disabled),
    .menu-item:focus-visible:not(:disabled) {
      color: var(--text);
      background: var(--surface-hover);
    }

    .menu-item:disabled {
      color: var(--color-text-disabled);
      cursor: not-allowed;
      opacity: 0.72;
    }

    .menu-item.danger {
      color: var(--red);
    }

    .menu-item.danger:hover:not(:disabled),
    .menu-item.danger:focus-visible:not(:disabled) {
      color: var(--red);
      background: var(--red-soft);
    }

    .menu-item.danger:disabled {
      color: var(--color-text-disabled);
    }

    .menu-item-leading,
    .menu-item-trailing {
      display: grid;
      place-items: center;
      min-width: 0;
      line-height: 0;
    }

    .menu-item-leading {
      width: 22px;
    }

    .menu-item-trailing {
      width: 16px;
      color: var(--muted);
    }

    .menu-item-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .menu-separator {
      height: 1px;
      margin: var(--space-2) 0;
      background: var(--border-soft);
    }

    .menu-button {
      height: var(--control-compact);
      padding: 0 var(--space-2);
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: var(--radius-small);
      cursor: pointer;
    }

    .menu-button:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .title-spacer {
      flex: 1;
      min-width: var(--space-4);
    }

    .global-search {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      width: min(300px, 30vw);
      height: var(--control-compact);
      padding: 0 var(--space-2) 0 var(--space-3);
      color: var(--muted);
      background: color-mix(in srgb, var(--surface) 76%, transparent);
      border: 0;
      border-radius: var(--radius-regular);
      cursor: pointer;
      -webkit-app-region: no-drag;
    }

    .global-search:hover {
      color: var(--text-soft);
      background: var(--surface-hover);
    }

    .global-search .search-label {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
    }

    .global-search kbd {
      padding: 0 var(--space-1);
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-small);
      font-size: var(--font-size-caption);
      font-family: inherit;
    }

    .window-controls {
      display: flex;
      align-self: stretch;
      margin-left: var(--space-1);
      -webkit-app-region: no-drag;
    }

    .window-control {
      display: grid;
      place-items: center;
      width: var(--control-default);
      color: var(--muted);
      background: transparent;
      border: 0;
    }

    .window-control:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .window-control.close:hover {
      color: #fff;
      background: #d7444d;
    }

    .window-control .icon {
      width: 13px;
      height: 13px;
      stroke-width: 1.5;
    }

    .workspace-frame {
      display: grid;
      grid-template-columns: 52px 286px minmax(0, 1fr);
      min-height: 0;
    }

    .workspace-frame.sidebar-collapsed {
      grid-template-columns: 52px minmax(0, 1fr);
    }

    .workspace-frame.sidebar-collapsed .workspace-sidebar {
      display: none;
    }

    .workspace-frame.operations-view,
    .workspace-frame.settings-view {
      grid-template-columns: 52px minmax(0, 1fr);
    }

    .workspace-frame.operations-view .workspace-sidebar,
    .workspace-frame.settings-view .workspace-sidebar {
      display: none;
    }

    .activity-rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) 0;
      background: var(--rail);
      border-right: 1px solid var(--border-soft);
    }

    .rail-button {
      position: relative;
      display: grid;
      place-items: center;
      width: var(--control-default);
      height: var(--control-default);
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .rail-button:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .rail-button.active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .rail-button .icon {
      width: var(--icon-regular);
      height: var(--icon-regular);
    }

    .rail-badge {
      position: absolute;
      top: 0;
      right: 0;
      display: grid;
      place-items: center;
      min-width: var(--icon-regular);
      height: var(--icon-regular);
      padding: 0 var(--space-1);
      color: #0c1413;
      background: var(--accent);
      border: 2px solid var(--rail);
      border-radius: 999px;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      line-height: 1;
    }

    .rail-spacer {
      flex: 1;
    }

    .rail-divider {
      width: calc(100% - var(--space-3));
      height: 1px;
      margin: 0 0 var(--space-1);
      border-top: 1px solid var(--border-soft);
    }

    .workspace-sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
    }

    .workspace-switcher-wrap {
      position: relative;
    }

    .workspace-switcher {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      width: 100%;
      min-height: 58px;
      padding: var(--space-2) var(--space-3);
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
    }

    .workspace-switcher:hover {
      background: color-mix(in srgb, var(--surface-hover) 58%, transparent);
    }

    .workspace-switcher[aria-expanded="true"] {
      background: var(--surface-hover);
    }

    .workspace-switcher-menu[hidden] {
      display: none;
    }

    .workspace-switcher-menu {
      width: 286px;
      max-width: calc(100vw - var(--space-4));
      border-right-color: color-mix(in srgb, var(--border) 72%, var(--text));
    }

    .workspace-avatar {
      display: grid;
      place-items: center;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      border-radius: var(--radius-regular);
      color: #fff;
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.36), transparent 30%),
        linear-gradient(145deg, #1eb1a5, #405bc7);
      box-shadow: 0 6px 16px rgba(32, 138, 137, 0.22);
    }

    .workspace-avatar .icon {
      width: var(--icon-regular);
      height: var(--icon-regular);
    }

    .workspace-meta {
      min-width: 0;
      flex: 1;
    }

    .workspace-switcher > span:last-child {
      display: grid;
      flex: 0 0 18px;
      place-items: center;
      width: 18px;
      height: 18px;
      color: var(--muted);
    }

    .workspace-name {
      display: block;
      overflow: hidden;
      color: var(--text);
      font-weight: var(--font-weight-semibold);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workspace-caption {
      display: block;
      margin-top: var(--space-1);
      overflow: hidden;
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-search-wrap {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--control-compact);
      align-items: center;
      gap: var(--space-1);
      margin: var(--space-2) var(--space-3);
    }

    .sidebar-search-field {
      position: relative;
      min-width: 0;
    }

    .sidebar-search-field > .gn-input-field {
      width: 100%;
    }

    .sidebar-search-field > .gn-input-field > .gn-input {
      height: var(--control-compact);
      background: var(--surface);
      border-color: var(--border-soft);
    }

    .sidebar-search-field > .gn-input-field > .gn-input .gn-input__leading {
      margin-left: var(--space-2);
    }

    .sidebar-search-field > .gn-input-field > .gn-input .gn-input__control {
      font-size: var(--font-size-body);
    }

    .sidebar-search-icon {
      position: absolute;
      top: 50%;
      left: var(--space-2);
      display: grid;
      place-items: center;
      width: var(--icon-small);
      height: var(--icon-small);
      color: var(--muted);
      pointer-events: none;
      transform: translateY(-50%);
    }

    .sidebar-search-icon > .icon {
      width: 100%;
      height: 100%;
    }

    .sidebar-search {
      width: 100%;
      height: var(--control-compact);
      padding:
        0
        var(--space-2)
        0
        var(--space-6);
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .sidebar-search::placeholder {
      color: var(--muted);
    }

    .sidebar-search:focus {
      border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
    }

    .sidebar-search:focus-visible {
      outline: none;
    }

    .sidebar-repository-menu-wrap {
      position: relative;
    }

    .sidebar-repository-menu-trigger {
      display: grid;
      place-items: center;
      width: var(--control-compact);
      height: var(--control-compact);
      padding: 0;
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .sidebar-repository-menu-trigger {
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border-soft);
    }

    .sidebar-repository-menu-trigger:hover,
    .sidebar-repository-menu-trigger[aria-expanded="true"] {
      color: var(--text);
      background: var(--surface-hover);
    }

    .sidebar-repository-menu-trigger:hover,
    .sidebar-repository-menu-trigger[aria-expanded="true"] {
      border-color: var(--border);
    }

    .sidebar-repository-menu[hidden] {
      display: none;
    }

    .repository-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0 var(--space-2) var(--space-3);
    }

    .workspace-root {
      min-width: 0;
    }

    .workspace-root + .workspace-root {
      margin-top: var(--space-3);
      padding-top: var(--space-3);
      border-top: 1px solid var(--border-soft);
    }

    .workspace-root-heading {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) 18px;
      align-items: center;
      gap: var(--space-2);
      width: 100%;
      min-width: 0;
      padding: var(--space-2);
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .workspace-root-toggle {
      display: grid;
      place-items: center;
      width: 18px;
      height: 28px;
      color: var(--muted);
    }

    .workspace-root-heading:hover {
      background: var(--surface-hover);
    }

    .workspace-root.selected .workspace-root-heading {
      background: var(--accent-soft);
      box-shadow: inset 2px 0 0 var(--accent);
    }

    .workspace-root-icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: var(--radius-regular);
    }

    .workspace-root-copy {
      display: block;
      min-width: 0;
    }

    .workspace-root-copy strong,
    .workspace-root-copy span,
    .workspace-root-copy small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workspace-root-copy strong {
      color: var(--text);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-semibold);
    }

    .workspace-root-copy span {
      color: var(--accent);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .workspace-root-copy small {
      margin-top: calc(var(--space-1) / 2);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
    }

    .workspace-root-body {
      display: grid;
      grid-template-rows: 1fr;
      min-height: 0;
      overflow: hidden;
      opacity: 1;
      transition:
        grid-template-rows var(--motion-layer) var(--ease-enter),
        opacity var(--motion-micro) var(--ease-enter);
    }

    .workspace-root-body-inner {
      min-height: 0;
      overflow: hidden;
    }

    .workspace-root.collapsed .workspace-root-body {
      grid-template-rows: 0fr;
      opacity: 0;
      pointer-events: none;
    }

    .repo-group {
      margin-top: var(--space-1);
    }

    .group-header {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      width: 100%;
      min-height: var(--control-compact);
      padding: 0 var(--space-2);
      color: var(--muted);
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: var(--radius-regular);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
      transition:
        color var(--motion-micro) var(--ease-enter),
        background-color var(--motion-micro) var(--ease-enter);
    }

    .group-header[draggable="true"] {
      cursor: grab;
    }

    .group-header[draggable="true"]:active,
    .group-header.dragging {
      cursor: grabbing;
    }

    .group-header.dragging {
      opacity: 0.56;
    }

    .group-header.drag-over-before {
      box-shadow: inset 0 2px 0 var(--accent);
    }

    .group-header.drag-over-after {
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .group-header:hover {
      color: var(--text-soft);
      background: var(--surface-hover);
    }

    .group-header .icon {
      width: 13px;
      height: 13px;
      transform: rotate(0deg);
      transition: transform var(--motion-micro) var(--ease-enter);
    }

    .repo-group.collapsed .group-header .icon {
      transform: rotate(-90deg);
    }

    .repo-group-body {
      display: grid;
      grid-template-rows: 1fr;
      opacity: 1;
      transition:
        grid-template-rows var(--motion-layer) var(--ease-enter),
        opacity var(--motion-micro) var(--ease-enter);
    }

    .repo-group-inner {
      min-height: 0;
      overflow: hidden;
    }

    .repo-group:not(.collapsed) .repo-group-inner {
      overflow: visible;
    }

    .repo-group-empty {
      display: flex;
      align-items: center;
      min-height: var(--control-compact);
      padding: 0 var(--space-2);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .repo-group-body {
      position: relative;
      margin-left: var(--space-2);
      padding-left: var(--space-1);
    }

    .repo-group-body::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: var(--space-1);
      left: 0;
      width: 1px;
      background: var(--border-soft);
    }

    .repo-group.collapsed .repo-group-body {
      grid-template-rows: 0fr;
      opacity: 0;
      pointer-events: none;
    }

    .group-count {
      min-width: 20px;
      height: 18px;
      padding: 0 var(--space-1);
      color: var(--muted);
      background: var(--surface-3);
      border-radius: 999px;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      line-height: 18px;
      text-align: center;
    }

    .repo-row {
      position: relative;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-1);
      width: 100%;
      min-height: 48px;
      padding: var(--space-1) 4px;
      color: inherit;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .repo-row:hover {
      background: var(--surface-hover);
    }

    .repo-row.active {
      background: var(--accent-soft);
    }

    .repo-row.active::before {
      content: "";
      position: absolute;
      left: calc(-1 * var(--space-1));
      width: 3px;
      height: var(--space-6);
      border-radius: 0 var(--radius-small) var(--radius-small) 0;
      background: var(--accent);
    }

    .repo-icon {
      position: relative;
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      color: var(--text-soft);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-regular);
    }

    .repo-icon .icon {
      width: 14px;
      height: 14px;
    }

    .repo-icon.clean::after,
    .repo-icon.dirty::after,
    .repo-icon.conflict::after,
    .repo-icon.behind::after {
      content: "";
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 7px;
      height: 7px;
      border: 2px solid var(--sidebar);
      border-radius: 50%;
    }

    .repo-icon.clean::after { background: var(--green); }
    .repo-icon.dirty::after { background: var(--yellow); }
    .repo-icon.conflict::after { background: var(--red); }
    .repo-icon.behind::after { background: var(--blue); }

    .repo-main {
      min-width: 0;
    }

    .repo-name {
      overflow: hidden;
      color: var(--text-soft);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-medium);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .repo-row.active .repo-name,
    .repo-row:hover .repo-name {
      color: var(--text);
    }

    .repo-branch {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      min-width: 0;
      margin-top: calc(var(--space-1) / 2);
      color: var(--muted);
      font-size: var(--font-size-caption);
      line-height: 1;
    }

    .repo-branch > .icon {
      display: block;
      flex: 0 0 auto;
      width: 11px;
      height: 11px;
    }

    .repo-branch > span {
      display: block;
      line-height: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .repo-status {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-1);
      min-width: 0;
      padding-left: var(--space-1);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      white-space: nowrap;
    }

    .repo-status.dirty { color: var(--yellow); }
    .repo-status.conflict { color: var(--red); }
    .repo-status.behind { color: var(--blue); }
    .repo-status.ahead { color: var(--green); }
    .repo-status.clean { color: var(--muted); }

    .workspace-context-menu {
      position: fixed;
    }

    .workspace-context-open-in {
      position: relative;
      min-width: 0;
    }

    .workspace-context-open-in:hover
      .workspace-context-open-in-trigger,
    .workspace-context-open-in.submenu-open
      .workspace-context-open-in-trigger {
      color: var(--text);
      background: var(--surface-hover);
    }

    .workspace-context-open-in-submenu {
      display: none;
    }

    .workspace-context-open-in:hover
      .workspace-context-open-in-submenu,
    .workspace-context-open-in.submenu-open
      .workspace-context-open-in-submenu,
    .workspace-context-open-in:focus-within
      .workspace-context-open-in-submenu {
      display: grid;
    }

    .sidebar-footer {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-height: var(--control-large);
      padding: var(--space-2) var(--space-3);
      border-top: 1px solid var(--border-soft);
    }

    .sidebar-add-directory {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      height: var(--control-compact);
      line-height: 1;
      color: var(--text-soft);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .sidebar-add-directory > span:first-child {
      display: grid;
      place-items: center;
      line-height: 0;
    }

    .sidebar-add-directory > span:last-child {
      line-height: 1;
    }

    .sidebar-add-directory:hover {
      color: var(--text);
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: var(--control-compact);
      height: var(--control-compact);
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .icon-button:hover {
      color: var(--text);
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .toolbar-menu {
      position: relative;
      height: var(--control-compact);
    }

    .toolbar-menu > summary {
      list-style: none;
    }

    .toolbar-menu > summary::-webkit-details-marker {
      display: none;
    }

    .toolbar-menu:not([open]) .toolbar-menu-popover {
      display: none;
    }

    .toolbar-menu[open] > summary {
      color: var(--text);
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .workbench {
      display: grid;
      grid-template-rows: 58px var(--control-default) minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      background: var(--canvas);
    }

    .workbench.operations-view {
      grid-template-rows: minmax(0, 1fr);
    }

    .workbench.operations-view .commandbar,
    .workbench.operations-view .context-tabs {
      display: none;
    }

    .commandbar {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-width: 0;
      padding: 0 var(--space-4);
      background: var(--surface);
      border-bottom: 1px solid var(--border-soft);
    }

    .context-identity {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      gap: var(--space-3);
      min-width: 0;
      margin-right: var(--space-1);
      overflow: hidden;
    }

    .context-identity > span:last-child {
      min-width: 0;
    }

    .context-icon {
      display: grid;
      flex: 0 0 var(--control-default);
      place-items: center;
      width: var(--control-default);
      height: var(--control-default);
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
      border-radius: var(--radius-regular);
    }

    .context-title {
      overflow: hidden;
      max-width: 270px;
      color: var(--text);
      font-size: var(--font-size-emphasis);
      font-weight: var(--font-weight-semibold);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .context-subtitle {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .context-subtitle > span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .context-subtitle .icon {
      width: 11px;
      height: 11px;
    }

    .toolbar-divider {
      flex: 0 0 1px;
      width: 1px;
      height: var(--space-5);
      margin: 0 var(--space-1);
      background: var(--border);
    }

    .branch-selector {
      display: flex;
      flex: 0 1 auto;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      height: var(--control-compact);
      max-width: 210px;
      padding: 0 var(--space-3);
      color: var(--text-soft);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-regular);
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
    }

    .branch-selector:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .branch-selector span {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
      white-space: nowrap;
    }

    .branch-selector > .icon:last-child {
      flex: 0 0 auto;
      margin-left: auto;
    }

    .open-in-control {
      position: relative;
      display: inline-flex;
      flex: 0 0 auto;
      align-items: stretch;
      height: var(--control-compact);
    }

    .open-in-primary,
    .open-in-menu-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: var(--control-compact);
      color: var(--text-soft);
      background: var(--surface-2);
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .open-in-primary {
      width: var(--control-compact);
      min-width: var(--control-compact);
      padding: 0;
      border-radius: var(--radius-regular) 0 0 var(--radius-regular);
      font-size: var(--font-size-caption);
      white-space: nowrap;
    }

    .open-in-menu-trigger {
      width: 20px;
      min-width: 20px;
      flex: 0 0 20px;
      padding: 0;
      margin-left: -1px;
      border-left-color: var(--border-soft);
      border-radius: 0 var(--radius-regular) var(--radius-regular) 0;
    }

    .open-in-label {
      display: none;
    }

    .open-in-primary:hover {
      z-index: 1;
      color: var(--text);
      background: var(--surface-hover);
      border-color: var(--border-strong);
    }

    .open-in-menu-trigger[aria-expanded="true"] .icon {
      transform: rotate(180deg);
    }

    .open-in-menu[hidden] {
      display: none;
    }

    .open-in-app-icon {
      display: block;
      flex: 0 0 18px;
      width: 18px;
      height: 18px;
      object-fit: contain;
    }

    .toolbar-actions-group {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-3);
      min-width: 0;
      margin-left: auto;
    }

    .toolbar-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-1);
      min-width: 0;
    }

    .toolbar-button {
      position: relative;
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-2);
      height: var(--control-compact);
      padding: 0 var(--space-3);
      color: var(--text-soft);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-regular);
      cursor: pointer;
      white-space: nowrap;
    }

    .toolbar-button:hover {
      color: var(--text);
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .toolbar-button.primary {
      color: color-mix(in srgb, var(--accent) 84%, white);
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 28%, transparent);
    }

    .toolbar-count {
      display: grid;
      place-items: center;
      min-width: var(--icon-regular);
      height: var(--icon-regular);
      padding: 0 var(--space-1);
      color: var(--blue);
      background: var(--blue-soft);
      border-radius: 999px;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      line-height: 1;
    }

    .context-tabs {
      display: flex;
      align-items: end;
      gap: var(--space-1);
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0 var(--space-4);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }

    .context-tabs::-webkit-scrollbar {
      display: none;
    }

    .context-tab {
      position: relative;
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-2);
      height: var(--control-default);
      padding: 0 var(--space-4);
      color: var(--muted);
      background: transparent;
      border: 0;
      cursor: pointer;
      font-size: var(--font-size-caption);
      white-space: nowrap;
    }

    .context-tab:hover {
      color: var(--text-soft);
    }

    .context-tab.active {
      color: var(--text);
      font-weight: var(--font-weight-semibold);
    }

    .context-tab.active::after {
      content: "";
      position: absolute;
      right: var(--space-3);
      bottom: -1px;
      left: var(--space-3);
      height: 2px;
      border-radius: 2px 2px 0 0;
      background: var(--accent);
    }

    .tab-count {
      display: grid;
      place-items: center;
      min-width: var(--icon-regular);
      height: var(--icon-regular);
      padding: 0 var(--space-1);
      color: var(--muted);
      background: var(--surface-3);
      border-radius: 999px;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      line-height: 1;
    }

    .context-tab.active .tab-count {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .content-frame {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(300px, 27vw, 380px);
      min-width: 0;
      min-height: 0;
    }

    body:not(.inspector-open) .content-frame {
      grid-template-columns: minmax(0, 1fr);
    }

    body:not(.inspector-open) .inspector {
      display: none;
    }

    .inspector-backdrop {
      display: none !important;
      border: 0;
    }

    .main-content {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 0%, color-mix(in srgb, var(--accent) 4%, transparent), transparent 28%),
        var(--canvas);
    }

    .page-scroll {
      height: 100%;
      overflow: auto;
      overscroll-behavior: contain;
      padding: var(--page-safe-margin);
    }

    .page-scroll > * {
      width: 100%;
    }

    .page-scroll.repository-page-changes {
      padding: 0;
    }

    .inspector {
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--surface);
      border-left: 1px solid var(--border);
    }

    .page-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-5);
      margin-bottom: var(--space-5);
    }

    .page-heading > :first-child {
      min-width: 0;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
      color: var(--accent);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
    }

    .page-title {
      margin: 0;
      color: var(--text);
      font-size: var(--font-size-title);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-title);
      letter-spacing: -0.02em;
    }

    .page-description {
      max-width: 650px;
      margin: var(--space-2) 0 0;
      color: var(--muted);
      line-height: var(--line-height-body);
    }

    .settings-page-scroll {
      padding-top: var(--space-6);
      padding-bottom: var(--space-7);
    }

    .settings-page {
      max-width: 1100px;
      margin-right: auto;
      margin-left: auto;
    }

    .settings-page .page-heading {
      align-items: center;
      margin-bottom: var(--space-6);
    }

    .settings-page .page-actions {
      margin-left: auto;
      justify-content: flex-end;
    }

    .settings-layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: var(--space-5);
      align-items: start;
    }

    .settings-nav {
      position: sticky;
      top: var(--space-4);
      padding: var(--space-2);
    }

    .settings-nav-label {
      padding: var(--space-2) var(--space-3);
      color: var(--muted);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .settings-nav-divider {
      height: 1px;
      margin: var(--space-2) var(--space-3);
      background: var(--border-soft);
    }

    .settings-nav-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      width: 100%;
      min-height: 48px;
      padding: var(--space-2) var(--space-3);
      color: var(--muted);
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .settings-nav-item:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .settings-nav-item.active {
      color: var(--text);
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 22%, transparent);
    }

    .settings-nav-item > .icon {
      flex: 0 0 auto;
      color: var(--muted);
    }

    .settings-nav-item.active > .icon {
      color: var(--accent);
    }

    .settings-nav-item-copy {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .settings-nav-item-title {
      color: inherit;
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-medium);
    }

    .settings-nav-item-subtitle {
      overflow: hidden;
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .settings-content {
      display: grid;
      gap: var(--space-4);
      min-width: 0;
    }

    .settings-section-heading {
      margin-bottom: var(--space-1);
    }

    .settings-section-kicker {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
      color: var(--accent);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
    }

    .settings-section-title {
      margin: 0;
      color: var(--text);
      font-size: var(--font-size-section);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-title);
    }

    .settings-section-description {
      max-width: 660px;
      margin: var(--space-2) 0 0;
      color: var(--muted);
      line-height: var(--line-height-body);
    }

    .settings-card {
      overflow: hidden;
    }

    .settings-card-header {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-4);
      border-bottom: 1px solid var(--border-soft);
    }

    .settings-card-title {
      color: var(--text);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-semibold);
    }

    .settings-card-description {
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .settings-card-header > .status-pill {
      margin-left: auto;
    }

    .settings-card-header > .settings-switch {
      flex: 0 0 auto;
      margin-left: auto;
    }

    .settings-card-body {
      padding: 0 var(--space-4);
    }

    .settings-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      background: var(--surface-2);
      border-top: 1px solid var(--border-soft);
    }

    .settings-card-footer-copy {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .settings-setting-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-4);
      min-height: 72px;
      padding: var(--space-3) 0;
      border-bottom: 1px solid var(--border-soft);
    }

    .settings-setting-row:last-child {
      border-bottom: 0;
    }

    .settings-setting-title {
      color: var(--text-soft);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-medium);
    }

    .settings-setting-description {
      max-width: 620px;
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .settings-switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 42px;
      height: 24px;
      padding: 2px;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
    }

    .settings-switch.active {
      justify-content: flex-end;
      background: var(--accent);
      border-color: var(--accent);
    }

    .settings-switch-thumb {
      display: block;
      width: 18px;
      height: 18px;
      background: var(--text-soft);
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.24);
    }

    .settings-switch.active .settings-switch-thumb {
      background: #071411;
    }

    html[data-theme="light"] .settings-switch.active .settings-switch-thumb {
      background: #fff;
    }

    .settings-info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-3);
      padding: var(--space-4) 0;
    }

    .settings-info-item {
      display: grid;
      gap: var(--space-1);
      min-width: 0;
      padding: var(--space-3);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .settings-info-label {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .settings-info-value {
      overflow: hidden;
      color: var(--text-soft);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .settings-preference-list {
      padding: var(--space-3) 0 var(--space-4);
    }

    .settings-tool-select {
      display: grid;
      gap: var(--space-1);
      max-width: 360px;
      padding: var(--space-4) 0;
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .settings-tool-menu {
      position: relative;
      width: 100%;
    }

    .settings-tool-menu > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      width: 100%;
      min-height: var(--control-default);
      padding: 0 var(--space-3);
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-regular);
      cursor: pointer;
      list-style: none;
    }

    .settings-tool-menu > summary::-webkit-details-marker {
      display: none;
    }

    .settings-tool-menu > summary:hover,
    .settings-tool-menu[open] > summary {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .settings-tool-menu-trigger-value {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
    }

    .settings-tool-menu-trigger-value > span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .settings-tool-menu-surface {
      display: grid;
      gap: var(--space-1);
      width: min(360px, calc(100vw - var(--space-6)));
      max-width: 360px;
      max-height: 260px;
      overflow: auto;
    }

    .settings-tool-menu .menu-item.is-selected {
      color: var(--text);
      background: var(--accent-soft);
    }

    .settings-ai-field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-3);
      padding: var(--space-4) 0 var(--space-3);
    }

    .settings-ai-field,
    .settings-ai-prompt {
      display: grid;
      gap: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .settings-ai-field input {
      width: 100%;
      min-width: 0;
      min-height: var(--control-default);
      padding: var(--space-2) var(--space-3);
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .settings-ai-field select {
      width: 100%;
      min-width: 0;
      min-height: var(--control-default);
      padding: 0 var(--space-3);
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .settings-ai-field-grid.single {
      grid-template-columns: minmax(0, 1fr);
      padding-top: 0;
    }

    .settings-ai-field input:hover,
    .settings-ai-field select:hover {
      border-color: var(--border);
    }

    .settings-ai-field input:focus,
    .settings-ai-field select:focus {
      border-color: var(--accent);
    }

    .settings-ai-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding-top: var(--space-3);
    }

    .settings-ai-actions-copy {
      min-width: 0;
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .settings-ai-actions-buttons {
      display: flex;
      flex: 0 0 auto;
      gap: var(--space-2);
    }

    .settings-ai-actions-buttons .gn-button {
      width: 120px;
      min-width: 120px;
    }

    .settings-account-preview {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-4) 0;
    }

    .settings-account-preview > div:first-child {
      display: grid;
      gap: var(--space-1);
      min-width: 0;
    }

    .settings-account-preview strong {
      color: var(--text);
    }

    .settings-account-preview span {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .settings-account-actions {
      display: flex;
      flex: 0 0 auto;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: var(--space-2);
    }

    .settings-option-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-3);
      padding: var(--space-4) 0;
    }

    .settings-option-grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .settings-option {
      display: grid;
      gap: var(--space-2);
      min-width: 0;
      padding: var(--space-3);
      color: var(--text-soft);
      text-align: left;
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .settings-option:hover {
      color: var(--text);
      border-color: var(--border);
    }

    .settings-option.active {
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 48%, var(--border));
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 16%, transparent);
    }

    .settings-option-head {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .settings-option-icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      color: var(--muted);
      background: var(--surface-3);
      border-radius: var(--radius-regular);
    }

    .settings-option.active .settings-option-icon {
      color: var(--accent);
      background: var(--surface);
    }

    .settings-option-title {
      color: inherit;
      font-weight: var(--font-weight-semibold);
    }

    .settings-option-description {
      color: var(--muted);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .settings-inline-note {
      display: flex;
      align-items: flex-start;
      gap: var(--space-2);
      padding: var(--space-3);
      color: var(--muted);
      background: var(--surface-2);
      border-radius: var(--radius-regular);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .settings-inline-note .icon {
      flex: 0 0 auto;
      color: var(--blue);
    }

    .settings-shortcut-list {
      padding: 0 var(--space-4);
    }

    .settings-shortcut-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-4);
      min-height: 58px;
      border-bottom: 1px solid var(--border-soft);
    }

    .settings-shortcut-row:last-child {
      border-bottom: 0;
    }

    .settings-shortcut-title {
      color: var(--text-soft);
      font-weight: var(--font-weight-medium);
    }

    .settings-shortcut-description {
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .settings-shortcut-keys {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: var(--space-1);
    }

    .settings-key {
      min-width: 28px;
      padding: 3px var(--space-2);
      color: var(--text-soft);
      text-align: center;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-bottom-color: color-mix(in srgb, var(--border) 72%, #000);
      border-radius: var(--radius-small);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
    }

    .workbench.settings-view {
      grid-template-rows: minmax(0, 1fr);
    }

    .workbench.settings-view .commandbar,
    .workbench.settings-view .context-tabs,
    .workbench.settings-view .inspector {
      display: none;
    }

    .workbench.settings-view .content-frame {
      grid-template-columns: minmax(0, 1fr);
    }

    .page-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: var(--space-2);
      flex: 0 0 auto;
    }

    .button {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      height: var(--control-default);
      padding: 0 var(--space-4);
      color: var(--text-soft);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-regular);
      cursor: pointer;
      line-height: 1;
      white-space: nowrap;
    }

    .button:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .button.primary {
      color: #071411;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: var(--font-weight-semibold);
    }

    html[data-theme="light"] .button.primary {
      color: white;
    }

    .button.primary:hover {
      background: color-mix(in srgb, var(--accent) 88%, white);
    }

    html[data-theme="light"] .button.primary:hover {
      background: color-mix(in srgb, var(--accent) 88%, black);
    }

    .button.danger {
      color: var(--red);
      background: var(--red-soft);
      border-color: color-mix(in srgb, var(--red) 28%, transparent);
    }

    .button.small {
      height: var(--control-compact);
      padding: 0 var(--space-3);
      font-size: var(--font-size-caption);
    }

    .button.large {
      height: var(--control-large);
      padding: 0 var(--space-5);
      font-size: var(--font-size-emphasis);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(145px, 1fr));
      gap: var(--space-3);
      margin-bottom: var(--space-5);
    }

    .metric-card {
      position: relative;
      min-height: 104px;
      overflow: hidden;
      padding: var(--space-4);
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-large);
    }

    .metric-card::after {
      content: "";
      position: absolute;
      top: var(--space-3);
      bottom: var(--space-3);
      left: 0;
      width: var(--space-1);
      border-radius: 0 var(--radius-small) var(--radius-small) 0;
      background: var(--metric-color, var(--accent));
      opacity: 0.74;
    }

    .metric-label {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
    }

    .metric-icon {
      display: grid;
      place-items: center;
      width: var(--control-compact);
      height: var(--control-compact);
      color: var(--metric-color, var(--accent));
      background: var(--metric-bg, var(--accent-soft));
      border-radius: var(--radius-regular);
    }

    .metric-value {
      position: relative;
      z-index: 1;
      margin-top: var(--space-2);
      color: var(--text);
      font-size: var(--font-size-title);
      font-weight: var(--font-weight-semibold);
      letter-spacing: -0.04em;
    }

    .metric-foot {
      position: relative;
      z-index: 1;
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.36fr) minmax(270px, 0.64fr);
      gap: var(--space-4);
      align-items: start;
    }

    .repository-dashboard {
      grid-template-columns: minmax(0, 1fr);
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-large);
    }

    .panel + .panel {
      margin-top: var(--space-4);
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-height: var(--control-large);
      padding: 0 var(--space-4);
      border-bottom: 1px solid var(--border-soft);
    }

    .panel-header-toggle {
      width: 100%;
      color: inherit;
      background: transparent;
      cursor: pointer;
      text-align: left;
      user-select: none;
    }

    .panel-header-toggle:hover {
      background: var(--surface-hover);
    }

    .panel-header-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .panel-collapse-indicator {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      margin-left: auto;
      color: var(--muted);
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      color: var(--text);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-semibold);
    }

    .panel-title .icon {
      color: var(--muted);
    }

    .panel-caption {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .panel-action {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-1);
      min-height: var(--control-compact);
      padding: 0 var(--space-2);
      margin-right: calc(-1 * var(--space-2));
      margin-left: auto;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: var(--radius-regular);
      font-size: var(--font-size-caption);
      cursor: pointer;
      white-space: nowrap;
    }

    .panel-action:hover {
      color: var(--accent);
      background: var(--surface-hover);
    }

    .data-page {
      height: 100%;
      overflow: auto;
      background: var(--surface);
    }

    .sticky-panel-header {
      position: sticky;
      top: 0;
      z-index: var(--z-navigation);
      background: var(--surface);
    }

    .panel-header-action {
      margin-left: auto;
    }

    /* 筛选输入框与右侧操作按钮作为一组靠右排列 */
    .history-filter-input + .panel-header-action {
      margin-left: 0;
    }

    .history-filter-input {
      flex: 0 1 220px;
      width: 220px;
      min-width: 120px;
      height: var(--control-compact);
      margin-left: auto;
      padding: 0 var(--space-2);
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
      font-size: var(--font-size-caption);
    }

    .history-filter-input:focus {
      border-color: var(--accent);
    }

    .history-filter-empty {
      display: grid;
      justify-items: center;
      gap: var(--space-1);
      min-height: 150px;
      padding: var(--space-5) var(--space-3);
      color: var(--muted);
      text-align: center;
    }

    .history-filter-empty .icon,
    .history-filter-empty strong {
      color: var(--accent);
    }

    .button.block {
      width: 100%;
    }

    .push-right {
      margin-left: auto;
    }

    .text-success {
      color: var(--green);
    }

    .text-warning {
      color: var(--yellow);
    }

    .text-danger {
      color: var(--red);
    }

    .status-pill {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-1);
      height: 24px;
      padding: 0 var(--space-2);
      border-radius: 999px;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      white-space: nowrap;
    }

    .status-pill.yellow {
      color: var(--yellow);
      background: var(--yellow-soft);
    }

    .status-pill.red {
      color: var(--red);
      background: var(--red-soft);
    }

    .status-pill.blue {
      color: var(--blue);
      background: var(--blue-soft);
    }

    .status-pill.green {
      color: var(--green);
      background: var(--green-soft);
    }

    .status-pill.neutral {
      color: var(--muted);
      background: var(--surface-3);
    }

    .status-pill .icon {
      width: 12px;
      height: 12px;
    }

    .repo-table {
      display: block;
      width: 100%;
      min-width: 0;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .repo-table thead,
    .repo-table tbody {
      display: block;
      width: 100%;
    }

    .repo-table tr {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr)
        clamp(90px, 16%, 120px)
        clamp(90px, 16%, 120px);
      align-items: center;
      width: 100%;
    }

    .repo-table th,
    .repo-table td {
      display: flex;
      align-items: center;
      height: var(--control-large);
      width: auto;
      min-width: 0;
      overflow: hidden;
      padding: 0 var(--space-3);
      border-bottom: 1px solid var(--border-soft);
      text-align: left;
      white-space: nowrap;
    }

    .repo-table th {
      height: var(--control-default);
      color: var(--muted);
      background: var(--surface-2);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
    }

    .repo-table tr:last-child td {
      border-bottom: 0;
    }

    .repo-table tbody tr:hover {
      background: var(--surface-hover);
    }

    .table-repo {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      width: 100%;
      min-height: var(--control-compact);
      min-width: 0;
      padding: 0;
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .table-repo .repo-icon {
      width: var(--icon-large);
      height: var(--icon-large);
      flex: 0 0 auto;
    }

    .table-repo-name {
      display: block;
      min-width: 0;
      overflow: hidden;
      color: var(--text-soft);
      font-weight: var(--font-weight-medium);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .table-repo-copy {
      display: block;
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
    }

    .table-repo-path {
      display: block;
      min-width: 0;
      overflow: hidden;
      margin-top: 1px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .branch-text,
    .sync-text {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      width: 100%;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .branch-text .icon,
    .sync-text .icon {
      flex: 0 0 auto;
      width: 12px;
      height: 12px;
    }

    .table-cell-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mini-counts {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
    }

    .mini-count {
      min-width: 25px;
      overflow: hidden;
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-small);
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .mini-count.changed {
      color: var(--yellow);
      background: var(--yellow-soft);
    }

    .mini-count.conflicted {
      color: var(--red);
      background: var(--red-soft);
    }

    .mini-count.clean {
      color: var(--green);
      background: var(--green-soft);
    }

    .activity-list {
      padding: var(--space-1) var(--space-4) var(--space-3);
    }

    .activity-item {
      position: relative;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      gap: var(--space-2);
      min-height: 56px;
      padding: var(--space-2) 0;
    }

    .activity-item:not(:last-child)::after {
      content: "";
      position: absolute;
      top: 33px;
      bottom: -9px;
      left: 11px;
      width: 1px;
      background: var(--border);
    }

    .activity-dot {
      z-index: 1;
      display: grid;
      place-items: center;
      width: 23px;
      height: 23px;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 50%;
    }

    .activity-dot .icon {
      width: 12px;
      height: 12px;
    }

    .activity-title {
      color: var(--text-soft);
      line-height: 1.35;
    }

    .activity-title strong {
      color: var(--text);
    }

    .activity-sub {
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .activity-time {
      padding-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .repo-hero {
      position: relative;
      display: grid;
      grid-template-columns: var(--control-large) minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-4);
      min-height: 112px;
      overflow: hidden;
      margin-bottom: var(--space-4);
      padding: var(--space-4);
      background:
        linear-gradient(112deg, color-mix(in srgb, var(--accent) 8%, var(--surface)), var(--surface) 58%),
        var(--surface);
      border: 1px solid color-mix(in srgb, var(--accent) 17%, var(--border-soft));
      border-radius: var(--radius-large);
    }

    .repo-hero::after {
      content: none;
    }

    .repo-hero-icon {
      z-index: 1;
      display: grid;
      place-items: center;
      width: var(--control-large);
      height: var(--control-large);
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent);
      border-radius: var(--radius-large);
    }

    .repo-hero-icon .icon {
      width: var(--icon-large);
      height: var(--icon-large);
    }

    .repo-hero-copy {
      z-index: 1;
      min-width: 0;
    }

    .repo-hero-title {
      color: var(--text);
      font-size: var(--font-size-section);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-title);
    }

    .repo-hero-path {
      overflow: hidden;
      max-width: 640px;
      margin-top: var(--space-1);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .repo-hero-status {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-2);
    }

    .repo-hero-actions {
      z-index: 1;
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      align-items: stretch;
      gap: var(--space-2);
      min-width: 112px;
      white-space: nowrap;
    }

    .repo-hero-actions .gn-button {
      width: 100%;
      min-width: 0;
      height: var(--control-compact);
      padding: 0 var(--space-2);
      font-size: var(--font-size-caption);
    }

    .commit-list {
      padding: var(--space-1) 0;
    }

    .commit-row {
      display: grid;
      grid-template-columns:
        var(--control-large)
        minmax(0, 1fr)
        136px
        100px
        88px;
      align-items: center;
      width: 100%;
      min-height: 64px;
      padding: 0 var(--space-3) 0 var(--space-1);
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
    }

    .commit-row:last-child {
      border-bottom: 0;
    }

    .commit-row:hover,
    .commit-row.selected {
      background: var(--surface-hover);
    }

    .commit-row.selected {
      box-shadow: 2px 0 0 var(--accent) inset;
    }

    .commit-graph {
      position: relative;
      align-self: stretch;
      min-height: 64px;
    }

    .commit-graph::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 23px;
      width: 2px;
      background: var(--lane-color, var(--accent));
      opacity: 0.56;
    }

    .commit-graph.branch::after {
      content: "";
      position: absolute;
      top: 28px;
      left: 24px;
      width: 20px;
      height: 17px;
      border-top: 2px solid var(--purple);
      border-right: 2px solid var(--purple);
      border-radius: 0 12px 0 0;
      transform: translateY(-17px);
      opacity: 0.62;
    }

    .commit-node {
      position: absolute;
      top: 50%;
      left: 18px;
      width: 12px;
      height: 12px;
      transform: translateY(-50%);
      background: var(--surface);
      border: 3px solid var(--lane-color, var(--accent));
      border-radius: 50%;
      z-index: 2;
    }

    .commit-row:hover .commit-node,
    .commit-row.selected .commit-node {
      background: var(--surface-hover);
    }

    .commit-message {
      min-width: 0;
      padding-right: var(--space-3);
    }

    .commit-subject {
      overflow: hidden;
      color: var(--text-soft);
      font-weight: var(--font-weight-medium);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .commit-meta {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .ref-label {
      display: inline-flex;
      align-items: center;
      height: var(--space-5);
      padding: 0 var(--space-2);
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
      border-radius: 999px;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .ref-label.remote {
      color: var(--blue);
      background: var(--blue-soft);
      border-color: color-mix(in srgb, var(--blue) 20%, transparent);
    }

    .commit-author {
      overflow: hidden;
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .commit-time,
    .commit-id,
    .commit-hash {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .commit-id {
      overflow: hidden;
      font-family: var(--font-mono);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .commit-id[role="button"] {
      cursor: copy;
    }

    .commit-id[role="button"]:hover,
    .commit-id[role="button"]:focus-visible {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .commit-hash {
      font-family: var(--font-mono);
    }

    .branch-health-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-2);
      padding: var(--space-3);
    }

    .branch-health-item {
      padding: var(--space-3);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .branch-health-label {
      color: var(--muted);
      font-size: var(--font-size-caption);
      letter-spacing: 0.03em;
    }

    .branch-health-value {
      overflow: hidden;
      margin-top: var(--space-2);
      color: var(--text);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-semibold);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .changes-layout {
      display: grid;
      grid-template-columns: clamp(240px, 26%, 300px) minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      height: 100%;
      max-height: none;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-large);
    }

    .changes-page {
      height: 100%;
      min-width: 0;
      min-height: 0;
    }

    .changes-file-pane {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
      border-right: 1px solid var(--border);
    }

    .file-pane-header,
    .diff-header {
      display: flex;
      align-items: center;
      min-height: var(--control-large);
      padding: 0 var(--space-3);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .file-pane-header {
      justify-content: space-between;
      gap: var(--space-2);
    }

    .file-pane-tools {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-1);
      min-width: 0;
    }

    .file-pane-header strong {
      flex: 0 0 4em;
      min-width: 4em;
      overflow: hidden;
      color: var(--text);
      font-size: var(--font-size-caption);
      line-height: 1;
      white-space: nowrap;
    }

    .change-filter-field {
      display: flex;
      flex: 0 0 112px;
      align-items: center;
      min-width: 0;
      width: 112px;
      height: var(--control-compact);
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .change-view-menu {
      flex: 0 0 var(--control-compact);
    }

.change-filter-field > input {
      flex: 1 1 auto;
      min-width: 0;
      width: 100%;
      height: 100%;
      padding: 0 var(--space-2);
      color: var(--text);
      font-size: var(--font-size-caption);
      background: transparent;
      border: 0;
    }

    .change-filter-field > input::placeholder {
      color: var(--muted);
    }

    .change-filter-field > input:focus-visible {
      outline-offset: -1px;
    }

    .change-filter-clear {
      display: grid;
      flex: 0 0 var(--control-compact);
      place-items: center;
      width: var(--control-compact);
      height: var(--control-compact);
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: var(--radius-small);
      cursor: pointer;
    }

    .change-filter-clear:hover {
      color: var(--text);
      background: transparent;
    }

    .change-filter-empty {
      display: grid;
      justify-items: center;
      gap: var(--space-1);
      min-height: 150px;
      padding: var(--space-5) var(--space-3);
      color: var(--muted);
      text-align: center;
    }

    .change-filter-empty .icon {
      color: var(--accent);
    }

    .change-filter-empty strong {
      color: var(--text);
    }

    .change-file-list {
      min-height: 0;
      overflow: auto;
      padding: 0;
    }

    .file-pane-title {
      color: var(--text-soft);
      font-weight: var(--font-weight-semibold);
    }

    .file-section-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      height: var(--control-compact);
      padding-right: var(--space-2);
      padding-left: var(--space-3);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border-soft);
    }

    .file-section-header:hover,
    .file-section-header:focus-within {
      background: var(--surface-hover);
    }

    .file-section-title {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      gap: var(--space-2);
      height: 100%;
      min-width: 0;
      padding: 0;
      color: var(--muted);
      text-align: left;
      background: transparent;
      border: 0;
      cursor: pointer;
