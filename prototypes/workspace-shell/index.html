      height: var(--icon-large);
    }

    .repo-hero-copy {
      z-index: 1;
      min-width: 0;
    }

    .repo-hero-title {
      color: var(--text);
      font-size: var(--font-size-section);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-title);
    }

    .repo-hero-path {
      overflow: hidden;
      max-width: 640px;
      margin-top: var(--space-1);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .repo-hero-status {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-2);
    }

    .repo-hero-actions {
      z-index: 1;
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      align-items: stretch;
      gap: var(--space-2);
      min-width: 112px;
      white-space: nowrap;
    }

    .repo-hero-actions .gn-button {
      width: 100%;
      min-width: 0;
      height: var(--control-compact);
      padding: 0 var(--space-2);
      font-size: var(--font-size-caption);
    }

    .commit-list {
      padding: var(--space-1) 0;
    }

    .commit-row {
      display: grid;
      grid-template-columns:
        var(--control-large)
        minmax(0, 1fr)
        136px
        100px
        88px;
      align-items: center;
      width: 100%;
      min-height: 64px;
      padding: 0 var(--space-3) 0 var(--space-1);
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
    }

    .commit-row:last-child {
      border-bottom: 0;
    }

    .commit-row:hover,
    .commit-row.selected {
      background: var(--surface-hover);
    }

    .commit-row.selected {
      box-shadow: 2px 0 0 var(--accent) inset;
    }

    .commit-graph {
      position: relative;
      align-self: stretch;
      min-height: 64px;
    }

    .commit-graph::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 23px;
      width: 2px;
      background: var(--lane-color, var(--accent));
      opacity: 0.56;
    }

    .commit-graph.branch::after {
      content: "";
      position: absolute;
      top: 28px;
      left: 24px;
      width: 20px;
      height: 17px;
      border-top: 2px solid var(--purple);
      border-right: 2px solid var(--purple);
      border-radius: 0 12px 0 0;
      transform: translateY(-17px);
      opacity: 0.62;
    }

    .commit-node {
      position: absolute;
      top: 50%;
      left: 18px;
      width: 12px;
      height: 12px;
      transform: translateY(-50%);
      background: var(--surface);
      border: 3px solid var(--lane-color, var(--accent));
      border-radius: 50%;
      z-index: 2;
    }

    .commit-row:hover .commit-node,
    .commit-row.selected .commit-node {
      background: var(--surface-hover);
    }

    .commit-message {
      min-width: 0;
      padding-right: var(--space-3);
    }

    .commit-subject {
      overflow: hidden;
      color: var(--text-soft);
      font-weight: var(--font-weight-medium);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .commit-meta {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .ref-label {
      display: inline-flex;
      align-items: center;
      height: var(--space-5);
      padding: 0 var(--space-2);
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
      border-radius: 999px;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .ref-label.remote {
      color: var(--blue);
      background: var(--blue-soft);
      border-color: color-mix(in srgb, var(--blue) 20%, transparent);
    }

    .ref-label.comparison-left {
      color: var(--purple);
      background: color-mix(in srgb, var(--purple) 13%, transparent);
      border-color: color-mix(in srgb, var(--purple) 30%, transparent);
    }

    .ref-label.comparison-right {
      color: var(--blue);
      background: var(--blue-soft);
      border-color: color-mix(in srgb, var(--blue) 30%, transparent);
    }

    .ref-label.comparison-base {
      color: var(--muted);
      background: var(--surface-3);
      border-color: var(--border);
    }

    .commit-row.comparison-base {
      border-top: 1px dashed var(--border);
    }

    .commit-author {
      overflow: hidden;
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .commit-time,
    .commit-id,
    .commit-hash {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .commit-id {
      overflow: hidden;
      font-family: var(--font-mono);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .commit-id[role="button"] {
      cursor: copy;
    }

    .commit-id[role="button"]:hover,
    .commit-id[role="button"]:focus-visible {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .commit-hash {
      font-family: var(--font-mono);
    }

    .branch-health-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-2);
      padding: var(--space-3);
    }

    .branch-health-item {
      padding: var(--space-3);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .branch-health-label {
      color: var(--muted);
      font-size: var(--font-size-caption);
      letter-spacing: 0.03em;
    }

    .branch-health-value {
      overflow: hidden;
      margin-top: var(--space-2);
      color: var(--text);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-semibold);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .changes-layout {
      display: grid;
      grid-template-columns: clamp(240px, 26%, 300px) minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      height: 100%;
      max-height: none;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-large);
    }

    .changes-page {
      height: 100%;
      min-width: 0;
      min-height: 0;
    }

    .changes-file-pane {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
      border-right: 1px solid var(--border);
    }

    .changes-sidebar-footer {
      min-width: 0;
      min-height: 0;
    }

    .repository-content-stack,
    .repository-diff-view,
    .repository-stash-view {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .repository-diff-view[hidden],
    .repository-stash-view[hidden] {
      display: none;
    }

    .repository-stash-view {
      display: grid;
      grid-template-columns: minmax(220px, 36%) minmax(0, 1fr);
      background: var(--surface);
    }

    .repository-stash-pane {
      display: grid;
      grid-template-rows: var(--control-large) minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .repository-stash-pane + .repository-stash-pane {
      grid-template-rows: auto 42px minmax(0, 1fr);
      border-left: 1px solid var(--border);
    }

    .repository-stash-pane > header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      min-width: 0;
      padding: 0 var(--space-3);
      border-bottom: 1px solid var(--border);
    }

    .repository-stash-pane > header strong {
      overflow: hidden;
      color: var(--text);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .repository-stash-pane > header > span,
    .repository-stash-count {
      min-width: 20px;
      padding: 2px var(--space-1);
      color: var(--muted);
      background: var(--surface-3);
      border-radius: 999px;
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      text-align: center;
    }

    .repository-stash-detail-header {
      align-items: flex-start !important;
      min-height: 84px;
      padding-top: var(--space-3) !important;
      padding-bottom: var(--space-3) !important;
    }

    .repository-stash-detail-header > div {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .repository-stash-detail-header > div > span {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
    }

    .repository-stash-detail-header > div > span strong {
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
    }

    .repository-stash-detail-header code,
    .repository-stash-detail-header small {
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 10px;
    }

    .repository-stash-detail-header b,
    .repository-stash-detail-header small {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .repository-stash-detail-header b {
      color: var(--text);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .repository-stash-file-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      min-width: 0;
      padding: 0 var(--space-3);
      border-bottom: 1px solid var(--border);
    }

    .repository-stash-file-toolbar > strong {
      flex: 0 0 auto;
      color: var(--text);
      font-size: var(--font-size-caption);
    }

    .repository-stash-file-toolbar label {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      width: min(240px, 52%);
      min-width: 112px;
      height: var(--control-compact);
      padding: 0 var(--space-2);
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .repository-stash-file-toolbar input {
      width: 100%;
      min-width: 0;
      padding: 0;
      color: var(--text);
      background: transparent;
      border: 0;
      outline: 0;
      font-size: var(--font-size-caption);
    }

    .repository-stash-list,
    .repository-stash-files {
      min-width: 0;
      min-height: 0;
      overflow: auto;
    }

    .repository-stash-item {
      display: grid;
      gap: var(--space-1);
      width: 100%;
      min-width: 0;
      padding: var(--space-3);
      color: var(--text-soft);
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
    }

    .repository-stash-item:hover,
    .repository-stash-item:focus-visible {
      background: var(--surface-hover);
    }

    .repository-stash-item:focus-visible,
    .repository-stash-entry:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: -1px;
    }

    .repository-stash-item.selected {
      background: color-mix(in srgb, var(--accent) 13%, var(--surface));
      box-shadow: inset 2px 0 0 var(--accent);
    }

    .repository-stash-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      min-width: 0;
    }

    .repository-stash-item-head strong {
      color: var(--text);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
    }

    .repository-stash-item-head span,
    .repository-stash-branch {
      overflow: hidden;
      color: var(--muted);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .repository-stash-title {
      overflow: hidden;
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .repository-stash-file {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      min-width: 0;
      min-height: var(--control-large);
      padding: 0 var(--space-3);
      border-bottom: 1px solid var(--border-soft);
    }

    .repository-stash-file > span:first-child {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
    }

    .repository-stash-file strong {
      overflow: hidden;
      color: var(--text-soft);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-medium);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .repository-stash-file-stats {
      display: flex;
      flex: 0 0 auto;
      gap: var(--space-2);
      font-family: var(--font-mono);
      font-size: 10px;
    }

    .repository-stash-file-stats em {
      color: var(--green);
      font-style: normal;
    }

    .repository-stash-file-stats i {
      color: var(--red);
      font-style: normal;
    }

    .repository-stash-binary {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 10px;
    }

    .repository-stash-state {
      display: grid;
      place-content: center;
      justify-items: center;
      gap: var(--space-2);
      min-height: 180px;
      padding: var(--space-5);
      color: var(--muted);
      text-align: center;
    }

    .repository-stash-state strong {
      color: var(--text);
      font-size: var(--font-size-caption);
    }

    .repository-stash-entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      width: 100%;
      min-height: 38px;
      padding: 0 var(--space-3);
      color: var(--text-soft);
      text-align: left;
      background: var(--surface);
      border: 0;
      border-top: 1px solid var(--border);
      cursor: pointer;
    }

    .repository-stash-entry:hover,
    .repository-stash-entry:focus-visible,
    .repository-stash-entry.active {
      color: var(--text);
      background: var(--surface-hover);
    }

    .repository-stash-entry.active {
      box-shadow: inset 2px 0 0 var(--accent);
    }

    .repository-stash-entry > span:first-child {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-medium);
    }

    .repository-stash-entry .icon {
      color: var(--accent);
    }

    .file-pane-header,
    .diff-header {
      display: flex;
      align-items: center;
      min-height: var(--control-large);
      padding: 0 var(--space-3);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .file-pane-header {
      justify-content: space-between;
      gap: var(--space-2);
    }

    .file-pane-tools {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-1);
      min-width: 0;
    }

    .file-pane-header strong {
      flex: 0 0 4em;
      min-width: 4em;
      overflow: hidden;
      color: var(--text);
      font-size: var(--font-size-caption);
      line-height: 1;
      white-space: nowrap;
    }

    .change-filter-field {
      display: flex;
      flex: 0 0 112px;
      align-items: center;
      min-width: 0;
      width: 112px;
      height: var(--control-compact);
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .change-view-menu {
      flex: 0 0 var(--control-compact);
    }

.change-filter-field > input {
      flex: 1 1 auto;
      min-width: 0;
      width: 100%;
      height: 100%;
      padding: 0 var(--space-2);
      color: var(--text);
      font-size: var(--font-size-caption);
      background: transparent;
      border: 0;
    }

    .change-filter-field > input::placeholder {
      color: var(--muted);
    }

    .change-filter-field > input:focus-visible {
      outline-offset: -1px;
    }

    .change-filter-clear {
      display: grid;
      flex: 0 0 var(--control-compact);
      place-items: center;
      width: var(--control-compact);
      height: var(--control-compact);
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: var(--radius-small);
      cursor: pointer;
    }

    .change-filter-clear:hover {
      color: var(--text);
      background: transparent;
    }

    .change-filter-empty {
      display: grid;
      justify-items: center;
      gap: var(--space-1);
      min-height: 150px;
      padding: var(--space-5) var(--space-3);
      color: var(--muted);
      text-align: center;
    }

    .change-filter-empty .icon {
      color: var(--accent);
    }

    .change-filter-empty strong {
      color: var(--text);
    }

    .change-file-list {
      min-height: 0;
      overflow: auto;
      padding: 0;
    }

    .file-pane-title {
      color: var(--text-soft);
      font-weight: var(--font-weight-semibold);
    }

    .file-section-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      height: var(--control-compact);
      padding-right: var(--space-2);
      padding-left: var(--space-3);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border-soft);
    }

    .file-section-header:hover,
    .file-section-header:focus-within {
      background: var(--surface-hover);
    }

    .file-section-title {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      gap: var(--space-2);
      height: 100%;
      min-width: 0;
      padding: 0;
      color: var(--muted);
      text-align: left;
      background: transparent;
      border: 0;
      cursor: pointer;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
    }

    .file-section-title:hover {
      color: var(--text-soft);
    }

    .file-section-title:disabled,
    .file-section-title:disabled:hover {
      color: var(--muted);
      background: var(--surface-2);
      cursor: default;
      opacity: 0.64;
    }

    .file-section-title > .icon {
      width: 13px;
      height: 13px;
      transition: transform var(--motion-micro) var(--ease-enter);
    }

    .file-section:not(.collapsed) .file-section-title > .icon {
      transform: rotate(90deg);
    }

    .file-section-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-section-count {
      position: absolute;
      right: 0;
      min-width: 20px;
      height: 18px;
      padding: 0 var(--space-1);
      color: var(--muted);
      background: var(--surface-3);
      border-radius: 999px;
      font-size: var(--font-size-caption);
      transition: opacity var(--motion-micro) ease;
      font-weight: var(--font-weight-semibold);
      line-height: 18px;
      text-align: center;
    }

    .file-section-tail {
      position: relative;
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      min-width: calc(var(--icon-small) * 2 + var(--space-1));
      min-height: var(--control-compact);
    }

    .file-section-actions {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--motion-micro) ease;
    }

    .file-section-header.has-actions:hover .file-section-actions,
    .file-section-header.has-actions:focus-within .file-section-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .file-section-header.has-actions:hover .file-section-count,
    .file-section-header.has-actions:focus-within .file-section-count {
      opacity: 0;
    }

    .file-section-actions .gn-button {
      width: var(--gn-button-icon-size, 14px);
      min-width: var(--gn-button-icon-size, 14px);
      height: var(--gn-button-icon-size, 14px);
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .file-section-actions .gn-button:hover:not(:disabled),
    .file-section-actions .gn-button:active:not(:disabled),
    .file-section-actions .gn-button:disabled,
    .file-section-actions .gn-button[data-selected="true"] {
      color: var(--text);
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }

    .file-section-actions .gn-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .file-section-body {
      display: grid;
      grid-template-rows: 1fr;
      opacity: 1;
      transition:
        grid-template-rows var(--motion-layer) var(--ease-enter),
        opacity var(--motion-micro) var(--ease-enter);
    }

    .file-section-body-inner {
      min-height: 0;
      overflow: hidden;
    }

    .file-section.collapsed .file-section-body {
      grid-template-rows: 0fr;
      opacity: 0;
      pointer-events: none;
    }

    .file-section-empty {
      display: block;
      width: 100%;
      min-height: var(--control-large);
      padding: var(--space-3);
      color: var(--muted);
      text-align: center;
      background: transparent;
      border: 0;
      cursor: pointer;
      font-size: var(--font-size-caption);
    }

    .file-section-empty:hover {
      color: var(--text-soft);
      background: var(--surface-hover);
    }

    .file-row {
      --diff-workspace-file-backdrop: transparent;
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      gap: var(--space-2);
      width: 100%;
      min-width: 0;
      min-height: var(--control-large);
      padding: 0 var(--space-2);
      color: var(--text-soft);
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
    }

    .file-row:hover,
    .file-row:focus-within {
      --diff-workspace-file-backdrop: var(--surface-hover);
      background: var(--surface-hover);
    }

    .file-row.active {
      --diff-workspace-file-backdrop: var(--surface-hover);
      background: var(--surface-hover);
      box-shadow: 2px 0 0 var(--accent) inset;
    }

    .change-tree-directory {
      display: grid;
      grid-template-columns: 16px 16px minmax(0, 1fr);
      align-items: center;
      gap: var(--space-1);
      width: 100%;
      min-width: 0;
      min-height: var(--control-compact);
      padding-top: 0;
      padding-right: var(--space-2);
      padding-bottom: 0;
      color: var(--muted);
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-medium);
    }

    .change-tree-directory:hover {
      color: var(--text-soft);
      background: var(--surface-hover);
    }

    .change-tree-directory > span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .change-tree-directory > .icon:first-child {
      transition: transform var(--motion-micro) var(--ease-enter);
    }

    .change-tree-directory:not(.collapsed) > .icon:first-child {
      transform: rotate(90deg);
    }

    .change-tree-directory > .icon:nth-child(2) {
      color: var(--accent);
    }

    .file-status-letter {
      display: grid;
      flex: 0 0 14px;
      place-items: center;
      width: 14px;
      height: 14px;
      border-radius: var(--radius-small);
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
    }

    .file-status-letter.modified {
      color: var(--yellow);
      background: var(--yellow-soft);
    }

    .file-status-letter.added {
      color: var(--green);
      background: var(--green-soft);
    }

    .file-status-letter.deleted {
      color: var(--red);
      background: var(--red-soft);
    }

    .file-status-letter.untracked {
      color: var(--blue);
      background: var(--blue-soft);
    }

    .file-path {
      min-width: 0;
      padding: 0;
    }

    .file-select-button {
      display: grid;
      gap: 2px;
      width: 100%;
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .file-name {
      display: block;
      direction: rtl;
      overflow: hidden;
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      text-align: left;
      white-space: nowrap;
    }

    .file-dir {
      display: block;
      overflow: hidden;
      margin-top: 0;
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-meta {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      min-width: 0;
    }

    .file-change-stats {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-2);
      margin-left: var(--space-1);
      font-family: var(--font-mono);
      font-size: calc(var(--font-size-caption) - 1px);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .file-change-stats strong {
      color: var(--green);
    }

    .file-change-stats em {
      color: var(--red);
      font-style: normal;
    }

    .stage-toggle {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: var(--radius-small);
      cursor: pointer;
    }

    .stage-toggle.gn-button {
      width: var(--control-compact);
      min-width: var(--control-compact);
      height: var(--control-compact);
      padding: 0;
    }

    .stage-toggle:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .file-actions {
      position: absolute;
      top: 0;
      right: var(--space-2);
      bottom: 0;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      padding-left: var(--space-5);
      visibility: hidden;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        transparent,
        var(--diff-workspace-file-backdrop) var(--space-5)
      );
      transition: none;
    }

    .file-row:hover .file-actions,
    .file-row:focus-within .file-actions {
      visibility: visible;
      pointer-events: auto;
    }

    .file-actions .gn-button {
      width: var(--gn-button-icon-size, 14px);
      min-width: var(--gn-button-icon-size, 14px);
      height: var(--gn-button-icon-size, 14px);
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      box-shadow: none;
      transition: none;
    }

    .file-actions .gn-button:hover:not(:disabled),
    .file-actions .gn-button:active:not(:disabled),
    .file-actions .gn-button:disabled,
    .file-actions .gn-button[data-selected="true"] {
      color: var(--text);
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }

    .file-actions .gn-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .diff-viewer-panel {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--code-bg);
    }

    .diff-viewer-main {
      position: relative;
      display: grid;
      grid-template-rows: 44px minmax(0, 1fr);
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--code-bg);
    }

    .diff-viewer-file-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      min-width: 0;
      overflow: hidden;
      padding: 0 var(--space-3);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .diff-viewer-file-heading {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      gap: var(--space-1);
      min-width: 0;
      overflow: hidden;
    }

    .diff-viewer-path-copy-button {
      display: grid;
      flex: 0 0 var(--control-compact);
      place-items: center;
      width: var(--control-compact);
      height: var(--control-compact);
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .diff-viewer-path-copy-button:hover:not(:disabled) {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .diff-viewer-path-copy-button.copied {
      color: var(--green);
      background: var(--green-soft);
      border-color: color-mix(in srgb, var(--green) 28%, transparent);
    }

    .diff-viewer-file-heading > span {
      display: -webkit-box;
      flex: 1 1 auto;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      overflow-wrap: anywhere;
      color: var(--text-soft);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: normal;
      word-break: break-word;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .diff-viewer-header-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      margin-left: auto;
    }

    .diff-viewer-stats {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-3);
      min-height: 24px;
      font-family: var(--font-mono);
      font-size: calc(var(--font-size-caption) - 1px);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .diff-viewer-stats strong {
      color: var(--green);
    }

    .diff-viewer-stats em {
      color: var(--red);
      font-style: normal;
      font-weight: var(--font-weight-semibold);
    }

    .diff-viewer-stats.muted {
      color: var(--muted);
      font-family: var(--font-sans);
    }

    .diff-viewer-file-header-separator {
      width: 1px;
      height: 22px;
      background: var(--border);
    }

    .diff-viewer-header-action-slot {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
    }

    .diff-open-external {
      width: var(--control-compact);
      height: var(--control-compact);
      padding: 0;
      text-decoration: none;
    }

    .diff-search-popover {
      position: absolute;
      top: calc(44px + var(--space-1));
      right: var(--space-3);
      z-index: var(--z-popover);
      display: grid;
      grid-template-columns: 14px minmax(96px, 1fr) auto repeat(3, 28px);
      align-items: center;
      gap: 2px;
      width: min(360px, calc(100% - var(--space-5)));
      min-height: var(--control-compact);
      padding: 2px var(--space-1);
      background: color-mix(in srgb, var(--surface) 94%, var(--canvas));
      border: 1px solid var(--border);
      border-radius: var(--radius-regular);
      box-shadow: var(--shadow-popover);
    }

    .diff-search-symbol {
      display: grid;
      place-items: center;
      width: 14px;
      height: 14px;
      color: var(--muted);
    }

    .diff-search-input {
      width: 100%;
      min-width: 0;
      height: 28px;
      padding: 0 2px;
      color: var(--text);
      background: transparent;
      border: 0;
      border-radius: var(--radius-small);
      font: inherit;
      outline: none;
      box-shadow: none;
    }

    .diff-search-input::placeholder {
      color: var(--muted);
    }

    .diff-search-input:focus,
    .diff-search-input:focus-visible {
      background: transparent;
      outline: none;
      box-shadow: none;
    }

    .diff-search-count {
      min-width: 36px;
      padding: 0 2px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      line-height: 1;
      text-align: center;
      white-space: nowrap;
    }

    .diff-search-action {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      color: var(--text-soft);
      background: transparent;
      border: 0;
      border-radius: var(--radius-small);
      cursor: pointer;
    }

    .diff-search-action:hover:not(:disabled) {
      color: var(--text);
      background: var(--surface-hover);
    }

    .diff-search-action:disabled {
      color: var(--muted);
      cursor: not-allowed;
      opacity: 0.55;
    }

    .diff-viewer-code {
      position: relative;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      background: var(--code-bg);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      line-height: 20px;
    }

    .diff-content-skeleton {
      display: grid;
      grid-template-rows: 32px minmax(0, 1fr);
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .diff-content-skeleton-hunk {
      display: flex;
      align-items: center;
      padding: 0 var(--space-3);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border-soft);
    }

    .diff-content-skeleton-code {
      min-height: 0;
      overflow: hidden;
      padding-top: var(--space-2);
    }

    .diff-content-skeleton-row {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      align-items: center;
      gap: var(--space-3);
      min-height: 24px;
      padding: 0 var(--space-4) 0 var(--space-2);
    }

    .diff-content-skeleton-block {
      position: relative;
      display: block;
      overflow: hidden;
      background: color-mix(
        in srgb,
        var(--surface-3) 82%,
        var(--surface)
      );
      border-radius: var(--radius-small);
    }

    .diff-content-skeleton-block::after {
      position: absolute;
      inset: 0;
      content: "";
      background: linear-gradient(
        90deg,
        transparent,
        color-mix(in srgb, var(--surface-hover) 82%, transparent),
        transparent
      );
      transform: translateX(-100%);
      animation: diff-content-skeleton-shimmer 1.35s ease-in-out infinite;
    }

    .diff-content-skeleton-hunk-line {
      width: min(220px, 42%);
      height: 9px;
    }

    .diff-content-skeleton-line-number {
      justify-self: end;
      width: 42px;
      height: 8px;
    }

    .diff-content-skeleton-code-line {
      width: 72%;
      height: 9px;
    }

    .diff-content-skeleton-row.is-long
      .diff-content-skeleton-code-line {
      width: 88%;
    }

    .diff-content-skeleton-row.is-short
      .diff-content-skeleton-code-line {
      width: 44%;
    }

    @keyframes diff-content-skeleton-shimmer {
      to {
        transform: translateX(100%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .diff-content-skeleton-block::after {
        animation: none;
        opacity: 0.28;
        transform: none;
      }
    }

    .diff-viewer-unified {
      min-width: max(100%, 760px);
      width: max-content;
      padding: var(--space-2) 0 var(--space-5);
    }

    .diff-viewer-unified-line {
      display: grid;
      grid-template-columns: 48px 48px 22px minmax(610px, 1fr);
      min-width: 760px;
      min-height: 20px;
    }

    .diff-viewer-unified-line:hover .diff-viewer-code-cell {
      filter: brightness(1.08);
    }

    .diff-viewer-line-number {
      padding: 0 var(--space-2) 0 var(--space-1);
      color: var(--muted);
      background: color-mix(in srgb, var(--surface-2) 56%, var(--code-bg));
      border-right: 1px solid var(--border-soft);
      font-variant-numeric: tabular-nums;
      text-align: right;
      user-select: none;
    }

    .diff-viewer-change-marker {
      color: var(--muted);
      background: color-mix(in srgb, var(--surface-2) 44%, var(--code-bg));
      text-align: center;
      user-select: none;
    }

    .diff-viewer-code-cell {
      min-width: 0;
      padding: 0 var(--space-3);
      color: var(--text-soft);
      background: var(--code-bg);
      border-right: 1px solid var(--border-soft);
    }

    .diff-viewer-code-cell > code {
      display: block;
      min-width: max-content;
      min-height: 20px;
      color: inherit;
      white-space: pre;
      tab-size: 2;
    }

    .diff-viewer-line-number.removed,
    .diff-viewer-change-marker.removed {
      color: color-mix(in srgb, var(--red) 76%, var(--muted));
      background: color-mix(in srgb, var(--red-soft) 72%, var(--surface-2));
    }

    .diff-viewer-code-cell.removed {
      color: var(--red);
      background: var(--red-soft);
    }

    .diff-viewer-line-number.added,
    .diff-viewer-change-marker.added {
      color: color-mix(in srgb, var(--green) 76%, var(--muted));
      background: color-mix(in srgb, var(--green-soft) 72%, var(--surface-2));
    }

    .diff-viewer-code-cell.added {
      color: var(--green);
      background: var(--green-soft);
    }

    .diff-viewer-wide-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-width: 100%;
      min-height: 20px;
      padding: 0 var(--space-3);
      color: var(--blue);
      background: color-mix(in srgb, var(--blue-soft) 86%, var(--code-bg));
      border-top: 1px solid color-mix(in srgb, var(--accent) 14%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 14%, transparent);
      scroll-margin-top: var(--space-3);
    }

    .diff-viewer-wide-row > code,
    .diff-viewer-wide-row > .diff-viewer-hunk-trigger {
      flex: 1 1 auto;
      min-width: max-content;
    }

    .diff-viewer-wide-row > code {
      color: inherit;
      white-space: pre;
    }

    .diff-viewer-hunk-trigger {
      display: inline-flex;
      align-items: center;
      padding: 0 2px;
      color: inherit;
      background: transparent;
      border: 0;
      border-radius: 2px;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .diff-viewer-hunk-trigger > code {
      color: inherit;
      font: inherit;
      white-space: pre;
    }

    .diff-viewer-hunk-trigger:hover {
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }

    .diff-viewer-hunk-trigger:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .diff-search-match {
      padding: 0;
      color: inherit;
      background: color-mix(in srgb, var(--yellow) 38%, transparent);
      border-radius: 2px;
    }

    .diff-search-match.current {
      color: var(--canvas);
      background: var(--yellow);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--yellow) 72%, white);
    }

    .branches-table {
      width: 100%;
      min-width: 700px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .branches-table th:nth-child(1) { width: 31%; }
    .branches-table th:nth-child(2) { width: 10%; }
    .branches-table th:nth-child(3) { width: 31%; }
    .branches-table th:nth-child(4) { width: 10%; }
    .branches-table th:nth-child(5) { width: 9%; }
    .branches-table th:nth-child(6) { width: 9%; }

    .branches-table th,
    .branches-table td {
      height: var(--control-large);
      padding: 0 var(--space-3);
      border-bottom: 1px solid var(--border-soft);
      text-align: left;
    }

    .branches-table th {
      height: var(--control-default);
      color: var(--muted);
      background: var(--surface-2);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
    }

    .branches-table tbody tr:hover {
      background: var(--surface-hover);
    }

    .branches-table tbody tr.selected {
      background: var(--accent-soft);
      box-shadow: 3px 0 0 var(--accent) inset;
    }

    .branch-name-button {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      width: 100%;
      min-height: var(--control-compact);
      min-width: 0;
      padding: 0;
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .branch-name-cell {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      color: var(--text-soft);
      font-weight: var(--font-weight-medium);
    }

    .branch-name-cell.current {
      color: var(--accent);
    }

    .branch-name-cell span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .branch-current-dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .branch-action-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-1);
    }

    .worktree-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 350px), 1fr));
      gap: var(--space-3);
    }

    .worktree-grid > * {
      max-width: 400px;
    }

    .worktree-toolbar {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-height: var(--control-large);
      padding: 0 var(--space-3);
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-large);
    }

    .worktree-toolbar-title {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--text);
      font-weight: var(--font-weight-semibold);
    }

    .worktree-toolbar-count {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .worktree-filter-field {
      flex: 0 1 240px;
      width: 240px;
      min-width: 120px;
      margin-left: auto;
    }

    .worktree-filter-field > .worktree-filter-input {
      background: var(--surface-2);
      border-color: var(--border-soft);
    }

    .worktree-filter-input .gn-input__control {
      font-size: var(--font-size-caption);
    }

    .worktree-filter-field + .panel-header-action {
      margin-left: 0;
    }

    .worktree-filter-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }

    .worktree-filter-bar-label {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .worktree-filter-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      height: 26px;
      padding: 0 var(--space-2);
      color: var(--text-soft);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      cursor: pointer;
      font-size: var(--font-size-caption);
    }

    .worktree-filter-chip:hover:not(:disabled) {
      color: var(--text);
      border-color: var(--border);
    }

    .worktree-filter-chip.selected {
      color: var(--accent-strong);
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 38%, transparent);
    }

    .worktree-filter-chip-count {
      padding: 0 var(--space-1);
      color: var(--muted);
      background: var(--surface-3);
      border-radius: 999px;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      line-height: 16px;
    }

    .worktree-filter-chip.selected .worktree-filter-chip-count {
      color: var(--accent-strong);
      background: color-mix(in srgb, var(--accent) 20%, transparent);
    }

    .worktree-filter-clear {
      height: 26px;
      padding: 0 var(--space-2);
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: var(--radius-small);
      cursor: pointer;
      font-size: var(--font-size-caption);
    }

    .worktree-filter-clear:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .worktree-repo-menu {
      position: relative;
    }

    .worktree-repo-menu > summary {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      max-width: 220px;
      height: var(--control-compact);
      padding: 0 var(--space-2);
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
      cursor: pointer;
      font-size: var(--font-size-caption);
      list-style: none;
    }

    .worktree-repo-menu > summary::-webkit-details-marker {
      display: none;
    }

    .worktree-repo-menu > summary:hover,
    .worktree-repo-menu[open] > summary {
      border-color: var(--border);
      background: var(--surface-hover);
    }

    .worktree-repo-menu-trigger-value {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .worktree-repo-menu-surface {
      gap: var(--space-1);
      width: min(240px, calc(100vw - var(--space-6)));
      max-height: 260px;
      overflow: auto;
    }

    .worktree-repo-menu-surface .menu-item.is-selected {
      color: var(--text);
      background: var(--accent-soft);
    }

    .worktree-repository-tag {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      max-width: 160px;
      overflow: hidden;
      color: var(--text-soft);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .worktree-filter-empty {
      display: grid;
      justify-items: center;
      gap: var(--space-1);
      min-height: 150px;
      padding: var(--space-5) var(--space-3);
      color: var(--muted);
      text-align: center;
    }

    .worktree-management {
      display: grid;
      gap: var(--space-4);
      min-width: 0;
    }

    .page-heading.worktree-page-heading {
      flex-wrap: nowrap;
      margin-bottom: 0;
    }

    .worktree-page-heading .page-actions {
      width: auto;
    }

    .worktree-page-heading .page-description {
      max-width: 680px;
      font-size: var(--font-size-caption);
    }

    .worktree-metric-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .worktree-card {
      position: relative;
      width: 100%;
      min-height: 180px;
      padding: var(--space-4);
      color: inherit;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-large);
      cursor: pointer;
    }

    .worktree-card:hover {
      border-color: color-mix(in srgb, var(--accent) 34%, var(--border));
    }

    .worktree-card.prunable {
      cursor: default;
    }

    .worktree-card.prunable:active {
      transform: none;
    }

    .worktree-card.primary {
      background: linear-gradient(140deg, var(--accent-soft), var(--surface) 48%);
      border-color: color-mix(in srgb, var(--accent) 25%, var(--border));
    }

    .worktree-card-head {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
    }

    .worktree-card-head > span:nth-child(2) {
      flex: 1 1 auto;
      min-width: 0;
    }

    .worktree-symbol {
      display: grid;
      flex: 0 0 var(--control-default);
      place-items: center;
      width: var(--control-default);
      height: var(--control-default);
      color: var(--blue);
      background: var(--blue-soft);
      border-radius: var(--radius-regular);
    }

    .worktree-card.primary .worktree-symbol {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .worktree-title {
      overflow: hidden;
      color: var(--text);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-semibold);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .worktree-branch {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      overflow: hidden;
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .worktree-path {
      overflow: hidden;
      margin-top: var(--space-4);
      padding: var(--space-2) var(--space-3);
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .worktree-foot {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-3);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .worktree-foot .spacer {
      flex: 1;
    }

    .worktree-clear-action {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      gap: var(--space-1);
      height: 26px;
      padding: 0 var(--space-2);
      color: var(--red);
      background: var(--red-soft);
      border: 1px solid color-mix(in srgb, var(--red) 28%, var(--border-soft));
      border-radius: var(--radius-small);
      cursor: pointer;
      font: inherit;
      font-weight: var(--font-weight-semibold);
    }

    .worktree-clear-action:hover:not(:disabled) {
      background: color-mix(in srgb, var(--red) 15%, var(--surface));
      border-color: color-mix(in srgb, var(--red) 44%, var(--border));
    }

    .worktree-clear-action:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 2px;
    }

    .worktree-clear-action:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .inspector-head {
      display: flex;
      align-items: center;
      min-height: var(--control-large);
      padding: 0 var(--space-4);
      border-bottom: 1px solid var(--border-soft);
    }

    .inspector-title {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--text);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-semibold);
    }

    .inspector-title .icon {
      color: var(--muted);
    }

    .inspector-close {
      margin-left: auto;
    }

    .inspector-actions {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      margin-left: auto;
    }

    .inspector-actions .inspector-close {
      margin-left: 0;
    }

    .inspector-section {
      padding: var(--space-4);
      border-bottom: 1px solid var(--border-soft);
    }

    .inspector-section-title {
      display: flex;
      align-items: center;
      margin-bottom: var(--space-3);
      color: var(--muted);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
    }

    .inspector-section-title span {
      margin-left: auto;
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-medium);
      letter-spacing: 0;
      text-transform: none;
    }

    .health-ring-wrap {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }

    .health-ring {
      --value: 84%;
      position: relative;
      display: grid;
      place-items: center;
      width: 66px;
      height: 66px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: conic-gradient(var(--accent) var(--value), var(--surface-3) 0);
    }

    .health-ring::before {
      content: "";
      position: absolute;
      width: 51px;
      height: 51px;
      background: var(--surface);
      border-radius: 50%;
    }

    .health-ring strong {
      z-index: 1;
      color: var(--text);
      font-size: var(--font-size-body);
    }

    .health-copy-title {
      color: var(--text);
      font-weight: var(--font-weight-semibold);
    }

    .health-copy-text {
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .detail-list {
      display: grid;
      gap: var(--space-2);
    }

    .commit-detail-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: var(--space-4);
      row-gap: var(--space-1);
    }

    .detail-row {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: var(--space-2);
      align-items: start;
    }

    .commit-detail-list .detail-row {
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
    }

    .commit-detail-list .detail-row:last-child {
      grid-column: 1 / -1;
    }

    .detail-label {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .detail-value {
      min-width: 0;
      overflow: hidden;
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .commit-detail-list .detail-value {
      text-align: left;
    }

    .operation-list {
      display: grid;
      gap: var(--space-2);
    }

    .operation-center-page {
      display: grid;
      align-content: start;
      gap: var(--space-4);
    }

    .operation-center-page .page-heading,
    .operation-center-page .metric-grid,
    .operation-center-page .panel {
      margin-bottom: 0;
    }

    .operation-center-page .operation-list,
    .operation-center-page .operation-constraints {
      padding: var(--space-4);
    }

    .operation-item {
      padding: var(--space-3);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .operation-head {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .operation-icon {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: var(--radius-regular);
    }

    .operation-icon.success {
      color: var(--green);
      background: var(--green-soft);
    }

    .operation-name {
      min-width: 0;
      overflow: hidden;
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-medium);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .operation-state {
      margin-left: auto;
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .progress-track {
      height: 4px;
      overflow: hidden;
      margin-top: var(--space-2);
      background: var(--surface-3);
      border-radius: 999px;
    }

    .progress-value {
      width: 68%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--blue));
      border-radius: inherit;
      transition: width var(--motion-micro) var(--ease-enter);
    }

    .operation-foot {
      display: flex;
      justify-content: space-between;
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-2);
    }

    .quick-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      min-width: 0;
      min-height: var(--control-default);
      padding: 0 var(--space-3);
      color: var(--text-soft);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
      cursor: pointer;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
    }

    .quick-button:hover {
      color: var(--text);
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .quick-button .icon {
      color: var(--muted);
    }

    .commit-composer {
      margin-top: var(--space-4);
    }

    .changes-file-pane > .commit-composer {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 160px;
      max-height: 420px;
      margin-top: 0;
      overflow: auto;
      border: 0;
      border-top: 1px solid var(--border);
      border-radius: 0;
      box-shadow: none;
    }

    .commit-resize-handle {
      position: relative;
      height: 8px;
      margin: 0;
      cursor: ns-resize;
      touch-action: none;
      user-select: none;
    }

    .commit-resize-handle::after {
      position: absolute;
      top: 3px;
      left: 50%;
      width: 32px;
      height: 2px;
      content: "";
      background: var(--border-soft);
      border-radius: 999px;
      transform: translateX(-50%);
      transition: background var(--motion-fast), width var(--motion-fast);
    }

    .commit-resize-handle:hover::after,
    .commit-resize-handle:focus-visible::after {
      width: 48px;
      background: var(--accent);
    }

    body.is-resizing-commit-panel,
    body.is-resizing-commit-panel * {
      cursor: ns-resize !important;
      user-select: none !important;
    }

    .changes-file-pane > .commit-composer .panel-header {
      min-height: var(--control-compact);
      padding: 0 var(--space-2);
    }

    .commit-composer .panel-header > .status-pill {
      margin-left: auto;
    }

    .commit-push-toggle {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-medium);
      cursor: pointer;
    }

    .commit-push-toggle input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    .commit-form {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: var(--space-2);
      min-height: 0;
      padding: var(--space-2);
    }

    .commit-form-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex: 0 0 auto;
      min-height: var(--control-compact);
    }

    .commit-form .gn-textarea-field {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-height: 0;
    }

    .commit-form .gn-textarea {
      flex: 1 1 auto;
      min-height: 0;
    }

    .commit-ai-button.gn-button {
      flex: 0 0 auto;
      width: var(--control-compact);
      min-width: var(--control-compact);
      padding: 0;
    }

    .commit-form label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-medium);
    }

    .commit-form label span {
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-regular);
    }

    .commit-form .commit-message {
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
      overflow: auto;
      resize: none;
      font-size: var(--font-size-caption);
      line-height: 1.4;
    }

    .commit-submit-button.gn-button {
      flex: 1 1 auto;
      width: auto;
      min-width: 0;
      min-height: var(--control-compact);
      height: var(--control-compact);
      padding: 0 var(--space-2);
    }

    .form-label {
      color: var(--muted);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .form-input {
      width: 100%;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-regular);
      transition:
        background-color var(--motion-micro) ease,
        border-color var(--motion-micro) ease;
    }

    .form-input:hover,
    .sidebar-search:hover {
      border-color: color-mix(in srgb, var(--accent) 36%, var(--border));
    }

    .form-input:focus,
    .sidebar-search:focus {
      border-color: var(--color-focus);
    }

    .form-input[aria-invalid="true"] {
      border-color: var(--red);
      background: color-mix(in srgb, var(--red-soft) 48%, var(--surface-2));
    }

    .form-input:disabled,
    .sidebar-search:disabled {
      color: var(--color-text-disabled);
      background: var(--surface-2);
      cursor: not-allowed;
      opacity: 0.72;
    }

    .form-input {
      height: var(--control-default);
      padding: 0 var(--space-3);
    }

    .form-input::placeholder {
      color: var(--muted);
    }

    .form-field-meta {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-2);
      min-height: var(--space-5);
      color: var(--muted);
      font-size: var(--font-size-caption);
      font-variant-numeric: tabular-nums;
    }

    .form-error {
      display: none;
      color: var(--red);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .form-error:not(:empty) {
      display: block;
    }

    .form-field-meta:has(.form-error:not(:empty)) .form-help {
      display: none;
    }

    .commit-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-height: var(--control-compact);
      cursor: pointer;
    }

    .checkbox-label input {
      accent-color: var(--accent);
    }

    .commit-button {
      width: 100%;
      margin-top: var(--space-1);
    }

    .selected-commit-title {
      margin: 0 0 var(--space-2);
      color: var(--text);
      font-size: var(--font-size-emphasis);
      line-height: var(--line-height-title);
    }

    .selected-commit-body {
      margin: 0;
      color: var(--muted);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .avatar-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }

    .avatar {
      display: grid;
      place-items: center;
      width: var(--control-compact);
      height: var(--control-compact);
      color: #fff;
      background: linear-gradient(145deg, #5579df, #9d67d5);
      border-radius: 50%;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .avatar-meta {
      min-width: 0;
    }

    .avatar-name {
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-medium);
    }

    .avatar-time {
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .changed-file-list {
      display: grid;
      gap: var(--space-1);
    }

    .changed-file-item {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      padding: var(--space-2);
      background: var(--surface-2);
      border-radius: var(--radius-regular);
    }

    .changed-file-item span {
      overflow: hidden;
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .changed-file-item .file-change-stat {
      display: flex;
      gap: var(--space-1);
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
    }

    .statusbar {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      min-width: 0;
      padding: 0 var(--space-2);
      color: var(--muted);
      background: var(--titlebar);
      border-top: 1px solid var(--border-soft);
      font-size: var(--font-size-caption);
      user-select: none;
    }

    .statusbar-item {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      min-width: 0;
    }

    .statusbar-item .icon {
      width: 12px;
      height: 12px;
    }

    .statusbar-spacer {
      flex: 1;
    }

    .online-dot {
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 0 3px var(--green-soft);
    }

    .command-overlay {
      position: fixed;
      inset: 0;
      z-index: var(--z-modal);
      display: grid;
      place-items: start center;
      padding-top: 12vh;
      background: var(--color-overlay);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--motion-exit) var(--ease-exit);
      backdrop-filter: blur(5px);
    }

    .command-overlay.open {
      opacity: 1;
      pointer-events: auto;
      transition-duration: var(--motion-layer);
      transition-timing-function: var(--ease-enter);
    }

    .command-palette {
      position: relative;
      width: min(610px, calc(100vw - 40px));
      max-height: min(680px, calc(100vh - 48px));
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      transform: translateY(-8px) scale(0.985);
      transform-origin: top center;
      transition: transform var(--motion-exit) var(--ease-exit);
    }

    .command-overlay.open .command-palette {
      transform: translateY(0) scale(1);
      transition-duration: var(--motion-layer);
      transition-timing-function: var(--ease-enter);
    }

    .command-input-wrap {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      height: var(--control-large);
      padding: 0 var(--space-4);
      border-bottom: 1px solid var(--border);
      border-radius: var(--radius-large) var(--radius-large) 0 0;
    }

    .command-input-wrap:focus-within {
      background: color-mix(in srgb, var(--accent) 5%, transparent);
      border-bottom-color: var(--color-focus);
    }

    .command-input-wrap .icon {
      color: var(--muted);
    }

    .command-input-wrap:focus-within .icon {
      color: var(--accent);
    }

    .command-input {
      flex: 1;
      height: 100%;
      color: var(--text);
      background: transparent;
      border: 0;
      font-size: var(--font-size-body);
    }

    .command-input:focus-visible {
      outline-color: transparent;
    }

    .command-input::placeholder {
      color: var(--muted);
    }

    .command-results {
      max-height: min(480px, calc(100vh - 160px));
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: var(--space-2);
    }

    .command-results-skeleton {
      display: grid;
      gap: var(--space-1);
      min-height: 224px;
    }

    .command-result-skeleton {
      display: grid;
      grid-template-columns: var(--control-compact) minmax(0, 1fr) auto;
      align-items: center;
      column-gap: var(--space-2);
      min-height: var(--control-large);
      padding: 0 var(--space-2);
    }

    .command-result-skeleton-copy {
      display: grid;
      gap: var(--space-2);
      min-width: 0;
    }

    .command-index-status {
      padding: var(--space-2) var(--space-3);
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-align: center;
    }

    .command-group-label {
      padding: var(--space-2);
      color: var(--muted);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
    }

    .command-result {
      display: grid;
      grid-template-columns: var(--control-compact) minmax(0, 1fr) auto;
      align-items: center;
      column-gap: var(--space-2);
      width: 100%;
      min-height: var(--control-large);
      padding: 0 var(--space-2);
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .command-result:hover,
    .command-result:focus-visible {
      background: var(--surface-hover);
    }

    .command-result:focus-visible {
      outline: 1px solid var(--color-focus);
      outline-offset: -1px;
    }

    .command-result-icon {
      display: grid;
      place-items: center;
      width: var(--control-compact);
      height: var(--control-compact);
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: var(--radius-regular);
    }

    .command-result-main {
      min-width: 0;
    }

    .command-result-title {
      display: block;
      overflow: hidden;
      color: var(--text-soft);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-medium);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .command-result:hover .command-result-title,
    .command-result:focus-visible .command-result-title {
      color: var(--text);
    }

    .command-result-sub {
      display: block;
      overflow: hidden;
      margin-top: calc(var(--space-1) / 2);
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .command-status,
    .command-key {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: var(--font-size-caption);
      white-space: nowrap;
    }

    .command-result > .command-status,
    .command-result > .command-key {
      margin-left: var(--space-3);
    }

    .command-status {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .command-key {
      display: inline-grid;
      place-items: center;
      min-width: var(--control-compact);
      height: var(--space-6);
      padding: 0 var(--space-2);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-small);
      font-family: inherit;
      line-height: 1;
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 260px;
      padding: var(--space-5);
      color: var(--muted);
      text-align: center;
    }

    .compact-empty-state {
      min-height: 150px;
    }

    .command-empty-state {
      min-height: 192px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .empty-state-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin: 0 auto var(--space-3);
      color: var(--muted);
      background: var(--surface-2);
      border-radius: var(--radius-large);
    }

    .empty-state-title {
      color: var(--text);
      font-size: var(--font-size-emphasis);
      font-weight: var(--font-weight-semibold);
    }

    .empty-state-description {
      max-width: 360px;
      margin: var(--space-2) auto 0;
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .empty-state-actions {
      display: flex;
      justify-content: center;
      gap: var(--space-2);
      margin-top: var(--space-4);
    }

    .field-help {
      min-height: var(--space-5);
      margin-top: var(--space-2);
      color: var(--muted);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .field-help.warning {
      color: var(--yellow);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: var(--z-modal);
      display: grid;
      place-items: center;
      padding: var(--space-5);
      background: var(--color-overlay);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity var(--motion-exit) var(--ease-exit),
        visibility var(--motion-exit) var(--ease-exit);
      backdrop-filter: blur(4px);
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition-duration: var(--motion-layer), var(--motion-layer);
      transition-timing-function: var(--ease-enter), var(--ease-enter);
    }

    .history-page {
      overflow: hidden;
    }

    .history-layout {
      display: grid;
      grid-template-rows: minmax(0, 1fr) 300px;
      height: 100%;
      min-height: 0;
      background: var(--surface);
    }

    .history-layout:not(.has-detail) {
      grid-template-rows: minmax(320px, 1fr);
    }

    .history-list {
      min-height: 0;
      overflow: auto;
    }

    .history-list .sticky-panel-header {
      z-index: var(--z-navigation);
      background: var(--surface);
    }

    .history-commit-detail {
      display: grid;
      grid-template-rows: var(--control-default) minmax(0, 1fr);
      height: 300px;
      min-height: 300px;
      max-height: 300px;
      overflow: hidden;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .history-commit-detail .inspector-head {
      position: sticky;
      top: 0;
      z-index: var(--z-navigation);
      min-height: var(--control-default);
      padding: 0 var(--space-3);
      background: var(--surface);
    }

    .history-commit-detail .inspector-section:last-child {
      border-bottom: 0;
    }

    .history-commit-summary {
      padding: var(--space-3) var(--space-4);
    }

    .history-commit-summary .selected-commit-title {
      margin-bottom: 0;
      font-size: var(--font-size-body);
    }

    .history-commit-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-2);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .history-commit-meta code {
      color: var(--accent);
      font-family: var(--font-mono);
    }

    .history-commit-summary .commit-refs {
      margin-top: var(--space-2);
    }

    .history-commit-summary .selected-commit-body {
      margin-top: var(--space-2);
    }

    .history-commit-heading {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      width: 100%;
      min-width: 0;
    }

    .history-commit-breadcrumb {
      min-width: 0;
    }

    .history-commit-breadcrumb ol {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      min-width: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .history-commit-breadcrumb li {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .history-commit-breadcrumb button {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      min-width: 0;
      min-height: 28px;
      padding: 0 var(--space-2);
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: var(--radius-small);
      cursor: pointer;
      font: inherit;
      font-size: var(--font-size-caption);
    }

    .history-commit-breadcrumb button:hover,
    .history-commit-breadcrumb button:focus-visible {
      color: var(--text);
      background: var(--surface-hover);
    }

    .history-commit-breadcrumb button:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: -1px;
    }

    .history-commit-breadcrumb button[aria-current="page"] {
      color: var(--text);
      background: var(--surface-2);
      font-weight: var(--font-weight-semibold);
    }

    .history-commit-breadcrumb button .icon {
      flex: 0 0 auto;
      color: var(--muted);
    }

    .history-commit-breadcrumb-separator {
      color: var(--muted);
      font-size: var(--font-size-emphasis);
      line-height: 1;
    }

    .history-commit-breadcrumb-count {
      display: inline-grid;
      place-items: center;
      min-width: 20px;
      height: 18px;
      padding: 0 var(--space-1);
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      font-size: calc(var(--font-size-caption) - 1px);
      font-weight: var(--font-weight-regular);
      line-height: 1;
    }

    .history-commit-heading-stats {
      flex: 0 0 auto;
      margin-left: auto;
    }

    .history-commit-detail-content {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .history-commit-overview {
      flex: 1 1 auto;
      height: 100%;
      min-width: 0;
      min-height: 0;
      max-height: none;
      overflow: auto;
    }

    .history-commit-files {
      display: block;
      flex: 1 1 auto;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .history-commit-file-browser {
      display: grid;
      grid-template-columns: minmax(220px, 300px) minmax(0, 1fr);
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .history-commit-file-list {
      display: grid;
      align-content: start;
      grid-auto-rows: max-content;
      min-width: 0;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      border-right: 1px solid var(--border-soft);
      background: var(--surface);
    }

    .history-commit-file {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-2);
      width: 100%;
      min-height: 42px;
      padding: var(--space-2) var(--space-3);
      color: var(--text-soft);
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
    }

    .history-commit-file:hover,
    .history-commit-file:focus-visible {
      background: var(--surface-hover);
    }

    .history-commit-file:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: -1px;
    }

    .history-commit-file.selected {
      color: var(--text);
      background: color-mix(in srgb, var(--accent) 13%, var(--surface));
      box-shadow: inset 2px 0 0 var(--accent);
    }

    .history-commit-file-path {
      overflow: hidden;
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-commit-file-stats {
      display: inline-flex;
      gap: var(--space-2);
      font-family: var(--font-mono);
      font-size: 10px;
    }

    .history-commit-file-stats strong {
      color: var(--green);
    }

    .history-commit-file-stats em {
      color: var(--red);
      font-style: normal;
      font-weight: var(--font-weight-semibold);
    }

    .history-commit-diff {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .history-commit-diff .diff-viewer-file-header {
      min-height: 44px;
    }

    .confirm-dialog {
      position: relative;
      width: min(480px, 100%);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow);
      transform: translateY(12px) scale(0.985);
      transform-origin: center;
      transition: transform var(--motion-exit) var(--ease-exit);
    }

    .modal-overlay.open .confirm-dialog {
      transform: translateY(0) scale(1);
      transition-duration: var(--motion-layer);
      transition-timing-function: var(--ease-enter);
    }

    .branch-switch-dialog {
      width: min(520px, calc(100vw - 48px));
    }

    .branch-switch-dialog-header {
      position: relative;
      grid-template-columns: var(--control-large) minmax(0, 1fr);
