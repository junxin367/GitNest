      repositorySelect = ""
    }) {
      const chips = WORKTREE_FACET_OPTIONS.map((option) => `
        <button
          type="button"
          class="worktree-filter-chip${facets.includes(option.id) ? " selected" : ""}"
          data-worktree-facet="${option.id}"
          aria-pressed="${facets.includes(option.id)}"
          ${counts[option.id] === 0 ? "disabled" : ""}
          onclick="toggleWorktreeFacet('${scope}', '${option.id}')"
        >${option.label}<span class="worktree-filter-chip-count">${counts[option.id]}</span></button>
      `).join("");
      return `
        <div class="worktree-filter-bar" role="group" aria-label="按状态筛选 Worktree">
          <span class="worktree-filter-bar-label">状态</span>
          ${chips}
          <button
            type="button"
            class="worktree-filter-chip worktree-filter-chip-dirty${onlyDirty ? " selected" : ""}"
            aria-pressed="${onlyDirty}"
            ${dirtyCount === 0 && !onlyDirty ? "disabled" : ""}
            onclick="toggleWorktreeOnlyDirty('${scope}')"
          >仅看有变更<span class="worktree-filter-chip-count">${dirtyCount}</span></button>
          ${repositorySelect}
          ${activeCount > 0
            ? `<button type="button" class="worktree-filter-clear" onclick="clearWorktreeFilters('${scope}')">清除筛选（${activeCount}）</button>`
            : ""}
        </div>
      `;
    }

    function toggleWorktreeFacet(scope, facet) {
      const key = scope === "workspace" ? "workspaceWorktreeFacets" : "repoWorktreeFacets";
      const current = state[key];
      state[key] = current.includes(facet)
        ? current.filter((candidate) => candidate !== facet)
        : [...current, facet];
      renderWorktreeScope(scope);
      document.querySelector(`[data-worktree-facet="${facet}"]`)?.focus();
    }

    function toggleWorktreeOnlyDirty(scope) {
      const key = scope === "workspace" ? "workspaceWorktreeOnlyDirty" : "repoWorktreeOnlyDirty";
      state[key] = !state[key];
      renderWorktreeScope(scope);
    }

    function onWorktreeRepoMenuToggle(details) {
      positionDetailsMenu(details, { side: "bottom", align: "end" });
      if (!details.open) return;
      requestAnimationFrame(() => {
        const surface = details.querySelector(".worktree-repo-menu-surface");
        if (!surface) return;
        const items = [...surface.querySelectorAll('[role^="menuitem"]')];
        const checked = items.find(
          (item) => item.getAttribute("aria-checked") === "true"
        );
        (checked || items[0])?.focus();
      });
    }

    function setWorktreeRepo(value) {
      state.workspaceWorktreeRepo = value;
      renderWorkspaceWorktrees();
      document.querySelector(".worktree-repo-menu > summary")?.focus();
    }

    function clearWorktreeFilters(scope) {
      if (scope === "workspace") {
        state.workspaceWorktreeFacets = [];
        state.workspaceWorktreeOnlyDirty = false;
        state.workspaceWorktreeRepo = "";
        state.workspaceWorktreeFilter = "";
        state.workspaceWorktreeFilterOpen = false;
      } else {
        state.repoWorktreeFacets = [];
        state.repoWorktreeOnlyDirty = false;
        state.repoWorktreeFilter = "";
        state.repoWorktreeFilterOpen = false;
      }
      renderWorktreeScope(scope);
    }

    function renderWorktreeScope(scope) {
      if (scope === "workspace") renderWorkspaceWorktrees();
      else renderWorktrees();
    }

    function workspaceWorktreeStatus(entry) {
      if (entry.prunable) return "可清理登记";
      if (entry.primary) return "主工作目录";
      if (entry.detached) return "游离 HEAD";
      return "已登记";
    }

    function worktreeSearchValues(entry) {
      return [
        entry.repo || "",
        entry.branch || "游离 HEAD",
        workspaceWorktreeStatus(entry),
        entry.head,
        entry.path,
        entry.exists ? "目录存在" : "目录不存在",
        entry.prunable ? "可清理 可 Prune 失效" : "登记路径"
      ];
    }

    const WORKTREE_FACET_OPTIONS = [
      { id: "primary", label: "主工作目录" },
      { id: "linked", label: "已登记" },
      { id: "detached", label: "游离 HEAD" },
      { id: "locked", label: "已锁定" },
      { id: "prunable", label: "可清理登记" }
    ];

    function worktreeFacetIds(entry) {
      const facets = [];
      if (entry.primary) facets.push("primary");
      else if (!entry.prunable) facets.push("linked");
      if (entry.detached || !entry.branch) facets.push("detached");
      if (entry.locked) facets.push("locked");
      if (entry.prunable) facets.push("prunable");
      return facets;
    }

    function matchesWorktreeQuery(query, values) {
      if (!query) return true;
      return values.join(" ").toLowerCase().includes(query);
    }

    function worktreeFacetCounts(facetLists) {
      const counts = { primary: 0, linked: 0, detached: 0, locked: 0, prunable: 0 };
      facetLists.forEach((facets) =>
        facets.forEach((facet) => (counts[facet] += 1))
      );
      return counts;
    }

    function matchesWorktreeFilters(entry, options) {
      if (options.repo && entry.repo !== options.repo) return false;
      if (options.facets.length) {
        const facets = worktreeFacetIds(entry);
        if (!facets.some((facet) => options.facets.includes(facet))) return false;
      }
      if (options.onlyDirty && !(entry.changes > 0)) return false;
      return matchesWorktreeQuery(options.query, worktreeSearchValues(entry));
    }

    function filteredWorkspaceWorktrees() {
      return workspaceSnapshot.worktreeEntries.filter((entry) =>
        matchesWorktreeFilters(entry, {
          query: (state.workspaceWorktreeFilter || "").trim().toLowerCase(),
          facets: state.workspaceWorktreeFacets,
          onlyDirty: state.workspaceWorktreeOnlyDirty,
          repo: state.workspaceWorktreeRepo
        })
      );
    }

    function filterWorkspaceWorktrees(value, cursorPosition = value.length) {
      state.workspaceWorktreeFilter = value;
      renderWorkspaceWorktrees();
      const input = document.getElementById("workspaceWorktreeFilter");
      if (!input) return;
      input.focus();
      if (typeof input.setSelectionRange === "function") {
        const nextPosition = Math.min(cursorPosition, input.value.length);
        input.setSelectionRange(nextPosition, nextPosition);
      }
    }

    function toggleWorkspaceWorktreeFilter() {
      state.workspaceWorktreeFilterOpen = !state.workspaceWorktreeFilterOpen;
      if (!state.workspaceWorktreeFilterOpen) {
        state.workspaceWorktreeFilter = "";
      }
      renderWorkspaceWorktrees();
      if (state.workspaceWorktreeFilterOpen) {
        document.getElementById("workspaceWorktreeFilter")?.focus();
      }
    }

    function renderWorkspaceWorktrees() {
      const visibleWorktrees = filteredWorkspaceWorktrees();
      const activeFilterCount =
        state.workspaceWorktreeFacets.length +
        (state.workspaceWorktreeOnlyDirty ? 1 : 0) +
        (state.workspaceWorktreeRepo ? 1 : 0) +
        ((state.workspaceWorktreeFilter || "").trim() ? 1 : 0);
      document.getElementById("mainContent").innerHTML = `
        <div class="page-scroll">
          ${workspaceHeader("跨仓 Worktrees", `聚合仓库实际登记 ${workspaceSnapshot.worktrees} 个 Worktree；其中 ${workspaceSnapshot.prunableWorktrees} 个记录指向不存在的目录。`)}
          <div class="worktree-management">
            <div class="worktree-toolbar">
              <span class="worktree-toolbar-title">${icon("worktree")}已登记 Worktrees</span>
              <span class="worktree-toolbar-count">共 ${workspaceSnapshot.worktreeEntries.length} 个${activeFilterCount === 0 ? "" : ` · 已筛出 ${visibleWorktrees.length} 个`}</span>
              ${state.workspaceWorktreeFilterOpen ? `
                <input
                  id="workspaceWorktreeFilter"
                  class="worktree-filter-input"
                  type="text"
                  aria-label="筛选跨仓 Worktree"
                  autocomplete="off"
                  spellcheck="false"
                  placeholder="筛选分支、路径或状态"
                  value="${escapeHtml(state.workspaceWorktreeFilter)}"
                  oninput="filterWorkspaceWorktrees(this.value, this.selectionStart ?? this.value.length)"
                  onkeydown="if (event.key === 'Escape') { event.preventDefault(); toggleWorkspaceWorktreeFilter(); }"
                />
              ` : ""}
              ${renderButton({
                label: "筛选",
                size: "small",
                variant: "default",
                className: `panel-header-action${state.workspaceWorktreeFilterOpen ? " active" : ""}`,
                icon: icon("filter", 13),
                attributes: `aria-expanded="${state.workspaceWorktreeFilterOpen}" onclick="toggleWorkspaceWorktreeFilter()"`
              })}
              ${renderWorktreeRepoMenu()}
            </div>
            ${renderWorktreeFilterBar({
              counts: worktreeFacetCounts(
                workspaceSnapshot.worktreeEntries.map(worktreeFacetIds)
              ),
              dirtyCount: workspaceSnapshot.worktreeEntries.filter((entry) => entry.changes > 0).length,
              facets: state.workspaceWorktreeFacets,
              onlyDirty: state.workspaceWorktreeOnlyDirty,
              scope: "workspace",
              activeCount: activeFilterCount
            })}
            ${visibleWorktrees.length
              ? `<div class="worktree-grid">${visibleWorktrees.map(workspaceWorktreeCard).join("")}</div>`
              : `<div class="worktree-filter-empty">${icon("search", 18)}<strong>没有匹配的 Worktree</strong><span>可修改筛选条件后重试。</span></div>`}
          </div>
        </div>
      `;
      renderWorkspaceInspector();
    }

    function workspaceWorktreeCard(entry) {
      const status = workspaceWorktreeStatus(entry);
      const tone = entry.prunable ? "red" : entry.detached ? "yellow" : entry.primary ? "green" : "neutral";
      return `
        <article role="button" tabindex="0" class="worktree-card ${entry.primary ? "primary" : ""}" onclick="showToast('sc_code Worktree', '${entry.path}', 'worktree')" onkeydown="activateOnKey(event)">
          <div class="worktree-card-head">
            <span class="worktree-symbol">${icon("worktree")}</span>
            <span>
              <div class="worktree-title">${entry.branch || "游离 HEAD"}</div>
          <div class="worktree-branch">${icon("commit", 16)}${entry.head}</div>
            </span>
            <span class="status-pill push-right ${tone}">${status}</span>
          </div>
          <div class="worktree-path">${entry.path}</div>
          <div class="worktree-foot">
            ${entry.repo ? `<span class="worktree-repository-tag">${icon("repository", 16)}${escapeHtml(entry.repo)}</span>` : ""}
            ${entry.exists ? "目录存在" : "目录不存在"}
            ${entry.changes > 0 ? `<span class="diff-add">${entry.changes} 项变更</span>` : ""}
            <span class="spacer"></span>
            ${entry.prunable ? "" : `${icon("external", 16)}登记路径`}
          </div>
        </article>
      `;
    }

    function renderWorkspaceInspector() {
      document.getElementById("inspector").innerHTML = `
        <div class="inspector-head">
          <div class="inspector-title">${icon("panel")}Workspace 详情</div>
          <button class="icon-button inspector-close" aria-label="折叠详情面板" onclick="toggleInspector(false)">${icon("x")}</button>
        </div>
        <section class="inspector-section">
          <div class="inspector-section-title">快照摘要<span>${formatSnapshotDate(workspaceSnapshot.snapshotAt)}</span></div>
          <div class="health-ring-wrap">
            <div class="health-ring" style="--value:100%"><strong>${workspaceSnapshot.dirtyRepositories}</strong></div>
            <div>
              <div class="health-copy-title">${workspaceSnapshot.dirtyRepositories} 个仓库存在工作区改动</div>
              <div class="health-copy-text">${workspaceSnapshot.behindRepositories} 个仓库相对本地上游跟踪引用落后；本次没有 Fetch。</div>
            </div>
          </div>
        </section>
        <section class="inspector-section">
          <div class="inspector-section-title">状态统计</div>
          <div class="detail-list">
            <div class="detail-row"><span class="detail-label">工作区改动</span><span class="detail-value text-warning">${workspaceSnapshot.totalChanges}</span></div>
            <div class="detail-row"><span class="detail-label">冲突</span><span class="detail-value">${workspaceSnapshot.conflicts}</span></div>
            <div class="detail-row"><span class="detail-label">落后仓库</span><span class="detail-value text-warning">${workspaceSnapshot.behindRepositories}</span></div>
            <div class="detail-row"><span class="detail-label">累计落后</span><span class="detail-value text-warning">${workspaceSnapshot.behindCommits} commits</span></div>
            <div class="detail-row"><span class="detail-label">可清理 Worktree</span><span class="detail-value text-danger">${workspaceSnapshot.prunableWorktrees}</span></div>
          </div>
        </section>
        <section class="inspector-section">
          <div class="inspector-section-title">Workspace 信息</div>
          <div class="detail-list">
            <div class="detail-row"><span class="detail-label">根目录</span><span class="detail-value">${workspaceSnapshot.rootPath}</span></div>
            <div class="detail-row"><span class="detail-label">仓库</span><span class="detail-value">${workspaceSnapshot.totalRepositories}</span></div>
            <div class="detail-row"><span class="detail-label">配置仓库</span><span class="detail-value">${workspaceSnapshot.configuredRepositories}</span></div>
            <div class="detail-row"><span class="detail-label">本地额外仓库</span><span class="detail-value">${workspaceSnapshot.localExtraRepositories}</span></div>
            <div class="detail-row"><span class="detail-label">远程主机</span><span class="detail-value">${workspaceSnapshot.remoteHost}</span></div>
            <div class="detail-row"><span class="detail-label">Fetch</span><span class="detail-value text-warning">未执行</span></div>
          </div>
        </section>
        <section class="inspector-section">
          <div class="inspector-section-title">设计预览操作</div>
          <div class="quick-grid">
            ${renderButton({
              label: "重新扫描",
              size: "small",
              variant: "quick",
              icon: icon("refresh"),
              attributes: 'onclick="runOperation(\'scan\', event.currentTarget)"'
            })}
            ${renderButton({
              label: "打开目录",
              size: "small",
              variant: "quick",
              icon: icon("folder"),
              attributes: 'onclick="showToast(\'打开目录\', \'将调用系统文件管理器打开 Workspace 根目录。\', \'folder\')"'
            })}
            ${renderButton({
              label: "导出配置",
              size: "small",
              variant: "quick",
              icon: icon("upload"),
              attributes: 'onclick="showToast(\'导出配置\', \'导出可共享的 .gitnest/workspace.json。\', \'upload\')"'
            })}
            ${renderButton({
              label: "打开终端",
              size: "small",
              variant: "quick",
              icon: icon("terminal"),
              attributes: 'onclick="openDefaultTerminal(\'workspace\')"'
            })}
          </div>
        </section>
      `;
      syncAccessibleHints();
    }

    function renderRepositoryOverview() {
      const repo = currentRepo();
      const commits = currentCommits().slice(0, 3);
      document.getElementById("mainContent").innerHTML = `
        <div class="page-scroll">
          ${repositoryHero(repo)}
          <div class="metric-grid">
            ${metricCard("fileCode", "工作区变更", String(repo.changes), repo.changes ? `${repo.untracked} 个未跟踪 · ${repo.staged} 个已暂存 · ${repo.unstaged} 个未暂存` : "工作区干净", "var(--yellow)", "var(--yellow-soft)")}
            ${metricCard("arrowUp", "领先远程", String(repo.ahead), repo.ahead ? `${repo.branch} · 准备 Push` : `当前分支：${repo.branch}`, "var(--green)", "var(--green-soft)")}
            ${metricCard("arrowDown", "落后远程", String(repo.behind), repo.upstream ? `上游：${repo.upstream} · ${repo.behind ? "可执行快进更新" : "无需 Pull"}` : repo.behind ? "可执行快进更新 · 未配置上游" : "未配置上游", "var(--blue)", "var(--blue-soft)")}
            ${metricCard("worktree", "Worktrees", String(repo.worktrees), `${repo.prunable} 个可清理 · ${repo.detached} 个 detached`, "var(--purple)", "rgba(174,140,255,.13)")}
          </div>
          <div class="dashboard-grid repository-dashboard">
            <section class="panel">
              <div class="panel-header">
                <div class="panel-title">${icon("history")}最近提交</div>
                <span class="panel-caption">快照采集 ${commits.length} 条</span>
                <button class="panel-action" onclick="setRepoTab('history')">打开历史视图</button>
              </div>
              <div class="commit-list">${commits.map(renderCommitRow).join("")}</div>
            </section>
          </div>
        </div>
      `;
      renderRepositoryInspector();
    }

    function repositoryHero(repo) {
      const statusTone = repo.conflicts ? "red" : repo.changes ? "yellow" : "green";
      const statusText = repo.conflicts ? `${repo.conflicts} 个冲突需要解决` : repo.changes ? `${repo.changes} 项未提交变更` : "工作区干净";
      return `
        <section class="repo-hero">
          <span class="repo-hero-icon">${icon("repository", 25)}</span>
          <span class="repo-hero-copy">
            <div class="repo-hero-title">${repo.name}</div>
            <div class="repo-hero-path">${repoAbsolutePath(repo)}</div>
            <div class="repo-hero-status">
              <span class="status-pill ${statusTone}">${repo.conflicts ? icon("alert", 12) : repo.changes ? "M" : icon("check", 12)}${statusText}</span>
              <span class="status-pill neutral">${icon("branch", 12)}${repo.branch}</span>
              ${repo.behind ? `<span class="status-pill blue">${icon("arrowDown", 12)}本地引用显示落后 ${repo.behind}</span>` : ""}
              <span class="status-pill neutral">${repo.listed ? "repos.yaml" : "本地发现"}</span>
            </div>
          </span>
          <span class="repo-hero-actions">
            ${renderButton({
              label: "打开目录",
              size: "small",
              variant: "default",
              icon: icon("folder"),
              fullWidth: true,
              attributes: `onclick="showToast('打开目录', '${repo.name} 已准备在文件管理器中打开。', 'folder')"`
            })}
            ${renderButton({
              label: repo.changes ? "查看变更" : "查看状态",
              size: "small",
              variant: "primary",
              icon: icon("fileCode"),
              fullWidth: true,
              attributes: 'onclick="setRepoTab(\'changes\')"'
            })}
          </span>
        </section>
      `;
    }

    function renderCommitRow(commit, index = 0) {
      const isSelected =
        state.tab === "history"
          ? state.historyDetailOpen && state.selectedCommit === commit.hash
          : state.selectedCommit === commit.hash;
      return `
        <div role="button" tabindex="0" class="commit-row ${isSelected ? "selected" : ""}" aria-current="${isSelected}" onclick="selectCommit('${commit.hash}')" onkeydown="activateOnKey(event)">
          <div class="commit-graph ${index === 2 ? "branch" : ""}" style="--lane-color:${commit.color}">
            <span class="commit-node"></span>
          </div>
          <div class="commit-message">
            <div class="commit-subject">${commit.subject}</div>
            <div class="commit-meta">
              ${commit.refs.map((ref) => `<span class="ref-label ${ref.startsWith("origin") ? "remote" : ""}">${ref}</span>`).join("")}
            </div>
          </div>
          <div class="commit-time" title="提交日期">${commit.time}</div>
          <div class="commit-author">${commit.author}</div>
          <div
            class="commit-id"
            role="button"
            tabindex="0"
            aria-label="复制 Commit ID ${commit.hash}"
            title="点击复制 Commit ID"
            onclick="event.stopPropagation(); copyText('${commit.hash}', 'Commit ID')"
            onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); event.stopPropagation(); copyText('${commit.hash}', 'Commit ID'); }"
          >${commit.hash}</div>
        </div>
      `;
    }

      const statusTitle = repo.changes
        ? "存在本地工作区改动"
        : repo.behind
          ? "本地上游跟踪引用显示落后"
          : "工作区与本地上游引用一致";
      const statusCopy = repo.changes
        ? `${repo.untracked} 个未跟踪文件；提交、暂存与文件内容均未被本次快照修改。`
        : repo.behind
          ? `当前分支相对 ${repo.upstream} 的本地引用落后 ${repo.behind} 个提交。由于未 Fetch，远程实时状态可能不同。`
          : "没有发现工作区改动；当前分支相对本地上游跟踪引用无领先或落后。";
      document.getElementById("inspector").innerHTML = `
        <div class="inspector-head">
          <div class="inspector-title">${icon("repository")}仓库详情</div>
          <button class="icon-button inspector-close" aria-label="折叠详情面板" onclick="toggleInspector(false)">${icon("x")}</button>
        </div>
        <section class="inspector-section">
          <div class="inspector-section-title">仓库状态<span>快照 ${formatSnapshotDate(workspaceSnapshot.snapshotAt)}</span></div>
          <div class="health-ring-wrap">
            <div class="health-ring" style="--value:100%"><strong>${statusValue}</strong></div>
            <div>
              <div class="health-copy-title">${statusTitle}</div>
              <div class="health-copy-text">${statusCopy}</div>
            </div>
          </div>
        </section>
        <section class="inspector-section">
          <div class="inspector-section-title">当前上下文</div>
          <div class="detail-list">
            <div class="detail-row"><span class="detail-label">分支</span><span class="detail-value">${repo.branch}</span></div>
            <div class="detail-row"><span class="detail-label">上游</span><span class="detail-value">${repo.upstream || "—"}</span></div>
            <div class="detail-row"><span class="detail-label">HEAD</span><span class="detail-value">${repo.head}</span></div>
            <div class="detail-row"><span class="detail-label">变更</span><span class="detail-value">${repo.changes}</span></div>
            <div class="detail-row"><span class="detail-label">Worktrees</span><span class="detail-value">${repo.worktrees}</span></div>
            <div class="detail-row"><span class="detail-label">来源</span><span class="detail-value">${repo.listed ? "repos.yaml" : "目录扫描发现"}</span></div>
          </div>
        </section>
        <section class="inspector-section">
          <div class="inspector-section-title">本地跟踪引用</div>
          <div class="operation-list">
            <div class="operation-item">
              <div class="operation-head">
                <span class="operation-icon">${icon("branch")}</span>
                <span class="operation-name">${repo.upstream || "未设置上游"}</span>
                <span class="operation-state">${repo.ahead ? `↑ ${repo.ahead}` : ""}${repo.behind ? ` ↓ ${repo.behind}` : !repo.ahead ? "已同步" : ""}</span>
              </div>
              <div class="operation-foot"><span>本次检查</span><span class="text-warning">未 Fetch</span></div>
            </div>
          </div>
        </section>
        <section class="inspector-section">
          <div class="inspector-section-title">快捷操作</div>
          <div class="quick-grid">
            <button class="quick-button" onclick="setRepoTab('changes')">${icon("fileCode")}查看变更</button>
            <button class="quick-button" onclick="setRepoTab('history')">${icon("history")}提交历史</button>
            <button class="quick-button" onclick="setRepoTab('branches')">${icon("branch")}分支管理</button>
            <button class="quick-button" onclick="setRepoTab('worktrees')">${icon("worktree")}Worktrees</button>
          </div>
        </section>
      `;
      syncAccessibleHints();
    }

    function renderChanges() {
      const repo = currentRepo();
      const allChangedFiles = currentChangedFiles();
      const changedFiles = filteredChangedFiles();
      const filterQuery = (state.changeFilter || "").trim();
      const treeDirectoryKeys =
        collectChangeTreeDirectoryKeys(changedFiles);
      const changeTreeScopeKey = `${repo.id}\u0001${filterQuery}`;
      if (state.changeTreeScopeKey !== changeTreeScopeKey) {
        state.changeTreeScopeKey = changeTreeScopeKey;
        state.collapsedChangeTreeNodes =
          state.changeTreeDirectoriesCollapsedPreference
            ? new Set(treeDirectoryKeys)
            : new Set();
      }
      const hasTreeDirectories = treeDirectoryKeys.length > 0;
      const hasExpandedTreeDirectories = treeDirectoryKeys.some(
        (key) => !state.collapsedChangeTreeNodes.has(key)
      );
      const canToggleTreeDirectories =
        state.changeViewMode === "tree" && hasTreeDirectories;
      const treeDirectoriesToggleCollapses =
        state.changeViewMode === "tree"
          ? hasExpandedTreeDirectories
          : !state.changeTreeDirectoriesCollapsedPreference;
      const treeDirectoriesToggleLabel =
        treeDirectoriesToggleCollapses
          ? "收起目录"
          : "展开目录";
      const treeDirectoriesToggleTitle =
        state.changeViewMode !== "tree"
          ? "切换到树形式查看后可用"
          : !hasTreeDirectories
            ? "当前变更中没有目录"
            : treeDirectoriesToggleCollapses
              ? "收起全部目录，并记住此偏好"
              : "展开全部目录，并记住此偏好";
      const selected = changedFiles.find((file) => file.path === state.selectedFile) || changedFiles[0];
      if (!allChangedFiles.length) {
        state.selectedFile = "";
        document.getElementById("mainContent").innerHTML = `
          <div class="page-scroll repository-page repository-page-changes">
            <div class="empty-state repository-empty-state">
              <span class="empty-state-icon">${icon("check", 20)}</span>
              <div>
                <strong>工作区干净</strong>
                <p>没有 staged、unstaged、untracked 或冲突文件。</p>
              </div>
            </div>
          </div>
        `;
        renderChangesInspector();
        return;
      }
      state.selectedFile = selected?.path || "";
      const standaloneDiffUrl = new URL("./diff-viewer.html", window.location.href);
      standaloneDiffUrl.searchParams.set("repo", repo.id);
      standaloneDiffUrl.searchParams.set("file", state.selectedFile);
      document.getElementById("mainContent").innerHTML = `
        <div class="page-scroll repository-page repository-page-changes">
          <div class="changes-page">
            <section class="changes-layout">
              <div class="changes-file-pane">
            <div class="file-pane-header">
              <strong>文件变更</strong>
              <div class="file-pane-tools">
                <label class="change-filter-field">
                  <input id="changeFilter" type="text" aria-label="筛选变更文件" autocomplete="off" spellcheck="false" placeholder="筛选变更…" value="${escapeHtml(state.changeFilter)}" oninput="filterChanges(this.value, this.selectionStart ?? this.value.length)" />
                  ${filterQuery ? `<button type="button" class="change-filter-clear" aria-label="清除变更筛选" title="清除变更筛选" onclick="clearChangeFilter()">${icon("x", 12)}</button>` : ""}
                </label>
                <details class="toolbar-menu change-view-menu" data-dropdown-id="change-view" ontoggle="positionDetailsMenu(event.currentTarget, { side: 'bottom' })">
                  <summary class="icon-button" aria-label="打开变更文件视图菜单" aria-haspopup="menu" title="变更文件视图">${icon("more", 14)}</summary>
                  <div class="toolbar-menu-popover menu-surface" role="menu">
                    ${renderMenuItem({
                      label:
                        state.changeViewMode === "tree"
                          ? "以列表形式查看"
                          : "以树形式查看",
                      leading: icon(
                        state.changeViewMode === "tree"
                          ? "fileCode"
                          : "folder",
                        14
                      ),
                      attributes: 'onclick="toggleChangeViewMode()"'
                    })}
                    ${renderMenuItem({
                      label: treeDirectoriesToggleLabel,
                      leading: icon(
                        treeDirectoriesToggleCollapses
                          ? "chevronRight"
                          : "chevronDown",
                        14
                      ),
                      disabled: !canToggleTreeDirectories,
                      title: treeDirectoriesToggleTitle,
                      attributes:
                        'onclick="toggleAllChangeTreeDirectories()"'
                    })}
                  </div>
                </details>
              </div>
            </div>
            <div class="change-file-list">
              ${changedFiles.length ? `
                ${renderFileSection("已暂存", changedFiles.filter((file) => file.staged), "staged")}
                ${renderFileSection("未暂存", changedFiles.filter((file) => !file.staged && file.status !== "untracked"), "unstaged")}
                ${renderFileSection("未跟踪", changedFiles.filter((file) => file.status === "untracked"), "untracked")}
              ` : `
                <div class="change-filter-empty">
                  ${icon("search", 18)}
                  <strong>没有匹配的变更</strong>
                  <span>尝试文件名、目录或状态。</span>
                </div>
              `}
            </div>
            ${repositoryDiffWorkspaceConfiguration.extensions.commitRegion ? renderCommitComposer(repo) : ""}
          </div>
              ${renderRepositoryDiffPanel(
                selected,
                standaloneDiffUrl,
                repositoryDiffWorkspaceConfiguration
              )}
            </section>
          </div>
        </div>
      `;
      renderChangesInspector();
    }

    function renderCommitComposer(repo) {
      const staged = repo.staged;
      const conflicted = repo.conflicts;
      const hasChanges =
        repo.staged + repo.unstaged + repo.untracked > 0;
      const statusTone = conflicted > 0 ? "red" : staged > 0 ? "green" : "neutral";
      const statusText = conflicted > 0 ? `${conflicted} 个冲突` : `${staged} 个已暂存`;
      const canCommit = hasChanges && conflicted === 0 && Boolean(state.commitDraft.message.trim());
      const hasCommitScope =
        staged > 0 || repo.unstaged + repo.untracked > 0;

      return `
        <article class="panel commit-composer" style="height: ${state.commitPanelHeight}px">
          <div
            class="commit-resize-handle"
            role="separator"
            tabindex="0"
            aria-orientation="horizontal"
            aria-label="调整提交区域高度"
            aria-valuemin="${diffCommitPanelHeightMin}"
            aria-valuemax="${diffCommitPanelHeightMax}"
            aria-valuenow="${state.commitPanelHeight}"
            title="拖动调整提交区域高度"
            onpointerdown="startCommitPanelResize(event)"
            onkeydown="handleCommitPanelResizeKeydown(event)"
          ></div>
          <header class="panel-header">
            <label class="commit-push-toggle" for="commitPush">
              <input id="commitPush" name="commit-push" type="checkbox" ${state.commitDraft.push ? "checked" : ""} onchange="updateCommitDraft()" />
              <span>推送到远程</span>
            </label>
            <span class="status-pill ${statusTone}">${statusText}</span>
          </header>
          <form class="commit-form" onsubmit="event.preventDefault(); completePreviewCommit(event.submitter || this.querySelector('.commit-submit-button'))">
            ${renderTextarea({
              id: "commitMessage",
              value: state.commitDraft.message,
              size: "small",
              fullWidth: true,
              ariaLabel: "提交信息",
              autocomplete: "off",
              maxLength: 100000,
              name: "commit-message",
              placeholder: "输入提交信息…",
              rows: 3,
              textareaClassName: "commit-message",
              attributes: 'oninput="updateCommitDraft()"'
            })}
            <div class="commit-form-actions">
              ${renderButton({
                label: "AI 生成",
                ariaLabel: "使用 AI 生成提交信息",
                title: !state.aiSettings.enabled
                  ? "请先在设置中启用 AI 提交信息"
                  : !state.aiSettings.url.trim() ||
                      !state.aiSettings.model.trim() ||
                      !state.aiSettings.apiKey.trim()
                    ? "请先在设置中完成 AI 提交信息配置"
                    : !hasCommitScope
                      ? "没有可提交的变更"
                      : "根据当前提交范围生成提交信息",
                size: "small",
                variant: "default",
                iconOnly: true,
                disabled:
                  !state.aiSettings.enabled ||
                  !state.aiSettings.url.trim() ||
                  !state.aiSettings.model.trim() ||
                  !state.aiSettings.apiKey.trim() ||
                  !hasCommitScope,
                className: "commit-ai-button",
                icon: icon("sparkle", 13),
                attributes: 'onclick="generateCommitMessageWithAI()"'
              })}
              ${renderButton({
                label: staged > 0 ? "提交已暂存变更" : "提交全部变更",
                size: "small",
                variant: "primary",
                disabled: !canCommit,
                className: "commit-submit-button",
                icon: icon("check"),
                type: "submit"
              })}
            </div>
          </form>
        </article>
      `;
    }

    function toggleChangeSection(mode) {
      const files = filteredChangedFiles();
      const hasFiles = files.some((file) =>
        mode === "untracked"
          ? file.status === "untracked"
          : mode === "staged"
            ? file.status !== "untracked" && file.staged
            : file.status !== "untracked" && !file.staged
      );

      if (!hasFiles) {
        const nextExpanded = new Set(
          state.expandedEmptyChangeSections
        );
        if (nextExpanded.has(mode)) {
          nextExpanded.delete(mode);
        } else {
          nextExpanded.add(mode);
        }
        state.expandedEmptyChangeSections = nextExpanded;
      } else {
        const nextCollapsed = new Set(
          state.collapsedChangeSections
        );
        if (nextCollapsed.has(mode)) {
          nextCollapsed.delete(mode);
        } else {
          nextCollapsed.add(mode);
        }
      state.collapsedChangeSections = nextCollapsed;
      }
      renderChanges();
    }

    function changeSectionFiles(mode) {
      return filteredChangedFiles().filter((file) =>
        mode === "untracked"
          ? file.status === "untracked"
          : mode === "staged"
            ? file.status !== "untracked" && file.staged
            : file.status !== "untracked" && !file.staged
      );
    }

    function toggleChangeSectionStage(mode) {
      const files = changeSectionFiles(mode);
      if (!files.length) return;
      const nextStaged = mode !== "staged";
      files.forEach((file) => {
        file.staged = nextStaged;
      });
      renderChanges();
      showToast(
        nextStaged ? "暂存" : "取消暂存",
        `${files.length} 个文件（原型预览，不执行 Git 命令）`,
        nextStaged ? "plus" : "minus"
      );
    }

    function discardChangeSection(mode) {
      const files = changeSectionFiles(mode);
      if (!files.length) return;
      const discarded = new Set(files.map((file) => file.path));
      const repoId = currentRepo().id;
      changedFilesByRepo[repoId] = currentChangedFiles().filter(
        (file) => !discarded.has(file.path)
      );
      if (discarded.has(state.selectedFile)) {
        state.selectedFile = "";
      }
      renderChanges();
      showToast(
        "放弃更改",
        `${discarded.size} 个文件（原型预览，不执行 Git 命令）`,
        "undo"
      );
    }

    function discardChangeFile(path) {
      const repoId = currentRepo().id;
      const target = currentChangedFiles().find(
        (file) => file.path === path
      );
      if (!target) return;
      changedFilesByRepo[repoId] = currentChangedFiles().filter(
        (file) => file.path !== path
      );
      if (state.selectedFile === path) {
        state.selectedFile = "";
      }
      renderChanges();
      showToast(
        "放弃更改",
        `${path}（原型预览，不执行 Git 命令）`,
        "undo"
      );
    }

    function toggleChangeViewMode() {
      state.changeViewMode =
        state.changeViewMode === "tree" ? "list" : "tree";
      try {
        localStorage.setItem(
          "gitnest-change-view-mode",
          state.changeViewMode
        );
      } catch {
        // 文件预览环境可能禁用持久化；视图切换本身仍然有效。
      }
      renderChanges();
    }

    function toggleChangeTree(key) {
      const nextCollapsed = new Set(
        state.collapsedChangeTreeNodes
      );
      if (nextCollapsed.has(key)) {
        nextCollapsed.delete(key);
      } else {
        nextCollapsed.add(key);
      }
      state.collapsedChangeTreeNodes = nextCollapsed;
      renderChanges();
    }

    function toggleAllChangeTreeDirectories() {
      const directoryKeys = collectChangeTreeDirectoryKeys(
        filteredChangedFiles()
      );
      if (
        state.changeViewMode !== "tree" ||
        directoryKeys.length === 0
      ) {
        return;
      }

      const collapsed = directoryKeys.some(
        (key) => !state.collapsedChangeTreeNodes.has(key)
      );
      state.collapsedChangeTreeNodes = collapsed
        ? new Set(directoryKeys)
        : new Set();
      state.changeTreeDirectoriesCollapsedPreference =
        collapsed;
      try {
        localStorage.setItem(
          changeTreeDirectoriesCollapsedStorageKey,
          String(collapsed)
        );
      } catch {
        // 文件预览环境可能禁用持久化；目录状态仍会在本次预览中生效。
      }
      renderChanges();
    }

    function collectChangeTreeDirectoryKeys(files) {
      const keys = new Set();

      files.forEach((file) => {
        const mode = file.status === "untracked"
          ? "untracked"
          : file.staged
            ? "staged"
            : "unstaged";
        let path = "";
        const segments = file.path
          .replace(/\\/g, "/")
          .split("/")
          .filter(Boolean);

        segments.slice(0, -1).forEach((segment) => {
          path = path ? `${path}/${segment}` : segment;
          keys.add(`${mode}:${path}`);
        });
      });

      return [...keys].sort();
    }

    function renderChangeFileRow(file, depth = 0) {
      const statusLetter = {
        modified: "M",
        added: "A",
        deleted: "D",
        untracked: "?"
      };
      const stats = diffPreviewStats(file);
      const displayName = depth > 0
        ? file.path.replace(/\\/g, "/").split("/").pop() || file.path
        : file.path;
      const indent = depth > 0
        ? ` style="padding-left:calc(var(--space-2) + ${depth} * var(--space-4))"`
        : "";
      return `
        <div class="file-row ${state.selectedFile === file.path ? "active" : ""}" data-file-path="${escapeHtml(file.path)}" oncontextmenu="openChangeFileContextMenu(event, this.dataset.filePath)"${indent}>
          <button type="button" class="file-path file-select-button" aria-current="${state.selectedFile === file.path}" data-file-path="${escapeHtml(file.path)}" onclick="selectFile(this.dataset.filePath)">
            <strong class="file-name" title="${escapeHtml(file.path)}">${escapeHtml(displayName)}</strong>
            <span class="file-meta">
              <span class="file-status-letter ${file.status}">${statusLetter[file.status] || "M"}</span>
              <small class="file-dir">${changeFileStatusLabel(file)}</small>
              <span class="file-change-stats" aria-label="新增 ${stats.additions} 行，删除 ${stats.deletions} 行">
                <strong>+${stats.additions}</strong>
                <em>-${stats.deletions}</em>
              </span>
            </span>
          </button>
          <div class="file-actions">
            ${file.staged ? "" : renderButton({
              label: `放弃更改 ${file.path}`,
              ariaLabel: `放弃更改 ${file.path}`,
              title: "放弃更改",
              size: "small",
              variant: "icon",
              className: "stage-toggle",
              icon: icon("undo", 14),
              attributes: `onclick="event.stopPropagation(); discardChangeFile(this.closest('.file-row').dataset.filePath)"`
            })}
            ${renderButton({
              label: `${file.staged ? "取消暂存" : "暂存"} ${file.path}`,
              ariaLabel: `${file.staged ? "取消暂存" : "暂存"} ${file.path}`,
              title: file.staged ? "取消暂存" : "暂存",
              size: "small",
              variant: "icon",
              className: "stage-toggle",
              icon: icon(file.staged ? "minus" : "plus", 14),
              attributes: `onclick="event.stopPropagation(); showToast('${file.staged ? "取消暂存" : "暂存文件"}', '${file.path}', '${file.staged ? "minus" : "plus"}')"`
            })}
          </div>
        </div>
      `;
    }

    function buildChangeTree(files) {
      const root = {
        name: "",
        path: "",
        directory: true,
        children: []
      };

      files.forEach((file) => {
        const segments = file.path
          .replace(/\\/g, "/")
          .split("/")
          .filter(Boolean);
        let parent = root;

        segments.forEach((segment, index) => {
          const directory = index < segments.length - 1;
          const path = directory
            ? `${parent.path}/${segment}`.replace(/^\/+/, "")
            : file.path;
          let node = parent.children.find((item) =>
            item.name === segment &&
            item.directory === directory
          );
          if (!node) {
            node = {
              name: segment,
              path,
              directory,
              children: []
            };
            parent.children.push(node);
          }
          if (directory) {
            parent = node;
          } else {
            node.file = file;
          }
        });
      });

      return sortChangeTreeNodes(root.children);
    }

    function sortChangeTreeNodes(nodes) {
      return [...nodes]
        .sort((left, right) => {
          if (left.directory !== right.directory) {
            return left.directory ? -1 : 1;
          }
          return left.name.localeCompare(
            right.name,
            undefined,
            { numeric: true, sensitivity: "base" }
          );
        })
        .map((node) => ({
          ...node,
          children: sortChangeTreeNodes(node.children)
        }));
    }

    function renderChangeTree(files, mode) {
      return renderChangeTreeNodes(
        compactChangeTreeNodes(
          buildChangeTree(files)
        ),
        mode
      );
    }

    function compactChangeTreeNodes(nodes) {
      return nodes.map((node) => {
        if (!node.directory) {
          return node;
        }

        let terminal = node;
        const names = [node.name];

        while (
          terminal.children.length === 1 &&
          terminal.children[0]?.directory
        ) {
          terminal = terminal.children[0];
          names.push(terminal.name);
        }

        return {
          ...terminal,
          name: names.join(" \\ "),
          children: compactChangeTreeNodes(terminal.children)
        };
      });
    }

    function renderChangeTreeNodes(nodes, mode, depth = 0) {
      return nodes.map((node) => {
        if (!node.directory && node.file) {
          return renderChangeFileRow(node.file, depth);
        }

        const key = `${mode}:${node.path}`;
        const collapsed =
          state.collapsedChangeTreeNodes.has(key);
        return `
          <button type="button" class="change-tree-directory${collapsed ? " collapsed" : ""}" aria-expanded="${!collapsed}" data-tree-key="${escapeHtml(key)}" onclick="toggleChangeTree(this.dataset.treeKey)" style="padding-left:calc(var(--space-2) + ${depth} * var(--space-4))">
            ${icon("chevronRight", 13)}
            ${icon("folder", 13)}
            <span>${escapeHtml(node.name)}</span>
          </button>
          ${collapsed ? "" : renderChangeTreeNodes(node.children, mode, depth + 1)}
        `;
      }).join("");
    }

    function renderFileSection(title, files, mode) {
      const isEmpty = files.length === 0;
      const isCollapsed =
        state.collapsedChangeSections.has(mode) ||
        (isEmpty &&
          !state.expandedEmptyChangeSections.has(mode));
      const bodyId = `change-file-section-${mode}`;
      const isStagedSection = mode === "staged";
      const canGroupStage = files.length > 0;
      const canGroupDiscard = files.length > 0 && !isStagedSection;
      const hasActions = canGroupStage || canGroupDiscard;
      return `
        <section class="file-section ${isCollapsed ? "collapsed" : ""}${isEmpty ? " empty" : ""}">
          <div class="file-section-header${hasActions ? " has-actions" : ""}">
            <button type="button" class="file-section-title" aria-expanded="${!isCollapsed}" aria-controls="${bodyId}" onclick="toggleChangeSection('${mode}')">
              ${icon("chevronDown", 13)}
              <span class="file-section-label">${title}</span>
            </button>
            <span class="file-section-tail">
              <span class="file-section-count">${files.length}</span>
              <span class="file-section-actions">
                ${canGroupDiscard
                  ? renderButton({
                      label: `放弃${title}分组的更改`,
                      ariaLabel: `放弃${title}分组的更改`,
                      title: `放弃更改（${files.length} 个文件）`,
                      size: "small",
                      variant: "icon",
                      className: "stage-toggle",
                      icon: icon("undo", 14),
                      attributes: `onclick="event.stopPropagation(); discardChangeSection('${mode}')"`
                    })
                  : ""}
                ${canGroupStage
                  ? renderButton({
                      label: `${isStagedSection ? "取消暂存" : "暂存"}${title}分组的文件`,
                      ariaLabel: `${isStagedSection ? "取消暂存" : "暂存"}${title}分组的文件`,
                      title: `${isStagedSection ? "取消暂存" : "暂存"}（${files.length} 个文件）`,
                      size: "small",
                      variant: "icon",
                      className: "stage-toggle",
                      icon: icon(isStagedSection ? "minus" : "plus", 14),
                      attributes: `onclick="event.stopPropagation(); toggleChangeSectionStage('${mode}')"`
                    })
                  : ""}
              </span>
            </span>
          </div>
            <div class="file-section-body" id="${bodyId}" aria-hidden="${isCollapsed}" ${isCollapsed ? "inert" : ""}>
              <div class="file-section-body-inner">
                ${isEmpty
                ? `<button type="button" class="file-section-empty" aria-label="收起${title}分组" onclick="toggleChangeSection('${mode}')">暂无${title}文件</button>`
                : state.changeViewMode === "tree"
                  ? renderChangeTree(files, mode)
                  : files.map((file) => renderChangeFileRow(file)).join("")}
            </div>
          </div>
        </section>
      `;
    }

    function renderChangesInspector() {
      const repo = currentRepo();
      const changedFiles = filteredChangedFiles();
      const selected = changedFiles.find((file) => file.path === state.selectedFile) || changedFiles[0];
      document.getElementById("inspector").innerHTML = `
        <div class="inspector-head">
          <div class="inspector-title">${icon("fileCode")}变更详情</div>
          <button class="icon-button inspector-close" aria-label="折叠详情面板" onclick="toggleInspector(false)">${icon("x")}</button>
        </div>
        <section class="inspector-section">
          <div class="inspector-section-title">只读快照<span>${formatSnapshotDate(workspaceSnapshot.snapshotAt)}</span></div>
          <h3 class="selected-commit-title">${repo.changes ? `${repo.changes} 项工作区改动` : "工作区干净"}</h3>
          <p class="selected-commit-body">${repo.changes ? "只采集 Git 状态，不读取文件内容，也不会执行暂存或提交。" : "未发现已暂存、未暂存、未跟踪或冲突文件。"}</p>
        </section>
        <section class="inspector-section">
          <div class="inspector-section-title">变更统计</div>
          <div class="detail-list">
            <div class="detail-row"><span class="detail-label">全部</span><span class="detail-value">${repo.changes}</span></div>
            <div class="detail-row"><span class="detail-label">已暂存</span><span class="detail-value">${repo.staged}</span></div>
            <div class="detail-row"><span class="detail-label">未暂存</span><span class="detail-value">${repo.unstaged}</span></div>
            <div class="detail-row"><span class="detail-label">未跟踪</span><span class="detail-value ${repo.untracked ? "text-warning" : ""}">${repo.untracked}</span></div>
            <div class="detail-row"><span class="detail-label">冲突</span><span class="detail-value">${repo.conflicts}</span></div>
          </div>
        </section>
        ${selected ? `
          <section class="inspector-section">
            <div class="inspector-section-title">当前文件</div>
            <div class="changed-file-list">
              <div class="changed-file-item">${icon("fileCode", 13)}<span>${selected.path}</span><span class="status-pill blue">${changeFileStatusLabel(selected)}</span></div>
            </div>
            <div class="quick-grid">
              <button class="quick-button" onclick="copyText('${selected.path}', '文件路径')">${icon("copy")}复制路径</button>
              <button class="quick-button" onclick="showToast('打开目录', '设计预览不会调用系统文件管理器。', 'folder')">${icon("folder")}打开目录</button>
            </div>
          </section>
        ` : ""}
      `;
      syncAccessibleHints();
    }

    function updateCommitDraft() {
      const message = document.getElementById("commitMessage");
      const push = document.querySelector('[name="commit-push"]');
      if (message) state.commitDraft.message = message.value;
      if (push) state.commitDraft.push = push.checked;
      state.commitDirty = JSON.stringify(state.commitDraft) !== state.commitBaseline;
      const commitButton = document.querySelector(".commit-composer button[type='submit']");
      if (commitButton) {
        const repo = currentRepo();
        const hasChanges =
          repo.staged + repo.unstaged + repo.untracked > 0;
        commitButton.disabled =
          !hasChanges ||
          repo.conflicts > 0 ||
          !message?.value.trim();
      }
      if (message?.value.trim()) {
        message.removeAttribute("aria-invalid");
      }
      const draftStatus = document.querySelector(".inspector-head > .status-pill");
      if (state.commitDirty && !draftStatus) {
        document.querySelector(".inspector-title")?.insertAdjacentHTML("afterend", '<span class="status-pill yellow">未保存</span>');
      } else if (!state.commitDirty && draftStatus?.textContent.trim() === "未保存") {
        draftStatus.remove();
      }
    }

    function completePreviewCommit(trigger) {
      const message = document.getElementById("commitMessage");
      const repo = currentRepo();
      const hasChanges =
        repo.staged + repo.unstaged + repo.untracked > 0;
      if (!message?.value.trim()) {
        message?.setAttribute("aria-invalid", "true");
        showErrorToast("无法提交", "请输入提交信息。");
        message?.focus();
        return;
      }
      if (repo.conflicts > 0) {
        showErrorToast("无法提交", "请先解决所有冲突。");
        return;
      }
      if (!hasChanges) {
        showErrorToast("无法提交", "当前仓库没有可提交的变更。");
        return;
      }
      startButtonLoading(trigger);
      setTimeout(() => {
        state.commitBaseline = JSON.stringify(state.commitDraft);
        state.commitDirty = false;
        stopButtonLoading(trigger);
        renderChangesInspector();
        const scope = repo.staged > 0
          ? "当前只会提交已暂存变更。"
          : "当前会提交全部未暂存和未跟踪变更。";
        showToast(
          "提交信息已就绪",
          `${scope} 这是设计预览，不会执行本地 Git 命令。`,
          "commit"
        );
      }, 900);
    }

    function discardCommitDraft() {
      state.commitDraft = JSON.parse(state.commitBaseline);
      state.commitDirty = false;
    }

    function shouldConfirmDiscardCommit() {
      return state.view === "repository" && state.tab === "changes" && state.commitDirty;
    }

    function withCommitDraftGuard(action) {
      if (!shouldConfirmDiscardCommit()) {
        action();
        return;
      }
      openConfirmDialog({
        title: "放弃未保存的提交信息？",
        description: "提交信息和推送选项尚未保存。离开后这些修改会被丢弃。",
        actionLabel: "放弃并离开",
        onConfirm: () => {
          discardCommitDraft();
          action();
        }
      });
    }

    function repositoryWorktreeRows(repo) {
      if (repo.id === "workspace-root") {
        return workspaceSnapshot.worktreeEntries.map((entry) => ({
          values: worktreeSearchValues(entry),
          facets: worktreeFacetIds(entry),
          changes: entry.changes || 0,
          render: () => workspaceWorktreeCard(entry)
        }));
      }
      const path = repoAbsolutePath(repo);
      const status = repo.changes ? `${repo.changes} 项变更` : "工作区干净";
      return [
        {
          values: [
            "当前工作目录",
            "主工作目录",
            repo.branch,
            repo.head,
            path,
            status
          ],
          facets: ["primary"],
          changes: repo.changes || 0,
          render: () =>
            repositoryWorktreeCard(
              "当前工作目录",
              repo.branch,
              path,
              repo.head,
              status,
              true,
              false
            )
        }
      ];
    }

    function filteredRepoWorktreeRows(repo) {
      const query = (state.repoWorktreeFilter || "").trim().toLowerCase();
      const facets = state.repoWorktreeFacets;
      return repositoryWorktreeRows(repo).filter((row) => {
        if (facets.length && !row.facets.some((facet) => facets.includes(facet))) {
          return false;
        }
        if (state.repoWorktreeOnlyDirty && !(row.changes > 0)) return false;
        return matchesWorktreeQuery(query, row.values);
      });
    }

    function filterRepoWorktrees(value, cursorPosition = value.length) {
      state.repoWorktreeFilter = value;
      renderWorktrees();
      const input = document.getElementById("repoWorktreeFilter");
      if (!input) return;
      input.focus();
      if (typeof input.setSelectionRange === "function") {
        const nextPosition = Math.min(cursorPosition, input.value.length);
        input.setSelectionRange(nextPosition, nextPosition);
      }
    }

    function toggleRepoWorktreeFilter() {
      state.repoWorktreeFilterOpen = !state.repoWorktreeFilterOpen;
      if (!state.repoWorktreeFilterOpen) {
        state.repoWorktreeFilter = "";

      renderWorktrees();
      if (state.repoWorktreeFilterOpen) {
        document.getElementById("repoWorktreeFilter")?.focus();
