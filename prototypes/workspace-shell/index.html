            <div class="operation-list">
              <article class="operation-item">
                <div class="operation-head">
                  <span class="operation-icon">${icon("refresh", 14)}</span>
                  <span class="operation-name">Workspace 状态扫描</span>
                  <span class="operation-state">进行中</span>
                </div>
                <div class="progress-track"><div class="progress-value" style="width:68%"></div></div>
                <div class="operation-foot">
                  <span>${activeWorkspaceSnapshot.totalRepositories} 个仓库 · 只读快照</span>
                  <span>68%</span>
                </div>
              </article>
              <article class="operation-item">
                <div class="operation-head">
                  <span class="operation-icon success">${icon("check", 14)}</span>
                  <span class="operation-name">scportal · 读取仓库状态</span>
                  <span class="operation-state">已完成</span>
                </div>
                <div class="operation-foot">
                  <span>1 项变更 · test</span>
                  <span>${formatSnapshotDate(workspaceSnapshot.snapshotAt)}</span>
                </div>
              </article>
              <article class="operation-item">
                <div class="operation-head">
                  <span class="operation-icon">${icon("download", 14)}</span>
                  <span class="operation-name">Fetch 全部仓库</span>
                  <span class="operation-state">已排队</span>
                </div>
                <div class="operation-foot">
                  <span>${activeWorkspaceSnapshot.totalRepositories} 个目标</span>
                  <span>等待执行</span>
                </div>
              </article>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <div class="panel-title">${icon("eye")}操作约束</div>
              <span class="panel-caption">当前为只读设计预览</span>
            </div>
            <div class="detail-list operation-constraints">
              <div class="detail-row"><span class="detail-label">数据来源</span><span class="detail-value">本地 Workspace 快照</span></div>
              <div class="detail-row"><span class="detail-label">远程操作</span><span class="detail-value">不会执行 Fetch / Pull / Push</span></div>
              <div class="detail-row"><span class="detail-label">状态保留</span><span class="detail-value">任务完成后保留记录</span></div>
            </div>
          </section>
        </div>
      `;
    }

    function renderWorkspaceOverview() {
      const activeWorkspaceSnapshot = currentWorkspaceSnapshot();
      const attentionRows = repositoriesByAttention();
      const repositoryStatusCollapsed =
        state.workspaceOverviewRepositoryStatusCollapsed;
      const recentCommitsCollapsed =
        state.workspaceOverviewRecentCommitsCollapsed;
      document.getElementById("mainContent").innerHTML = `
        <div class="page-scroll">
          ${workspaceHeader("Workspace 概览", `来自 ${activeWorkspaceSnapshot.rootPath} 的本地只读快照；未执行 Fetch，远程差异以现有跟踪引用为准。`)}

          <div class="metric-grid">
            ${metricCard("repository", "仓库", String(activeWorkspaceSnapshot.totalRepositories), `${activeWorkspaceSnapshot.configuredRepositories} 个已配置 · ${activeWorkspaceSnapshot.localExtraRepositories} 个本地额外仓库`, "var(--blue)", "var(--blue-soft)")}
            ${metricCard("fileCode", "未提交变更", String(activeWorkspaceSnapshot.totalChanges), `${activeWorkspaceSnapshot.dirtyRepositories} 个仓库 · ${activeWorkspaceSnapshot.untrackedChanges} 个未跟踪文件`, "var(--yellow)", "var(--yellow-soft)")}
            ${metricCard("arrowDown", "本地引用显示落后", String(activeWorkspaceSnapshot.behindRepositories), `累计 ${activeWorkspaceSnapshot.behindCommits} 个提交 · 未 Fetch`, "var(--accent)", "var(--accent-soft)")}
            ${metricCard("worktree", "Worktrees", String(activeWorkspaceSnapshot.worktrees), `${activeWorkspaceSnapshot.prunableWorktrees} 个可清理 · ${activeWorkspaceSnapshot.detachedWorktrees} 个 detached`, "var(--purple)", "rgba(174, 140, 255, .13)")}
          </div>

          <div class="dashboard-grid">
            <div>
              <section class="panel">
                <div
                  class="panel-header panel-header-toggle"
                  role="button"
                  tabindex="0"
                  aria-expanded="${!repositoryStatusCollapsed}"
                  aria-controls="workspace-overview-repository-list"
                  onclick="toggleWorkspaceOverviewSection('repository-status', event)"
                  onkeydown="handleWorkspaceOverviewSectionKeydown(event, 'repository-status')"
                >
                  <div class="panel-title">${icon("repository")}仓库状态</div>
                  <span class="panel-caption">快照：${formatSnapshotDate(workspaceSnapshot.snapshotAt)}</span>
                  <span class="panel-collapse-indicator" aria-hidden="true">${icon(repositoryStatusCollapsed ? "chevronRight" : "chevronDown", 14)}</span>
                </div>
                <div id="workspace-overview-repository-list"${repositoryStatusCollapsed ? " hidden" : ""}>
                  ${renderRepositoryTable(attentionRows.slice(0, 8))}
                </div>
              </section>
            </div>

            <div>
              <section class="panel">
                <div
                  class="panel-header panel-header-toggle"
                  role="button"
                  tabindex="0"
                  aria-expanded="${!recentCommitsCollapsed}"
                  aria-controls="workspace-overview-recent-commits"
                  onclick="toggleWorkspaceOverviewSection('recent-commits', event)"
                  onkeydown="handleWorkspaceOverviewSectionKeydown(event, 'recent-commits')"
                >
                  <div class="panel-title">${icon("history")}各仓库最近提交</div>
                  <span class="panel-caption">每仓库采集 1 条</span>
                  <span class="panel-collapse-indicator" aria-hidden="true">${icon(recentCommitsCollapsed ? "chevronRight" : "chevronDown", 14)}</span>
                </div>
                <div id="workspace-overview-recent-commits"${recentCommitsCollapsed ? " hidden" : ""}>
                  <div class="activity-list">
                  ${renderSnapshotActivity(6)}
                  </div>
                </div>
              </section>

              <section class="panel">
                <div class="panel-header">
                  <div class="panel-title">${icon("branch")}分支分布</div>
                  <span class="panel-caption">${activeWorkspaceSnapshot.totalRepositories} 个当前分支</span>
                </div>
                <div class="branch-health-grid">
                  ${activeWorkspaceSnapshot.branchDistribution.map((item) => `
                    <div class="branch-health-item">
                      <div class="branch-health-label">${item.name}</div>
                      <div class="branch-health-value">${item.count}</div>
                    </div>
                  `).join("")}
                </div>
              </section>
            </div>
          </div>
        </div>
      `;
      renderWorkspaceInspector();
    }

    function metricCard(iconName, label, value, foot, color, bg) {
      return `
        <article class="metric-card" style="--metric-color:${color};--metric-bg:${bg}">
          <div class="metric-label"><span>${label}</span><span class="metric-icon">${icon(iconName)}</span></div>
          <div class="metric-value">${value}</div>
          <div class="metric-foot">${foot}</div>
        </article>
      `;
    }

    function activityItem(iconName, title, sub, time) {
      return `
        <div class="activity-item">
          <span class="activity-dot">${icon(iconName)}</span>
          <span>
            <div class="activity-title">${title}</div>
            <div class="activity-sub">${sub}</div>
          </span>
          <span class="activity-time">${time}</span>
        </div>
      `;
    }

    function renderSnapshotActivity(
      limit = currentWorkspaceRepositories().length
    ) {
      return recentRepositories(limit).map((repo) =>
        activityItem(
          "commit",
          `<strong>${escapeHtml(repo.name)}</strong> 的 HEAD 最近提交`,
          `${repo.head} · ${escapeHtml(repo.lastSubject)}`,
          formatSnapshotDate(repo.lastDate)
        )
      ).join("");
    }

    function renderRepositoryTable(rows) {
      return `
          <table class="repo-table">
            <thead>
              <tr>
                <th>仓库</th>
                <th>分支</th>
                <th>工作区</th>
                <th>远程同步</th>
              </tr>
          </thead>
          <tbody>
            ${rows.map((repo) => `
              <tr>
                <td>
                  <button type="button" class="table-repo" aria-label="打开仓库 ${repo.name}" onclick="openRepository('${repo.id}')">
                    <span class="repo-icon ${repo.status}">${icon("repository", 14)}</span>
                    <span class="table-repo-copy">
                      <span class="table-repo-name">${repo.name}${repo.listed ? "" : ' <span class="status-pill neutral">本地发现</span>'}</span>
                      <span class="table-repo-path">${repo.path}</span>
                    </span>
                  </button>
                </td>
                <td><span class="branch-text" title="${repo.branch}">${icon("branch", 12)}<span class="table-cell-text">${repo.branch}</span></span></td>
                <td>
                  <span class="mini-counts">
                    ${repo.conflicts ? `<span class="mini-count conflicted">${repo.conflicts} 冲突</span>` : repo.changes ? `<span class="mini-count changed">${repo.changes} 变更</span>` : `<span class="mini-count clean">干净</span>`}
                  </span>
                </td>
                <td><span class="sync-text">${repo.ahead ? icon("arrowUp", 12) : ""}${repo.behind ? icon("arrowDown", 12) : ""}${!repo.ahead && !repo.behind ? icon("check", 12) : ""}<span class="table-cell-text">${repo.ahead ? `${repo.ahead}${repo.behind ? ` · ${repo.behind}` : ""}` : repo.behind ? repo.behind : "已同步"}</span></span></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function renderWorkspaceRepositories() {
      const activeWorkspaceSnapshot = currentWorkspaceSnapshot();
      document.getElementById("mainContent").innerHTML = `
        <div class="page-scroll">
          ${workspaceHeader("仓库管理", "统一查看实际仓库路径、当前分支、工作区状态与本地远程跟踪引用差异。")}
          <section class="panel">
            <div class="panel-header">
              <div class="panel-title">${icon("repository")}全部仓库</div>
              <span class="panel-caption">${activeWorkspaceSnapshot.totalRepositories} 个仓库 · ${activeWorkspaceSnapshot.configuredRepositories} 个配置项 · ${activeWorkspaceSnapshot.localExtraRepositories} 个本地发现</span>
              <button class="panel-action" onclick="showToast('添加仓库', '可扫描目录、选择现有仓库或克隆远程仓库。', 'plus')">${icon("plus", 13)} 添加仓库</button>
            </div>
            ${renderRepositoryTable(repositoriesByAttention())}
          </section>
        </div>
      `;
      renderWorkspaceInspector();
    }

    function renderWorkspaceActivity() {
      const activeWorkspaceSnapshot = currentWorkspaceSnapshot();
      document.getElementById("mainContent").innerHTML = `
        <div class="page-scroll">
          ${workspaceHeader("Workspace 活动", "按提交时间汇总每个仓库在本次只读快照中采集到的最近一条 HEAD 提交。")}
          <section class="panel">
            <div class="panel-header">
              <div class="panel-title">${icon("history")}最近 HEAD 提交</div>
              <span class="panel-caption">${activeWorkspaceSnapshot.totalRepositories} 条 · 快照 ${formatSnapshotDate(activeWorkspaceSnapshot.snapshotAt)}</span>
              <button class="panel-action" onclick="showToast('活动筛选', '可按仓库、作者和提交日期筛选。', 'filter')">筛选</button>
            </div>
            <div class="activity-list">
              ${renderSnapshotActivity()}
            </div>
          </section>
        </div>
      `;
      renderWorkspaceInspector();
    }

    function workspaceWorktreeRepositoryOptions() {
      return [...new Set(
        currentWorkspaceSnapshot().worktreeEntries
          .map((entry) => entry.repo)
          .filter(Boolean)
      )].sort((left, right) => left.localeCompare(right));
    }

    function renderWorktreeRepoMenu() {
      const options = workspaceWorktreeRepositoryOptions();
      if (options.length <= 1) return "";
      const current = state.workspaceWorktreeRepo;
      const entries = [{ value: "", label: "全部仓库" }, ...options.map((repo) => ({ value: repo, label: repo }))];
      const currentLabel = entries.find((entry) => entry.value === current)?.label || "全部仓库";
      return `
        <details
          class="worktree-repo-menu"
          data-dropdown-id="worktree-repo-filter"
          ontoggle="onWorktreeRepoMenuToggle(event.currentTarget)"
        >
          <summary class="worktree-repo-menu-trigger" aria-haspopup="menu" aria-label="按仓库筛选 Worktree">
            <span class="worktree-repo-menu-trigger-value">${escapeHtml(currentLabel)}</span>
            ${icon("chevronDown", 14)}
          </summary>
          <div class="worktree-repo-menu-surface menu-surface" role="menu" aria-label="按仓库筛选 Worktree">
            ${entries.map((entry) => renderMenuItem({
              label: entry.label,
              className: entry.value === current ? "is-selected" : "",
              role: "menuitemradio",
              attributes: `aria-checked="${entry.value === current}" onclick="setWorktreeRepo(${JSON.stringify(entry.value).replace(/"/g, "&quot;")})"`
            })).join("")}
          </div>
        </details>
      `;
    }

    function renderWorktreeFilterBar({
      counts,
      dirtyCount,
      facet,
      onlyDirty,
      scope,
      activeCount = 0,
      repositorySelect = ""
    }) {
      const chips = WORKTREE_FACET_OPTIONS.map((option) => `
        <button
          type="button"
          class="worktree-filter-chip${facet === option.id ? " selected" : ""}"
          data-worktree-facet="${option.id}"
          aria-pressed="${facet === option.id}"
          ${counts[option.id] === 0 ? "disabled" : ""}
          onclick="toggleWorktreeFacet('${scope}', '${option.id}')"
        >${option.label}<span class="worktree-filter-chip-count">${counts[option.id]}</span></button>
      `).join("");
      return `
        <div class="worktree-filter-bar" role="group" aria-label="按类型筛选 Worktree">
          <span class="worktree-filter-bar-label">类型</span>
          ${chips}
          <button
            type="button"
            class="worktree-filter-chip worktree-filter-chip-dirty${onlyDirty ? " selected" : ""}"
            aria-pressed="${onlyDirty}"
            ${dirtyCount === 0 && !onlyDirty ? "disabled" : ""}
            onclick="toggleWorktreeOnlyDirty('${scope}')"
          >仅看有变更<span class="worktree-filter-chip-count">${dirtyCount}</span></button>
          ${repositorySelect}
          ${activeCount > 0
            ? `<button type="button" class="worktree-filter-clear" onclick="clearWorktreeFilters('${scope}')">清除筛选（${activeCount}）</button>`
            : ""}
        </div>
      `;
    }

    function toggleWorktreeFacet(scope, facet) {
      const key = scope === "workspace" ? "workspaceWorktreeFacet" : "repoWorktreeFacet";
      const current = state[key];
      state[key] = current === facet ? "" : facet;
      renderWorktreeScope(scope);
      document.querySelector(`[data-worktree-facet="${facet}"]`)?.focus();
    }

    function toggleWorktreeOnlyDirty(scope) {
      const key = scope === "workspace" ? "workspaceWorktreeOnlyDirty" : "repoWorktreeOnlyDirty";
      state[key] = !state[key];
      renderWorktreeScope(scope);
    }

    function onWorktreeRepoMenuToggle(details) {
      positionDetailsMenu(details, { side: "bottom", align: "end" });
      if (!details.open) return;
      requestAnimationFrame(() => {
        const surface = details.querySelector(".worktree-repo-menu-surface");
        if (!surface) return;
        const items = [...surface.querySelectorAll('[role^="menuitem"]')];
        const checked = items.find(
          (item) => item.getAttribute("aria-checked") === "true"
        );
        (checked || items[0])?.focus();
      });
    }

    function setWorktreeRepo(value) {
      state.workspaceWorktreeRepo = value;
      renderWorkspaceWorktrees();
      document.querySelector(".worktree-repo-menu > summary")?.focus();
    }

    function clearWorktreeFilters(scope) {
      if (scope === "workspace") {
        state.workspaceWorktreeFacet = "";
        state.workspaceWorktreeOnlyDirty = false;
        state.workspaceWorktreeRepo = "";
        state.workspaceWorktreeFilter = "";
        state.workspaceWorktreeFilterOpen = false;
      } else {
        state.repoWorktreeFacet = "";
        state.repoWorktreeOnlyDirty = false;
        state.repoWorktreeFilter = "";
        state.repoWorktreeFilterOpen = false;
      }
      renderWorktreeScope(scope);
    }

    function renderWorktreeScope(scope) {
      if (scope === "workspace") renderWorkspaceWorktrees();
      else renderWorktrees();
    }

    function workspaceWorktreeStatus(entry) {
      if (entry.prunable) return "可清理登记";
      if (entry.primary) return "主工作目录";
      if (entry.detached) return "游离 HEAD";
      return "已登记";
    }

    function worktreeSearchValues(entry) {
      return [
        entry.repo || "",
        entry.branch || "游离 HEAD",
        workspaceWorktreeStatus(entry),
        entry.head,
        entry.path,
        entry.exists ? "目录存在" : "目录不存在",
        entry.prunable ? "可清理 可 Prune 失效" : "登记路径"
      ];
    }

    const WORKTREE_FACET_OPTIONS = [
      { id: "primary", label: "主工作目录" },
      { id: "linked", label: "已登记" },
      { id: "detached", label: "游离 HEAD" },
      { id: "locked", label: "已锁定" },
      { id: "prunable", label: "可清理登记" }
    ];

    function worktreeFacetIds(entry) {
      const facets = [];
      if (entry.primary) facets.push("primary");
      else if (!entry.prunable) facets.push("linked");
      if (entry.detached || !entry.branch) facets.push("detached");
      if (entry.locked) facets.push("locked");
      if (entry.prunable) facets.push("prunable");
      return facets;
    }

    function matchesWorktreeQuery(query, values) {
      if (!query) return true;
      return values.join(" ").toLowerCase().includes(query);
    }

    function worktreeFacetCounts(facetLists) {
      const counts = { primary: 0, linked: 0, detached: 0, locked: 0, prunable: 0 };
      facetLists.forEach((facets) =>
        facets.forEach((facet) => (counts[facet] += 1))
      );
      return counts;
    }

    function matchesWorktreeFilters(entry, options) {
      if (options.repo && entry.repo !== options.repo) return false;
      if (
        options.facet &&
        !worktreeFacetIds(entry).includes(options.facet)
      ) {
        return false;
      }
      if (options.onlyDirty && !(entry.changes > 0)) return false;
      return matchesWorktreeQuery(options.query, worktreeSearchValues(entry));
    }

    function filteredWorkspaceWorktrees() {
      return currentWorkspaceSnapshot().worktreeEntries.filter((entry) =>
        matchesWorktreeFilters(entry, {
          query: (state.workspaceWorktreeFilter || "").trim().toLowerCase(),
          facet: state.workspaceWorktreeFacet,
          onlyDirty: state.workspaceWorktreeOnlyDirty,
          repo: state.workspaceWorktreeRepo
        })
      );
    }

    function filterWorkspaceWorktrees(value, cursorPosition = value.length) {
      state.workspaceWorktreeFilter = value;
      renderWorkspaceWorktrees();
      const input = document.getElementById("workspaceWorktreeFilter");
      if (!input) return;
      input.focus();
      if (typeof input.setSelectionRange === "function") {
        const nextPosition = Math.min(cursorPosition, input.value.length);
        input.setSelectionRange(nextPosition, nextPosition);
      }
    }

    function toggleWorkspaceWorktreeFilter() {
      state.workspaceWorktreeFilterOpen = !state.workspaceWorktreeFilterOpen;
      if (!state.workspaceWorktreeFilterOpen) {
        state.workspaceWorktreeFilter = "";
      }
      renderWorkspaceWorktrees();
      if (state.workspaceWorktreeFilterOpen) {
        document.getElementById("workspaceWorktreeFilter")?.focus();
      }
    }

    function renderWorkspaceWorktrees() {
      const activeWorkspaceSnapshot = currentWorkspaceSnapshot();
      const visibleWorktrees = filteredWorkspaceWorktrees();
      const activeFilterCount =
        (state.workspaceWorktreeFacet ? 1 : 0) +
        (state.workspaceWorktreeOnlyDirty ? 1 : 0) +
        (state.workspaceWorktreeRepo ? 1 : 0) +
        ((state.workspaceWorktreeFilter || "").trim() ? 1 : 0);
      document.getElementById("mainContent").innerHTML = `
        <div class="page-scroll">
          ${workspaceHeader("跨仓 Worktrees", `聚合仓库实际登记 ${activeWorkspaceSnapshot.worktrees} 个 Worktree；其中 ${activeWorkspaceSnapshot.prunableWorktrees} 个记录指向不存在的目录。`)}
          <div class="worktree-management">
            <div class="worktree-toolbar">
              <span class="worktree-toolbar-title">${icon("worktree")}已登记 Worktrees</span>
              <span class="worktree-toolbar-count">共 ${activeWorkspaceSnapshot.worktreeEntries.length} 个${activeFilterCount === 0 ? "" : ` · 已筛出 ${visibleWorktrees.length} 个`}</span>
              ${state.workspaceWorktreeFilterOpen
                ? renderInput({
                    id: "workspaceWorktreeFilter",
                    value: state.workspaceWorktreeFilter,
                    placeholder: "筛选分支、路径或状态",
                    size: "small",
                    fullWidth: true,
                    fieldClassName: "worktree-filter-field",
                    inputClassName: "worktree-filter-input",
                    leadingIcon: icon("search", 13),
                    ariaLabel: "筛选跨仓 Worktree",
                    autocomplete: "off",
                    spellcheck: false,
                    attributes: `oninput="filterWorkspaceWorktrees(this.value, this.selectionStart ?? this.value.length)" onkeydown="if (event.key === 'Escape') { event.preventDefault(); toggleWorkspaceWorktreeFilter(); }"`,
                    clearButton: state.workspaceWorktreeFilter
                      ? {
                          icon: icon("x", 12),
                          ariaLabel: "清除跨仓 Worktree 筛选",
                          title: "清除跨仓 Worktree 筛选",
                          attributes: `onclick="filterWorkspaceWorktrees('', 0)"`
                        }
                      : null
                  })
                : ""}
              ${renderButton({
                label: "筛选",
                size: "small",
                variant: "default",
                className: `panel-header-action${state.workspaceWorktreeFilterOpen ? " active" : ""}`,
                icon: icon("filter", 13),
                attributes: `aria-expanded="${state.workspaceWorktreeFilterOpen}" onclick="toggleWorkspaceWorktreeFilter()"`
              })}
              ${renderWorktreeRepoMenu()}
            </div>
            ${renderWorktreeFilterBar({
              counts: worktreeFacetCounts(
                activeWorkspaceSnapshot.worktreeEntries.map(worktreeFacetIds)
              ),
              dirtyCount: activeWorkspaceSnapshot.worktreeEntries.filter((entry) => entry.changes > 0).length,
              facet: state.workspaceWorktreeFacet,
              onlyDirty: state.workspaceWorktreeOnlyDirty,
              scope: "workspace",
              activeCount: activeFilterCount
            })}
            ${visibleWorktrees.length
              ? `<div class="worktree-grid">${visibleWorktrees.map(workspaceWorktreeCard).join("")}</div>`
              : `<div class="worktree-filter-empty">${icon("search", 18)}<strong>没有匹配的 Worktree</strong><span>可修改筛选条件后重试。</span></div>`}
          </div>
        </div>
      `;
      renderWorkspaceInspector();
    }

    function workspaceWorktreeCard(entry) {
      const status = workspaceWorktreeStatus(entry);
      const tone = entry.prunable ? "red" : entry.detached ? "yellow" : entry.primary ? "green" : "neutral";
      const cardClass = `worktree-card ${entry.primary ? "primary" : ""}${entry.prunable ? " prunable" : ""}`;
      const cardInteraction = entry.prunable
        ? `class="${cardClass}"`
        : `role="button" tabindex="0" class="${cardClass}" onclick="showToast('sc_code Worktree', '${entry.path}', 'worktree')" onkeydown="activateOnKey(event)"`;
      return `
        <article ${cardInteraction}>
          <div class="worktree-card-head">
            <span class="worktree-symbol">${icon("worktree")}</span>
            <span>
              <div class="worktree-title">${entry.branch || "游离 HEAD"}</div>
          <div class="worktree-branch">${icon("commit", 16)}${entry.head}</div>
            </span>
            <span class="status-pill push-right ${tone}">${status}</span>
          </div>
          <div class="worktree-path">${entry.path}</div>
          <div class="worktree-foot">
            ${entry.repo ? `<span class="worktree-repository-tag">${icon("repository", 16)}${escapeHtml(entry.repo)}</span>` : ""}
            ${entry.exists ? "目录存在" : "目录不存在"}
            ${entry.changes > 0 ? `<span class="diff-add">${entry.changes} 项变更</span>` : ""}
            <span class="spacer"></span>
            ${entry.prunable
              ? `<button
                  type="button"

      openConfirmDialog({
        title: "清除失效 Worktree 登记？",
        description: `${path} 的目录已不存在。正式程序会先预检，并清除 ${repository} 中所有可清理的失效 Git 登记；不会递归删除仍存在的目录。`,

    function renderCommitRow(commit, index = 0) {

        : "";

          <div class="commit-message">
            <div class="commit-subject">${commit.subject}</div>
            <div class="commit-meta">
              ${commit.refs.map((ref) => `<span class="ref-label ${ref.startsWith("origin") ? "remote" : ""}${commit.comparisonSide ? ` comparison-${commit.comparisonSide}` : ""}">${ref}</span>`).join("")}

    function renderChanges() {
      const repo = currentRepo();
      const allChangedFiles = currentChangedFiles();
      const changedFiles = filteredChangedFiles();
      const filterQuery = (state.changeFilter || "").trim();
      const treeDirectoryKeys =
        collectChangeTreeDirectoryKeys(changedFiles);
      const changeTreeScopeKey = `${repo.id}\u0001${filterQuery}`;
      if (state.changeTreeScopeKey !== changeTreeScopeKey) {
        state.changeTreeScopeKey = changeTreeScopeKey;
        state.collapsedChangeTreeNodes =
          state.changeTreeDirectoriesCollapsedPreference
            ? new Set(treeDirectoryKeys)
            : new Set();
      }
      const pendingRevealFile = state.pendingChangeRevealPath
        ? changedFiles.find(
            (file) => file.path === state.pendingChangeRevealPath
          )
        : null;
      state.pendingChangeRevealPath = "";
      if (pendingRevealFile) {
        revealChangeFileContainers(pendingRevealFile);
      }
      const hasTreeDirectories = treeDirectoryKeys.length > 0;
      const hasExpandedTreeDirectories = treeDirectoryKeys.some(
        (key) => !state.collapsedChangeTreeNodes.has(key)
      );
      const canToggleTreeDirectories =
        state.changeViewMode === "tree" && hasTreeDirectories;
      const treeDirectoriesToggleCollapses =
        state.changeViewMode === "tree"
          ? hasExpandedTreeDirectories
          : !state.changeTreeDirectoriesCollapsedPreference;
      const treeDirectoriesToggleLabel =
        treeDirectoriesToggleCollapses
          ? "收起目录"
          : "展开目录";
      const treeDirectoriesToggleTitle =
        state.changeViewMode !== "tree"
          ? "切换到树形式查看后可用"
          : !hasTreeDirectories
            ? "当前变更中没有目录"
            : treeDirectoriesToggleCollapses
              ? "收起全部目录，并记住此偏好"
              : "展开全部目录，并记住此偏好";
      const selected = changedFiles.find((file) => file.path === state.selectedFile) || changedFiles[0];
      state.selectedFile = selected?.path || "";
      const standaloneDiffUrl = new URL("./diff-viewer.html", window.location.href);
      standaloneDiffUrl.searchParams.set("repo", repo.id);
      standaloneDiffUrl.searchParams.set("file", state.selectedFile);
      document.getElementById("mainContent").innerHTML = `
        <div class="page-scroll repository-page repository-page-changes">
          <div class="changes-page">
            <section class="changes-layout">
              <div class="changes-file-pane">
            <div class="file-pane-header">
              <strong>变更文件</strong>
              <div class="file-pane-tools">
                <label class="change-filter-field">
                  <input id="changeFilter" type="text" aria-label="筛选变更文件" autocomplete="off" spellcheck="false" placeholder="筛选变更…" value="${escapeHtml(state.changeFilter)}" oninput="filterChanges(this.value, this.selectionStart ?? this.value.length)" />
                  ${filterQuery ? `<button type="button" class="change-filter-clear" aria-label="清除变更筛选" title="清除变更筛选" onclick="clearChangeFilter()">${icon("x", 12)}</button>` : ""}
                </label>
                <details class="toolbar-menu change-view-menu" data-dropdown-id="change-view" ontoggle="positionDetailsMenu(event.currentTarget, { side: 'bottom' })">
                  <summary class="icon-button" aria-label="打开变更文件视图菜单" aria-haspopup="menu" title="变更文件视图">${icon("more", 14)}</summary>
                  <div class="toolbar-menu-popover menu-surface" role="menu">
                    ${renderMenuItem({
                      label:
                        state.changeViewMode === "tree"
                          ? "以列表形式查看"
                          : "以树形式查看",
                      leading: icon(
                        state.changeViewMode === "tree"
                          ? "fileCode"
                          : "folder",
                        14
                      ),
                      attributes: 'onclick="toggleChangeViewMode()"'
                    })}
                    ${renderMenuItem({
                      label: treeDirectoriesToggleLabel,
                      leading: icon(
                        treeDirectoriesToggleCollapses
                          ? "chevronRight"
                          : "chevronDown",
                        14
                      ),
                      disabled: !canToggleTreeDirectories,
                      title: treeDirectoriesToggleTitle,
                      attributes:
                        'onclick="toggleAllChangeTreeDirectories()"'
                    })}
                  </div>
                </details>
              </div>
            </div>
            <div class="change-file-list">
              ${changedFiles.length ? `
                ${renderFileSection("已暂存", changedFiles.filter((file) => file.staged), "staged")}
                ${renderFileSection("未暂存", changedFiles.filter((file) => !file.staged && file.status !== "untracked"), "unstaged")}
                ${renderFileSection("未跟踪", changedFiles.filter((file) => file.status === "untracked"), "untracked")}
              ` : `
                <div class="change-filter-empty">
                  ${icon(allChangedFiles.length ? "search" : "check", 18)}
                  <strong>${allChangedFiles.length ? "没有匹配的变更" : "工作区干净"}</strong>
                  <span>${allChangedFiles.length ? "尝试文件名、目录或状态。" : "没有 staged、unstaged、untracked 或冲突文件。"}</span>
                </div>
              `}
            </div>
            <div class="changes-sidebar-footer">
              ${repositoryDiffWorkspaceConfiguration.extensions.stashBrowser ? renderStashEntry() : ""}
              ${repositoryDiffWorkspaceConfiguration.extensions.commitRegion ? renderCommitComposer(repo) : ""}
            </div>
          </div>
              <div class="repository-content-stack">
                <div class="repository-diff-view" ${state.stashBrowserOpen ? "hidden" : ""}>
                  ${renderRepositoryDiffPanel(
                    selected,
                    standaloneDiffUrl,
                    repositoryDiffWorkspaceConfiguration
                  )}
                </div>
                <div class="repository-stash-view" id="repository-stash-browser" ${state.stashBrowserOpen ? "" : "hidden"}>
                  ${renderRepositoryStashBrowser()}
                </div>
              </div>
            </section>
          </div>
        </div>
      `;
      renderChangesInspector();
      if (pendingRevealFile) {
        focusRevealedChangeFile(pendingRevealFile.path);
      }
    }

                      <span class="repository-stash-branch">${escapeHtml(stash.branch)}</span>
                    </button>
                  `;
                }).join("")
              : `
                <div class="repository-stash-state">
                  ${icon("layers", 20)}
                  <strong>还没有储藏</strong>
                  <span>当前仓库没有可浏览的储藏变更。</span>

        <section class="repository-stash-pane" aria-label="储藏文件">
          <header class="repository-stash-detail-header">
            <div>
              <span>
                <strong>${escapeHtml(selected?.ref || "文件")}</strong>
                ${selected ? `<code>${escapeHtml(selected.hash.slice(0, 8))}</code>` : ""}
              </span>
              <b>${escapeHtml(selected?.title || "选择一个储藏")}</b>
              ${selected ? `<small>${escapeHtml(selected.author)} · ${escapeHtml(selected.relativeTime)}</small>` : ""}
            </div>
            <span>${selectedFiles.length}</span>
          </header>
          <div class="repository-stash-file-toolbar">

            <label>
              ${icon("search", 13)}
              <input
                id="repositoryStashFileFilter"
                type="text"
                aria-label="筛选储藏文件"
                autocomplete="off"
                spellcheck="false"
                placeholder="筛选文件"
                value="${escapeHtml(state.stashFileFilter)}"
                oninput="updateRepositoryStashFileFilter(this.value, this.selectionStart ?? this.value.length)"
              />
            </label>
          </div>
          <div class="repository-stash-files">
            ${visibleFiles.length
              ? visibleFiles.map((file) => `
                  <div class="repository-stash-file">
                    <span>${icon("fileCode", 14)}<strong title="${escapeHtml(file.path)}">${escapeHtml(file.path)}</strong></span>
                    ${file.binary
                      ? '<span class="repository-stash-binary">二进制</span>'
                      : `<span class="repository-stash-file-stats"><em>+${file.additions}</em><i>-${file.deletions}</i></span>`}
                  </div>
                `).join("")
              : `
                <div class="repository-stash-state">
                  ${icon(filterQuery ? "search" : "fileCode", 20)}
                  <strong>${filterQuery ? "没有匹配的文件" : selected ? "这个储藏没有文件" : "选择一个储藏"}</strong>
                  <span>${filterQuery ? "尝试输入文件名或目录。" : selected ? "没有可展示的文件记录。" : "从左侧列表选择后查看文件。"}</span>

    function toggleRepositoryStashes() {
      state.stashBrowserOpen = !state.stashBrowserOpen;
      const entry = document.querySelector(".repository-stash-entry");
      const diffView = document.querySelector(".repository-diff-view");
      const stashView = document.querySelector(".repository-stash-view");
      entry?.classList.toggle("active", state.stashBrowserOpen);
      entry?.setAttribute("aria-pressed", String(state.stashBrowserOpen));
      entry?.setAttribute("aria-expanded", String(state.stashBrowserOpen));
      if (diffView) diffView.hidden = state.stashBrowserOpen;
      if (stashView) {
        stashView.hidden = !state.stashBrowserOpen;
        if (state.stashBrowserOpen) {
          stashView.innerHTML = renderRepositoryStashBrowser();
        }
      }
    }

    function selectRepositoryStash(hash) {
      if (!visibleRepositoryStashes().some((stash) => stash.hash === hash)) return;
      state.selectedStashHash = hash;
      state.stashFileFilter = "";
      const stashView = document.querySelector(".repository-stash-view");
      if (stashView) {
        stashView.innerHTML = renderRepositoryStashBrowser();
      }
    }

    function updateRepositoryStashFileFilter(
      value,
      cursorPosition = value.length
    ) {
      state.stashFileFilter = value;
      const stashView = document.querySelector(".repository-stash-view");
      if (!stashView) return;
      stashView.innerHTML = renderRepositoryStashBrowser();
      const input = document.getElementById(
        "repositoryStashFileFilter"
      );
      input?.focus({ preventScroll: true });
      if (
        typeof cursorPosition === "number" &&
        typeof input?.setSelectionRange === "function"
      ) {
        const nextPosition = Math.min(
          cursorPosition,
          input.value.length
        );
        input.setSelectionRange(nextPosition, nextPosition);
      }
    }

    function renderCommitComposer(repo) {
      const staged = repo.staged;
      const conflicted = repo.conflicts;
      const hasChanges =
        repo.staged + repo.unstaged + repo.untracked > 0;
      const statusTone = conflicted > 0 ? "red" : staged > 0 ? "green" : "neutral";
      const statusText = conflicted > 0 ? `${conflicted} 个冲突` : `${staged} 个已暂存`;
      const canCommit = hasChanges && conflicted === 0 && Boolean(state.commitDraft.message.trim());
      const hasCommitScope =
        staged > 0 || repo.unstaged + repo.untracked > 0;

      return `
        <article class="panel commit-composer" style="height: ${state.commitPanelHeight}px">
          <div
            class="commit-resize-handle"
            role="separator"
            tabindex="0"
            aria-orientation="horizontal"
            aria-label="调整提交区域高度"
            aria-valuemin="${diffCommitPanelHeightMin}"
            aria-valuemax="${diffCommitPanelHeightMax}"
            aria-valuenow="${state.commitPanelHeight}"
            title="拖动调整提交区域高度"
            onpointerdown="startCommitPanelResize(event)"
            onkeydown="handleCommitPanelResizeKeydown(event)"
          ></div>
          <header class="panel-header">
            <label class="commit-push-toggle" for="commitPush">
              <input id="commitPush" name="commit-push" type="checkbox" ${state.commitDraft.push ? "checked" : ""} onchange="updateCommitDraft()" />
              <span>推送到远程</span>
            </label>
            <span class="status-pill ${statusTone}">${statusText}</span>
          </header>
          <form class="commit-form" onsubmit="event.preventDefault(); completePreviewCommit(event.submitter || this.querySelector('.commit-submit-button'))">
            ${renderTextarea({
              id: "commitMessage",
              value: state.commitDraft.message,
              size: "small",
              fullWidth: true,
              ariaLabel: "提交信息",
              autocomplete: "off",
              maxLength: 100000,
              name: "commit-message",
              placeholder: "输入提交信息…",
              rows: 3,
              textareaClassName: "commit-message",
              attributes: 'oninput="updateCommitDraft()"'
            })}
            <div class="commit-form-actions">
              ${renderButton({
                label: "AI 生成",
                ariaLabel: "使用 AI 生成提交信息",
                title: !state.aiSettings.enabled
                  ? "请先在设置中启用 AI 提交信息"
                  : !state.aiSettings.url.trim() ||
                      !state.aiSettings.model.trim() ||
                      !state.aiSettings.apiKey.trim()
                    ? "请先在设置中完成 AI 提交信息配置"
                    : !hasCommitScope
                      ? "没有可提交的变更"
                      : "根据当前提交范围生成提交信息",
                size: "small",
                variant: "default",
                iconOnly: true,
                disabled:
                  !state.aiSettings.enabled ||
                  !state.aiSettings.url.trim() ||
                  !state.aiSettings.model.trim() ||
                  !state.aiSettings.apiKey.trim() ||
                  !hasCommitScope,
                className: "commit-ai-button",
                icon: icon("sparkle", 13),
                attributes: 'onclick="generateCommitMessageWithAI()"'
              })}
              ${renderButton({
                label: staged > 0 ? "提交已暂存变更" : "提交全部变更",
                size: "small",
                variant: "primary",
                disabled: !canCommit,
                className: "commit-submit-button",
                icon: icon("check"),
                type: "submit"
              })}
            </div>
          </form>
        </article>
      `;
    }

    function toggleChangeSection(mode) {
      const files = filteredChangedFiles();
      const hasFiles = files.some((file) =>
        mode === "untracked"
          ? file.status === "untracked"
          : mode === "staged"
            ? file.status !== "untracked" && file.staged
            : file.status !== "untracked" && !file.staged
      );

      if (!hasFiles) {
        const nextExpanded = new Set(
          state.expandedEmptyChangeSections
        );
        if (nextExpanded.has(mode)) {
          nextExpanded.delete(mode);
        } else {
          nextExpanded.add(mode);
        }
        state.expandedEmptyChangeSections = nextExpanded;
      } else {
        const nextCollapsed = new Set(
          state.collapsedChangeSections
        );
        if (nextCollapsed.has(mode)) {
          nextCollapsed.delete(mode);
        } else {
          nextCollapsed.add(mode);
        }
      state.collapsedChangeSections = nextCollapsed;
      }
      renderChanges();
    }

    function changeSectionFiles(mode) {
      return filteredChangedFiles().filter((file) =>
        mode === "untracked"
          ? file.status === "untracked"
          : mode === "staged"
            ? file.status !== "untracked" && file.staged
            : file.status !== "untracked" && !file.staged
      );
    }

    function toggleChangeSectionStage(mode) {
      const files = changeSectionFiles(mode);
      if (!files.length) return;
      const nextStaged = mode !== "staged";
      files.forEach((file) => {
        file.staged = nextStaged;
      });
      renderChanges();
      showToast(
        nextStaged ? "暂存" : "取消暂存",
        `${files.length} 个文件（原型预览，不执行 Git 命令）`,
        nextStaged ? "plus" : "minus"
      );
    }

    function openDiscardChangeConfirmation(files, onConfirm, scope = "file") {
      const untrackedCount = files.filter(
        (file) => file.status === "untracked"
      ).length;
      const singleFile = scope === "file" ? files[0] : null;
      const title = singleFile
        ? untrackedCount > 0
          ? "永久删除未跟踪文件？"
          : `放弃对“${singleFile.path}”的更改？`
        : `放弃 ${files.length} 个文件的更改？`;
      const targetSummary = singleFile
        ? singleFile.path
        : `${files.length} 个文件${
            untrackedCount > 0
              ? `，其中 ${untrackedCount} 个未跟踪文件`
              : ""
          }`;
      const risk = untrackedCount > 0
        ? `其中 ${untrackedCount} 个未跟踪文件会从磁盘永久删除，不会移入回收站，且无法撤销。`
        : "工作区中的修改将被还原，此操作无法撤销。";

      openConfirmDialog({
        title,
        description: `${targetSummary}。${risk} 当前为原型预览，不执行 Git 命令。`,
        actionLabel:
          untrackedCount > 0
            ? "永久删除并放弃"
            : "确认放弃",
        onConfirm
      });
    }

    function applyDiscardedChanges(files) {
      const discarded = new Set(files.map((file) => file.path));
      const repoId = currentRepo().id;
      changedFilesByRepo[repoId] = currentChangedFiles().filter(
        (file) => !discarded.has(file.path)
      );
      if (discarded.has(state.selectedFile)) {
        state.selectedFile = "";
      }
      renderChanges();
      showToast(
        "放弃更改",
        files.length === 1
          ? `${files[0].path}（原型预览，不执行 Git 命令）`
          : `${discarded.size} 个文件（原型预览，不执行 Git 命令）`,
        "undo"
      );
    }

    function discardChangeSection(mode) {
      const files = changeSectionFiles(mode);
      if (!files.length) return;
      openDiscardChangeConfirmation(
        [...files],
        () => applyDiscardedChanges(files),
        "group"
      );
    }

    function discardChangeFile(path) {
      const target = currentChangedFiles().find(
        (file) => file.path === path
      );
      if (!target) return;
      openDiscardChangeConfirmation(
        [target],
        () => applyDiscardedChanges([target]),
        "file"
      );
    }

    function toggleChangeViewMode() {
      state.changeViewMode =
        state.changeViewMode === "tree" ? "list" : "tree";
      try {
        localStorage.setItem(
          "gitnest-change-view-mode",
          state.changeViewMode
        );
      } catch {
        // 文件预览环境可能禁用持久化；视图切换本身仍然有效。
      }
      renderChanges();
    }

    function toggleChangeTree(key) {
      const nextCollapsed = new Set(
        state.collapsedChangeTreeNodes
      );
      if (nextCollapsed.has(key)) {
        nextCollapsed.delete(key);
      } else {
        nextCollapsed.add(key);
      }
      state.collapsedChangeTreeNodes = nextCollapsed;
      renderChanges();
    }

    function toggleAllChangeTreeDirectories() {
      const directoryKeys = collectChangeTreeDirectoryKeys(
        filteredChangedFiles()
      );
      if (
        state.changeViewMode !== "tree" ||
        directoryKeys.length === 0
      ) {
        return;
      }

      const collapsed = directoryKeys.some(
        (key) => !state.collapsedChangeTreeNodes.has(key)
      );
      state.collapsedChangeTreeNodes = collapsed
        ? new Set(directoryKeys)
        : new Set();
      state.changeTreeDirectoriesCollapsedPreference =
        collapsed;
      try {
        localStorage.setItem(
          changeTreeDirectoriesCollapsedStorageKey,
          String(collapsed)
        );
      } catch {
        // 文件预览环境可能禁用持久化；目录状态仍会在本次预览中生效。
      }
      renderChanges();
    }

    function collectChangeTreeDirectoryKeys(files) {
      const keys = new Set();

      files.forEach((file) => {
        const mode = changeFileMode(file);
        let path = "";
        const segments = file.path
          .replace(/\\/g, "/")
          .split("/")
          .filter(Boolean);

        segments.slice(0, -1).forEach((segment) => {
          path = path ? `${path}/${segment}` : segment;
          keys.add(`${mode}:${path}`);
        });
      });

      return [...keys].sort();
    }

    function changeFileMode(file) {
      return file.status === "untracked"
        ? "untracked"
        : file.staged
          ? "staged"
          : "unstaged";
    }

    function revealChangeFileContainers(file) {
      const mode = changeFileMode(file);
      state.collapsedChangeSections.delete(mode);
      let path = "";
      file.path
        .replace(/\\/g, "/")
        .split("/")
        .filter(Boolean)
        .slice(0, -1)
        .forEach((segment) => {
          path = path ? `${path}/${segment}` : segment;
          state.collapsedChangeTreeNodes.delete(`${mode}:${path}`);
        });
    }

    function focusRevealedChangeFile(path) {
      requestAnimationFrame(() => {
        const row = [...document.querySelectorAll(".file-row[data-file-path]")]
          .find((element) => element.dataset.filePath === path);
        if (!row) return;
        row.scrollIntoView({ block: "nearest" });
        row.querySelector(".file-select-button")
          ?.focus({ preventScroll: true });
      });
    }

    function renderChangeFileRow(file, depth = 0) {
      const statusLetter = {
        modified: "M",
        added: "A",
        deleted: "D",
        untracked: "?"
      };
      const stats = diffPreviewStats(file);
      const displayName = depth > 0
        ? file.path.replace(/\\/g, "/").split("/").pop() || file.path
        : file.path;
      const indent = depth > 0
        ? ` style="padding-left:calc(var(--space-2) + ${depth} * var(--space-4))"`
        : "";
      return `
        <div class="file-row ${state.selectedFile === file.path ? "active" : ""}" data-file-path="${escapeHtml(file.path)}" oncontextmenu="openChangeFileContextMenu(event, this.dataset.filePath)"${indent}>
          <button type="button" class="file-path file-select-button" aria-current="${state.selectedFile === file.path}" data-file-path="${escapeHtml(file.path)}" onclick="selectFile(this.dataset.filePath)">
            <strong class="file-name" title="${escapeHtml(file.path)}">${escapeHtml(displayName)}</strong>
            <span class="file-meta">
              <span class="file-status-letter ${file.status}">${statusLetter[file.status] || "M"}</span>
              <span class="file-change-stats" aria-label="新增 ${stats.additions} 行，删除 ${stats.deletions} 行">
                <strong>+${stats.additions}</strong>
                <em>-${stats.deletions}</em>
              </span>
            </span>
          </button>
          <div class="file-actions">
            ${file.staged ? "" : renderButton({
              label: `放弃更改 ${file.path}`,
              ariaLabel: `放弃更改 ${file.path}`,
              title: "放弃更改",
              size: "small",
              variant: "icon",
              className: "stage-toggle",
              icon: icon("undo", 14),
              attributes: `onclick="event.stopPropagation(); discardChangeFile(this.closest('.file-row').dataset.filePath)"`
            })}
            ${renderButton({
              label: `${file.staged ? "取消暂存" : "暂存"} ${file.path}`,
              ariaLabel: `${file.staged ? "取消暂存" : "暂存"} ${file.path}`,
              title: file.staged ? "取消暂存" : "暂存",
              size: "small",
              variant: "icon",
              className: "stage-toggle",
              icon: icon(file.staged ? "minus" : "plus", 14),
              attributes: `onclick="event.stopPropagation(); showToast('${file.staged ? "取消暂存" : "暂存文件"}', '${file.path}', '${file.staged ? "minus" : "plus"}')"`
            })}
          </div>
        </div>
      `;
    }

    function buildChangeTree(files) {
      const root = {
        name: "",
        path: "",
        directory: true,
        children: []
      };

      files.forEach((file) => {
        const segments = file.path
          .replace(/\\/g, "/")
          .split("/")
          .filter(Boolean);
        let parent = root;

        segments.forEach((segment, index) => {
          const directory = index < segments.length - 1;
          const path = directory
            ? `${parent.path}/${segment}`.replace(/^\/+/, "")
            : file.path;
          let node = parent.children.find((item) =>
            item.name === segment &&
            item.directory === directory
          );
          if (!node) {
            node = {
              name: segment,
              path,
              directory,
              children: []
            };
            parent.children.push(node);
          }
          if (directory) {
            parent = node;
          } else {
            node.file = file;
          }
        });
      });

      return sortChangeTreeNodes(root.children);
    }

    function sortChangeTreeNodes(nodes) {
      return [...nodes]
        .sort((left, right) => {
          if (left.directory !== right.directory) {
            return left.directory ? -1 : 1;
          }
          return left.name.localeCompare(
            right.name,
            undefined,
            { numeric: true, sensitivity: "base" }
          );
        })
        .map((node) => ({
          ...node,
          children: sortChangeTreeNodes(node.children)
        }));
    }

    function renderChangeTree(files, mode) {
      return renderChangeTreeNodes(
        compactChangeTreeNodes(
          buildChangeTree(files)
        ),
        mode
      );
    }

    function compactChangeTreeNodes(nodes) {
      return nodes.map((node) => {
        if (!node.directory) {
          return node;
        }

        let terminal = node;
        const names = [node.name];

        while (
          terminal.children.length === 1 &&
          terminal.children[0]?.directory
        ) {
          terminal = terminal.children[0];
          names.push(terminal.name);
        }

        return {
          ...terminal,
          name: names.join(" \\ "),
          children: compactChangeTreeNodes(terminal.children)
        };
      });
    }

    function renderChangeTreeNodes(nodes, mode, depth = 0) {
      return nodes.map((node) => {
        if (!node.directory && node.file) {
          return renderChangeFileRow(node.file, depth);
        }

        const key = `${mode}:${node.path}`;
        const collapsed =
          state.collapsedChangeTreeNodes.has(key);
        return `
          <button type="button" class="change-tree-directory${collapsed ? " collapsed" : ""}" aria-expanded="${!collapsed}" data-tree-key="${escapeHtml(key)}" onclick="toggleChangeTree(this.dataset.treeKey)" style="padding-left:calc(var(--space-2) + ${depth} * var(--space-4))">
            ${icon("chevronRight", 13)}
            ${icon("folder", 13)}
            <span>${escapeHtml(node.name)}</span>
          </button>
          ${collapsed ? "" : renderChangeTreeNodes(node.children, mode, depth + 1)}
        `;
      }).join("");
    }

    function renderFileSection(title, files, mode) {
      const isEmpty = files.length === 0;
      const isCollapsed =
        state.collapsedChangeSections.has(mode) ||
        (isEmpty &&
          !state.expandedEmptyChangeSections.has(mode));
      const bodyId = `change-file-section-${mode}`;
      const isStagedSection = mode === "staged";
      const canGroupStage = files.length > 0;
      const canGroupDiscard = files.length > 0 && !isStagedSection;
      const hasActions = canGroupStage || canGroupDiscard;
      return `
        <section class="file-section ${isCollapsed ? "collapsed" : ""}${isEmpty ? " empty" : ""}">
          <div class="file-section-header${hasActions ? " has-actions" : ""}">
            <button type="button" class="file-section-title" aria-expanded="${!isCollapsed}" aria-controls="${bodyId}" onclick="toggleChangeSection('${mode}')">
              ${icon("chevronDown", 13)}
              <span class="file-section-label">${title}</span>
            </button>
            <span class="file-section-tail">
              <span class="file-section-count">${files.length}</span>
              <span class="file-section-actions">
                ${canGroupDiscard
                  ? renderButton({
                      label: `放弃${title}分组的更改`,
                      ariaLabel: `放弃${title}分组的更改`,
                      title: `放弃更改（${files.length} 个文件）`,
                      size: "small",
                      variant: "icon",
                      className: "stage-toggle",
                      icon: icon("undo", 14),
                      attributes: `onclick="event.stopPropagation(); discardChangeSection('${mode}')"`
                    })
                  : ""}
                ${canGroupStage
                  ? renderButton({
                      label: `${isStagedSection ? "取消暂存" : "暂存"}${title}分组的文件`,
                      ariaLabel: `${isStagedSection ? "取消暂存" : "暂存"}${title}分组的文件`,
                      title: `${isStagedSection ? "取消暂存" : "暂存"}（${files.length} 个文件）`,
                      size: "small",
                      variant: "icon",
                      className: "stage-toggle",
                      icon: icon(isStagedSection ? "minus" : "plus", 14),
                      attributes: `onclick="event.stopPropagation(); toggleChangeSectionStage('${mode}')"`
                    })
                  : ""}
              </span>
            </span>
          </div>
            <div class="file-section-body" id="${bodyId}" aria-hidden="${isCollapsed}" ${isCollapsed ? "inert" : ""}>
              <div class="file-section-body-inner">
                ${isEmpty
                ? `<button type="button" class="file-section-empty" aria-label="收起${title}分组" onclick="toggleChangeSection('${mode}')">暂无${title}文件</button>`
                : state.changeViewMode === "tree"
                  ? renderChangeTree(files, mode)
                  : files.map((file) => renderChangeFileRow(file)).join("")}
            </div>
          </div>
        </section>
      `;
    }

    function renderChangesInspector() {

      const changedFiles = filteredChangedFiles();
      const selected = changedFiles.find((file) => file.path === state.selectedFile) || changedFiles[0];
      document.getElementById("inspector").innerHTML = `

          </div>
        </section>
        ${selected ? `

            </div>

    function updateCommitDraft() {
      const message = document.getElementById("commitMessage");
      const push = document.querySelector('[name="commit-push"]');
      if (message) state.commitDraft.message = message.value;
      if (push) state.commitDraft.push = push.checked;
      state.commitDirty = JSON.stringify(state.commitDraft) !== state.commitBaseline;
      const commitButton = document.querySelector(".commit-composer button[type='submit']");
      if (commitButton) {
        const repo = currentRepo();
        const hasChanges =
          repo.staged + repo.unstaged + repo.untracked > 0;
        commitButton.disabled =
          !hasChanges ||
          repo.conflicts > 0 ||
          !message?.value.trim();
      }
      if (message?.value.trim()) {
        message.removeAttribute("aria-invalid");
      }
      const draftStatus = document.querySelector(".inspector-head > .status-pill");
      if (state.commitDirty && !draftStatus) {
        document.querySelector(".inspector-title")?.insertAdjacentHTML("afterend", '<span class="status-pill yellow">未保存</span>');
      } else if (!state.commitDirty && draftStatus?.textContent.trim() === "未保存") {
        draftStatus.remove();
      }
    }

    function completePreviewCommit(trigger) {
      const message = document.getElementById("commitMessage");
      const repo = currentRepo();
      const hasChanges =
        repo.staged + repo.unstaged + repo.untracked > 0;
      if (!message?.value.trim()) {
        message?.setAttribute("aria-invalid", "true");
        showErrorToast("无法提交", "请输入提交信息。");
        message?.focus();
        return;
      }
      if (repo.conflicts > 0) {
        showErrorToast("无法提交", "请先解决所有冲突。");
        return;
      }
      if (!hasChanges) {
        showErrorToast("无法提交", "当前仓库没有可提交的变更。");
        return;
      }
      startButtonLoading(trigger);
      setTimeout(() => {
        state.commitBaseline = JSON.stringify(state.commitDraft);
        state.commitDirty = false;
        stopButtonLoading(trigger);
        renderChangesInspector();
        const scope = repo.staged > 0
          ? "当前只会提交已暂存变更。"
          : "当前会提交全部未暂存和未跟踪变更。";
        showToast(
          "提交信息已就绪",
          `${scope} 这是设计预览，不会执行本地 Git 命令。`,
          "commit"
        );
      }, 900);
    }

    function discardCommitDraft() {
      state.commitDraft = JSON.parse(state.commitBaseline);
      state.commitDirty = false;
    }

    function shouldConfirmDiscardCommit() {
      return state.view === "repository" && state.tab === "changes" && state.commitDirty;
    }

    function withCommitDraftGuard(action) {
      if (!shouldConfirmDiscardCommit()) {
        action();
        return;
      }
      openConfirmDialog({
        title: "放弃未保存的提交信息？",
        description: "提交信息和推送选项尚未保存。离开后这些修改会被丢弃。",
        actionLabel: "放弃并离开",
        onConfirm: () => {
          discardCommitDraft();
          action();
        }
      });
    }

    function renderHistoryCommitDiffLine(line) {
      if (line.kind === "hunk") {
        return `
          <div class="diff-viewer-wide-row hunk">
            ${icon("diff", 14)}
            <code>${escapeHtml(line.code)}</code>
          </div>
        `;
      }
      const kind =
        line.kind === "deleted"
          ? "removed"
          : line.kind === "added"
            ? "added"
            : "context";
      const marker =
        kind === "removed" ? "−" : kind === "added" ? "+" : "";
      return `
        <div class="diff-viewer-unified-line ${kind}">
          <span class="diff-viewer-line-number ${kind}">${escapeHtml(line.oldLine)}</span>
          <span class="diff-viewer-line-number ${kind}">${escapeHtml(line.newLine)}</span>
          <span class="diff-viewer-change-marker ${kind}">${marker}</span>
          <span class="diff-viewer-code-cell ${kind}"><code>${escapeHtml(line.code)}</code></span>
        </div>
      `;
    }

      if (!file) {
        return `

      const lines = diffPreviewFullLines(file);
      return `

          <main class="diff-viewer-main">
            <header class="diff-viewer-file-header">
              <div class="diff-viewer-file-heading">
                <button

              </div>
            </div>
          </main>
        </section>
      `;
    }

        return workspaceSnapshot.worktreeEntries.map((entry) => ({
          values: worktreeSearchValues(entry),
          facets: worktreeFacetIds(entry),
          changes: entry.changes || 0,
          render: () => workspaceWorktreeCard(entry)
        }));
      }
      const path = repoAbsolutePath(repo);
      const status = repo.changes ? `${repo.changes} 项变更` : "工作区干净";
      return [
        {
          values: [
            "当前工作目录",
            "主工作目录",
            repo.branch,
            repo.head,
            path,
            status
          ],
          facets: ["primary"],
          changes: repo.changes || 0,
          render: () =>
            repositoryWorktreeCard(
              "当前工作目录",
              repo.branch,
              path,
              repo.head,
              status,
              true,
              false
            )
        }
      ];
    }

    function filteredRepoWorktreeRows(repo) {
      const query = (state.repoWorktreeFilter || "").trim().toLowerCase();
      const facet = state.repoWorktreeFacet;
      return repositoryWorktreeRows(repo).filter((row) => {
        if (facet && !row.facets.includes(facet)) {
          return false;
        }
        if (state.repoWorktreeOnlyDirty && !(row.changes > 0)) return false;
        return matchesWorktreeQuery(query, row.values);
      });
    }

    function filterRepoWorktrees(value, cursorPosition = value.length) {
      state.repoWorktreeFilter = value;
      renderWorktrees();
      const input = document.getElementById("repoWorktreeFilter");
      if (!input) return;
      input.focus();
      if (typeof input.setSelectionRange === "function") {
        const nextPosition = Math.min(cursorPosition, input.value.length);
        input.setSelectionRange(nextPosition, nextPosition);
      }
    }

    function toggleRepoWorktreeFilter() {
      state.repoWorktreeFilterOpen = !state.repoWorktreeFilterOpen;
      if (!state.repoWorktreeFilterOpen) {
        state.repoWorktreeFilter = "";
      }
      renderWorktrees();
      if (state.repoWorktreeFilterOpen) {
        document.getElementById("repoWorktreeFilter")?.focus();
      }
    }

    function renderWorktrees() {
      const repo = currentRepo();
      const worktreeRows = repositoryWorktreeRows(repo);
      const visibleWorktreeRows = filteredRepoWorktreeRows(repo);
      const repoWorktreeActiveFilterCount =
        (state.repoWorktreeFacet ? 1 : 0) +
        (state.repoWorktreeOnlyDirty ? 1 : 0) +
        ((state.repoWorktreeFilter || "").trim() ? 1 : 0);
      const existingWorktrees = Math.max(0, repo.worktrees - repo.prunable);
      document.getElementById("mainContent").innerHTML = `
        <div class="page-scroll">
          <div class="worktree-management">
            <div class="page-heading worktree-page-heading">
              <div>
                <h1 class="page-title">${repo.name} Worktrees</h1>
                <p class="page-description">显示本次只读扫描得到的登记数量与当前工作目录。聚合仓库可展开全部 ${repo.worktrees} 条实际登记路径。</p>
              </div>
              <div class="page-actions">
                ${renderButton({
                  label: "新建 Worktree",
                  size: "small",
                  variant: "primary",
                  icon: icon("plus"),
                  attributes: 'onclick="showToast(\'创建 Worktree\', \'选择目标目录、起点和新分支后创建。\', \'plus\')"'
                })}
              </div>
            </div>
            <div class="metric-grid worktree-metric-grid">
              ${metricCard("worktree", "已登记", String(repo.worktrees), "包含当前主工作目录", "var(--purple)", "rgba(174,140,255,.13)")}
              ${metricCard("check", "目录存在", String(existingWorktrees), "按可清理记录反推", "var(--green)", "var(--green-soft)")}
              ${metricCard("alert", "可清理", String(repo.prunable), "gitdir 指向不存在位置", "var(--red)", "var(--red-soft)")}
              ${metricCard("branch", "游离 HEAD", String(repo.detached), "未关联本地分支", "var(--yellow)", "var(--yellow-soft)")}
            </div>
            <div class="worktree-toolbar">
              <span class="worktree-toolbar-title">${icon("worktree")}已登记 Worktrees</span>
              <span class="worktree-toolbar-count">共 ${worktreeRows.length} 个${repoWorktreeActiveFilterCount === 0 ? "" : ` · 已筛出 ${visibleWorktreeRows.length} 个`}</span>
              ${state.repoWorktreeFilterOpen
                ? renderInput({
                    id: "repoWorktreeFilter",
                    value: state.repoWorktreeFilter,
                    placeholder: "筛选分支、路径或状态",
                    size: "small",
                    fullWidth: true,
                    fieldClassName: "worktree-filter-field",
                    inputClassName: "worktree-filter-input",
                    leadingIcon: icon("search", 13),
                    ariaLabel: "筛选 Worktree",
                    autocomplete: "off",
                    spellcheck: false,
                    attributes: `oninput="filterRepoWorktrees(this.value, this.selectionStart ?? this.value.length)" onkeydown="if (event.key === 'Escape') { event.preventDefault(); toggleRepoWorktreeFilter(); }"`,
                    clearButton: state.repoWorktreeFilter
                      ? {
                          icon: icon("x", 12),
                          ariaLabel: "清除 Worktree 筛选",
                          title: "清除 Worktree 筛选",
                          attributes: `onclick="filterRepoWorktrees('', 0)"`
                        }
                      : null
                  })
                : ""}
              ${renderButton({
                label: "筛选",
                size: "small",
                variant: "default",
                className: `panel-header-action${state.repoWorktreeFilterOpen ? " active" : ""}`,
                icon: icon("filter", 13),
                attributes: `aria-expanded="${state.repoWorktreeFilterOpen}" onclick="toggleRepoWorktreeFilter()"`
              })}
            </div>
            ${renderWorktreeFilterBar({
              counts: worktreeFacetCounts(worktreeRows.map((row) => row.facets)),
              dirtyCount: worktreeRows.filter((row) => row.changes > 0).length,
              facet: state.repoWorktreeFacet,
              onlyDirty: state.repoWorktreeOnlyDirty,
              scope: "repo",
              activeCount: repoWorktreeActiveFilterCount
            })}
            ${visibleWorktreeRows.length
              ? `<div class="worktree-grid">${visibleWorktreeRows.map((row) => row.render()).join("")}</div>`
              : `<div class="worktree-filter-empty">${icon("search", 18)}<strong>没有匹配的 Worktree</strong><span>可修改筛选条件后重试。</span></div>`}
          </div>
        </div>
      `;
      renderWorktreeInspector();
    }

    function repositoryWorktreeCard(title, branch, path, head, status, primary, locked) {
      return `
        <article role="button" tabindex="0" class="worktree-card ${primary ? "primary" : ""}" onclick="showToast('${title}', '${path}', 'worktree')" onkeydown="activateOnKey(event)">
          <div class="worktree-card-head">
            <span class="worktree-symbol">${icon(locked ? "lock" : "worktree")}</span>
            <span>
              <div class="worktree-title">${title}</div>
              <div class="worktree-branch">${icon("branch", 16)}${branch}</div>
            </span>

          <div class="worktree-path">${path}</div>
          <div class="worktree-foot">
            <span>${head}</span>
            <span>·</span>
            <span class="${status.includes("变更") ? "diff-add" : ""}">${status}</span>
            <span class="spacer"></span>
            ${icon("external", 16)}打开

    }

    function renderWorktreeInspector() {
      const repo = currentRepo();
      document.getElementById("inspector").innerHTML = `
        <div class="inspector-head">
          <div class="inspector-title">${icon("worktree")}Worktree 详情</div>
          <div class="inspector-actions">
            <button class="icon-button" aria-label="打开 Worktree 菜单" onclick="showToast('Worktree 菜单', '锁定、移动、修复和清理操作位于这里。', 'more')">${icon("more")}</button>
