<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090d12" id="themeColorMeta" />
  <title>GitNest · SC 代码聚合</title>
  <style>
    :root {
      color-scheme: dark;

      /* DESIGN.md: typography */
      --font-sans: Inter, "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      --font-mono: "Cascadia Code", Consolas, monospace;
      --font-size-body: 14px;
      --font-size-caption: 12px;
      --font-size-emphasis: 16px;
      --font-size-title: 24px;
      --font-size-section: 18px;
      --line-height-body: 1.5;
      --line-height-title: 1.3;
      --font-weight-regular: 400;
      --font-weight-medium: 500;
      --font-weight-semibold: 600;

      /* DESIGN.md: spacing, sizing, radii and motion */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 48px;
      --radius-small: 4px;
      --radius-regular: 8px;
      --radius-large: 12px;
      --control-compact: 32px;
      --control-default: 40px;
      --control-large: 48px;
      --icon-small: 16px;
      --icon-regular: 20px;
      --icon-large: 24px;
      --page-max-width: 1440px;
      --page-safe-margin: 24px;
      --page-safe-margin-narrow: 16px;
      --motion-exit: 140ms;
      --motion-micro: 180ms;
      --motion-layer: 240ms;
      --ease-enter: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-exit: ease-in;

      /* DESIGN.md: semantic colors */
      --color-primary: #36c7b5;
      --color-primary-strong: #23aa9b;
      --color-primary-soft: rgba(54, 199, 181, 0.13);
      --color-success: #56d18b;
      --color-success-soft: rgba(86, 209, 139, 0.13);
      --color-warning: #f0c66a;
      --color-warning-soft: rgba(240, 198, 106, 0.14);
      --color-danger: #ff737b;
      --color-danger-soft: rgba(255, 115, 123, 0.13);
      --color-info: #64a8ff;
      --color-info-soft: rgba(100, 168, 255, 0.13);
      --color-text-primary: #e8eef6;
      --color-text-secondary: #c1ccd8;
      --color-text-muted: #91a0b0;
      --color-text-disabled: #657486;
      --color-bg-page: #0d131b;
      --color-bg-surface: #131c27;
      --color-bg-subtle: #182330;
      --color-bg-muted: #1d2a38;
      --color-bg-hover: #223141;
      --color-border: #2b3b4d;
      --color-border-subtle: #1e2a37;
      --color-focus: #7de3d7;
      --color-overlay: rgba(4, 8, 12, 0.48);

      /* DESIGN.md: shared layer scale */
      --z-content: 0;
      --z-navigation: 100;
      --z-popover: 200;
      --z-tooltip: 300;
      --z-overlay: 400;
      --z-modal: 500;
      --z-toast: 600;

      /* Compatibility aliases used by the prototype components. */
      --titlebar: #090d12;
      --rail: #0c1118;
      --sidebar: #101721;
      --canvas: var(--color-bg-page);
      --surface: var(--color-bg-surface);
      --surface-2: var(--color-bg-subtle);
      --surface-3: var(--color-bg-muted);
      --surface-hover: var(--color-bg-hover);
      --border: var(--color-border);
      --border-soft: var(--color-border-subtle);
      --text: var(--color-text-primary);
      --text-soft: var(--color-text-secondary);
      --muted: var(--color-text-muted);
      --accent: var(--color-primary);
      --accent-strong: var(--color-primary-strong);
      --accent-soft: var(--color-primary-soft);
      --blue: var(--color-info);
      --blue-soft: var(--color-info-soft);
      --green: var(--color-success);
      --green-soft: var(--color-success-soft);
      --yellow: var(--color-warning);
      --yellow-soft: var(--color-warning-soft);
      --red: var(--color-danger);
      --red-soft: var(--color-danger-soft);
      --purple: #ae8cff;
      --shadow: 0 24px 64px rgba(0, 0, 0, 0.32);
      --scrollbar: #314154;
      --code-bg: #0b1118;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --color-primary: #087f75;
      --color-primary-strong: #06645d;
      --color-primary-soft: rgba(8, 127, 117, 0.1);
      --color-success: #177245;
      --color-success-soft: rgba(23, 114, 69, 0.1);
      --color-warning: #946100;
      --color-warning-soft: rgba(169, 110, 0, 0.11);
      --color-danger: #b82e3a;
      --color-danger-soft: rgba(184, 46, 58, 0.09);
      --color-info: #1f60a8;
      --color-info-soft: rgba(31, 96, 168, 0.1);
      --color-text-primary: #1b2733;
      --color-text-secondary: #3f4f61;
      --color-text-muted: #647588;
      --color-text-disabled: #98a5b2;
      --color-bg-page: #f2f5f8;
      --color-bg-surface: #ffffff;
      --color-bg-subtle: #f7f9fb;
      --color-bg-muted: #eef3f7;
      --color-bg-hover: #e8eff5;
      --color-border: #cfdae4;
      --color-border-subtle: #e4eaf0;
      --color-focus: #087f75;
      --color-overlay: rgba(24, 37, 49, 0.46);
      --titlebar: #e9eef4;
      --rail: #eef2f7;
      --sidebar: #f7f9fc;
      --purple: #7653d4;
      --shadow: 0 24px 64px rgba(37, 55, 72, 0.16);
      --scrollbar: #c2ced9;
      --code-bg: #f7f9fb;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--canvas);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-regular);
      line-height: var(--line-height-body);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
      touch-action: manipulation;
    }

    button:not(:disabled),
    [role="button"]:not([aria-disabled="true"]) {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    [tabindex="0"]:focus-visible {
      outline: 1px solid var(--color-focus);
      outline-offset: 2px;
    }

    h1,
    h2,
    h3 {
      text-wrap: balance;
    }

    p {
      text-wrap: pretty;
    }

    ::selection {
      background: color-mix(in srgb, var(--accent) 32%, transparent);
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar);
      border: 3px solid transparent;
      border-radius: 999px;
      background-clip: padding-box;
    }

    .icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      stroke: currentColor;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .app-shell {
      display: grid;
      grid-template-rows: var(--control-default) minmax(0, 1fr) var(--space-5);
      width: 100vw;
      height: 100vh;
      min-width: 1024px;
      background: var(--canvas);
    }

    .skip-link {
      position: fixed;
      top: var(--space-2);
      left: 72px;
      z-index: var(--z-toast);
      padding: var(--space-2) var(--space-3);
      color: #071411;
      background: var(--accent);
      border-radius: var(--radius-regular);
      font-weight: var(--font-weight-semibold);
      text-decoration: none;
      transform: translateY(-160%);
      transition: transform var(--motion-micro) var(--ease-enter);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .titlebar {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-width: 0;
      padding-left: var(--space-3);
      background: var(--titlebar);
      border-bottom: 1px solid var(--border-soft);
      -webkit-app-region: drag;
      user-select: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 128px;
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.01em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: var(--icon-large);
      height: var(--icon-large);
      border-radius: var(--radius-regular);
      color: #071411;
      background: linear-gradient(145deg, #67ead8, #2eb7a7);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
    }

    .brand-mark .icon {
      width: 14px;
      height: 14px;
      stroke-width: 2.3;
    }

    .menu-strip {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      -webkit-app-region: no-drag;
    }

    .menu-button {
      height: var(--control-compact);
      padding: 0 var(--space-2);
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: var(--radius-small);
      cursor: pointer;
    }

    .menu-button:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .title-spacer {
      flex: 1;
      min-width: var(--space-4);
    }

    .global-search {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      width: min(300px, 30vw);
      height: var(--control-compact);
      padding: 0 var(--space-2) 0 var(--space-3);
      color: var(--muted);
      background: color-mix(in srgb, var(--surface) 76%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius-regular);
      cursor: pointer;
      -webkit-app-region: no-drag;
    }

    .global-search:hover {
      color: var(--text-soft);
      border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
    }

    .global-search .search-label {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
    }

    .global-search kbd {
      padding: 0 var(--space-1);
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-small);
      font-size: var(--font-size-caption);
      font-family: inherit;
    }

    .window-controls {
      display: flex;
      align-self: stretch;
      margin-left: var(--space-1);
      -webkit-app-region: no-drag;
    }

    .window-control {
      display: grid;
      place-items: center;
      width: var(--control-default);
      color: var(--muted);
      background: transparent;
      border: 0;
    }

    .window-control:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .window-control.close:hover {
      color: #fff;
      background: #d7444d;
    }

    .window-control .icon {
      width: 13px;
      height: 13px;
      stroke-width: 1.5;
    }

    .workspace-frame {
      display: grid;
      grid-template-columns: 64px 240px minmax(0, 1fr);
      min-height: 0;
    }

    .activity-rail {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      background: var(--rail);
      border-right: 1px solid var(--border-soft);
    }

    .rail-button {
      position: relative;
      display: grid;
      place-items: center;
      width: var(--control-default);
      height: var(--control-default);
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .rail-button:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .rail-button.active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .rail-button.active::before {
      content: "";
      position: absolute;
      left: -12px;
      width: 3px;
      height: var(--space-5);
      border-radius: 0 var(--radius-small) var(--radius-small) 0;
      background: var(--accent);
    }

    .rail-button .icon {
      width: var(--icon-regular);
      height: var(--icon-regular);
    }

    .rail-badge {
      position: absolute;
      top: 0;
      right: 0;
      display: grid;
      place-items: center;
      min-width: var(--icon-regular);
      height: var(--icon-regular);
      padding: 0 var(--space-1);
      color: #0c1413;
      background: var(--accent);
      border: 2px solid var(--rail);
      border-radius: 999px;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      line-height: 1;
    }

    .rail-spacer {
      flex: 1;
    }

    .workspace-sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
    }

    .workspace-switcher {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      width: 100%;
      min-height: 72px;
      padding: var(--space-3);
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
    }

    .workspace-switcher:hover {
      background: color-mix(in srgb, var(--surface-hover) 58%, transparent);
    }

    .workspace-avatar {
      display: grid;
      place-items: center;
      width: var(--control-default);
      height: var(--control-default);
      border-radius: var(--radius-large);
      color: #fff;
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.36), transparent 30%),
        linear-gradient(145deg, #1eb1a5, #405bc7);
      box-shadow: 0 6px 16px rgba(32, 138, 137, 0.22);
    }

    .workspace-avatar .icon {
      width: var(--icon-regular);
      height: var(--icon-regular);
    }

    .workspace-meta {
      min-width: 0;
      flex: 1;
    }

    .workspace-name {
      display: block;
      overflow: hidden;
      color: var(--text);
      font-weight: var(--font-weight-semibold);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workspace-caption {
      display: block;
      margin-top: var(--space-1);
      overflow: hidden;
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workspace-overview-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: var(--control-default);
      margin: var(--space-3) var(--space-3) var(--space-1);
      padding: 0 var(--space-3);
      color: var(--text-soft);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .workspace-overview-button:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .workspace-overview-button.active {
      color: var(--text);
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 25%, transparent);
    }

    .overview-label {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-weight: var(--font-weight-medium);
    }

    .health-dots {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .health-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }

    .health-dot.green { background: var(--green); }
    .health-dot.yellow { background: var(--yellow); }
    .health-dot.red { background: var(--red); }

    .sidebar-search-wrap {
      position: relative;
      margin: var(--space-2) var(--space-3) var(--space-3);
    }

    .sidebar-search-wrap .icon {
      position: absolute;
      top: var(--space-2);
      left: var(--space-2);
      width: var(--icon-small);
      height: var(--icon-small);
      color: var(--muted);
      pointer-events: none;
    }

    .sidebar-search {
      width: 100%;
      height: var(--control-compact);
      padding: 0 var(--space-6);
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .sidebar-search::placeholder {
      color: var(--muted);
    }

    .sidebar-search:focus {
      border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
    }

    .sidebar-search:focus-visible {
      outline-color: transparent;
    }

    .repository-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: var(--space-1) var(--space-2) var(--space-3);
    }

    .repo-group {
      margin-top: var(--space-2);
    }

    .group-header {
      display: flex;
      align-items: center;
      width: 100%;
      height: var(--control-compact);
      padding: 0 var(--space-2);
      color: var(--muted);
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: var(--radius-regular);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        color var(--motion-micro) var(--ease-enter),
        background-color var(--motion-micro) var(--ease-enter);
    }

    .group-header:hover {
      color: var(--text-soft);
      background: var(--surface-hover);
    }

    .group-header .icon {
      width: 13px;
      height: 13px;
      margin-right: var(--space-1);
      transform: rotate(0deg);
      transition: transform var(--motion-micro) var(--ease-enter);
    }

    .repo-group.collapsed .group-header .icon {
      transform: rotate(-90deg);
    }

    .repo-group-body {
      display: grid;
      grid-template-rows: 1fr;
      opacity: 1;
      transition:
        grid-template-rows var(--motion-layer) var(--ease-enter),
        opacity var(--motion-micro) var(--ease-enter);
    }

    .repo-group-inner {
      min-height: 0;
      overflow: hidden;
    }

    .repo-group.collapsed .repo-group-body {
      grid-template-rows: 0fr;
      opacity: 0;
      pointer-events: none;
    }

    .group-count {
      margin-left: auto;
      font-weight: 600;
      letter-spacing: 0;
    }

    .repo-row {
      position: relative;
      display: grid;
      grid-template-columns: var(--control-compact) minmax(0, 1fr) auto;
      align-items: center;
      width: 100%;
      min-height: 56px;
      padding: var(--space-2);
      color: inherit;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .repo-row:hover {
      background: var(--surface-hover);
    }

    .repo-row.active {
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 25%, transparent);
    }

    .repo-row.active::before {
      content: "";
      position: absolute;
      left: -8px;
      width: 3px;
      height: var(--space-6);
      border-radius: 0 var(--radius-small) var(--radius-small) 0;
      background: var(--accent);
    }

    .repo-icon {
      position: relative;
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      color: var(--text-soft);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-regular);
    }

    .repo-icon .icon {
      width: 14px;
      height: 14px;
    }

    .repo-icon.clean::after,
    .repo-icon.dirty::after,
    .repo-icon.conflict::after,
    .repo-icon.behind::after {
      content: "";
      position: absolute;
      right: -2px;
      bottom: -2px;
      width: 7px;
      height: 7px;
      border: 2px solid var(--sidebar);
      border-radius: 50%;
    }

    .repo-icon.clean::after { background: var(--green); }
    .repo-icon.dirty::after { background: var(--yellow); }
    .repo-icon.conflict::after { background: var(--red); }
    .repo-icon.behind::after { background: var(--blue); }

    .repo-main {
      min-width: 0;
      padding-left: var(--space-1);
    }

    .repo-name {
      overflow: hidden;
      color: var(--text-soft);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-medium);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .repo-row.active .repo-name,
    .repo-row:hover .repo-name {
      color: var(--text);
    }

    .repo-branch {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      min-width: 0;
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .repo-branch .icon {
      width: 11px;
      height: 11px;
    }

    .repo-branch span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .repo-status {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      padding-left: var(--space-1);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .repo-status.dirty { color: var(--yellow); }
    .repo-status.conflict { color: var(--red); }
    .repo-status.behind { color: var(--blue); }
    .repo-status.ahead { color: var(--green); }
    .repo-status.clean { color: var(--muted); }

    .sidebar-footer {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-height: var(--control-large);
      padding: var(--space-2) var(--space-3);
      border-top: 1px solid var(--border-soft);
    }

    .bulk-sync {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      height: var(--control-compact);
      color: color-mix(in srgb, var(--accent) 80%, white);
      background: var(--accent-soft);
      border: 1px solid color-mix(in srgb, var(--accent) 27%, transparent);
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .bulk-sync:hover {
      background: color-mix(in srgb, var(--accent) 19%, transparent);
      border-color: color-mix(in srgb, var(--accent) 45%, transparent);
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: var(--control-compact);
      height: var(--control-compact);
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .icon-button:hover {
      color: var(--text);
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .workbench {
      display: grid;
      grid-template-rows: 64px var(--control-large) minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      background: var(--canvas);
    }

    .commandbar {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-width: 0;
      padding: 0 var(--space-4);
      background: var(--surface);
      border-bottom: 1px solid var(--border-soft);
    }

    .context-identity {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      gap: var(--space-3);
      min-width: 0;
      margin-right: var(--space-1);
      overflow: hidden;
    }

    .context-identity > span:last-child {
      min-width: 0;
    }

    .context-icon {
      display: grid;
      flex: 0 0 var(--control-default);
      place-items: center;
      width: var(--control-default);
      height: var(--control-default);
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
      border-radius: var(--radius-regular);
    }

    .context-title {
      overflow: hidden;
      max-width: 270px;
      color: var(--text);
      font-size: var(--font-size-emphasis);
      font-weight: var(--font-weight-semibold);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .context-subtitle {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      overflow: hidden;
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .context-subtitle .icon {
      width: 11px;
      height: 11px;
    }

    .toolbar-divider {
      flex: 0 0 1px;
      width: 1px;
      height: var(--space-5);
      margin: 0 var(--space-1);
      background: var(--border);
    }

    .branch-selector {
      display: flex;
      flex: 0 1 auto;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      height: var(--control-compact);
      max-width: 210px;
      padding: 0 var(--space-3);
      color: var(--text-soft);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-regular);
      cursor: pointer;
      white-space: nowrap;
    }

    .branch-selector:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .branch-selector span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toolbar-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-1);
      min-width: 0;
      margin-left: auto;
    }

    .toolbar-button {
      position: relative;
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-2);
      height: var(--control-compact);
      padding: 0 var(--space-3);
      color: var(--text-soft);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-regular);
      cursor: pointer;
      white-space: nowrap;
    }

    .toolbar-button:hover {
      color: var(--text);
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .toolbar-button.primary {
      color: color-mix(in srgb, var(--accent) 84%, white);
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 28%, transparent);
    }

    .toolbar-count {
      display: grid;
      place-items: center;
      min-width: var(--icon-regular);
      height: var(--icon-regular);
      padding: 0 var(--space-1);
      color: var(--blue);
      background: var(--blue-soft);
      border-radius: 999px;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      line-height: 1;
    }

    .context-tabs {
      display: flex;
      align-items: end;
      gap: var(--space-1);
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0 var(--space-4);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }

    .context-tabs::-webkit-scrollbar {
      display: none;
    }

    .context-tab {
      position: relative;
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-2);
      height: var(--control-large);
      padding: 0 var(--space-4);
      color: var(--muted);
      background: transparent;
      border: 0;
      cursor: pointer;
      white-space: nowrap;
    }

    .context-tab:hover {
      color: var(--text-soft);
    }

    .context-tab.active {
      color: var(--text);
      font-weight: var(--font-weight-semibold);
    }

    .context-tab.active::after {
      content: "";
      position: absolute;
      right: var(--space-3);
      bottom: -1px;
      left: var(--space-3);
      height: 2px;
      border-radius: 2px 2px 0 0;
      background: var(--accent);
    }

    .tab-count {
      display: grid;
      place-items: center;
      min-width: var(--icon-regular);
      height: var(--icon-regular);
      padding: 0 var(--space-1);
      color: var(--muted);
      background: var(--surface-3);
      border-radius: 999px;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      line-height: 1;
    }

    .context-tab.active .tab-count {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .content-frame {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(300px, 27vw, 380px);
      min-width: 0;
      min-height: 0;
    }

    body:not(.inspector-open) .content-frame {
      grid-template-columns: minmax(0, 1fr);
    }

    body:not(.inspector-open) .inspector {
      display: none;
    }

    .inspector-backdrop {
      display: none !important;
      border: 0;
    }

    .main-content {
      position: relative;
      z-index: var(--z-content);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 0%, color-mix(in srgb, var(--accent) 4%, transparent), transparent 28%),
        var(--canvas);
    }

    .page-scroll {
      height: 100%;
      overflow: auto;
      overscroll-behavior: contain;
      padding: var(--page-safe-margin);
    }

    .page-scroll > * {
      width: 100%;
      max-width: var(--page-max-width);
      margin-right: auto;
      margin-left: auto;
    }

    .inspector {
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--surface);
      border-left: 1px solid var(--border);
    }

    .page-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-5);
      margin-bottom: var(--space-5);
    }

    .page-heading > :first-child {
      min-width: 0;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
      color: var(--accent);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
    }

    .page-title {
      margin: 0;
      color: var(--text);
      font-size: var(--font-size-title);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-title);
      letter-spacing: -0.02em;
    }

    .page-description {
      max-width: 650px;
      margin: var(--space-2) 0 0;
      color: var(--muted);
      line-height: var(--line-height-body);
    }

    .page-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: var(--space-2);
      flex: 0 0 auto;
    }

    .button {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      height: var(--control-default);
      padding: 0 var(--space-4);
      color: var(--text-soft);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-regular);
      cursor: pointer;
      line-height: 1;
      white-space: nowrap;
    }

    .button:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .button.primary {
      color: #071411;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: var(--font-weight-semibold);
    }

    html[data-theme="light"] .button.primary {
      color: white;
    }

    .button.primary:hover {
      background: color-mix(in srgb, var(--accent) 88%, white);
    }

    html[data-theme="light"] .button.primary:hover {
      background: color-mix(in srgb, var(--accent) 88%, black);
    }

    .button.danger {
      color: var(--red);
      background: var(--red-soft);
      border-color: color-mix(in srgb, var(--red) 28%, transparent);
    }

    .button.small {
      height: var(--control-compact);
      padding: 0 var(--space-3);
      font-size: var(--font-size-caption);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(145px, 1fr));
      gap: var(--space-3);
      margin-bottom: var(--space-5);
    }

    .metric-card {
      position: relative;
      min-height: 104px;
      overflow: hidden;
      padding: var(--space-4);
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-large);
    }

    .metric-card::after {
      content: "";
      position: absolute;
      top: var(--space-3);
      bottom: var(--space-3);
      left: 0;
      width: var(--space-1);
      border-radius: 0 var(--radius-small) var(--radius-small) 0;
      background: var(--metric-color, var(--accent));
      opacity: 0.74;
    }

    .metric-label {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
    }

    .metric-icon {
      display: grid;
      place-items: center;
      width: var(--control-compact);
      height: var(--control-compact);
      color: var(--metric-color, var(--accent));
      background: var(--metric-bg, var(--accent-soft));
      border-radius: var(--radius-regular);
    }

    .metric-value {
      position: relative;
      z-index: 1;
      margin-top: var(--space-2);
      color: var(--text);
      font-size: var(--font-size-title);
      font-weight: var(--font-weight-semibold);
      letter-spacing: -0.04em;
    }

    .metric-foot {
      position: relative;
      z-index: 1;
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.36fr) minmax(270px, 0.64fr);
      gap: var(--space-4);
      align-items: start;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-large);
    }

    .panel + .panel {
      margin-top: var(--space-4);
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-height: var(--control-large);
      padding: 0 var(--space-4);
      border-bottom: 1px solid var(--border-soft);
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      color: var(--text);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-semibold);
    }

    .panel-title .icon {
      color: var(--muted);
    }

    .panel-caption {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .panel-action {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-1);
      min-height: var(--control-compact);
      padding: 0 var(--space-2);
      margin-right: calc(-1 * var(--space-2));
      margin-left: auto;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: var(--radius-regular);
      font-size: var(--font-size-caption);
      cursor: pointer;
      white-space: nowrap;
    }

    .panel-action:hover {
      color: var(--accent);
      background: var(--surface-hover);
    }

    .data-page {
      height: 100%;
      overflow: auto;
      background: var(--surface);
    }

    .sticky-panel-header {
      position: sticky;
      top: 0;
      z-index: var(--z-navigation);
      background: var(--surface);
    }

    .panel-header-action {
      margin-left: auto;
    }

    .button.block {
      width: 100%;
    }

    .push-right {
      margin-left: auto;
    }

    .text-success {
      color: var(--green);
    }

    .text-warning {
      color: var(--yellow);
    }

    .text-danger {
      color: var(--red);
    }

    .attention-list {
      padding: var(--space-2);
    }

    .attention-item {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-3);
      width: 100%;
      min-height: 64px;
      padding: var(--space-2) var(--space-3);
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .attention-item:hover {
      background: var(--surface-hover);
    }

    .attention-symbol {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-regular);
    }

    .attention-symbol.yellow {
      color: var(--yellow);
      background: var(--yellow-soft);
    }

    .attention-symbol.red {
      color: var(--red);
      background: var(--red-soft);
    }

    .attention-symbol.blue {
      color: var(--blue);
      background: var(--blue-soft);
    }

    .attention-name {
      display: block;
      color: var(--text-soft);
      font-weight: var(--font-weight-medium);
    }

    .attention-detail {
      display: block;
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .status-pill {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-1);
      height: 24px;
      padding: 0 var(--space-2);
      border-radius: 999px;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      white-space: nowrap;
    }

    .status-pill.yellow {
      color: var(--yellow);
      background: var(--yellow-soft);
    }

    .status-pill.red {
      color: var(--red);
      background: var(--red-soft);
    }

    .status-pill.blue {
      color: var(--blue);
      background: var(--blue-soft);
    }

    .status-pill.green {
      color: var(--green);
      background: var(--green-soft);
    }

    .status-pill.neutral {
      color: var(--muted);
      background: var(--surface-3);
    }

    .status-pill .icon {
      width: 12px;
      height: 12px;
    }

    .repo-table {
      width: 100%;
      min-width: 0;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .repo-table th:nth-child(1) { width: 37%; }
    .repo-table th:nth-child(2) { width: 23%; }
    .repo-table th:nth-child(3) { width: 18%; }
    .repo-table th:nth-child(4) { width: 22%; }

    .repo-table th,
    .repo-table td {
      height: var(--control-large);
      overflow: hidden;
      padding: 0 var(--space-3);
      border-bottom: 1px solid var(--border-soft);
      text-align: left;
      white-space: nowrap;
    }

    .repo-table th {
      height: var(--control-default);
      color: var(--muted);
      background: var(--surface-2);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
    }

    .repo-table tr:last-child td {
      border-bottom: 0;
    }

    .repo-table tbody tr:hover {
      background: var(--surface-hover);
    }

    .table-repo {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      width: 100%;
      min-height: var(--control-compact);
      min-width: 0;
      padding: 0;
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .table-repo .repo-icon {
      width: var(--icon-large);
      height: var(--icon-large);
      flex: 0 0 auto;
    }

    .table-repo-name {
      display: block;
      overflow: hidden;
      color: var(--text-soft);
      font-weight: var(--font-weight-medium);
      text-overflow: ellipsis;
    }

    .table-repo-copy {
      display: block;
      min-width: 0;
      overflow: hidden;
    }

    .table-repo-path {
      display: block;
      overflow: hidden;
      margin-top: 1px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 11px;
      text-overflow: ellipsis;
    }

    .branch-text,
    .sync-text {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      overflow: hidden;
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .branch-text .icon,
    .sync-text .icon {
      width: 12px;
      height: 12px;
    }

    .mini-counts {
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }

    .mini-count {
      min-width: 25px;
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-small);
      text-align: center;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .mini-count.changed {
      color: var(--yellow);
      background: var(--yellow-soft);
    }

    .mini-count.conflicted {
      color: var(--red);
      background: var(--red-soft);
    }

    .mini-count.clean {
      color: var(--green);
      background: var(--green-soft);
    }

    .activity-list {
      padding: var(--space-1) var(--space-4) var(--space-3);
    }

    .activity-item {
      position: relative;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) auto;
      gap: var(--space-2);
      min-height: 56px;
      padding: var(--space-2) 0;
    }

    .activity-item:not(:last-child)::after {
      content: "";
      position: absolute;
      top: 33px;
      bottom: -9px;
      left: 11px;
      width: 1px;
      background: var(--border);
    }

    .activity-dot {
      z-index: 1;
      display: grid;
      place-items: center;
      width: 23px;
      height: 23px;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 50%;
    }

    .activity-dot .icon {
      width: 12px;
      height: 12px;
    }

    .activity-title {
      color: var(--text-soft);
      line-height: 1.35;
    }

    .activity-title strong {
      color: var(--text);
    }

    .activity-sub {
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .activity-time {
      padding-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .repo-hero {
      position: relative;
      display: grid;
      grid-template-columns: var(--control-large) minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-4);
      min-height: 112px;
      overflow: hidden;
      margin-bottom: var(--space-4);
      padding: var(--space-4);
      background:
        linear-gradient(112deg, color-mix(in srgb, var(--accent) 8%, var(--surface)), var(--surface) 58%),
        var(--surface);
      border: 1px solid color-mix(in srgb, var(--accent) 17%, var(--border-soft));
      border-radius: var(--radius-large);
    }

    .repo-hero::after {
      content: none;
    }

    .repo-hero-icon {
      z-index: 1;
      display: grid;
      place-items: center;
      width: var(--control-large);
      height: var(--control-large);
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent);
      border-radius: var(--radius-large);
    }

    .repo-hero-icon .icon {
      width: var(--icon-large);
      height: var(--icon-large);
    }

    .repo-hero-copy {
      z-index: 1;
      min-width: 0;
    }

    .repo-hero-title {
      color: var(--text);
      font-size: var(--font-size-section);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-title);
    }

    .repo-hero-path {
      overflow: hidden;
      max-width: 640px;
      margin-top: var(--space-1);
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .repo-hero-status {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-2);
    }

    .repo-hero-actions {
      z-index: 1;
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-2);
      white-space: nowrap;
    }

    .repo-hero-actions .button {
      min-width: 104px;
    }

    .commit-list {
      padding: var(--space-1) 0;
    }

    .commit-row {
      display: grid;
      grid-template-columns: var(--control-large) minmax(0, 1fr) 120px 88px;
      align-items: center;
      width: 100%;
      min-height: 64px;
      padding: 0 var(--space-3) 0 var(--space-1);
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
    }

    .commit-row:last-child {
      border-bottom: 0;
    }

    .commit-row:hover,
    .commit-row.selected {
      background: var(--surface-hover);
    }

    .commit-row.selected {
      box-shadow: 2px 0 0 var(--accent) inset;
    }

    .commit-graph {
      position: relative;
      align-self: stretch;
      min-height: 64px;
    }

    .commit-graph::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 23px;
      width: 2px;
      background: var(--lane-color, var(--accent));
      opacity: 0.56;
    }

    .commit-graph.branch::after {
      content: "";
      position: absolute;
      top: 28px;
      left: 24px;
      width: 20px;
      height: 17px;
      border-top: 2px solid var(--purple);
      border-right: 2px solid var(--purple);
      border-radius: 0 12px 0 0;
      transform: translateY(-17px);
      opacity: 0.62;
    }

    .commit-node {
      position: absolute;
      top: 50%;
      left: 18px;
      width: 12px;
      height: 12px;
      transform: translateY(-50%);
      background: var(--surface);
      border: 3px solid var(--lane-color, var(--accent));
      border-radius: 50%;
      z-index: 2;
    }

    .commit-row:hover .commit-node,
    .commit-row.selected .commit-node {
      background: var(--surface-hover);
    }

    .commit-message {
      min-width: 0;
      padding-right: var(--space-3);
    }

    .commit-subject {
      overflow: hidden;
      color: var(--text-soft);
      font-weight: var(--font-weight-medium);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .commit-meta {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .ref-label {
      display: inline-flex;
      align-items: center;
      height: var(--space-5);
      padding: 0 var(--space-2);
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
      border-radius: 999px;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .ref-label.remote {
      color: var(--blue);
      background: var(--blue-soft);
      border-color: color-mix(in srgb, var(--blue) 20%, transparent);
    }

    .commit-author {
      overflow: hidden;
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .commit-time,
    .commit-hash {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .commit-hash {
      font-family: var(--font-mono);
    }

    .branch-health-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-2);
      padding: var(--space-3);
    }

    .branch-health-item {
      padding: var(--space-3);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .branch-health-label {
      color: var(--muted);
      font-size: var(--font-size-caption);
      letter-spacing: 0.03em;
    }

    .branch-health-value {
      overflow: hidden;
      margin-top: var(--space-2);
      color: var(--text);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-semibold);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .changes-layout {
      display: grid;
      grid-template-columns: clamp(240px, 26%, 300px) minmax(0, 1fr);
      height: 100%;
      min-height: 0;
      background: var(--surface);
    }

    .file-pane {
      min-height: 0;
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }

    .file-pane-header,
    .diff-header {
      display: flex;
      align-items: center;
      min-height: var(--control-large);
      padding: 0 var(--space-3);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .file-pane-title {
      color: var(--text-soft);
      font-weight: var(--font-weight-semibold);
    }

    .file-section-title {
      display: flex;
      align-items: center;
      height: var(--control-compact);
      padding: 0 var(--space-3);
      color: var(--muted);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border-soft);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
    }

    .file-section-title span {
      margin-left: auto;
      padding: 0 var(--space-2);
      background: var(--surface-3);
      border-radius: 999px;
      font-size: var(--font-size-caption);
    }

    .file-row {
      display: grid;
      grid-template-columns: var(--space-5) minmax(0, 1fr) var(--control-compact);
      align-items: center;
      min-height: var(--control-large);
      padding: 0 var(--space-2);
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
    }

    .file-row:hover,
    .file-row.active {
      background: var(--surface-hover);
    }

    .file-row.active {
      box-shadow: 2px 0 0 var(--accent) inset;
    }

    .file-status-letter {
      display: grid;
      place-items: center;
      width: var(--icon-regular);
      height: var(--icon-regular);
      border-radius: var(--radius-small);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .file-status-letter.modified {
      color: var(--yellow);
      background: var(--yellow-soft);
    }

    .file-status-letter.added {
      color: var(--green);
      background: var(--green-soft);
    }

    .file-status-letter.deleted {
      color: var(--red);
      background: var(--red-soft);
    }

    .file-status-letter.untracked {
      color: var(--blue);
      background: var(--blue-soft);
    }

    .file-path {
      min-width: 0;
      padding: 0 var(--space-2);
    }

    .file-select-button {
      display: block;
      width: 100%;
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .file-name {
      display: block;
      overflow: hidden;
      color: var(--text-soft);
      font-size: var(--font-size-body);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-dir {
      display: block;
      overflow: hidden;
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stage-toggle {
      display: grid;
      place-items: center;
      width: var(--control-compact);
      height: var(--control-compact);
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: var(--radius-small);
      cursor: pointer;
    }

    .stage-toggle:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .diff-pane {
      display: grid;
      grid-template-rows: var(--control-large) minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
    }

    .diff-title {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      color: var(--text-soft);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
    }

    .diff-title span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .diff-stats {
      display: flex;
      gap: var(--space-2);
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .diff-add { color: var(--green); }
    .diff-del { color: var(--red); }

    .file-pane-header .panel-header-action {
      margin-left: auto;
    }

    .diff-view-action {
      margin-left: var(--space-2);
    }

    .diff-code {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: var(--space-2) 0 var(--space-5);
      background: var(--code-bg);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .diff-line {
      display: grid;
      grid-template-columns: 42px 42px minmax(max-content, 1fr);
      min-width: 760px;
      min-height: 20px;
      padding-right: 16px;
    }

    .diff-line.added {
      background: color-mix(in srgb, var(--green) 10%, transparent);
    }

    .diff-line.deleted {
      background: color-mix(in srgb, var(--red) 10%, transparent);
    }

    .diff-line.hunk {
      color: var(--blue);
      background: var(--blue-soft);
    }

    .line-no {
      padding-right: 9px;
      color: var(--muted);
      border-right: 1px solid var(--border-soft);
      text-align: right;
      user-select: none;
    }

    .line-code {
      padding-left: 12px;
      color: var(--text-soft);
      white-space: pre;
    }

    .diff-line.added .line-code { color: color-mix(in srgb, var(--green) 75%, var(--text)); }
    .diff-line.deleted .line-code { color: color-mix(in srgb, var(--red) 75%, var(--text)); }

    .branches-table {
      width: 100%;
      min-width: 700px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .branches-table th:nth-child(1) { width: 28%; }
    .branches-table th:nth-child(2) { width: 12%; }
    .branches-table th:nth-child(3) { width: 26%; }
    .branches-table th:nth-child(4) { width: 13%; }
    .branches-table th:nth-child(5) { width: 12%; }
    .branches-table th:nth-child(6) { width: 9%; }

    .branches-table th,
    .branches-table td {
      height: var(--control-large);
      padding: 0 var(--space-3);
      border-bottom: 1px solid var(--border-soft);
      text-align: left;
    }

    .branches-table th {
      height: var(--control-default);
      color: var(--muted);
      background: var(--surface-2);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
    }

    .branches-table tbody tr:hover {
      background: var(--surface-hover);
    }

    .branches-table tbody tr.selected {
      background: var(--accent-soft);
      box-shadow: 3px 0 0 var(--accent) inset;
    }

    .branch-name-button {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      width: 100%;
      min-height: var(--control-compact);
      min-width: 0;
      padding: 0;
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .branch-name-cell {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      color: var(--text-soft);
      font-weight: var(--font-weight-medium);
    }

    .branch-name-cell.current {
      color: var(--accent);
    }

    .branch-name-cell span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .branch-current-dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .branch-action-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-1);
    }

    .worktree-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-3);
    }

    .worktree-card {
      position: relative;
      width: 100%;
      min-height: 160px;
      padding: var(--space-4);
      color: inherit;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-large);
      cursor: pointer;
    }

    .worktree-card:hover {
      border-color: color-mix(in srgb, var(--accent) 34%, var(--border));
    }

    .worktree-card.primary {
      background: linear-gradient(140deg, var(--accent-soft), var(--surface) 48%);
      border-color: color-mix(in srgb, var(--accent) 25%, var(--border));
    }

    .worktree-card-head {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
    }

    .worktree-card-head > span:nth-child(2) {
      flex: 1 1 auto;
      min-width: 0;
    }

    .worktree-symbol {
      display: grid;
      flex: 0 0 var(--control-default);
      place-items: center;
      width: var(--control-default);
      height: var(--control-default);
      color: var(--blue);
      background: var(--blue-soft);
      border-radius: var(--radius-regular);
    }

    .worktree-card.primary .worktree-symbol {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .worktree-title {
      overflow: hidden;
      color: var(--text);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-semibold);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .worktree-branch {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      overflow: hidden;
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .worktree-path {
      overflow: hidden;
      margin-top: var(--space-4);
      padding: var(--space-2) var(--space-3);
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .worktree-foot {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-3);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .worktree-foot .spacer {
      flex: 1;
    }

    .inspector-head {
      display: flex;
      align-items: center;
      min-height: var(--control-large);
      padding: 0 var(--space-4);
      border-bottom: 1px solid var(--border-soft);
    }

    .inspector-title {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--text);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-semibold);
    }

    .inspector-title .icon {
      color: var(--muted);
    }

    .inspector-close {
      margin-left: auto;
    }

    .inspector-actions {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      margin-left: auto;
    }

    .inspector-actions .inspector-close {
      margin-left: 0;
    }

    .inspector-section {
      padding: var(--space-4);
      border-bottom: 1px solid var(--border-soft);
    }

    .inspector-section-title {
      display: flex;
      align-items: center;
      margin-bottom: var(--space-3);
      color: var(--muted);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
    }

    .inspector-section-title span {
      margin-left: auto;
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-medium);
      letter-spacing: 0;
      text-transform: none;
    }

    .health-ring-wrap {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }

    .health-ring {
      --value: 84%;
      position: relative;
      display: grid;
      place-items: center;
      width: 66px;
      height: 66px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: conic-gradient(var(--accent) var(--value), var(--surface-3) 0);
    }

    .health-ring::before {
      content: "";
      position: absolute;
      width: 51px;
      height: 51px;
      background: var(--surface);
      border-radius: 50%;
    }

    .health-ring strong {
      z-index: 1;
      color: var(--text);
      font-size: var(--font-size-body);
    }

    .health-copy-title {
      color: var(--text);
      font-weight: var(--font-weight-semibold);
    }

    .health-copy-text {
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .detail-list {
      display: grid;
      gap: var(--space-2);
    }

    .detail-row {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: var(--space-2);
      align-items: start;
    }

    .detail-label {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .detail-value {
      min-width: 0;
      overflow: hidden;
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .operation-list {
      display: grid;
      gap: var(--space-2);
    }

    .operation-item {
      padding: var(--space-3);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .operation-head {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .operation-icon {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: var(--radius-regular);
    }

    .operation-icon.success {
      color: var(--green);
      background: var(--green-soft);
    }

    .operation-name {
      min-width: 0;
      overflow: hidden;
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-medium);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .operation-state {
      margin-left: auto;
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .progress-track {
      height: 4px;
      overflow: hidden;
      margin-top: var(--space-2);
      background: var(--surface-3);
      border-radius: 999px;
    }

    .progress-value {
      width: 68%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--blue));
      border-radius: inherit;
      transition: width var(--motion-micro) var(--ease-enter);
    }

    .operation-foot {
      display: flex;
      justify-content: space-between;
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-2);
    }

    .quick-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      min-width: 0;
      min-height: var(--control-default);
      padding: 0 var(--space-3);
      color: var(--text-soft);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
      cursor: pointer;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
    }

    .quick-button:hover {
      color: var(--text);
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .quick-button .icon {
      color: var(--muted);
    }

    .commit-form {
      display: grid;
      gap: var(--space-3);
    }

    .form-label {
      color: var(--muted);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .form-input,
    .form-textarea {
      width: 100%;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-regular);
      transition:
        background-color var(--motion-micro) ease,
        border-color var(--motion-micro) ease;
    }

    .form-input:hover,
    .form-textarea:hover,
    .sidebar-search:hover {
      border-color: color-mix(in srgb, var(--accent) 36%, var(--border));
    }

    .form-input:focus,
    .form-textarea:focus,
    .sidebar-search:focus {
      border-color: var(--color-focus);
    }

    .form-input[aria-invalid="true"],
    .form-textarea[aria-invalid="true"] {
      border-color: var(--red);
      background: color-mix(in srgb, var(--red-soft) 48%, var(--surface-2));
    }

    .form-input:disabled,
    .form-textarea:disabled,
    .sidebar-search:disabled {
      color: var(--color-text-disabled);
      background: var(--surface-2);
      cursor: not-allowed;
      opacity: 0.72;
    }

    .form-input {
      height: var(--control-default);
      padding: 0 var(--space-3);
    }

    .form-textarea {
      min-height: 96px;
      padding: var(--space-3);
      resize: vertical;
    }

    .form-input::placeholder,
    .form-textarea::placeholder {
      color: var(--muted);
    }

    .form-field-meta {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-2);
      min-height: var(--space-5);
      color: var(--muted);
      font-size: var(--font-size-caption);
      font-variant-numeric: tabular-nums;
    }

    .form-error {
      display: none;
      color: var(--red);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .form-error:not(:empty) {
      display: block;
    }

    .form-field-meta:has(.form-error:not(:empty)) .form-help {
      display: none;
    }

    .commit-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-height: var(--control-compact);
      cursor: pointer;
    }

    .checkbox-label input {
      accent-color: var(--accent);
    }

    .commit-button {
      width: 100%;
      margin-top: var(--space-1);
    }

    .selected-commit-title {
      margin: 0 0 var(--space-2);
      color: var(--text);
      font-size: var(--font-size-emphasis);
      line-height: var(--line-height-title);
    }

    .selected-commit-body {
      margin: 0;
      color: var(--muted);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .avatar-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }

    .avatar {
      display: grid;
      place-items: center;
      width: var(--control-compact);
      height: var(--control-compact);
      color: #fff;
      background: linear-gradient(145deg, #5579df, #9d67d5);
      border-radius: 50%;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .avatar-meta {
      min-width: 0;
    }

    .avatar-name {
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-medium);
    }

    .avatar-time {
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .changed-file-list {
      display: grid;
      gap: var(--space-1);
    }

    .changed-file-item {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      padding: var(--space-2);
      background: var(--surface-2);
      border-radius: var(--radius-regular);
    }

    .changed-file-item span {
      overflow: hidden;
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .changed-file-item .file-change-stat {
      display: flex;
      gap: var(--space-1);
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
    }

    .statusbar {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      min-width: 0;
      padding: 0 var(--space-2);
      color: var(--muted);
      background: var(--titlebar);
      border-top: 1px solid var(--border-soft);
      font-size: var(--font-size-caption);
      user-select: none;
    }

    .statusbar-item {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      min-width: 0;
    }

    .statusbar-item .icon {
      width: 12px;
      height: 12px;
    }

    .statusbar-spacer {
      flex: 1;
    }

    .online-dot {
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 0 3px var(--green-soft);
    }

    .toast {
      position: fixed;
      top: var(--space-5);
      left: 50%;
      z-index: var(--z-toast);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      width: min(400px, calc(100vw - 48px));
      min-height: 64px;
      padding: var(--space-3) var(--space-4);
      color: var(--text);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translate(-50%, -12px);
      pointer-events: none;
      transition:
        opacity var(--motion-exit) var(--ease-exit),
        transform var(--motion-exit) var(--ease-exit);
      backdrop-filter: blur(16px);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
      transition-duration: var(--motion-micro), var(--motion-micro);
      transition-timing-function: var(--ease-enter), var(--ease-enter);
    }

    .toast-symbol {
      display: grid;
      place-items: center;
      width: var(--control-default);
      height: var(--control-default);
      flex: 0 0 auto;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: var(--radius-regular);
    }

    .toast-title {
      color: var(--text);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-semibold);
      display: block;
    }

    .toast-message {
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
      display: block;
    }

    .command-overlay {
      position: fixed;
      inset: 0;
      z-index: var(--z-overlay);
      display: grid;
      place-items: start center;
      padding-top: 12vh;
      background: var(--color-overlay);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--motion-exit) var(--ease-exit);
      backdrop-filter: blur(5px);
    }

    .command-overlay.open {
      opacity: 1;
      pointer-events: auto;
      transition-duration: var(--motion-layer);
      transition-timing-function: var(--ease-enter);
    }

    .command-palette {
      position: relative;
      z-index: var(--z-modal);
      width: min(610px, calc(100vw - 40px));
      max-height: min(680px, calc(100vh - 48px));
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      transform: translateY(-8px) scale(0.985);
      transform-origin: top center;
      transition: transform var(--motion-exit) var(--ease-exit);
    }

    .command-overlay.open .command-palette {
      transform: translateY(0) scale(1);
      transition-duration: var(--motion-layer);
      transition-timing-function: var(--ease-enter);
    }

    .command-input-wrap {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      height: var(--control-large);
      padding: 0 var(--space-4);
      border-bottom: 1px solid var(--border);
      border-radius: var(--radius-large) var(--radius-large) 0 0;
    }

    .command-input-wrap:focus-within {
      background: color-mix(in srgb, var(--accent) 5%, transparent);
      border-bottom-color: var(--color-focus);
    }

    .command-input-wrap .icon {
      color: var(--muted);
    }

    .command-input-wrap:focus-within .icon {
      color: var(--accent);
    }

    .command-input {
      flex: 1;
      height: 100%;
      color: var(--text);
      background: transparent;
      border: 0;
      font-size: var(--font-size-body);
    }

    .command-input:focus-visible {
      outline-color: transparent;
    }

    .command-input::placeholder {
      color: var(--muted);
    }

    .command-results {
      max-height: min(480px, calc(100vh - 160px));
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: var(--space-2);
    }

    .command-group-label {
      padding: var(--space-2);
      color: var(--muted);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
    }

    .command-result {
      display: grid;
      grid-template-columns: var(--control-compact) minmax(0, 1fr) auto;
      align-items: center;
      width: 100%;
      min-height: var(--control-large);
      padding: 0 var(--space-2);
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .command-result:hover,
    .command-result:focus-visible {
      background: var(--surface-hover);
    }

    .command-result:focus-visible {
      outline: 1px solid var(--color-focus);
      outline-offset: -1px;
    }

    .command-result-icon {
      display: grid;
      place-items: center;
      width: var(--control-compact);
      height: var(--control-compact);
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: var(--radius-regular);
    }

    .command-result-title {
      display: block;
      color: var(--text-soft);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-medium);
    }

    .command-result:hover .command-result-title,
    .command-result:focus-visible .command-result-title {
      color: var(--text);
    }

    .command-result-sub {
      display: block;
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .command-status,
    .command-key {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: var(--font-size-caption);
      white-space: nowrap;
    }

    .command-result > .command-status,
    .command-result > .command-key {
      margin-left: var(--space-3);
    }

    .command-status {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .command-key {
      display: inline-grid;
      place-items: center;
      min-width: var(--control-compact);
      height: var(--space-6);
      padding: 0 var(--space-2);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-small);
      font-family: inherit;
      line-height: 1;
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 260px;
      padding: var(--space-5);
      color: var(--muted);
      text-align: center;
    }

    .compact-empty-state {
      min-height: 150px;
    }

    .command-empty-state {
      min-height: 192px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .empty-state-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin: 0 auto var(--space-3);
      color: var(--muted);
      background: var(--surface-2);
      border-radius: var(--radius-large);
    }

    .empty-state-title {
      color: var(--text);
      font-size: var(--font-size-emphasis);
      font-weight: var(--font-weight-semibold);
    }

    .empty-state-description {
      max-width: 360px;
      margin: var(--space-2) auto 0;
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .empty-state-actions {
      display: flex;
      justify-content: center;
      gap: var(--space-2);
      margin-top: var(--space-4);
    }

    .field-help {
      min-height: var(--space-5);
      margin-top: var(--space-2);
      color: var(--muted);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .field-help.warning {
      color: var(--yellow);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: var(--z-overlay);
      display: grid;
      place-items: center;
      padding: var(--space-5);
      background: var(--color-overlay);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity var(--motion-exit) var(--ease-exit),
        visibility var(--motion-exit) var(--ease-exit);
      backdrop-filter: blur(4px);
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition-duration: var(--motion-layer), var(--motion-layer);
      transition-timing-function: var(--ease-enter), var(--ease-enter);
    }

    .confirm-dialog {
      position: relative;
      z-index: var(--z-modal);
      width: min(480px, 100%);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow);
      transform: translateY(12px) scale(0.985);
      transform-origin: center;
      transition: transform var(--motion-exit) var(--ease-exit);
    }

    .modal-overlay.open .confirm-dialog {
      transform: translateY(0) scale(1);
      transition-duration: var(--motion-layer);
      transition-timing-function: var(--ease-enter);
    }

    .confirm-dialog-body {
      display: grid;
      grid-template-columns: var(--control-large) minmax(0, 1fr);
      gap: var(--space-4);
      padding: var(--space-5);
    }

    .confirm-dialog-icon {
      display: grid;
      place-items: center;
      width: var(--control-large);
      height: var(--control-large);
      color: var(--red);
      background: var(--red-soft);
      border-radius: var(--radius-large);
    }

    .confirm-dialog-title {
      margin: 0;
      color: var(--text);
      font-size: var(--font-size-section);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-title);
    }

    .confirm-dialog-description {
      margin: var(--space-2) 0 0;
      color: var(--muted);
      line-height: var(--line-height-body);
    }

    .confirm-dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: var(--space-2);
      padding: var(--space-4) var(--space-5);
      background: var(--surface-2);
      border-top: 1px solid var(--border-soft);
    }

    .button.danger.primary {
      color: #fff;
      background: var(--red);
      border-color: var(--red);
    }

    .button.danger.primary:hover {
      background: color-mix(in srgb, var(--red) 86%, #000);
    }

    .button,
    .icon-button,
    .toolbar-button,
    .rail-button,
    .quick-button,
    .bulk-sync,
    .context-tab,
    .repo-row,
    .attention-item,
    .worktree-card,
    .command-result,
    .branch-name-button,
    .stage-toggle,
    .menu-button,
    .global-search,
    .workspace-switcher,
    .workspace-overview-button,
    .window-control,
    .branch-selector,
    .panel-action {
      transition:
        color var(--motion-micro) ease,
        background-color var(--motion-micro) ease,
        border-color var(--motion-micro) ease,
        box-shadow var(--motion-micro) ease,
        transform var(--motion-micro) ease;
    }

    button:disabled,
    button[aria-disabled="true"],
    [role="button"][aria-disabled="true"] {
      color: var(--color-text-disabled);
      background: var(--surface-2);
      border-color: var(--border-soft);
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.72;
      pointer-events: none;
      transform: none;
    }

    .button.is-error,
    .toolbar-button.is-error,
    .quick-button.is-error {
      color: var(--red);
      background: var(--red-soft);
      border-color: color-mix(in srgb, var(--red) 36%, var(--border));
