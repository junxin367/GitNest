            <div class="detail-row"><span class="detail-label">HEAD</span><span class="detail-value">${repo.head}</span></div>
            <div class="detail-row"><span class="detail-label">状态</span><span class="detail-value ${repo.changes ? "text-warning" : "text-success"}">${repo.changes ? `${repo.changes} 项变更` : "工作区干净"}</span></div>
            <div class="detail-row"><span class="detail-label">已登记</span><span class="detail-value">${repo.worktrees}</span></div>
            <div class="detail-row"><span class="detail-label">可清理</span><span class="detail-value ${repo.prunable ? "text-danger" : ""}">${repo.prunable}</span></div>
            <div class="detail-row"><span class="detail-label">游离 HEAD</span><span class="detail-value">${repo.detached}</span></div>
          </div>
        </section>
        <section class="inspector-section">
          <div class="inspector-section-title">快捷操作</div>
          <div class="quick-grid">
            <button class="quick-button" onclick="showToast('打开目录', '将在系统文件管理器中打开。', 'folder')">${icon("folder")}打开目录</button>
            <button class="quick-button" onclick="openDefaultTerminal('repository')">${icon("terminal")}打开终端</button>
            <button class="quick-button" onclick="showToast('锁定 Worktree', '锁定后 Prune 不会移除该记录。', 'lock')">${icon("lock")}锁定</button>
            <button class="quick-button" onclick="showToast('移动 Worktree', '移动前将校验目标路径和仓库状态。', 'external')">${icon("external")}移动</button>
          </div>
        </section>
        <section class="inspector-section">
          ${renderButton({
            label: "移除 Worktree…",
            size: "small",
            variant: "danger",
            fullWidth: true,
            disabled: true,
            icon: icon("alert"),
            attributes: 'aria-describedby="worktreeRemoveReason"'
          })}
          <div class="field-help warning" id="worktreeRemoveReason">当前是只读设计预览，不会移动、清理或删除任何 Worktree。</div>
        </section>
      `;
      syncAccessibleHints();
    }

    function selectFile(path) {
      state.selectedFile = path;
      renderChanges();
    }

    function selectBranch(name) {
      state.selectedBranch = name;
      renderBranches();
    }

    function clearRepositoryFilter() {
      const input = document.getElementById("repoSearch");
      if (!input) return;
      input.value = "";
      renderSidebar();
      input.focus();
    }

    function clearCommandSearch() {
      const input = document.getElementById("commandInput");
      if (!input) return;
      input.value = "";
      renderCommandResults();
      input.focus();
    }

    function handleContextTabKeydown(event) {
      if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
      const tabs = [...document.querySelectorAll(".context-tab")];
      const currentIndex = tabs.indexOf(event.currentTarget);
      if (currentIndex < 0) return;
      event.preventDefault();
      const nextIndex = event.key === "Home"
        ? 0
        : event.key === "End"
          ? tabs.length - 1
          : event.key === "ArrowLeft"
            ? (currentIndex - 1 + tabs.length) % tabs.length
            : (currentIndex + 1) % tabs.length;
      tabs[nextIndex]?.click();
      requestAnimationFrame(() => document.querySelector(".context-tab.active")?.focus());
    }

    function activateOnKey(event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        event.currentTarget.click();
      }
    }

    function syncAccessibleHints() {
      document.querySelectorAll("button.icon-button[aria-label], button.rail-button[aria-label], button.window-control[aria-label], button.stage-toggle[aria-label], button.toolbar-button[aria-label]").forEach((button) => {
        if (!button.title) button.title = button.getAttribute("aria-label");
      });
    }

    function selectCommit(hash) {
      const togglingSelectedHistoryCommit =
        state.tab === "history" &&
        state.historyDetailOpen &&
        state.selectedCommit === hash;
      if (togglingSelectedHistoryCommit) {
        state.historyDetailOpen = false;
      } else {
        state.selectedCommit = hash;
        if (state.tab === "history") {
          state.historyDetailOpen = true;
        }
      }
      if (state.tab === "history") {
        renderHistory();
      } else {
        renderRepositoryOverview();
      }
    }

    function openWorkspace() {
      withCommitDraftGuard(() => {
        state.view = "workspace";
        state.tab = "overview";
        renderMain();
      });
    }

    function toggleRepositorySidebar() {
      state.sidebarCollapsed = !state.sidebarCollapsed;
      updateNavigationState();
    }

    function openRepository(id) {
      withCommitDraftGuard(() => {
        const repo = repositories.find((item) => item.id === id) || repositories[0];
        const changedFiles = changedFilesByRepo[repo.id] || [];
        const hasChanges =
          repo.changes > 0 ||
          repo.conflicts > 0 ||
          changedFiles.length > 0;
        state.view = "repository";
        state.repoId = repo.id;
        state.tab = hasChanges ? "changes" : "overview";
        state.selectedCommit = repo.head;
        state.historyDetailOpen = false;
        state.selectedFile = changedFiles[0]?.path || "";
        state.changeFilter = "";
        state.repoWorktreeFilter = "";
        state.repoWorktreeFilterOpen = false;
        state.repoWorktreeFacets = [];
        state.repoWorktreeOnlyDirty = false;
        resetDiffSearch();
        state.selectedBranch = repo.branch;
        renderMain();
      });
    }

    function setWorkspaceTab(tab) {
      withCommitDraftGuard(() => {
        state.view = "workspace";
        state.tab = tab;
        renderMain();
      });
    }

    function toggleWorkspaceOverviewSection(section, event) {
      if (event?.target?.closest?.("a, button, input, select, textarea") &&
          event.target !== event.currentTarget) {
        return;
      }
      if (section === "repository-status") {
        state.workspaceOverviewRepositoryStatusCollapsed =
          !state.workspaceOverviewRepositoryStatusCollapsed;
      } else if (section === "recent-commits") {
        state.workspaceOverviewRecentCommitsCollapsed =
          !state.workspaceOverviewRecentCommitsCollapsed;
      } else {
        return;
      }
      renderWorkspaceOverview();
    }

    function handleWorkspaceOverviewSectionKeydown(event, section) {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      toggleWorkspaceOverviewSection(section, event);
    }

    function setRepoTab(tab) {
      if (state.view === "repository" && state.tab === tab) return;
      withCommitDraftGuard(() => {
        state.view = "repository";
        state.tab = tab;
        if (tab === "history") {
          state.historyDetailOpen = false;
        }
        if (tab !== "changes") resetDiffSearch();
        renderMain();
      });
    }

    function showOperationCenter() {
      withCommitDraftGuard(() => {
        state.view = "operations";
        state.tab = "overview";
        state.inspectorOpen = false;
        renderMain();
      });
    }

    function startButtonLoading(button) {
      if (!(button instanceof HTMLButtonElement) || button.disabled) return null;
      const width = button.getBoundingClientRect().width;
      button.dataset.loadingLabel = button.getAttribute("aria-label") || "";
      button.style.inlineSize = `${width}px`;
      button.classList.add("is-loading");
      button.setAttribute("aria-busy", "true");
      button.setAttribute("aria-label", `${button.innerText.trim() || button.title || "操作"}，处理中`);
      button.disabled = true;
      return button;
    }

    function stopButtonLoading(button) {
      if (!(button instanceof HTMLButtonElement)) return;
      button.classList.remove("is-loading");
      button.removeAttribute("aria-busy");
      button.disabled = false;
      button.style.inlineSize = "";
      if (button.dataset.loadingLabel) button.setAttribute("aria-label", button.dataset.loadingLabel);
      else button.removeAttribute("aria-label");
      delete button.dataset.loadingLabel;
    }

    function runOperation(kind, trigger = null) {
      const config = {
        "fetch-all": ["Fetch 全部（设计预览）", `不会执行 Git 命令；当前仍是 ${workspaceSnapshot.totalRepositories} 个仓库的本地快照。`, "download"],
        "scan": ["重新扫描（设计预览）", `不会重新读取或修改 ${workspaceSnapshot.rootPath}。`, "refresh"],
        "pull-all": ["批量 Pull（设计预览）", `会对 Workspace 中的全部 ${workspaceSnapshot.totalRepositories} 个仓库执行 Pull；当前不会执行更新。`, "arrowDown"],
        "push-all": ["批量 Push（设计预览）", `会对 Workspace 中的全部 ${workspaceSnapshot.totalRepositories} 个仓库执行 Push；当前不会执行更新。`, "arrowUp"],
        "fetch": ["Fetch（设计预览）", `${currentRepo().name} 不会获取远程引用。`, "download"],
        "pull": ["Pull（设计预览）", `${currentRepo().name} 不会更新工作目录或分支。`, "arrowDown"],
        "push": ["Push（设计预览）", `${currentRepo().name} 不会向远程发送任何提交。`, "arrowUp"]
      };
      const [title, message, iconName] = config[kind] || ["设计预览", "不会执行真实 Git 操作。", "operations"];
      const activeTrigger = startButtonLoading(trigger);
      showToast(title, message, iconName);
      if (activeTrigger) {
        clearTimeout(state.transientLoadingTimer);
        state.transientLoadingTimer = setTimeout(() => {
          stopButtonLoading(activeTrigger);
          state.transientLoadingTimer = null;
        }, 650);
      }
    }

    function showToast(title, message, iconName = "check", tone = "info") {
      return window.GitNestToast.show({
        title,
        message,
        tone,
        icon: icon(iconName),
        duration: 3100,
        closable: true
      });
    }

    function showErrorToast(title, message) {
      showToast(title, message, "alert", "error");
    }

    async function copyText(value, label) {
      try {
        await navigator.clipboard.writeText(value);
      } catch {
        const textarea = document.createElement("textarea");
        textarea.value = value;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      }
      showToast(`${label} 已复制`, value, "copy");
    }

    async function copyDiffPath(button) {
      const value = button?.dataset?.copyPath || "";
      if (!value) return;

      await copyText(value, "文件路径");
      button.classList.add("copied");
      button.setAttribute("aria-label", "文件路径已复制");
      button.setAttribute("title", "文件路径已复制");
      button.innerHTML = icon("check", 14);
      window.setTimeout(() => {
        if (!button.isConnected) return;
        button.classList.remove("copied");
        button.setAttribute("aria-label", "复制文件路径");
        button.setAttribute("title", "复制完整文件路径");
        button.innerHTML = icon("fileCode", 14);
      }, 1800);
    }

    function applyTheme() {
      document.documentElement.dataset.theme = state.theme;
      document.getElementById("themeColorMeta").setAttribute("content", state.theme === "dark" ? "#090d12" : "#e9eef4");
      try {
        localStorage.setItem("gitnest-theme", state.theme);
      } catch {
        // 文件预览环境可能禁用持久化；主题切换本身仍然有效。
      }
    }

    function toggleTheme() {
      state.theme = state.theme === "dark" ? "light" : "dark";
      applyTheme();
      updateThemeIcon();
      showToast(state.theme === "dark" ? "已切换为深色主题" : "已切换为浅色主题", "布局、层级与状态颜色保持一致。", state.theme === "dark" ? "moon" : "sun");
    }

    function updateThemeIcon() {
      const button = document.getElementById("themeRail");
      if (button) button.innerHTML = icon(state.theme === "dark" ? "sun" : "moon");
    }

    function setInspectorBackgroundInert(inert) {
      [
        ".titlebar",
        ".activity-rail",
        ".workspace-sidebar",
        ".commandbar",
        ".context-tabs",
        ".main-content",
        ".statusbar"
      ].forEach((selector) => {
        const element = document.querySelector(selector);
        if (element) element.inert = inert;
      });
    }

    function updateInspectorState() {
      const compactLayout = window.innerWidth <= inspectorOverlayBreakpoint;
      document.body.classList.toggle("inspector-open", state.inspectorOpen);
      document.querySelectorAll('[aria-label="切换详情面板"]').forEach((button) => {
        button.setAttribute("aria-pressed", String(state.inspectorOpen));
      });
      setInspectorBackgroundInert(compactLayout && state.inspectorOpen);
    }

    function toggleInspector(force) {
      const compactLayout = window.innerWidth <= inspectorOverlayBreakpoint;
      const nextOpen = typeof force === "boolean" ? force : !state.inspectorOpen;
      if (nextOpen && compactLayout) {
        state.inspectorReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      }
      state.inspectorOpen = nextOpen;
      updateInspectorState();
      if (nextOpen && compactLayout) {
        focusAfterInertSettles(
          document.querySelector(".inspector .inspector-close, .inspector button"),
          state.inspectorReturnFocus
        );
      } else if (!nextOpen && compactLayout && state.inspectorReturnFocus?.isConnected) {
        state.inspectorReturnFocus.focus();
        state.inspectorReturnFocus = null;
      }
    }

    function rememberInspectorBackdropPointer(event) {
      state.inspectorPointerDownOnBackdrop = event.target === event.currentTarget;
    }

    function closeInspectorFromBackdrop(event) {
      const shouldClose = state.inspectorPointerDownOnBackdrop && event.target === event.currentTarget;
      state.inspectorPointerDownOnBackdrop = false;
      if (shouldClose) toggleInspector(false);
    }

    function openCommandPalette() {
      const overlay = document.getElementById("commandOverlay");
      state.paletteReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      document.querySelector(".app-shell").inert = true;
      overlay.inert = false;
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      const input = document.getElementById("commandInput");
      input.value = "";
      renderCommandResults();
      focusAfterInertSettles(input, state.paletteReturnFocus);
    }

    function closeCommandPalette() {
      const overlay = document.getElementById("commandOverlay");
      if (!overlay.classList.contains("open")) return;
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      overlay.inert = true;
      document.querySelector(".app-shell").inert = false;
      updateInspectorState();
      if (state.paletteReturnFocus?.isConnected) {
        state.paletteReturnFocus.focus();
      }
      state.paletteReturnFocus = null;
    }

    function rememberPaletteBackdropPointer(event) {
      state.palettePointerDownOnBackdrop = event.target === event.currentTarget;
    }

    function closePaletteFromBackdrop(event) {
      const shouldClose = state.palettePointerDownOnBackdrop && event.target === event.currentTarget;
      state.palettePointerDownOnBackdrop = false;
      if (shouldClose) closeCommandPalette();
    }

    function branchSwitchOptions(repo) {
      const names = [
        repo.branch,
        ...repositories
          .filter((item) => item.group === repo.group)
          .map((item) => item.branch),
        "master",
        "test",
        "pre-production",
        "main"
      ].filter(Boolean);

      return [...new Set(names)].map((name) => ({
        name,
        current: name === repo.branch,
        upstream: `origin/${name}`
      }));
    }

    function renderBranchSwitchDialog() {
      const repo = currentRepo();
      const branches = branchSwitchOptions(repo);
      const list = document.getElementById("branchSwitchList");
      document.getElementById("branchSwitchDescription").textContent = `${repo.name} · ${repoAbsolutePath(repo)}`;
      document.getElementById("branchSwitchCount").textContent = `${branches.length} 条`;
      list.innerHTML = branches.map((branch) => `
        <button
          type="button"
          role="option"
          aria-selected="${branch.current}"
          class="branch-switch-option${branch.current ? " current" : ""}"
          ${branch.current ? "disabled" : `onclick="selectBranchFromSwitch(decodeURIComponent('${encodeURIComponent(branch.name)}'))"`}
          title="${branch.current ? "当前分支" : "切换前会执行安全预检"}"
        >
          <span class="branch-switch-option-main">
            ${icon(branch.current ? "check" : "branch", 16)}
            <span>
              <strong>${escapeHtml(branch.name)}</strong>
              <small>跟踪 ${escapeHtml(branch.upstream)}</small>
            </span>
          </span>
          <span class="branch-switch-option-status">${branch.current ? "当前" : "切换"}</span>
        </button>
      `).join("");
    }

    function openBranchSwitchDialog(returnFocus = null) {
      if (state.view !== "repository") return;
      const overlay = document.getElementById("branchSwitchOverlay");
      state.branchSwitchReturnFocus = returnFocus instanceof HTMLElement
        ? returnFocus
        : document.activeElement instanceof HTMLElement
          ? document.activeElement
          : null;
      renderBranchSwitchDialog();
      document.querySelector(".app-shell").inert = true;
      overlay.inert = false;
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
      focusAfterInertSettles(
        overlay.querySelector(".branch-switch-option:not(:disabled)") || document.getElementById("branchSwitchCancel"),
        state.branchSwitchReturnFocus
      );
    }

    function closeBranchSwitchDialog({ restoreFocus = true } = {}) {
      const overlay = document.getElementById("branchSwitchOverlay");
      if (!overlay.classList.contains("open")) return;
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      overlay.inert = true;
      document.querySelector(".app-shell").inert = false;
      document.body.classList.remove("modal-open");
      const returnFocus = state.branchSwitchReturnFocus;
      state.branchSwitchReturnFocus = null;
      if (restoreFocus && returnFocus?.isConnected) returnFocus.focus();
    }

    function rememberBranchSwitchBackdropPointer(event) {
      state.branchSwitchPointerDownOnBackdrop = event.target === event.currentTarget;
    }

    function closeBranchSwitchFromBackdrop(event) {
      const shouldClose = state.branchSwitchPointerDownOnBackdrop && event.target === event.currentTarget;
      state.branchSwitchPointerDownOnBackdrop = false;
      if (shouldClose) closeBranchSwitchDialog();
    }

    function selectBranchFromSwitch(name) {
      const repo = currentRepo();
      if (name === repo.branch) return;
      closeBranchSwitchDialog({ restoreFocus: false });
      showToast("切换分支预览", `${repo.name} 将切换到 ${name}；当前原型不会执行真实 Git 命令。`, "branch");
    }

    function rememberConfirmBackdropPointer(event) {
      state.confirmPointerDownOnBackdrop = event.target === event.currentTarget;
    }

    function closeConfirmFromBackdrop(event) {
      const shouldClose = state.confirmPointerDownOnBackdrop && event.target === event.currentTarget;
      state.confirmPointerDownOnBackdrop = false;
      if (shouldClose) closeConfirmDialog();
    }

    function openConfirmDialog({ title, description, actionLabel, onConfirm }) {
      closeCommandPalette();
      const overlay = document.getElementById("confirmOverlay");
      state.confirmReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      state.confirmAction = typeof onConfirm === "function" ? onConfirm : null;
      document.getElementById("confirmTitle").textContent = title;
      document.getElementById("confirmDescription").textContent = description;
      document.querySelector("#confirmAction .gn-button__label").textContent =
        actionLabel;
      document.getElementById("confirmIcon").innerHTML = icon("alert", 22);
      document.querySelector(".app-shell").inert = true;
      overlay.inert = false;
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
      focusAfterInertSettles(document.getElementById("confirmCancel"), state.confirmReturnFocus);
    }

    function closeConfirmDialog({ restoreFocus = true } = {}) {
      const overlay = document.getElementById("confirmOverlay");
      if (!overlay.classList.contains("open")) return;
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      overlay.inert = true;
      document.querySelector(".app-shell").inert = false;
      updateInspectorState();
      document.body.classList.remove("modal-open");
      const returnFocus = state.confirmReturnFocus;
      state.confirmReturnFocus = null;
      state.confirmAction = null;
      if (restoreFocus && returnFocus?.isConnected) returnFocus.focus();
    }

    function runConfirmAction() {
      const action = state.confirmAction;
      closeConfirmDialog({ restoreFocus: false });
      action?.();
    }

    function confirmBranchDelete(name) {
      openConfirmDialog({
        title: `删除分支 ${name}？`,
        description: "此操作会检查未合并提交、远程引用和关联 Worktree。设计预览不会执行真实 Git 删除。",
        actionLabel: "确认删除",
        onConfirm: () => showToast("删除检查已完成", `${name} 当前满足保护性检查；设计预览未执行删除。`, "alert")
      });
    }

    function handleCommandInputKeydown(event) {
      if (event.isComposing) return;
      const firstResult = document.querySelector(".command-result");
      if (event.key === "ArrowDown") {
        event.preventDefault();
        firstResult?.focus();
      } else if (event.key === "Enter" && firstResult) {
        event.preventDefault();
        firstResult.click();
      }
    }

    function handleCommandResultKeydown(event) {
      const results = [...document.querySelectorAll(".command-result")];
      const index = results.indexOf(event.currentTarget);
      if (event.key === "ArrowDown") {
        event.preventDefault();
        results[(index + 1) % results.length]?.focus();
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        (index <= 0 ? document.getElementById("commandInput") : results[index - 1])?.focus();
      } else if (event.key === "Home") {
        event.preventDefault();
        results[0]?.focus();
      } else if (event.key === "End") {
        event.preventDefault();
        results.at(-1)?.focus();
      }
    }

    function renderCommandResults() {
      const query = (document.getElementById("commandInput")?.value || "").toLowerCase();
      const repoResults = repositories.filter((repo) => !query || `${repo.name} ${repo.branch}`.toLowerCase().includes(query)).slice(0, 5);
      const commands = [
        { title: "Fetch 全部仓库", sub: "获取 Workspace 中所有远程引用", icon: "download", action: "runOperation('fetch-all')" },
        { title: "重新扫描 Workspace", sub: "发现新增、移动或移除的仓库", icon: "refresh", action: "runOperation('scan')" },
        { title: "切换深色 / 浅色主题", sub: "修改当前界面外观", icon: "sun", action: "toggleTheme()" }
      ].filter((command) => !query || `${command.title} ${command.sub}`.toLowerCase().includes(query));

      document.getElementById("commandResults").innerHTML = `
        ${repoResults.length ? '<div class="command-group-label">仓库</div>' : ""}
        ${repoResults.map((repo) => `
          <button type="button" class="command-result" onkeydown="handleCommandResultKeydown(event)" onclick="closeCommandPalette(); openRepository('${repo.id}')">
            <span class="command-result-icon">${icon("repository", 14)}</span>
            <span><span class="command-result-title">${repo.name}</span><span class="command-result-sub">${repo.branch} · ${repo.path}</span></span>
            <span class="command-status">${repo.changes ? `${repo.changes} 变更` : "干净"}</span>
          </button>
        `).join("")}
        ${commands.length ? '<div class="command-group-label">命令</div>' : ""}
        ${commands.map((command) => `
          <button type="button" class="command-result" onkeydown="handleCommandResultKeydown(event)" onclick="closeCommandPalette(); ${command.action}">
            <span class="command-result-icon">${icon(command.icon, 14)}</span>
            <span><span class="command-result-title">${command.title}</span><span class="command-result-sub">${command.sub}</span></span>
            <kbd class="command-key">Enter</kbd>
          </button>
        `).join("")}
        ${!repoResults.length && !commands.length ? `
          <div class="empty-state command-empty-state">
            <div>
              <div class="empty-state-icon">${icon("search", 22)}</div>
              <div class="empty-state-title">没有匹配结果</div>
              <div class="empty-state-description">当前关键词未匹配仓库或命令，请修改关键词或清除搜索。</div>
              <div class="empty-state-actions">
                ${renderButton({
                  label: "清除搜索",
                  size: "small",
                  variant: "default",
                  attributes: 'onclick="clearCommandSearch()"'
                })}
              </div>
            </div>
          </div>
        ` : ""}
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function trapFocusWithin(event, container) {
      const focusable = [...container.querySelectorAll(
        'button:not(:disabled), input:not(:disabled), textarea:not(:disabled), select:not(:disabled), [tabindex]:not([tabindex="-1"])'
      )].filter((element) => !element.closest("[inert]"));
      if (!focusable.length) return;
      const currentIndex = focusable.indexOf(document.activeElement);
      const nextIndex = event.shiftKey
        ? (currentIndex <= 0 ? focusable.length - 1 : currentIndex - 1)
        : (currentIndex + 1) % focusable.length;
      event.preventDefault();
      focusable[nextIndex].focus();
    }

    function focusAfterInertSettles(target, previousFocus, frame = 0) {
      if (!(target instanceof HTMLElement) || !target.isConnected) return;
      const active = document.activeElement;
      const activeInsideInert = Boolean(active?.closest?.("[inert]"));
      const sourceReleased = !previousFocus || previousFocus === document.body || active !== previousFocus;
      if (activeInsideInert && active instanceof HTMLElement) active.blur();
      if (!activeInsideInert && sourceReleased) {
        target.focus({ preventScroll: true });
        if (document.activeElement === target) return;
      }
      if (frame >= 12) return;
      requestAnimationFrame(() => focusAfterInertSettles(target, previousFocus, frame + 1));
    }

    let compactInspectorLayout = window.innerWidth <= inspectorOverlayBreakpoint;

    window.addEventListener("beforeunload", (event) => {
      if (!state.commitDirty) return;
      event.preventDefault();
      event.returnValue = "";
    });

    window.addEventListener("resize", () => {
      closeOpenInMenu();
      repositionVisibleAnchoredMenus();
      const nextCompactLayout = window.innerWidth <= inspectorOverlayBreakpoint;
      if (nextCompactLayout !== compactInspectorLayout) {
        compactInspectorLayout = nextCompactLayout;
        updateInspectorState();
      }
    });
    window.addEventListener("blur", closeOpenInMenu);
    window.addEventListener("pointermove", moveCommitPanelResize);
    window.addEventListener("pointerup", finishCommitPanelResize);
    window.addEventListener("pointercancel", finishCommitPanelResize);
    window.addEventListener(
      "scroll",
      closeOpenInMenu,
      true
    );
    window.addEventListener(
      "scroll",
      repositionVisibleAnchoredMenus,
      true
    );

    document.addEventListener("pointerdown", (event) => {
      const target = event.target;
      const titlebarMenus = [
        ...document.querySelectorAll(
          ".titlebar-file-menu[open], .titlebar-help-menu[open]"
        )
      ];
      const activeTitlebarMenu =
        target instanceof Node
          ? titlebarMenus.find((menu) => menu.contains(target))
          : null;
      titlebarMenus.forEach((menu) => {
        if (menu !== activeTitlebarMenu) {
          menu.removeAttribute("open");
        }
      });
      const switcher = document.getElementById("workspaceSwitcherWrap");
      if (
        state.workspaceSwitcherOpen &&
        !(target instanceof Node && switcher?.contains(target))
      ) {
        closeWorkspaceSwitcher();
      }
      const sidebarRepositoryMenuWrap = document.getElementById(
        "sidebarRepositoryMenuWrap"
      );
      if (
        state.sidebarRepositoryMenuOpen &&
        !(
          target instanceof Node &&
          sidebarRepositoryMenuWrap?.contains(target)
        )
      ) {
        closeSidebarRepositoryMenu();
      }
      const openInControl =
        target instanceof Element
          ? target.closest("[data-open-in-control]")
          : null;
      const openInMenu = document.getElementById(
        "openInFloatingMenu"
      );
      if (
        state.openInMenuOpen &&
        !openInControl &&
        !(target instanceof Node && openInMenu?.contains(target))
      ) {
        closeOpenInMenu();
      }

      if (!state.contextMenu) return;
      const menu = document.querySelector(".workspace-context-menu");
      if (target instanceof Node && menu?.contains(target)) return;
      closeWorkspaceContextMenu();
    });

    document.addEventListener("keydown", (event) => {
      if (handleMenuKeyboard(event)) return;
      if (
        (event.ctrlKey || event.metaKey) &&
        event.key.toLowerCase() === "f" &&
        state.view === "repository" &&
        state.tab === "changes"
      ) {
        event.preventDefault();
        openDiffSearch();
        return;
      }
      if (event.key === "Escape" && state.diffSearchOpen) {
        event.preventDefault();
        closeDiffSearch();
        return;
      }
      if (event.key === "Escape") {
        document
          .querySelectorAll(
            ".titlebar-file-menu[open], .titlebar-help-menu[open]"
          )
          .forEach((menu) => menu.removeAttribute("open"));
      }
      if (event.key === "Escape" && state.openInMenuOpen) {
        event.preventDefault();
        closeOpenInMenu();
        return;
      }
      if (event.key === "Escape" && state.workspaceSwitcherOpen) {
        event.preventDefault();
        closeWorkspaceSwitcher();
        return;
      }
      if (
        event.key === "Escape" &&
        state.sidebarRepositoryMenuOpen
      ) {
        event.preventDefault();
        closeSidebarRepositoryMenu();
        return;
      }
      const branchSwitchOverlay = document.getElementById("branchSwitchOverlay");
      const branchSwitchOpen = branchSwitchOverlay.classList.contains("open");
      if (branchSwitchOpen) {
        if (event.key === "Escape") {
          event.preventDefault();
          closeBranchSwitchDialog();
        } else if (event.key === "Tab") {
          trapFocusWithin(event, branchSwitchOverlay);
        }
        return;
      }
      const confirmOverlay = document.getElementById("confirmOverlay");
      const confirmOpen = confirmOverlay.classList.contains("open");
      if (confirmOpen) {
        if (event.key === "Escape") {
          event.preventDefault();
          closeConfirmDialog();
        } else if (event.key === "Tab") {
          trapFocusWithin(event, confirmOverlay);
        }
        return;
      }

      const renameOverlay = document.getElementById("renameEntryOverlay");
      const renameOpen = renameOverlay.classList.contains("open");
      if (renameOpen) {
        if (event.key === "Escape") {
          event.preventDefault();
          closeRenameEntryDialog();
        } else if (event.key === "Tab") {
          trapFocusWithin(event, renameOverlay);
        }
        return;
      }

      const tapdKeywordOverlay = document.getElementById("tapdKeywordOverlay");
      const tapdKeywordOpen = tapdKeywordOverlay.classList.contains("open");
      if (tapdKeywordOpen) {
        if (event.key === "Escape") {
          event.preventDefault();
          closeTapdKeywordDialog();
        } else if (event.key === "Tab") {
          trapFocusWithin(event, tapdKeywordOverlay);
        }
        return;
      }

      if (state.contextMenu) {
        if (event.key === "Escape") {
          event.preventDefault();
          closeWorkspaceContextMenu();
        }
        return;
      }

      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
        event.preventDefault();
        openCommandPalette();
      } else if ((event.ctrlKey || event.metaKey) && event.key === "\\") {
        event.preventDefault();
        toggleInspector();
        return;
      } else if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.key.toLowerCase() === "l") {
        event.preventDefault();
        toggleTheme();
        return;
      }
      const commandOverlay = document.getElementById("commandOverlay");
      const paletteOpen = commandOverlay.classList.contains("open");
      if (event.key === "Escape" && paletteOpen) {
        event.preventDefault();
        closeCommandPalette();
        return;
      }
      if (event.key === "Tab" && paletteOpen) {
        trapFocusWithin(event, commandOverlay);
        return;
      }

      const compactInspectorOpen = window.innerWidth <= inspectorOverlayBreakpoint && state.inspectorOpen;
      if (compactInspectorOpen && event.key === "Escape") {
        event.preventDefault();
        toggleInspector(false);
        return;
      }
      if (compactInspectorOpen && event.key === "Tab") {
        trapFocusWithin(event, document.getElementById("inspector"));
      }
    });

    mountSidebarSearchInput();
    hydrateStaticIcons();
    renderSidebar();
    renderMain();
  </script>
</body>
</html>
