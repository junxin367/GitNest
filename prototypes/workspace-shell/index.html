      padding-right: calc(var(--space-5) + var(--control-default));
    }

    .branch-switch-dialog-close {
      position: absolute;
      top: var(--space-4);
      right: var(--space-4);
    }

    .branch-switch-dialog-content {
      display: grid;
      gap: var(--space-3);
      min-height: 0;
      padding: var(--space-4) var(--space-5);
    }

    .branch-switch-dialog-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      color: var(--text-soft);
      font-size: var(--font-size-caption);
    }

    .branch-switch-dialog-heading > span {
      color: var(--muted);
      font-weight: var(--font-weight-regular);
    }

    .branch-switch-list {
      display: grid;
      gap: var(--space-2);
      max-height: min(360px, 42vh);
      overflow: auto;
    }

    .branch-switch-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      width: 100%;
      min-height: 54px;
      padding: var(--space-3);
      color: var(--text);
      text-align: left;
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .branch-switch-option:hover:not(:disabled) {
      color: var(--text);
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .branch-switch-option.current {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 36%, var(--border-soft));
    }

    .branch-switch-option:disabled {
      cursor: default;
      opacity: 0.72;
    }

    .branch-switch-option-main {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
    }

    .branch-switch-option-main > .icon {
      flex: 0 0 auto;
    }

    .branch-switch-option-main > span {
      display: grid;
      gap: var(--space-1);
      min-width: 0;
    }

    .branch-switch-option-main strong,
    .branch-switch-option-main small {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .branch-switch-option-main strong {
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-semibold);
    }

    .branch-switch-option-main small {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .branch-switch-option-status {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .branch-switch-dialog-state {
      display: grid;
      justify-items: center;
      gap: var(--space-2);
      min-height: 140px;
      padding: var(--space-5);
      color: var(--muted);
      text-align: center;
    }

    .branch-switch-dialog-state.error {
      color: var(--red);
    }

    .branch-switch-dialog-note {
      margin: 0;
      color: var(--muted);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .confirm-dialog-body {
      display: grid;
      grid-template-columns: var(--control-large) minmax(0, 1fr);
      gap: var(--space-4);
      padding: var(--space-5);
    }

    .confirm-dialog-icon {
      display: grid;
      place-items: center;
      width: var(--control-large);
      height: var(--control-large);
      color: var(--red);
      background: var(--red-soft);
      border-radius: var(--radius-large);
    }

    .confirm-dialog-title {
      margin: 0;
      color: var(--text);
      font-size: var(--font-size-section);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-title);
    }

    .confirm-dialog-description {
      margin: var(--space-2) 0 0;
      color: var(--muted);
      line-height: var(--line-height-body);
    }

    .confirm-dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: var(--space-2);
      padding: var(--space-4) var(--space-5);
      background: var(--surface-2);
      border-top: 1px solid var(--border-soft);
    }

    .workspace-entry-dialog {
      width: min(520px, 100%);
    }

    .workspace-entry-dialog-body {
      grid-template-columns: var(--control-large) minmax(0, 1fr);
    }

    .workspace-entry-dialog-body p {
      margin: var(--space-2) 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workspace-entry-dialog-form {
      padding: 0 var(--space-5) var(--space-5);
    }

    .workspace-entry-dialog-field {
      display: grid;
      gap: var(--space-2);
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .workspace-entry-dialog-field input {
      width: 100%;
      height: var(--control-default);
      padding: 0 var(--space-3);
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-regular);
      font-size: var(--font-size-body);
    }

    .workspace-entry-dialog-field input:focus {
      border-color: var(--accent);
    }

    .workspace-entry-dialog-field small {
      color: var(--muted);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-regular);
      line-height: var(--line-height-body);
    }

    .workspace-tapd-dialog {
      width: min(520px, 100%);
    }

    .button.danger.primary {
      color: #fff;
      background: var(--red);
      border-color: var(--red);
    }

    .button.danger.primary:hover {
      background: color-mix(in srgb, var(--red) 86%, #000);
    }

    .button,
    .icon-button,
    .toolbar-button,
    .rail-button,
    .quick-button,
    .sidebar-add-directory,
    .context-tab,
    .worktree-card,
    .command-result,
    .branch-name-button,
    .stage-toggle,
    .menu-button,
    .global-search,
    .workspace-switcher,
    .window-control,
    .branch-selector,
    .open-in-primary,
    .open-in-menu-trigger,
    .panel-action {
      transition:
        color var(--motion-micro) ease,
        background-color var(--motion-micro) ease,
        border-color var(--motion-micro) ease,
        box-shadow var(--motion-micro) ease,
        transform var(--motion-micro) ease;
    }

    button:disabled,
    button[aria-disabled="true"],
    [role="button"][aria-disabled="true"] {
      color: var(--color-text-disabled);
      background: var(--surface-2);
      border-color: var(--border-soft);
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.72;
      pointer-events: none;
      transform: none;
    }

    .button.is-error,
    .toolbar-button.is-error,
    .quick-button.is-error {
      color: var(--red);
      background: var(--red-soft);
      border-color: color-mix(in srgb, var(--red) 36%, var(--border));
    }

    .button.is-loading,
    .icon-button.is-loading,
    .toolbar-button.is-loading,
    .quick-button.is-loading,
    .sidebar-add-directory.is-loading {
      position: relative;
      color: transparent;
      pointer-events: none;
    }

    .button.is-loading > *,
    .icon-button.is-loading > *,
    .toolbar-button.is-loading > *,
    .quick-button.is-loading > *,
    .sidebar-add-directory.is-loading > * {
      visibility: hidden;
    }

    .button.is-loading::after,
    .icon-button.is-loading::after,
    .toolbar-button.is-loading::after,
    .quick-button.is-loading::after,
    .sidebar-add-directory.is-loading::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--icon-small);
      height: var(--icon-small);
      margin: -8px 0 0 -8px;
      border: 2px solid color-mix(in srgb, var(--text) 24%, transparent);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: control-spin 700ms linear infinite;
    }

    .button.primary.is-loading::after {
      border-top-color: #071411;
    }

    html[data-theme="light"] .button.primary.is-loading::after {
      border-top-color: #fff;
    }

    @keyframes control-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .metric-value,
    .repo-status,
    .tab-count,
    .toolbar-count,
    .mini-count,
    .commit-hash,
    .commit-time,
    .diff-stats,
    .line-no,
    .detail-value,
    .operation-state,
    .statusbar {
      font-variant-numeric: tabular-nums;
    }

    .button:active,
    .icon-button:active,
    .toolbar-button:active,
    .rail-button:active,
    .quick-button:active,
    .sidebar-add-directory:active,
    .context-tab:active,
    .repo-row:active,
    .worktree-card:active,
    .command-result:active,
    .branch-name-button:active,
    .stage-toggle:active,
    .menu-button:active,
    .global-search:active,
    .workspace-switcher:active,
    .window-control:active,
    .branch-selector:active,
    .panel-action:active {
      transform: translateY(1px);
    }

    .file-select-button:active,
    .repo-row:active {
      opacity: 1;
      transform: none;
    }

    @media (max-width: 1500px) and (min-width: 1241px) {
      .workspace-frame {
        grid-template-columns: 52px 286px minmax(0, 1fr);
      }

      .content-frame {
        grid-template-columns: minmax(0, 1fr) clamp(320px, 26vw, 400px);
      }

      .metric-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 1360px) {
      .history-header-actions {
        flex: 1 0 100%;
        flex-wrap: nowrap;
        width: 100%;
        margin-left: 0;
        gap: var(--space-1);
        justify-content: flex-start;
      }

      .history-scope-controls,
      .history-scope-controls.comparison,
      .history-filter-controls {
        flex: 0 1 auto;
        flex-wrap: nowrap;
        justify-content: flex-start;
        min-width: 0;
      }

      .history-filter-controls {
        width: auto;
        margin-left: 0;
      }

      .history-ref-trigger {
        max-width: min(160px, 18vw);
      }

      .history-filter-input {
        flex-basis: min(180px, 20vw);
        width: min(180px, 20vw);
        min-width: 100px;
      }
    }

    @media (max-width: 1240px) {
      .workspace-frame {
        grid-template-columns: 48px 244px minmax(0, 1fr);
      }

      .workspace-switcher-menu {
        width: 244px;
      }

      .workspace-frame.sidebar-collapsed {
        grid-template-columns: 48px minmax(0, 1fr);
      }

      .workspace-frame.operations-view,
      .workspace-frame.settings-view {
        grid-template-columns: 48px minmax(0, 1fr);
      }

      .content-frame {
        grid-template-columns: minmax(0, 1fr) minmax(280px, 330px);
      }

      .page-scroll {
        padding: var(--page-safe-margin-narrow);
      }

      .metric-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .commit-row {
        grid-template-columns:
          var(--control-large)
          minmax(0, 1fr)
          118px
          84px
          78px;
      }

      .commit-time,
      .commit-author,
      .commit-id {
        display: block;
      }

      body:not(.inspector-open) .content-frame {
        grid-template-columns: minmax(0, 1fr);
      }

      .inspector {
        position: relative;
        display: block;
        width: auto;
        min-width: 0;
        box-shadow: none;
        transform: none;
        visibility: visible;
        pointer-events: auto;
        transition: none;
      }

      body:not(.inspector-open) .inspector {
        display: none;
      }

      .inspector-backdrop,
      body.inspector-open .inspector-backdrop {
        display: none !important;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        backdrop-filter: none;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .context-title {
        max-width: 192px;
      }

      .toolbar-button span:not(.toolbar-count) {
        display: none;
      }

    }

    .analysis-page-scroll {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .analysis-page-skeleton {
      flex: 1 0 auto;
      min-height: 0;
    }

    .analysis-skeleton-header {
      display: grid;
      gap: var(--space-2);
      min-width: 0;
    }

    .analysis-skeleton-description,
    .analysis-skeleton-summary-label,
    .analysis-skeleton-summary-value,
    .analysis-skeleton-navigation-meta {
      display: flex;
      align-items: center;
    }

    .analysis-skeleton-description {
      min-height: 21px;
    }

    .analysis-skeleton-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      min-width: 0;
    }

    .analysis-skeleton-actions {
      display: flex;
      flex: 0 0 auto;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-2);
    }

    .analysis-skeleton-summary-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: var(--space-3);
    }

    .analysis-skeleton-summary-card {
      display: grid;
      gap: var(--space-1);
      min-height: 0;
      padding: var(--space-3) var(--space-4);
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-large);
    }

    .analysis-skeleton-summary-label {
      min-height: 18px;
    }

    .analysis-skeleton-summary-value {
      min-height: 21px;
    }

    .analysis-skeleton-runtime {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2);
    }

    .analysis-skeleton-runtime > .gn-skeleton {
      border-radius: 999px;

      align-items: center;
      gap: var(--space-2);

    .analysis-skeleton-heading-row {

    .analysis-skeleton-tabs {

      border-radius: var(--radius-regular);

    .analysis-skeleton-navigation-list {
      display: grid;
      align-content: start;

    .analysis-skeleton-navigation-row:last-child {

    .analysis-skeleton-graph {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .analysis-skeleton-graph-header {
      min-height: 50px;
      padding: 0 var(--space-3);
      border-bottom: 1px solid var(--border-soft);
    }

    .analysis-skeleton-graph-heading {
      flex: 1 1 auto;
      min-width: 0;
    }

      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));

      gap: var(--space-6);
      min-height: 0;
      padding: var(--space-6);

    .analysis-skeleton-graph-column {

      justify-items: center;
      gap: var(--space-6);
      min-width: 0;
    }

    .analysis-skeleton-graph-node {
      width: min(180px, 100%);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .analysis-page-header {
      display: grid;
      min-width: 0;
    }

    .analysis-page-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      min-width: 0;
    }

    .analysis-page-header h1 {
      margin: 0;
      color: var(--text);
      font-size: var(--font-size-title);

    .analysis-page-header p {
      max-width: 720px;
      margin: var(--space-2) 0 0;
      color: var(--muted);
      font-size: var(--font-size-body);
    }

    .analysis-header-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: var(--space-2);
    }

    .analysis-scope-switch {
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .analysis-scope-switch button {
      min-width: 84px;
      height: 30px;
      padding: 0 var(--space-3);
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: calc(var(--radius-regular) - 2px);
    }

    .analysis-scope-switch button:hover:not(:disabled) {
      color: var(--text);
      background: var(--surface-hover);
    }

    .analysis-scope-switch button.active {
      color: var(--text);
      background: var(--surface);
      box-shadow: 0 1px 3px rgb(0 0 0 / 18%);

    .analysis-progress-panel {
      display: grid;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-4);

    .analysis-progress-copy {

      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      min-width: 0;

      white-space: nowrap;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .analysis-progress-copy > span:last-child {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .analysis-progress-copy strong {
      margin-left: var(--space-2);
      color: var(--text-soft);
      font-weight: var(--font-weight-medium);
    }

    .analysis-progress-track {
      height: 4px;

      background: var(--surface-3);
      border-radius: 999px;

    .analysis-progress-track span {

      width: 100%;
      height: 100%;

      transform-origin: left center;

      gap: var(--space-3);

    .analysis-summary-card {

      padding: var(--space-3) var(--space-4);

    .analysis-summary-card span {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .analysis-summary-card strong {
      color: var(--text);
      font-size: var(--font-size-heading);
      font-weight: var(--font-weight-semibold);
    }

    .analysis-runtime-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .analysis-runtime-strip > span,
    .analysis-warning-panel > summary {
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 var(--space-2);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      white-space: nowrap;

      gap: var(--space-2);
    }

    .analysis-runtime-strip .connected {
      color: var(--green);
      border-color: color-mix(in srgb, var(--green) 26%, var(--border-soft));
    }

    .analysis-runtime-strip .unavailable {
      color: var(--yellow);
      border-color: color-mix(in srgb, var(--yellow) 24%, var(--border-soft));
    }

    .analysis-warning-panel {
      position: relative;
      flex: 0 0 auto;
    }

    .analysis-warning-panel > summary {
      gap: 4px;
      color: var(--yellow);
      border-color: color-mix(in srgb, var(--yellow) 24%, var(--border-soft));
      cursor: pointer;
      list-style: none;
    }

    .analysis-warning-panel > summary::-webkit-details-marker {
      display: none;
    }

    .analysis-warning-panel > summary::marker {
      content: "";
    }

    .analysis-warning-panel > summary:hover,
    .analysis-warning-panel[open] > summary {
      background: var(--yellow-soft);
    }

    .analysis-warning-panel > summary:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 1px;
    }

    .analysis-warning-panel > .analysis-warning-menu {
      position: absolute;
      top: calc(100% + var(--space-2));
      right: 0;
      display: grid;
      gap: var(--space-1);
      width: max-content;
      min-width: 260px;
      max-width: min(420px, calc(100vw - var(--space-6)));
      margin: 0;
      padding: var(--space-3) var(--space-4) var(--space-3) calc(var(--space-4) + var(--space-2));
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .analysis-server-install {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      min-width: 0;
      height: 22px;
      padding: 1px 6px;
      color: var(--accent);
      font: inherit;
      font-weight: var(--font-weight-semibold);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border: 0;
      border-radius: 999px;
      cursor: pointer;
    }

    .analysis-server-install:hover:not(:disabled) {
      background: color-mix(in srgb, var(--accent) 20%, transparent);
    }

    .analysis-server-install:disabled {
      cursor: default;
      opacity: 0.62;
    }

    .analysis-workbench {
      display: grid;
      flex: 1 0 590px;
      grid-template-columns:
        minmax(230px, 280px)
        minmax(520px, 1fr);
      gap: var(--space-3);
      min-width: 0;
      min-height: 590px;
    }

    .analysis-chain-panel,
    .analysis-graph-workspace,
    .analysis-graph-panel,
    .analysis-node-diff-drawer {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .analysis-graph-workspace {
      position: relative;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      gap: var(--space-3);
    }

    .analysis-graph-workspace > .panel + .panel {
      margin-top: 0;
    }

    .analysis-graph-workspace.is-fullscreen {
      position: fixed;
      inset: 0;
      z-index: var(--z-modal);
      padding: var(--space-3);
      background: var(--canvas);

    .analysis-chain-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .analysis-chain-panel.is-node-detail {
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .analysis-chain-panel > header {
      display: grid;
      gap: var(--space-2);
      padding: var(--space-3);
      border-bottom: 1px solid var(--border-soft);
    }

    .analysis-chain-panel > header.analysis-node-detail-header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      min-height: 50px;
      padding-right: calc(var(--space-3) + 22px);
    }

    .analysis-chain-panel > .analysis-node-detail-header > div:first-child {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .analysis-node-detail-header > div > span {

      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .analysis-node-detail-back.gn-button[data-variant="icon"] {
      --gn-button-height: 22px;
      position: absolute;
      top: var(--space-3);
      right: var(--space-3);
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: var(--radius-small);
      box-shadow: none;
    }

    .analysis-node-detail-back.gn-button[data-variant="icon"]:hover:not(:disabled) {
      color: var(--text);
      background: transparent;
    }

    .analysis-chain-panel > header > div:first-child,
    .analysis-panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
    }

    .analysis-chain-panel > header strong,
    .analysis-panel-heading strong {
      color: var(--text);
      font-size: var(--font-size-body);
    }

    .analysis-chain-panel > header span,
    .analysis-panel-heading span {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .analysis-navigation-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 3px;
      padding: 3px;
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .analysis-navigation-tabs button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 0;
      height: 28px;
      padding: 0 var(--space-2);
      overflow: hidden;
      color: var(--muted);
      font-size: calc(var(--font-size-caption) - 1px);
      white-space: nowrap;
      background: transparent;
      border: 0;
      border-radius: calc(var(--radius-regular) - 2px);
    }

    .analysis-navigation-tabs button:hover {
      color: var(--text-soft);
    }

    .analysis-navigation-tabs button.active {
      color: var(--text);
      background: var(--surface);
      box-shadow: var(--shadow-subtle);
    }

    .analysis-navigation-tabs button span {
      min-width: 20px;
      padding: 0 5px;
      color: inherit;
      font-size: calc(var(--font-size-caption) - 2px);
      line-height: 18px;
      text-align: center;
      background: color-mix(in srgb, var(--border) 52%, transparent);
      border-radius: 999px;

    .analysis-chain-filter {

      min-width: 0;

      background: var(--surface-2);
      border-color: var(--border-soft);

    .analysis-method-menu {
      width: 100%;
      min-width: 0;

    .analysis-method-menu > summary {

    }

    .analysis-method-menu > summary::-webkit-details-marker {
      display: none;

    .analysis-method-menu-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);

      height: var(--control-compact);
      padding: 0 var(--space-2);
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
      cursor: pointer;
      font-size: var(--font-size-caption);

    .analysis-method-menu-trigger:hover,

      background: var(--surface-hover);
      border-color: var(--border);

    .analysis-method-menu-trigger > span {
      min-width: 0;
      overflow: hidden;
      color: inherit;
      font-size: inherit;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .analysis-method-menu-surface {

      width: min(244px, calc(100vw - var(--space-6)));
      max-height: 252px;
      overflow: auto;

    .analysis-method-menu-surface .menu-item-label {
      color: inherit;
      font-size: inherit;
    }

    .analysis-chain-list {
      min-height: 0;
      overflow: auto;
    }

    .analysis-chain-list > button {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: var(--space-1) var(--space-2);
      width: 100%;
      min-width: 0;
      padding: var(--space-3);
      color: var(--text-soft);
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
    }

    .analysis-chain-list > button:hover {
      background: var(--surface-hover);
    }

    .analysis-chain-list > button.active {

      box-shadow: inset 3px 0 0 var(--accent);

    .analysis-chain-list > button strong {
      align-self: center;
      min-width: 0;
      overflow: hidden;
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .analysis-chain-list > button small {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 11px;
    }

    .analysis-chain-list > button.analysis-symbol-result {
      grid-template-columns: 12px minmax(0, 1fr);
    }

    .analysis-symbol-result .analysis-node-dot {
      width: 8px;
      height: 8px;
      margin-top: 4px;
    }

    .analysis-method,
    .http-method {
      display: inline-flex;

      justify-content: center;
      min-width: 48px;
      height: 20px;
      padding: 0 6px;
      color: var(--accent);
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
      background: var(--accent-soft);
      border-radius: 999px;
    }

    .analysis-method.post,
    .http-method.method-post {
      color: var(--blue);
      background: color-mix(in srgb, var(--blue) 12%, transparent);
    }

    .http-method.method-delete {
      color: var(--red);
      background: var(--red-soft);
    }

    .http-method.method-put,
    .http-method.method-patch {
      color: var(--yellow);
      background: var(--yellow-soft);
    }

    .analysis-list-empty,
    .analysis-graph-empty {
      display: grid;
      place-content: center;
      justify-items: center;
      gap: var(--space-2);
      min-height: 240px;
      padding: var(--space-5);
      color: var(--muted);
      text-align: center;
    }

    .analysis-list-empty strong,
    .analysis-graph-empty strong {
      color: var(--text-soft);
    }

    .analysis-list-empty p,
    .analysis-graph-empty p {
      max-width: 320px;
      margin: 0;
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .analysis-panel-heading {
      min-height: 50px;
      padding: 0 var(--space-3);
      border-bottom: 1px solid var(--border-soft);
    }

    .analysis-panel-heading > div {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .analysis-panel-heading-actions {
      display: flex !important;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-2) !important;
    }

    .analysis-panel-heading > div > span {
      max-width: 360px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .analysis-graph-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .analysis-graph-stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .analysis-graph-scroll {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
      background:

      background-size: 24px 24px;

    .analysis-graph-scroll.is-panning {

    .analysis-graph-canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      display: block;
      width: max-content;
      height: max-content;
      transform: translate(-50%, -50%);
      will-change: margin;
    }

    .analysis-graph-svg {
      display: block;
      max-width: none;
    }

    .analysis-graph-edge {
      pointer-events: none;
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.4;
      opacity: 0.72;
    }

    .analysis-graph-edge.edge-http-request {
      stroke: var(--accent);
      stroke-width: 2;
    }

    .analysis-graph-edge.edge-calls {
      stroke: var(--blue);
    }

    .analysis-graph-edge-label {
      fill: var(--accent);
      font-size: calc(var(--font-size-caption) - 3px);
      font-weight: var(--font-weight-semibold);
      text-anchor: middle;
    }

    .analysis-graph-arrow path {
      fill: var(--muted);
    }

    .analysis-graph-node {

    }

    .analysis-graph-node rect {

      stroke: var(--border);
      stroke-width: 1;
    }

    .analysis-graph-node:focus-visible rect {
      stroke: var(--text-soft);
    }

    .analysis-graph-node.selected rect {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 2;
    }

    .analysis-graph-node.changed rect {
      stroke-dasharray: 5 3;
    }

    .analysis-graph-node circle {
      fill: var(--muted);
    }

    .analysis-graph-node.node-client-request circle {
      fill: var(--blue);
    }

    .analysis-graph-node.node-server-endpoint circle {
      fill: var(--accent);
    }

    .analysis-graph-node.node-method circle {
      fill: var(--yellow);
    }

    .analysis-node-kind {
      fill: var(--muted);
      font-size: calc(var(--font-size-caption) - 2px);
    }

    .analysis-node-copy {

      pointer-events: none;
    }

    .analysis-node-copy-inner {

      align-content: start;

      height: 100%;

      font-family: var(--font-sans);
      line-height: 1.2;
    }

    .analysis-node-copy-inner > * {

      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .analysis-node-name {
      color: var(--text);
      fill: var(--text);
      font-size: calc(var(--font-size-caption) - 1px);
      font-weight: var(--font-weight-semibold);
    }

    .analysis-node-path {
      display: block;
      overflow: hidden;
      color: var(--muted);
      fill: var(--muted);
      font-size: calc(var(--font-size-caption) - 3.5px);
      line-height: 1.25;
      overflow-wrap: anywhere;
      text-overflow: clip;
      white-space: normal;
      word-break: break-word;

    .analysis-node-description {
      color: color-mix(in srgb, var(--green) 62%, var(--muted));

      font-size: calc(var(--font-size-caption) - 3px);
    }

    .analysis-graph-controls {
      position: absolute;
      top: var(--space-2);
      right: var(--space-2);
      z-index: var(--z-selected);

      align-items: center;
      gap: 2px;
      padding: 3px;
      color: var(--muted);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
      box-shadow: var(--shadow-floating);
      backdrop-filter: blur(8px);
    }

    .analysis-graph-controls button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: calc(var(--radius-regular) - 2px);
    }

    .analysis-graph-controls button:hover:not(:disabled) {
      color: var(--text);
      background: var(--surface-hover);
    }

    .analysis-graph-controls button:disabled {
      opacity: 0.35;
    }

    .analysis-graph-controls > span {
      min-width: 38px;
      font-size: calc(var(--font-size-caption) - 2px);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .analysis-graph-controls input[type="range"] {
      width: 84px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .analysis-graph-direction-hint {
      position: absolute;
      bottom: var(--space-2);
      left: var(--space-2);
      z-index: var(--z-selected);
      padding: 5px 8px;
      color: var(--muted);
      font-size: calc(var(--font-size-caption) - 2px);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
      backdrop-filter: blur(8px);
    }

    .analysis-node-diff-drawer {
      position: absolute;
      inset: 0 auto 0 0;
      z-index: var(--z-navigation);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: min(760px, calc(100% - var(--space-4)));
      box-shadow: var(--shadow-floating);
    }

    .analysis-graph-workspace.is-fullscreen .analysis-node-diff-drawer {
      inset:
        var(--space-3)
        auto
        var(--space-3)
        var(--space-3);
    }

    .analysis-node-details {
      min-height: 0;
      padding: var(--space-3);
      overflow: auto;
    }

    .analysis-node-overview {
      min-width: 0;
    }

    .analysis-node-title {
      display: flex;
      align-items: flex-start;
      gap: var(--space-2);
      margin-bottom: var(--space-3);
    }

    .analysis-node-title > div {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .analysis-node-dot {
      flex: 0 0 auto;
      width: 10px;
      height: 10px;
      margin-top: 5px;
      background: var(--muted);
      border-radius: 50%;
    }

    .analysis-node-dot.node-client-request {
      background: var(--blue);
    }

    .analysis-node-dot.node-server-endpoint {
      background: var(--accent);
    }

    .analysis-node-dot.node-method {
      background: var(--yellow);
    }

    .analysis-node-title strong,
    .analysis-node-title span {
      overflow-wrap: anywhere;
    }

    .analysis-node-title > div > span {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .analysis-node-details .detail-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-2);
      margin: 0;
      padding: 0;
    }

    .analysis-node-details .detail-row {
      grid-template-columns: minmax(0, 1fr);
      align-content: start;
      align-items: start;
      gap: 3px;
      min-height: 0;
      padding: var(--space-2);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .analysis-node-details .detail-row.analysis-detail-wide {
      grid-column: 1 / -1;
    }

    .analysis-node-details .detail-row dt {
      line-height: 1.2;
    }

    .analysis-node-details .detail-row dd {
      overflow: visible;
      overflow-wrap: anywhere;
      text-align: left;
      text-overflow: clip;
      white-space: normal;
    }

    .analysis-node-documentation,
    .analysis-metadata {
      display: grid;
      gap: var(--space-2);
      margin-top: var(--space-4);
      padding-top: var(--space-3);
      border-top: 1px solid var(--border-soft);
    }

    .analysis-node-diff-trigger {
      display: grid;
      gap: var(--space-2);
      padding: var(--space-3);
      background: var(--surface);
      border-top: 1px solid var(--border-soft);
    }

    .analysis-node-documentation h3,
    .analysis-metadata h3 {
      margin: 0;
      color: var(--text);
      font-size: var(--font-size-caption);
    }

    .analysis-node-documentation p {
      margin: 0;
      overflow-wrap: anywhere;
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
      white-space: pre-wrap;
    }

    .analysis-metadata > div {
      display: grid;
      gap: 2px;
    }

    .analysis-metadata span {
      margin: 0;
      color: var(--muted);
      font-size: calc(var(--font-size-caption) - 1px);
    }

    .analysis-metadata strong {
      overflow: visible;
      overflow-wrap: anywhere;
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      text-overflow: clip;
      white-space: normal;
    }

    .analysis-node-diff-trigger > button {
      width: 100%;
      justify-content: center;
    }

    .analysis-node-diff-trigger p {
      margin: 0;
      color: var(--muted);
      font-size: calc(var(--font-size-caption) - 1px);
      line-height: var(--line-height-body);
    }

    .analysis-node-diff-content {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .analysis-node-diff-content > div {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }

    .analysis-node-diff-panel {
      height: 100%;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .analysis-node-diff-panel .gn-diff-panel__main {
      grid-template-rows: 38px minmax(0, 1fr);
    }

    .analysis-node-diff-panel .gn-diff-panel__file-header {
      min-height: 38px;
    }

    .analysis-node-diff-panel .gn-diff-panel__file-heading {
      justify-content: flex-start;
      text-align: left;
    }

    .analysis-node-diff-panel .gn-diff-panel__file-path {
      text-align: left;
    }

    .analysis-node-diff-panel .analysis-diff-mode-tabs {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      background: var(--canvas);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .analysis-node-diff-panel .analysis-diff-mode-button.gn-button {
      min-width: 0;
      height: 22px;
      padding: 0 7px;
      color: var(--muted);
      font-size: calc(var(--font-size-caption) - 2px);
      background: transparent;
      border: 0;
      border-radius: calc(var(--radius-regular) - 2px);
      box-shadow: none;
    }

    .analysis-node-diff-panel .analysis-diff-mode-button.gn-button:hover {
      color: var(--text-soft);
      background: transparent;
    }

    .analysis-node-diff-panel .analysis-diff-mode-button.gn-button[data-selected="true"] {
      color: var(--text);
      background: var(--surface);
      box-shadow: var(--shadow-subtle);
    }

    .analysis-node-diff-panel.is-code-view .gn-diff-panel__stats,
    .analysis-node-diff-panel.is-code-view .gn-diff-panel__file-header-separator,
    .analysis-node-diff-panel.is-code-view .gn-diff-panel__change-marker,
    .analysis-node-diff-panel.is-code-view .gn-diff-panel__row > .gn-diff-panel__line-number:first-child {
      display: none;
    }

    .analysis-node-diff-panel.is-code-view .gn-diff-panel__table {
      min-width: max(100%, 680px);
    }

    .analysis-node-diff-panel.is-code-view .gn-diff-panel__row,
    .analysis-node-diff-panel.is-code-view[data-wrap="true"] .gn-diff-panel__row {
      grid-template-columns: 56px minmax(610px, 1fr);
      min-width: 680px;
    }

    .analysis-node-diff-panel.is-code-view .gn-diff-panel__syntax-token.is-comment {
      color: color-mix(in srgb, var(--green) 62%, var(--muted));
      font-style: italic;
    }

    .analysis-node-diff-panel.is-code-view .gn-diff-panel__syntax-token.is-keyword,
    .analysis-node-diff-panel.is-code-view .gn-diff-panel__syntax-token.is-annotation {
      color: color-mix(in srgb, var(--purple) 84%, var(--text));
    }

    .analysis-node-diff-panel.is-code-view .gn-diff-panel__syntax-token.is-string {
      color: color-mix(in srgb, var(--green) 82%, var(--text));
    }

    .analysis-node-diff-panel.is-code-view .gn-diff-panel__syntax-token.is-number,
    .analysis-node-diff-panel.is-code-view .gn-diff-panel__syntax-token.is-literal {
      color: color-mix(in srgb, var(--yellow) 78%, var(--text));
    }

    .analysis-node-diff-panel.is-code-view .gn-diff-panel__syntax-token.is-type,
    .analysis-node-diff-panel.is-code-view .gn-diff-panel__syntax-token.is-tag {
      color: color-mix(in srgb, var(--blue) 82%, var(--text));
    }

    .analysis-node-diff-panel.is-code-view .gn-diff-panel__syntax-token.is-function {
      color: color-mix(in srgb, var(--yellow) 88%, var(--text-soft));
    }

    .analysis-node-diff-panel.is-code-view .gn-diff-panel__syntax-token.is-property {
      color: color-mix(in srgb, var(--blue) 64%, var(--text-soft));
    }

    .analysis-node-diff-panel.is-code-view .gn-diff-panel__syntax-token.is-operator {
      color: color-mix(in srgb, var(--accent) 62%, var(--text-soft));
    }

    .analysis-node-diff-panel.is-code-view
      .gn-diff-panel__search-hit.is-current
      .gn-diff-panel__syntax-token {
      color: inherit;
      font-style: inherit;
    }

    .analysis-node-code-empty {
      display: grid;
      place-items: center;
      align-content: center;
      gap: var(--space-2);
      width: 100%;
      height: 100%;
      min-height: 240px;
      padding: var(--space-5);
      color: var(--muted);
      text-align: center;
    }

    .analysis-node-code-empty strong {
      color: var(--text);
    }

    .analysis-settings-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-3);
    }

    .analysis-settings-grid .settings-ai-field {
      min-width: 0;
    }

    @media (max-width: 1120px) {
      .workspace-frame {
        grid-template-columns: 48px 244px minmax(0, 1fr);
      }

      .global-search {
        width: min(300px, 40vw);
      }

      .page-scroll {
        padding: var(--page-safe-margin-narrow);
      }

      .analysis-workbench {
        grid-template-columns: minmax(220px, 270px) minmax(0, 1fr);
      }

      .analysis-skeleton-workbench {
        grid-template-columns: minmax(220px, 270px) minmax(0, 1fr);
      }
    }

    @media (max-width: 1040px) {
      .statusbar-item:nth-last-child(-n + 2) {
        display: none;
      }

      .page-heading {
        gap: var(--space-4);
      }

      .page-actions {
        justify-content: flex-start;
        width: 100%;
      }

      .settings-page .page-actions {
        justify-content: flex-end;
      }
    }

    @media (max-width: 760px) {
      .commit-row {
        grid-template-columns:
          var(--control-large)
          minmax(0, 1fr);
      }

      .commit-time,
      .commit-author,
      .commit-id {
        display: none;
      }

      .commit-detail-list {
        grid-template-columns: minmax(0, 1fr);
      }

      .commit-detail-list .detail-row:last-child {
        grid-column: auto;
      }

      .settings-page-scroll {
        padding: var(--space-4);
      }

      .settings-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .settings-nav {
        position: static;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--space-1);
      }

      .settings-nav-label,
      .settings-nav-divider {
        grid-column: 1 / -1;
      }

      .settings-nav-divider {
        margin-top: var(--space-2);
        margin-bottom: var(--space-2);
      }

      .settings-info-grid,
      .settings-option-grid,
      .settings-option-grid.three,
      .settings-ai-field-grid,
      .analysis-settings-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .analysis-summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .analysis-skeleton-summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .analysis-page-title-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .analysis-skeleton-title-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .analysis-header-actions {
        justify-content: flex-start;
        width: 100%;
      }

      .analysis-skeleton-actions {
        justify-content: flex-start;
        width: 100%;
      }

      .analysis-workbench {
        flex: 0 0 auto;
        grid-template-columns: minmax(0, 1fr);
      }

      .analysis-skeleton-workbench {
        flex: 0 0 auto;
        grid-template-columns: minmax(0, 1fr);
      }

      .analysis-chain-panel,
      .analysis-graph-workspace,
      .analysis-graph-panel {
        grid-column: auto;
        min-height: 420px;
      }

      .analysis-skeleton-navigation,
      .analysis-skeleton-graph {
        grid-column: auto;
        min-height: 420px;
      }

      .analysis-node-diff-drawer {
        width: 100%;
      }

      .settings-setting-row,
      .settings-shortcut-row {
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
        gap: var(--space-2);
      }

      .settings-ai-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .settings-ai-actions-buttons {
        justify-content: flex-end;
      }

      .settings-account-preview {
        align-items: stretch;
        flex-direction: column;
      }

      .settings-account-actions {
        justify-content: flex-start;
      }

      .settings-switch {
        margin-bottom: var(--space-1);
      }

      .settings-shortcut-keys {
        justify-content: flex-start;
      }

      .settings-card-footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>

  <a class="skip-link" href="#mainContent">跳到主内容</a>
  <div class="app-shell">
    <header class="titlebar">
      <div class="brand">
        <span class="brand-mark" id="brandMark"></span>
        <span>GitNest</span>
      </div>
      <div class="menu-strip">
        <details class="titlebar-file-menu" data-dropdown-id="titlebar-file" ontoggle="positionDetailsMenu(event.currentTarget, { side: 'bottom' })">
          <summary>文件</summary>
          <div class="titlebar-file-popover menu-surface" id="titlebarFileMenu" role="menu"></div>
        </details>
        <details class="titlebar-help-menu" data-dropdown-id="titlebar-help" ontoggle="positionDetailsMenu(event.currentTarget, { side: 'bottom' })">
          <summary>帮助</summary>
          <div class="titlebar-file-popover menu-surface" id="titlebarHelpMenu" role="menu"></div>
        </details>
      </div>
      <div class="title-spacer"></div>
      <button class="global-search" aria-haspopup="dialog" aria-controls="commandOverlay" onclick="openCommandPalette()">
        <span class="search-label" id="globalSearchLabel"></span>
        <kbd>Ctrl K</kbd>
      </button>
      <div class="window-controls">
        <button class="window-control" aria-label="最小化" id="minimizeButton"></button>
        <button class="window-control" aria-label="最大化" id="maximizeButton"></button>
        <button class="window-control close" aria-label="关闭" id="closeButton"></button>
      </div>
    </header>

    <div class="workspace-frame">
      <nav class="activity-rail" aria-label="主导航">
        <button class="rail-button" id="sidebarToggleRail" aria-label="折叠仓库目录" aria-pressed="false" title="折叠仓库目录" onclick="toggleRepositorySidebar()"></button>
        <div class="rail-divider" aria-hidden="true"></div>
        <button class="rail-button active" id="workspaceRail" aria-label="Workspace 总览" title="Workspace 总览" onclick="openWorkspace()"></button>
        <button class="rail-button" id="analysisRail" aria-label="代码分析" title="代码分析" onclick="openCodeAnalysis()"></button>
        <button class="rail-button" id="operationRail" aria-label="操作中心" title="操作中心" onclick="showOperationCenter()">
        </button>
        <button class="rail-button" id="searchRail" aria-label="全局搜索" title="全局搜索" onclick="openCommandPalette()"></button>
        <div class="rail-spacer"></div>
        <button class="rail-button" id="terminalRail" aria-label="打开终端" title="打开终端" onclick="openDefaultTerminal('repository')"></button>
        <button class="rail-button" id="themeRail" aria-label="切换主题" title="切换主题" onclick="toggleTheme()"></button>
        <button class="rail-button" id="settingsRail" aria-label="设置" title="设置" onclick="openSettings()"></button>
      </nav>

      <aside class="workspace-sidebar">
        <div class="workspace-switcher-wrap" id="workspaceSwitcherWrap">
          <button class="workspace-switcher" aria-label="切换 Workspace" aria-expanded="false" aria-haspopup="menu" onclick="toggleWorkspaceSwitcher()">
            <span class="workspace-avatar" id="workspaceAvatar"></span>
            <span class="workspace-meta">
              <span class="workspace-name">GitNest Workspace</span>
              <span class="workspace-caption">1 个 Workspace · 本地持久化</span>
            </span>
            <span id="workspaceChevron"></span>
          </button>
          <div class="workspace-switcher-menu menu-surface" id="workspaceSwitcherMenu" role="menu" hidden></div>
        </div>

        <div class="sidebar-search-wrap">
          <div class="sidebar-search-field" id="sidebarSearchField"></div>
          <div class="sidebar-repository-menu-wrap" id="sidebarRepositoryMenuWrap">
            <button id="sidebarRepositoryMenuButton" class="sidebar-repository-menu-trigger" type="button" aria-label="仓库筛选菜单" aria-haspopup="menu" aria-expanded="false" title="仓库筛选菜单" onclick="toggleSidebarRepositoryMenu()"></button>
            <div class="sidebar-repository-menu menu-surface" id="sidebarRepositoryMenu" role="menu" hidden></div>
          </div>
        </div>

        <div class="repository-list" id="repositoryList" oncontextmenu="openRepositoryPanelContextMenu(event)"></div>

        <div class="sidebar-footer">
          <button class="sidebar-add-directory" aria-label="添加目录" title="添加目录" onclick="showToast('添加目录', '选择目录后将加入当前 Workspace。', 'plus')">
            <span id="addDirectoryIcon"></span>
            <span>添加目录</span>
          </button>
          <button class="icon-button" aria-label="重新扫描 Workspace" title="重新扫描 Workspace" id="rescanButton" onclick="runOperation('scan', event.currentTarget)"></button>
        </div>

      <section class="workbench">

        <nav class="context-tabs" id="contextTabs" aria-label="上下文导航"></nav>
        <div class="content-frame">
          <main class="main-content" id="mainContent" tabindex="-1"></main>
          <button class="inspector-backdrop" aria-label="关闭详情面板" onpointerdown="rememberInspectorBackdropPointer(event)" onpointerup="closeInspectorFromBackdrop(event)"></button>
          <aside class="inspector" id="inspector"></aside>

      <span class="statusbar-spacer"></span>
      <span class="statusbar-item" id="statusWatcher"></span>
      <span class="statusbar-item">本地只读快照 · 未 Fetch · 不执行 Git 命令</span>

  <div id="workspaceContextMenuMount"></div>

    <div class="command-palette" role="dialog" aria-modal="true" aria-labelledby="commandPaletteTitle">
      <span id="commandPaletteTitle" hidden>GitNest 命令面板</span>
      <div class="command-input-wrap">
        <span id="paletteSearchIcon"></span>
        <input id="commandInput" name="command-search" class="command-input" aria-label="搜索仓库、变更文件、分支或命令" autocomplete="off" spellcheck="false" placeholder="搜索仓库、变更文件、分支或命令…" oninput="queueCommandResults()" onkeydown="handleCommandInputKeydown(event)" />
        <kbd class="command-key">Esc</kbd>

      <div class="command-results" id="commandResults"></div>

  <div class="modal-overlay" id="confirmOverlay" aria-hidden="true" inert onpointerdown="rememberConfirmBackdropPointer(event)" onpointerup="closeConfirmFromBackdrop(event)">
    <div class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmDescription">
      <div class="confirm-dialog-body">

    function resolveMenuPlacement(
      anchorRect,
      menuRect,
      {
        align = "start",
        gap = 4,
        side = "right",
        viewportPadding = 8
      } = {}
    ) {
      const sideFits = {
        right:
          anchorRect.right + gap + menuRect.width <=
          window.innerWidth - viewportPadding,
        left:
          anchorRect.left - gap - menuRect.width >=
          viewportPadding,
        bottom:
          anchorRect.bottom + gap + menuRect.height <=
          window.innerHeight - viewportPadding,
        top:
          anchorRect.top - gap - menuRect.height >=
          viewportPadding
      };
      const oppositeSide = {
        right: "left",
        left: "right",
        bottom: "top",
        top: "bottom"
      };
      const resolvedSide = sideFits[side]
        ? side
        : oppositeSide[side];
      const alignPosition = (start, end, size) => {
        if (align === "end") return end - size;
        if (align === "center") {
          return start + (end - start - size) / 2;
        }
        return start;
      };
      const crossAxisPosition =
        resolvedSide === "left" || resolvedSide === "right"
          ? alignPosition(
              anchorRect.top,
              anchorRect.bottom,
              menuRect.height
            )
          : alignPosition(
              anchorRect.left,
              anchorRect.right,
              menuRect.width
            );
      const rawLeft =
        resolvedSide === "right"
          ? anchorRect.right + gap
          : resolvedSide === "left"
            ? anchorRect.left - menuRect.width - gap
            : crossAxisPosition;
      const rawTop =
        resolvedSide === "bottom"
          ? anchorRect.bottom + gap
          : resolvedSide === "top"
            ? anchorRect.top - menuRect.height - gap
            : crossAxisPosition;
      const clampToViewport = (value, size, viewportSize) => {
        const maximum = Math.max(
          viewportPadding,
          viewportSize - size - viewportPadding
        );
        return Math.min(
          maximum,
          Math.max(viewportPadding, value)
        );
      };

      return {
        left: clampToViewport(
          rawLeft,
          menuRect.width,
          window.innerWidth
        ),
        side: resolvedSide,
        top: clampToViewport(
          rawTop,
          menuRect.height,
          window.innerHeight
        )
      };
    }

    function positionAnchoredMenu(menu, anchor, options = {}) {

        menu.getBoundingClientRect(),

      );
      menu.style.position = "fixed";
      menu.style.left = `${placement.left}px`;
      menu.style.top = `${placement.top}px`;
      menu.dataset.menuSide = placement.side;
    }

    function handleMenuKeyboard(event) {
      if (!(event.target instanceof Element)) return false;
      const menu = event.target.closest(".menu-surface");
      if (!menu) return false;

      const items = [
        ...menu.querySelectorAll(
          '[role^="menuitem"]:not(:disabled)'
        )
      ].filter(
        (item) => item.closest(".menu-surface") === menu
      );
      if (!items.length) return false;

      const currentIndex = items.indexOf(event.target);
      let nextIndex = null;
      if (event.key === "ArrowDown") {
        nextIndex = (currentIndex + 1) % items.length;
      } else if (event.key === "ArrowUp") {
        nextIndex =
          (currentIndex - 1 + items.length) % items.length;
      } else if (event.key === "Home") {
        nextIndex = 0;
      } else if (event.key === "End") {
        nextIndex = items.length - 1;
      }

      if (nextIndex === null) return false;
      event.preventDefault();
      items[nextIndex].focus();
      return true;
    }
