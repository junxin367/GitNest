      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
    }

    .file-section-title:hover {
      color: var(--text-soft);
    }

    .file-section-title:disabled,
    .file-section-title:disabled:hover {
      color: var(--muted);
      background: var(--surface-2);
      cursor: default;
      opacity: 0.64;
    }

    .file-section-title > .icon {
      width: 13px;
      height: 13px;
      transition: transform var(--motion-micro) var(--ease-enter);
    }

    .file-section:not(.collapsed) .file-section-title > .icon {
      transform: rotate(90deg);
    }

    .file-section-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-section-count {
      position: absolute;
      right: 0;
      min-width: 20px;
      height: 18px;
      padding: 0 var(--space-1);
      color: var(--muted);
      background: var(--surface-3);
      border-radius: 999px;
      font-size: var(--font-size-caption);
      transition: opacity var(--motion-micro) ease;
      font-weight: var(--font-weight-semibold);
      line-height: 18px;
      text-align: center;
    }

    .file-section-tail {
      position: relative;
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      min-width: calc(var(--icon-small) * 2 + var(--space-1));
      min-height: var(--control-compact);
    }

    .file-section-actions {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--motion-micro) ease;
    }

    .file-section-header.has-actions:hover .file-section-actions,
    .file-section-header.has-actions:focus-within .file-section-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .file-section-header.has-actions:hover .file-section-count,
    .file-section-header.has-actions:focus-within .file-section-count {
      opacity: 0;
    }

    .file-section-actions .gn-button {
      width: var(--gn-button-icon-size, 14px);
      min-width: var(--gn-button-icon-size, 14px);
      height: var(--gn-button-icon-size, 14px);
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .file-section-actions .gn-button:hover:not(:disabled),
    .file-section-actions .gn-button:active:not(:disabled),
    .file-section-actions .gn-button:disabled,
    .file-section-actions .gn-button[data-selected="true"] {
      color: var(--text);
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }

    .file-section-actions .gn-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .file-section-body {
      display: grid;
      grid-template-rows: 1fr;
      opacity: 1;
      transition:
        grid-template-rows var(--motion-layer) var(--ease-enter),
        opacity var(--motion-micro) var(--ease-enter);
    }

    .file-section-body-inner {
      min-height: 0;
      overflow: hidden;
    }

    .file-section.collapsed .file-section-body {
      grid-template-rows: 0fr;
      opacity: 0;
      pointer-events: none;
    }

    .file-section-empty {
      display: block;
      width: 100%;
      min-height: var(--control-large);
      padding: var(--space-3);
      color: var(--muted);
      text-align: center;
      background: transparent;
      border: 0;
      cursor: pointer;
      font-size: var(--font-size-caption);
    }

    .file-section-empty:hover {
      color: var(--text-soft);
      background: var(--surface-hover);
    }

    .file-row {
      --diff-workspace-file-backdrop: transparent;
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      gap: var(--space-2);
      width: 100%;
      min-width: 0;
      min-height: var(--control-large);
      padding: 0 var(--space-2);
      color: var(--text-soft);
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
    }

    .file-row:hover,
    .file-row:focus-within {
      --diff-workspace-file-backdrop: var(--surface-hover);
      background: var(--surface-hover);
    }

    .file-row.active {
      --diff-workspace-file-backdrop: var(--surface-hover);
      background: var(--surface-hover);
      box-shadow: 2px 0 0 var(--accent) inset;
    }

    .change-tree-directory {
      display: grid;
      grid-template-columns: 16px 16px minmax(0, 1fr);
      align-items: center;
      gap: var(--space-1);
      width: 100%;
      min-width: 0;
      min-height: var(--control-compact);
      padding-top: 0;
      padding-right: var(--space-2);
      padding-bottom: 0;
      color: var(--muted);
      text-align: left;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      cursor: pointer;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-medium);
    }

    .change-tree-directory:hover {
      color: var(--text-soft);
      background: var(--surface-hover);
    }

    .change-tree-directory > span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .change-tree-directory > .icon:first-child {
      transition: transform var(--motion-micro) var(--ease-enter);
    }

    .change-tree-directory:not(.collapsed) > .icon:first-child {
      transform: rotate(90deg);
    }

    .change-tree-directory > .icon:nth-child(2) {
      color: var(--accent);
    }

    .file-status-letter {
      display: grid;
      flex: 0 0 14px;
      place-items: center;
      width: 14px;
      height: 14px;
      border-radius: var(--radius-small);
      font-size: 10px;
      font-weight: var(--font-weight-semibold);
    }

    .file-status-letter.modified {
      color: var(--yellow);
      background: var(--yellow-soft);
    }

    .file-status-letter.added {
      color: var(--green);
      background: var(--green-soft);
    }

    .file-status-letter.deleted {
      color: var(--red);
      background: var(--red-soft);
    }

    .file-status-letter.untracked {
      color: var(--blue);
      background: var(--blue-soft);
    }

    .file-path {
      min-width: 0;
      padding: 0;
    }

    .file-select-button {
      display: grid;
      gap: 2px;
      width: 100%;
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .file-name {
      display: block;
      direction: rtl;
      overflow: hidden;
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      text-align: left;
      white-space: nowrap;
    }

    .file-dir {
      display: block;
      overflow: hidden;
      margin-top: 0;
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-meta {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      min-width: 0;
    }

    .file-change-stats {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-2);
      margin-left: var(--space-1);
      font-family: var(--font-mono);
      font-size: calc(var(--font-size-caption) - 1px);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .file-change-stats strong {
      color: var(--green);
    }

    .file-change-stats em {
      color: var(--red);
      font-style: normal;
    }

    .stage-toggle {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: var(--radius-small);
      cursor: pointer;
    }

    .stage-toggle.gn-button {
      width: var(--control-compact);
      min-width: var(--control-compact);
      height: var(--control-compact);
      padding: 0;
    }

    .stage-toggle:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .file-actions {
      position: absolute;
      top: 0;
      right: var(--space-2);
      bottom: 0;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 2px;
      padding-left: var(--space-5);
      opacity: 0;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        transparent,
        var(--diff-workspace-file-backdrop) var(--space-5)
      );
      transition: opacity var(--motion-micro) ease;
    }

    .file-row:hover .file-actions,
    .file-row:focus-within .file-actions {
      opacity: 1;
      pointer-events: auto;
    }

    .file-actions .gn-button {
      width: var(--gn-button-icon-size, 14px);
      min-width: var(--gn-button-icon-size, 14px);
      height: var(--gn-button-icon-size, 14px);
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .file-actions .gn-button:hover:not(:disabled),
    .file-actions .gn-button:active:not(:disabled),
    .file-actions .gn-button:disabled,
    .file-actions .gn-button[data-selected="true"] {
      color: var(--text);
      background: transparent;
      border-color: transparent;
      box-shadow: none;
    }

    .file-actions .gn-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .diff-viewer-panel {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--code-bg);
    }

    .diff-viewer-main {
      position: relative;
      display: grid;
      grid-template-rows: 44px minmax(0, 1fr);
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--code-bg);
    }

    .diff-viewer-file-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      min-width: 0;
      overflow: hidden;
      padding: 0 var(--space-3);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .diff-viewer-file-heading {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      gap: var(--space-1);
      min-width: 0;
      overflow: hidden;
    }

    .diff-viewer-path-copy-button {
      display: grid;
      flex: 0 0 var(--control-compact);
      place-items: center;
      width: var(--control-compact);
      height: var(--control-compact);
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .diff-viewer-path-copy-button:hover:not(:disabled) {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .diff-viewer-path-copy-button.copied {
      color: var(--green);
      background: var(--green-soft);
      border-color: color-mix(in srgb, var(--green) 28%, transparent);
    }

    .diff-viewer-file-heading > span {
      display: -webkit-box;
      flex: 1 1 auto;
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      overflow-wrap: anywhere;
      color: var(--text-soft);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: normal;
      word-break: break-word;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .diff-viewer-header-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      margin-left: auto;
    }

    .diff-viewer-stats {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-3);
      min-height: 24px;
      font-family: var(--font-mono);
      font-size: calc(var(--font-size-caption) - 1px);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .diff-viewer-stats strong {
      color: var(--green);
    }

    .diff-viewer-stats em {
      color: var(--red);
      font-style: normal;
      font-weight: var(--font-weight-semibold);
    }

    .diff-viewer-stats.muted {
      color: var(--muted);
      font-family: var(--font-sans);
    }

    .diff-viewer-file-header-separator {
      width: 1px;
      height: 22px;
      background: var(--border);
    }

    .diff-viewer-header-action-slot {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
    }

    .diff-open-external {
      width: var(--control-compact);
      height: var(--control-compact);
      padding: 0;
      text-decoration: none;
    }

    .diff-search-popover {
      position: absolute;
      top: calc(44px + var(--space-1));
      right: var(--space-3);
      z-index: var(--z-popover);
      display: grid;
      grid-template-columns: 14px minmax(96px, 1fr) auto repeat(3, 28px);
      align-items: center;
      gap: 2px;
      width: min(360px, calc(100% - var(--space-5)));
      min-height: var(--control-compact);
      padding: 2px var(--space-1);
      background: color-mix(in srgb, var(--surface) 94%, var(--canvas));
      border: 1px solid var(--border);
      border-radius: var(--radius-regular);
      box-shadow: var(--shadow-popover);
    }

    .diff-search-symbol {
      display: grid;
      place-items: center;
      width: 14px;
      height: 14px;
      color: var(--muted);
    }

    .diff-search-input {
      width: 100%;
      min-width: 0;
      height: 28px;
      padding: 0 2px;
      color: var(--text);
      background: transparent;
      border: 0;
      border-radius: var(--radius-small);
      font: inherit;
      outline: none;
      box-shadow: none;
    }

    .diff-search-input::placeholder {
      color: var(--muted);
    }

    .diff-search-input:focus,
    .diff-search-input:focus-visible {
      background: transparent;
      outline: none;
      box-shadow: none;
    }

    .diff-search-count {
      min-width: 36px;
      padding: 0 2px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      line-height: 1;
      text-align: center;
      white-space: nowrap;
    }

    .diff-search-action {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      color: var(--text-soft);
      background: transparent;
      border: 0;
      border-radius: var(--radius-small);
      cursor: pointer;
    }

    .diff-search-action:hover:not(:disabled) {
      color: var(--text);
      background: var(--surface-hover);
    }

    .diff-search-action:disabled {
      color: var(--muted);
      cursor: not-allowed;
      opacity: 0.55;
    }

    .diff-viewer-code {
      position: relative;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      background: var(--code-bg);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      line-height: 20px;
    }

    .diff-viewer-unified {
      min-width: max(100%, 760px);
      width: max-content;
      padding: var(--space-2) 0 var(--space-5);
    }

    .diff-viewer-unified-line {
      display: grid;
      grid-template-columns: 48px 48px 22px minmax(610px, 1fr);
      min-width: 760px;
      min-height: 20px;
    }

    .diff-viewer-unified-line:hover .diff-viewer-code-cell {
      filter: brightness(1.08);
    }

    .diff-viewer-line-number {
      padding: 0 var(--space-2) 0 var(--space-1);
      color: var(--muted);
      background: color-mix(in srgb, var(--surface-2) 56%, var(--code-bg));
      border-right: 1px solid var(--border-soft);
      font-variant-numeric: tabular-nums;
      text-align: right;
      user-select: none;
    }

    .diff-viewer-change-marker {
      color: var(--muted);
      background: color-mix(in srgb, var(--surface-2) 44%, var(--code-bg));
      text-align: center;
      user-select: none;
    }

    .diff-viewer-code-cell {
      min-width: 0;
      padding: 0 var(--space-3);
      color: var(--text-soft);
      background: var(--code-bg);
      border-right: 1px solid var(--border-soft);
    }

    .diff-viewer-code-cell > code {
      display: block;
      min-width: max-content;
      min-height: 20px;
      color: inherit;
      white-space: pre;
      tab-size: 2;
    }

    .diff-viewer-line-number.removed,
    .diff-viewer-change-marker.removed {
      color: color-mix(in srgb, var(--red) 76%, var(--muted));
      background: color-mix(in srgb, var(--red-soft) 72%, var(--surface-2));
    }

    .diff-viewer-code-cell.removed {
      color: var(--red);
      background: var(--red-soft);
    }

    .diff-viewer-line-number.added,
    .diff-viewer-change-marker.added {
      color: color-mix(in srgb, var(--green) 76%, var(--muted));
      background: color-mix(in srgb, var(--green-soft) 72%, var(--surface-2));
    }

    .diff-viewer-code-cell.added {
      color: var(--green);
      background: var(--green-soft);
    }

    .diff-viewer-wide-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-width: 100%;
      min-height: 20px;
      padding: 0 var(--space-3);
      color: var(--blue);
      background: color-mix(in srgb, var(--blue-soft) 86%, var(--code-bg));
      border-top: 1px solid color-mix(in srgb, var(--accent) 14%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 14%, transparent);
      scroll-margin-top: var(--space-3);
    }

    .diff-viewer-wide-row > code {
      min-width: max-content;
      color: inherit;
      white-space: pre;
    }

    .diff-search-match {
      padding: 0;
      color: inherit;
      background: color-mix(in srgb, var(--yellow) 38%, transparent);
      border-radius: 2px;
    }

    .diff-search-match.current {
      color: var(--canvas);
      background: var(--yellow);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--yellow) 72%, white);
    }

    .branches-table {
      width: 100%;
      min-width: 700px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .branches-table th:nth-child(1) { width: 31%; }
    .branches-table th:nth-child(2) { width: 10%; }
    .branches-table th:nth-child(3) { width: 31%; }
    .branches-table th:nth-child(4) { width: 10%; }
    .branches-table th:nth-child(5) { width: 9%; }
    .branches-table th:nth-child(6) { width: 9%; }

    .branches-table th,
    .branches-table td {
      height: var(--control-large);
      padding: 0 var(--space-3);
      border-bottom: 1px solid var(--border-soft);
      text-align: left;
    }

    .branches-table th {
      height: var(--control-default);
      color: var(--muted);
      background: var(--surface-2);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
    }

    .branches-table tbody tr:hover {
      background: var(--surface-hover);
    }

    .branches-table tbody tr.selected {
      background: var(--accent-soft);
      box-shadow: 3px 0 0 var(--accent) inset;
    }

    .branch-name-button {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      width: 100%;
      min-height: var(--control-compact);
      min-width: 0;
      padding: 0;
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    .branch-name-cell {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      color: var(--text-soft);
      font-weight: var(--font-weight-medium);
    }

    .branch-name-cell.current {
      color: var(--accent);
    }

    .branch-name-cell span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .branch-current-dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .branch-action-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-1);
    }

    .worktree-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 350px), 1fr));
      gap: var(--space-3);
    }

    .worktree-grid > * {
      max-width: 400px;
    }

    .worktree-toolbar {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-height: var(--control-large);
      padding: 0 var(--space-3);
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-large);
    }

    .worktree-toolbar-title {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--text);
      font-weight: var(--font-weight-semibold);
    }

    .worktree-toolbar-count {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .worktree-filter-input {
      flex: 0 1 240px;
      width: 240px;
      min-width: 120px;
      height: var(--control-compact);
      margin-left: auto;
      padding: 0 var(--space-2);
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
      font-size: var(--font-size-caption);
    }

    .worktree-filter-input:focus {
      border-color: var(--accent);
    }

    .worktree-filter-input + .panel-header-action {
      margin-left: 0;
}

    .worktree-filter-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }

    .worktree-filter-bar-label {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .worktree-filter-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      height: 26px;
      padding: 0 var(--space-2);
      color: var(--text-soft);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      cursor: pointer;
      font-size: var(--font-size-caption);
    }

    .worktree-filter-chip:hover:not(:disabled) {
      color: var(--text);
      border-color: var(--border);
    }

    .worktree-filter-chip.selected {
      color: var(--accent-strong);
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 38%, transparent);
    }

    .worktree-filter-chip-count {
      padding: 0 var(--space-1);
      color: var(--muted);
      background: var(--surface-3);
      border-radius: 999px;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      line-height: 16px;
    }

    .worktree-filter-chip.selected .worktree-filter-chip-count {
      color: var(--accent-strong);
      background: color-mix(in srgb, var(--accent) 20%, transparent);
    }

    .worktree-filter-clear {
      height: 26px;
      padding: 0 var(--space-2);
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: var(--radius-small);
      cursor: pointer;
      font-size: var(--font-size-caption);
    }

    .worktree-filter-clear:hover {
      color: var(--text);
      background: var(--surface-hover);
    }

    .worktree-repo-menu {
      position: relative;
    }

    .worktree-repo-menu > summary {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      max-width: 220px;
      height: var(--control-compact);
      padding: 0 var(--space-2);
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
      cursor: pointer;
      font-size: var(--font-size-caption);
      list-style: none;
    }

    .worktree-repo-menu > summary::-webkit-details-marker {
      display: none;
    }

    .worktree-repo-menu > summary:hover,
    .worktree-repo-menu[open] > summary {
      border-color: var(--border);
      background: var(--surface-hover);
    }

    .worktree-repo-menu-trigger-value {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .worktree-repo-menu-surface {
      gap: var(--space-1);
      width: min(240px, calc(100vw - var(--space-6)));
      max-height: 260px;
      overflow: auto;
    }

    .worktree-repo-menu-surface .menu-item.is-selected {
      color: var(--text);
      background: var(--accent-soft);
    }

    .worktree-repository-tag {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      max-width: 160px;
      overflow: hidden;
      color: var(--text-soft);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .worktree-filter-empty {
      display: grid;
      justify-items: center;
      gap: var(--space-1);
      min-height: 150px;
      padding: var(--space-5) var(--space-3);
      color: var(--muted);
      text-align: center;
    }

    .worktree-management {
      display: grid;
      gap: var(--space-4);
      min-width: 0;
    }

    .page-heading.worktree-page-heading {
      flex-wrap: nowrap;
      margin-bottom: 0;
    }

    .worktree-page-heading .page-actions {
      width: auto;
    }

    .worktree-page-heading .page-description {
      max-width: 680px;
      font-size: var(--font-size-caption);
    }

    .worktree-metric-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .worktree-card {
      position: relative;
      width: 100%;
      min-height: 180px;
      padding: var(--space-4);
      color: inherit;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-large);
      cursor: pointer;
    }

    .worktree-card:hover {
      border-color: color-mix(in srgb, var(--accent) 34%, var(--border));
    }

    .worktree-card.primary {
      background: linear-gradient(140deg, var(--accent-soft), var(--surface) 48%);
      border-color: color-mix(in srgb, var(--accent) 25%, var(--border));
    }

    .worktree-card-head {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
    }

    .worktree-card-head > span:nth-child(2) {
      flex: 1 1 auto;
      min-width: 0;
    }

    .worktree-symbol {
      display: grid;
      flex: 0 0 var(--control-default);
      place-items: center;
      width: var(--control-default);
      height: var(--control-default);
      color: var(--blue);
      background: var(--blue-soft);
      border-radius: var(--radius-regular);
    }

    .worktree-card.primary .worktree-symbol {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .worktree-title {
      overflow: hidden;
      color: var(--text);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-semibold);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .worktree-branch {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      overflow: hidden;
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .worktree-path {
      overflow: hidden;
      margin-top: var(--space-4);
      padding: var(--space-2) var(--space-3);
      color: var(--muted);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .worktree-foot {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-3);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .worktree-foot .spacer {
      flex: 1;
    }

    .inspector-head {
      display: flex;
      align-items: center;
      min-height: var(--control-large);
      padding: 0 var(--space-4);
      border-bottom: 1px solid var(--border-soft);
    }

    .inspector-title {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--text);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-semibold);
    }

    .inspector-title .icon {
      color: var(--muted);
    }

    .inspector-close {
      margin-left: auto;
    }

    .inspector-actions {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      margin-left: auto;
    }

    .inspector-actions .inspector-close {
      margin-left: 0;
    }

    .inspector-section {
      padding: var(--space-4);
      border-bottom: 1px solid var(--border-soft);
    }

    .inspector-section-title {
      display: flex;
      align-items: center;
      margin-bottom: var(--space-3);
      color: var(--muted);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
    }

    .inspector-section-title span {
      margin-left: auto;
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-medium);
      letter-spacing: 0;
      text-transform: none;
    }

    .health-ring-wrap {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }

    .health-ring {
      --value: 84%;
      position: relative;
      display: grid;
      place-items: center;
      width: 66px;
      height: 66px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: conic-gradient(var(--accent) var(--value), var(--surface-3) 0);
    }

    .health-ring::before {
      content: "";
      position: absolute;
      width: 51px;
      height: 51px;
      background: var(--surface);
      border-radius: 50%;
    }

    .health-ring strong {
      z-index: 1;
      color: var(--text);
      font-size: var(--font-size-body);
    }

    .health-copy-title {
      color: var(--text);
      font-weight: var(--font-weight-semibold);
    }

    .health-copy-text {
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .detail-list {
      display: grid;
      gap: var(--space-2);
    }

    .commit-detail-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: var(--space-4);
      row-gap: var(--space-1);
    }

    .detail-row {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      gap: var(--space-2);
      align-items: start;
    }

    .commit-detail-list .detail-row {
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
    }

    .commit-detail-list .detail-row:last-child {
      grid-column: 1 / -1;
    }

    .detail-label {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .detail-value {
      min-width: 0;
      overflow: hidden;
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .commit-detail-list .detail-value {
      text-align: left;
    }

    .operation-list {
      display: grid;
      gap: var(--space-2);
    }

    .operation-center-page {
      display: grid;
      align-content: start;
      gap: var(--space-4);
    }

    .operation-center-page .page-heading,
    .operation-center-page .metric-grid,
    .operation-center-page .panel {
      margin-bottom: 0;
    }

    .operation-center-page .operation-list,
    .operation-center-page .operation-constraints {
      padding: var(--space-4);
    }

    .operation-item {
      padding: var(--space-3);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
    }

    .operation-head {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .operation-icon {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: var(--radius-regular);
    }

    .operation-icon.success {
      color: var(--green);
      background: var(--green-soft);
    }

    .operation-name {
      min-width: 0;
      overflow: hidden;
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-medium);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .operation-state {
      margin-left: auto;
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .progress-track {
      height: 4px;
      overflow: hidden;
      margin-top: var(--space-2);
      background: var(--surface-3);
      border-radius: 999px;
    }

    .progress-value {
      width: 68%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--blue));
      border-radius: inherit;
      transition: width var(--motion-micro) var(--ease-enter);
    }

    .operation-foot {
      display: flex;
      justify-content: space-between;
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-2);
    }

    .quick-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      min-width: 0;
      min-height: var(--control-default);
      padding: 0 var(--space-3);
      color: var(--text-soft);
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
      cursor: pointer;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
    }

    .quick-button:hover {
      color: var(--text);
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .quick-button .icon {
      color: var(--muted);
    }

    .commit-composer {
      margin-top: var(--space-4);
    }

    .changes-file-pane > .commit-composer {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 160px;
      max-height: 420px;
      margin-top: 0;
      overflow: auto;
      border: 0;
      border-top: 1px solid var(--border);
      border-radius: 0;
      box-shadow: none;
    }

    .commit-resize-handle {
      position: relative;
      height: 8px;
      margin: 0;
      cursor: ns-resize;
      touch-action: none;
      user-select: none;
    }

    .commit-resize-handle::after {
      position: absolute;
      top: 3px;
      left: 50%;
      width: 32px;
      height: 2px;
      content: "";
      background: var(--border-soft);
      border-radius: 999px;
      transform: translateX(-50%);
      transition: background var(--motion-fast), width var(--motion-fast);
    }

    .commit-resize-handle:hover::after,
    .commit-resize-handle:focus-visible::after {
      width: 48px;
      background: var(--accent);
    }

    body.is-resizing-commit-panel,
    body.is-resizing-commit-panel * {
      cursor: ns-resize !important;
      user-select: none !important;
    }

    .changes-file-pane > .commit-composer .panel-header {
      min-height: var(--control-compact);
      padding: 0 var(--space-2);
    }

    .commit-composer .panel-header > .status-pill {
      margin-left: auto;
    }

    .commit-push-toggle {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-medium);
      cursor: pointer;
    }

    .commit-push-toggle input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    .commit-form {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: var(--space-2);
      min-height: 0;
      padding: var(--space-2);
    }

    .commit-form-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex: 0 0 auto;
      min-height: var(--control-compact);
    }

    .commit-form .gn-textarea-field {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      min-height: 0;
    }

    .commit-form .gn-textarea {
      flex: 1 1 auto;
      min-height: 0;
    }

    .commit-ai-button.gn-button {
      flex: 0 0 auto;
      width: var(--control-compact);
      min-width: var(--control-compact);
      padding: 0;
    }

    .commit-form label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-medium);
    }

    .commit-form label span {
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-regular);
    }

    .commit-form .commit-message {
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
      overflow: auto;
      resize: none;
      font-size: var(--font-size-caption);
      line-height: 1.4;
    }

    .commit-submit-button.gn-button {
      flex: 1 1 auto;
      width: auto;
      min-width: 0;
      min-height: var(--control-compact);
      height: var(--control-compact);
      padding: 0 var(--space-2);
    }

    .form-label {
      color: var(--muted);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .form-input {
      width: 100%;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-regular);
      transition:
        background-color var(--motion-micro) ease,
        border-color var(--motion-micro) ease;
    }

    .form-input:hover,
    .sidebar-search:hover {
      border-color: color-mix(in srgb, var(--accent) 36%, var(--border));
    }

    .form-input:focus,
    .sidebar-search:focus {
      border-color: var(--color-focus);
    }

    .form-input[aria-invalid="true"] {
      border-color: var(--red);
      background: color-mix(in srgb, var(--red-soft) 48%, var(--surface-2));
    }

    .form-input:disabled,
    .sidebar-search:disabled {
      color: var(--color-text-disabled);
      background: var(--surface-2);
      cursor: not-allowed;
      opacity: 0.72;
    }

    .form-input {
      height: var(--control-default);
      padding: 0 var(--space-3);
    }

    .form-input::placeholder {
      color: var(--muted);
    }

    .form-field-meta {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-2);
      min-height: var(--space-5);
      color: var(--muted);
      font-size: var(--font-size-caption);
      font-variant-numeric: tabular-nums;
    }

    .form-error {
      display: none;
      color: var(--red);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .form-error:not(:empty) {
      display: block;
    }

    .form-field-meta:has(.form-error:not(:empty)) .form-help {
      display: none;
    }

    .commit-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-height: var(--control-compact);
      cursor: pointer;
    }

    .checkbox-label input {
      accent-color: var(--accent);
    }

    .commit-button {
      width: 100%;
      margin-top: var(--space-1);
    }

    .selected-commit-title {
      margin: 0 0 var(--space-2);
      color: var(--text);
      font-size: var(--font-size-emphasis);
      line-height: var(--line-height-title);
    }

    .selected-commit-body {
      margin: 0;
      color: var(--muted);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .avatar-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }

    .avatar {
      display: grid;
      place-items: center;
      width: var(--control-compact);
      height: var(--control-compact);
      color: #fff;
      background: linear-gradient(145deg, #5579df, #9d67d5);
      border-radius: 50%;
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .avatar-meta {
      min-width: 0;
    }

    .avatar-name {
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-medium);
    }

    .avatar-time {
      margin-top: var(--space-1);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .changed-file-list {
      display: grid;
      gap: var(--space-1);
    }

    .changed-file-item {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
      padding: var(--space-2);
      background: var(--surface-2);
      border-radius: var(--radius-regular);
    }

    .changed-file-item span {
      overflow: hidden;
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .changed-file-item .file-change-stat {
      display: flex;
      gap: var(--space-1);
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: var(--font-size-caption);
    }

    .statusbar {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      min-width: 0;
      padding: 0 var(--space-2);
      color: var(--muted);
      background: var(--titlebar);
      border-top: 1px solid var(--border-soft);
      font-size: var(--font-size-caption);
      user-select: none;
    }

    .statusbar-item {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      min-width: 0;
    }

    .statusbar-item .icon {
      width: 12px;
      height: 12px;
    }

    .statusbar-spacer {
      flex: 1;
    }

    .online-dot {
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 0 3px var(--green-soft);
    }

    .command-overlay {
      position: fixed;
      inset: 0;
      z-index: var(--z-modal);
      display: grid;
      place-items: start center;
      padding-top: 12vh;
      background: var(--color-overlay);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--motion-exit) var(--ease-exit);
      backdrop-filter: blur(5px);
    }

    .command-overlay.open {
      opacity: 1;
      pointer-events: auto;
      transition-duration: var(--motion-layer);
      transition-timing-function: var(--ease-enter);
    }

    .command-palette {
      position: relative;
      width: min(610px, calc(100vw - 40px));
      max-height: min(680px, calc(100vh - 48px));
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      transform: translateY(-8px) scale(0.985);
      transform-origin: top center;
      transition: transform var(--motion-exit) var(--ease-exit);
    }

    .command-overlay.open .command-palette {
      transform: translateY(0) scale(1);
      transition-duration: var(--motion-layer);
      transition-timing-function: var(--ease-enter);
    }

    .command-input-wrap {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      height: var(--control-large);
      padding: 0 var(--space-4);
      border-bottom: 1px solid var(--border);
      border-radius: var(--radius-large) var(--radius-large) 0 0;
    }

    .command-input-wrap:focus-within {
      background: color-mix(in srgb, var(--accent) 5%, transparent);
      border-bottom-color: var(--color-focus);
    }

    .command-input-wrap .icon {
      color: var(--muted);
    }

    .command-input-wrap:focus-within .icon {
      color: var(--accent);
    }

    .command-input {
      flex: 1;
      height: 100%;
      color: var(--text);
      background: transparent;
      border: 0;
      font-size: var(--font-size-body);
    }

    .command-input:focus-visible {
      outline-color: transparent;
    }

    .command-input::placeholder {
      color: var(--muted);
    }

    .command-results {
      max-height: min(480px, calc(100vh - 160px));
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: var(--space-2);
    }

    .command-group-label {
      padding: var(--space-2);
      color: var(--muted);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.02em;
    }

    .command-result {
      display: grid;
      grid-template-columns: var(--control-compact) minmax(0, 1fr) auto;
      align-items: center;
      column-gap: var(--space-2);
      width: 100%;
      min-height: var(--control-large);
      padding: 0 var(--space-2);
      color: inherit;
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .command-result:hover,
    .command-result:focus-visible {
      background: var(--surface-hover);
    }

    .command-result:focus-visible {
      outline: 1px solid var(--color-focus);
      outline-offset: -1px;
    }

    .command-result-icon {
      display: grid;
      place-items: center;
      width: var(--control-compact);
      height: var(--control-compact);
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: var(--radius-regular);
    }

    .command-result-title {
      display: block;
      color: var(--text-soft);
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-medium);
    }

    .command-result:hover .command-result-title,
    .command-result:focus-visible .command-result-title {
      color: var(--text);
    }

    .command-result-sub {
      display: block;
      margin-top: calc(var(--space-1) / 2);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .command-status,
    .command-key {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: var(--font-size-caption);
      white-space: nowrap;
    }

    .command-result > .command-status,
    .command-result > .command-key {
      margin-left: var(--space-3);
    }

    .command-status {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .command-key {
      display: inline-grid;
      place-items: center;
      min-width: var(--control-compact);
      height: var(--space-6);
      padding: 0 var(--space-2);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-small);
      font-family: inherit;
      line-height: 1;
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 260px;
      padding: var(--space-5);
      color: var(--muted);
      text-align: center;
    }

    .compact-empty-state {
      min-height: 150px;
    }

    .command-empty-state {
      min-height: 192px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .empty-state-icon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin: 0 auto var(--space-3);
      color: var(--muted);
      background: var(--surface-2);
      border-radius: var(--radius-large);
    }

    .empty-state-title {
      color: var(--text);
      font-size: var(--font-size-emphasis);
      font-weight: var(--font-weight-semibold);
    }

    .empty-state-description {
      max-width: 360px;
      margin: var(--space-2) auto 0;
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .empty-state-actions {
      display: flex;
      justify-content: center;
      gap: var(--space-2);
      margin-top: var(--space-4);
    }

    .field-help {
      min-height: var(--space-5);
      margin-top: var(--space-2);
      color: var(--muted);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .field-help.warning {
      color: var(--yellow);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: var(--z-modal);
      display: grid;
      place-items: center;
      padding: var(--space-5);
      background: var(--color-overlay);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        opacity var(--motion-exit) var(--ease-exit),
        visibility var(--motion-exit) var(--ease-exit);
      backdrop-filter: blur(4px);
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition-duration: var(--motion-layer), var(--motion-layer);
      transition-timing-function: var(--ease-enter), var(--ease-enter);
    }

    .history-page {
      overflow: hidden;
    }

    .history-layout {
      display: grid;
      grid-template-rows: minmax(320px, 1fr) auto;
      height: 100%;
      min-height: 0;
      background: var(--surface);
    }

    .history-layout:not(.has-detail) {
      grid-template-rows: minmax(320px, 1fr);
    }

    .history-list {
      min-height: 0;
      overflow: auto;
    }

    .history-list .sticky-panel-header {
      z-index: var(--z-navigation);
      background: var(--surface);
    }

    .history-commit-detail {
      min-height: 0;
      max-height: min(350px, 42vh);
      overflow: auto;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .history-commit-detail .inspector-head {
      position: sticky;
      top: 0;
      z-index: var(--z-navigation);
      min-height: var(--control-default);
      padding: 0 var(--space-3);
      background: var(--surface);
    }

    .history-commit-detail .inspector-section:last-child {
      border-bottom: 0;
    }

    .history-commit-summary {
      padding: var(--space-3) var(--space-4);
    }

    .history-commit-summary .selected-commit-title {
      margin-bottom: 0;
      font-size: var(--font-size-body);
    }

    .history-commit-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-2);
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .history-commit-meta code {
      color: var(--accent);
      font-family: var(--font-mono);
    }

    .history-commit-summary .commit-refs {
      margin-top: var(--space-2);
    }

    .history-commit-summary .selected-commit-body {
      margin-top: var(--space-2);
    }

    .confirm-dialog {
      position: relative;
      width: min(480px, 100%);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-large);
      box-shadow: var(--shadow);
      transform: translateY(12px) scale(0.985);
      transform-origin: center;
      transition: transform var(--motion-exit) var(--ease-exit);
    }

    .modal-overlay.open .confirm-dialog {
      transform: translateY(0) scale(1);
      transition-duration: var(--motion-layer);
      transition-timing-function: var(--ease-enter);
    }

    .branch-switch-dialog {
      width: min(520px, calc(100vw - 48px));
    }

    .branch-switch-dialog-header {
      position: relative;
      grid-template-columns: var(--control-large) minmax(0, 1fr);
      padding-right: calc(var(--space-5) + var(--control-default));
    }

    .branch-switch-dialog-close {
      position: absolute;
      top: var(--space-4);
      right: var(--space-4);
    }

    .branch-switch-dialog-content {
      display: grid;
      gap: var(--space-3);
      min-height: 0;
      padding: var(--space-4) var(--space-5);
    }

    .branch-switch-dialog-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      color: var(--text-soft);
      font-size: var(--font-size-caption);
    }

    .branch-switch-dialog-heading > span {
      color: var(--muted);
      font-weight: var(--font-weight-regular);
    }

    .branch-switch-list {
      display: grid;
      gap: var(--space-2);
      max-height: min(360px, 42vh);
      overflow: auto;
    }

    .branch-switch-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      width: 100%;
      min-height: 54px;
      padding: var(--space-3);
      color: var(--text);
      text-align: left;
      background: var(--surface-2);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-regular);
      cursor: pointer;
    }

    .branch-switch-option:hover:not(:disabled) {
      color: var(--text);
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    .branch-switch-option.current {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: color-mix(in srgb, var(--accent) 36%, var(--border-soft));
    }

    .branch-switch-option:disabled {
      cursor: default;
      opacity: 0.72;
    }

    .branch-switch-option-main {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
    }

    .branch-switch-option-main > .icon {
      flex: 0 0 auto;
    }

    .branch-switch-option-main > span {
      display: grid;
      gap: var(--space-1);
      min-width: 0;
    }

    .branch-switch-option-main strong,
    .branch-switch-option-main small {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .branch-switch-option-main strong {
      font-size: var(--font-size-body);
      font-weight: var(--font-weight-semibold);
    }

    .branch-switch-option-main small {
      color: var(--muted);
      font-size: var(--font-size-caption);
    }

    .branch-switch-option-status {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .branch-switch-dialog-state {
      display: grid;
      justify-items: center;
      gap: var(--space-2);
      min-height: 140px;
      padding: var(--space-5);
      color: var(--muted);
      text-align: center;
    }

    .branch-switch-dialog-state.error {
      color: var(--red);
    }

    .branch-switch-dialog-note {
      margin: 0;
      color: var(--muted);
      font-size: var(--font-size-caption);
      line-height: var(--line-height-body);
    }

    .confirm-dialog-body {
      display: grid;
      grid-template-columns: var(--control-large) minmax(0, 1fr);
      gap: var(--space-4);
      padding: var(--space-5);
    }

    .confirm-dialog-icon {
      display: grid;
      place-items: center;
      width: var(--control-large);
      height: var(--control-large);
      color: var(--red);
      background: var(--red-soft);
      border-radius: var(--radius-large);
    }

    .confirm-dialog-title {
      margin: 0;
      color: var(--text);
      font-size: var(--font-size-section);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-title);
    }

    .confirm-dialog-description {
      margin: var(--space-2) 0 0;
      color: var(--muted);
      line-height: var(--line-height-body);
    }

    .confirm-dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: var(--space-2);
      padding: var(--space-4) var(--space-5);
      background: var(--surface-2);
      border-top: 1px solid var(--border-soft);
    }

    .workspace-entry-dialog {
      width: min(520px, 100%);
    }

    .workspace-entry-dialog-body {
      grid-template-columns: var(--control-large) minmax(0, 1fr);
    }

    .workspace-entry-dialog-body p {
      margin: var(--space-2) 0 0;
      overflow: hidden;
      color: var(--muted);
      font-size: var(--font-size-caption);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workspace-entry-dialog-form {
      padding: 0 var(--space-5) var(--space-5);
    }

    .workspace-entry-dialog-field {
      display: grid;
      gap: var(--space-2);
      color: var(--text-soft);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-semibold);
    }

    .workspace-entry-dialog-field input {
      width: 100%;
      height: var(--control-default);
      padding: 0 var(--space-3);
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-regular);
      font-size: var(--font-size-body);
    }

    .workspace-entry-dialog-field input:focus {
      border-color: var(--accent);
    }

    .workspace-entry-dialog-field small {
      color: var(--muted);
      font-size: var(--font-size-caption);
      font-weight: var(--font-weight-regular);
      line-height: var(--line-height-body);
    }

    .workspace-tapd-dialog {
      width: min(520px, 100%);
    }

    .button.danger.primary {
      color: #fff;
      background: var(--red);
      border-color: var(--red);
    }

    .button.danger.primary:hover {
      background: color-mix(in srgb, var(--red) 86%, #000);
    }

    .button,
    .icon-button,
    .toolbar-button,
    .rail-button,
    .quick-button,
    .sidebar-add-directory,
    .context-tab,
    .repo-row,
    .worktree-card,
    .command-result,
    .branch-name-button,
    .stage-toggle,
    .menu-button,
    .global-search,
    .workspace-switcher,
    .window-control,
    .branch-selector,
    .open-in-primary,
    .open-in-menu-trigger,
    .panel-action {
      transition:
        color var(--motion-micro) ease,
        background-color var(--motion-micro) ease,
        border-color var(--motion-micro) ease,
        box-shadow var(--motion-micro) ease,
        transform var(--motion-micro) ease;
    }

    button:disabled,
    button[aria-disabled="true"],
    [role="button"][aria-disabled="true"] {
      color: var(--color-text-disabled);
      background: var(--surface-2);
      border-color: var(--border-soft);
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.72;
      pointer-events: none;
      transform: none;
    }

    .button.is-error,
    .toolbar-button.is-error,
    .quick-button.is-error {
      color: var(--red);
      background: var(--red-soft);
      border-color: color-mix(in srgb, var(--red) 36%, var(--border));
    }

    .button.is-loading,
    .icon-button.is-loading,
    .toolbar-button.is-loading,
    .quick-button.is-loading,
    .sidebar-add-directory.is-loading {
      position: relative;
      color: transparent;
      pointer-events: none;
    }

    .button.is-loading > *,
    .icon-button.is-loading > *,
    .toolbar-button.is-loading > *,
    .quick-button.is-loading > *,
    .sidebar-add-directory.is-loading > * {
      visibility: hidden;
    }

    .button.is-loading::after,
    .icon-button.is-loading::after,
    .toolbar-button.is-loading::after,
    .quick-button.is-loading::after,
    .sidebar-add-directory.is-loading::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--icon-small);
      height: var(--icon-small);
      margin: -8px 0 0 -8px;
      border: 2px solid color-mix(in srgb, var(--text) 24%, transparent);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: control-spin 700ms linear infinite;
    }

    .button.primary.is-loading::after {
      border-top-color: #071411;
    }

    html[data-theme="light"] .button.primary.is-loading::after {
      border-top-color: #fff;
    }

    @keyframes control-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .metric-value,
    .repo-status,
    .tab-count,
    .toolbar-count,
    .mini-count,
    .commit-hash,
    .commit-time,
    .diff-stats,
    .line-no,
    .detail-value,
    .operation-state,
    .statusbar {
      font-variant-numeric: tabular-nums;
    }

    .button:active,
    .icon-button:active,
    .toolbar-button:active,
    .rail-button:active,
    .quick-button:active,
    .sidebar-add-directory:active,
    .context-tab:active,
    .repo-row:active,
    .worktree-card:active,
    .command-result:active,
    .branch-name-button:active,
    .stage-toggle:active,
    .menu-button:active,
    .global-search:active,
    .workspace-switcher:active,
    .window-control:active,
    .branch-selector:active,
    .panel-action:active {
      transform: translateY(1px);
    }

    @media (max-width: 1500px) and (min-width: 1241px) {
      .workspace-frame {
        grid-template-columns: 52px 286px minmax(0, 1fr);
      }

      .content-frame {
        grid-template-columns: minmax(0, 1fr) clamp(320px, 26vw, 400px);
      }

      .metric-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 1240px) {
      .workspace-frame {
        grid-template-columns: 48px 244px minmax(0, 1fr);
      }

      .workspace-switcher-menu {
        width: 244px;
      }

      .workspace-frame.sidebar-collapsed {
        grid-template-columns: 48px minmax(0, 1fr);
      }

      .workspace-frame.operations-view,
      .workspace-frame.settings-view {
        grid-template-columns: 48px minmax(0, 1fr);
      }

      .content-frame {
        grid-template-columns: minmax(0, 1fr) minmax(280px, 330px);
      }

      .page-scroll {
        padding: var(--page-safe-margin-narrow);
      }

      .metric-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .commit-row {
        grid-template-columns:
          var(--control-large)
          minmax(0, 1fr)
          118px
          84px
          78px;
      }

      .commit-time,
      .commit-author,
      .commit-id {
        display: block;
      }

      body:not(.inspector-open) .content-frame {
        grid-template-columns: minmax(0, 1fr);
      }

      .inspector {
        position: relative;
        display: block;
        width: auto;
        min-width: 0;
        box-shadow: none;
        transform: none;
        visibility: visible;
        pointer-events: auto;
        transition: none;
      }

      body:not(.inspector-open) .inspector {
        display: none;
      }

      .inspector-backdrop,
      body.inspector-open .inspector-backdrop {
        display: none !important;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        backdrop-filter: none;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .context-title {
        max-width: 192px;
      }

      .toolbar-button span:not(.toolbar-count) {
        display: none;
      }

    }

    @media (max-width: 1120px) {
      .workspace-frame {
        grid-template-columns: 48px 244px minmax(0, 1fr);
      }

      .global-search {
        width: min(300px, 40vw);
      }

      .page-scroll {
        padding: var(--page-safe-margin-narrow);
      }
    }

    @media (max-width: 1040px) {
      .statusbar-item:nth-last-child(-n + 2) {
        display: none;
      }

      .page-heading {
        gap: var(--space-4);
      }

      .page-actions {
        justify-content: flex-start;
        width: 100%;
      }

      .settings-page .page-actions {
        justify-content: flex-end;
      }
    }

    @media (max-width: 760px) {
      .commit-row {
        grid-template-columns:
          var(--control-large)
          minmax(0, 1fr);
      }

      .commit-time,
      .commit-author,
      .commit-id {
        display: none;
      }

      .commit-detail-list {
        grid-template-columns: minmax(0, 1fr);
      }

      .commit-detail-list .detail-row:last-child {
        grid-column: auto;
      }

      .settings-page-scroll {
        padding: var(--space-4);
      }

      .settings-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .settings-nav {
        position: static;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--space-1);
      }

      .settings-nav-label,
      .settings-nav-divider {
        grid-column: 1 / -1;
      }

      .settings-nav-divider {
        margin-top: var(--space-2);
        margin-bottom: var(--space-2);
      }

      .settings-info-grid,
      .settings-option-grid,
      .settings-option-grid.three,
      .settings-ai-field-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .settings-setting-row,
      .settings-shortcut-row {
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
        gap: var(--space-2);
      }

      .settings-ai-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .settings-ai-actions-buttons {
        justify-content: flex-end;
      }

      .settings-account-preview {
        align-items: stretch;
        flex-direction: column;
      }

      .settings-account-actions {
        justify-content: flex-start;
      }

      .settings-switch {
        margin-bottom: var(--space-1);
      }

      .settings-shortcut-keys {
        justify-content: flex-start;
      }

      .settings-card-footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#mainContent">跳到主内容</a>
  <div class="app-shell">
    <header class="titlebar">
      <div class="brand">
        <span class="brand-mark" id="brandMark"></span>
        <span>GitNest</span>
      </div>
      <div class="menu-strip">
        <details class="titlebar-file-menu" data-dropdown-id="titlebar-file" ontoggle="positionDetailsMenu(event.currentTarget, { side: 'bottom' })">
          <summary>文件</summary>
          <div class="titlebar-file-popover menu-surface" id="titlebarFileMenu" role="menu"></div>
        </details>
        <details class="titlebar-help-menu" data-dropdown-id="titlebar-help" ontoggle="positionDetailsMenu(event.currentTarget, { side: 'bottom' })">
          <summary>帮助</summary>
          <div class="titlebar-file-popover menu-surface" id="titlebarHelpMenu" role="menu"></div>
        </details>
      </div>
      <div class="title-spacer"></div>
      <button class="global-search" aria-haspopup="dialog" aria-controls="commandOverlay" onclick="openCommandPalette()">
        <span class="search-label" id="globalSearchLabel"></span>
        <kbd>Ctrl K</kbd>
      </button>
      <div class="window-controls">
        <button class="window-control" aria-label="最小化" id="minimizeButton"></button>
        <button class="window-control" aria-label="最大化" id="maximizeButton"></button>
        <button class="window-control close" aria-label="关闭" id="closeButton"></button>
      </div>
    </header>

    <div class="workspace-frame">
      <nav class="activity-rail" aria-label="主导航">
        <button class="rail-button" id="sidebarToggleRail" aria-label="折叠仓库目录" aria-pressed="false" title="折叠仓库目录" onclick="toggleRepositorySidebar()"></button>
        <div class="rail-divider" aria-hidden="true"></div>
        <button class="rail-button active" id="workspaceRail" aria-label="Workspace 总览" title="Workspace 总览" onclick="openWorkspace()"></button>
        <button class="rail-button" id="operationRail" aria-label="操作中心" title="操作中心" onclick="showOperationCenter()">
        </button>
        <button class="rail-button" id="searchRail" aria-label="全局搜索" title="全局搜索" onclick="openCommandPalette()"></button>
        <div class="rail-spacer"></div>
        <button class="rail-button" id="terminalRail" aria-label="打开终端" title="打开终端" onclick="openDefaultTerminal('repository')"></button>
        <button class="rail-button" id="themeRail" aria-label="切换主题" title="切换主题" onclick="toggleTheme()"></button>
        <button class="rail-button" id="settingsRail" aria-label="设置" title="设置" onclick="openSettings()"></button>
      </nav>

      <aside class="workspace-sidebar">
        <div class="workspace-switcher-wrap" id="workspaceSwitcherWrap">
          <button class="workspace-switcher" aria-label="切换 Workspace" aria-expanded="false" aria-haspopup="menu" onclick="toggleWorkspaceSwitcher()">
            <span class="workspace-avatar" id="workspaceAvatar"></span>
            <span class="workspace-meta">
              <span class="workspace-name">GitNest Workspace</span>
              <span class="workspace-caption">1 个 Workspace · 本地持久化</span>
            </span>
            <span id="workspaceChevron"></span>
          </button>
          <div class="workspace-switcher-menu menu-surface" id="workspaceSwitcherMenu" role="menu" hidden></div>
        </div>

        <div class="sidebar-search-wrap">
          <div class="sidebar-search-field" id="sidebarSearchField"></div>
          <div class="sidebar-repository-menu-wrap" id="sidebarRepositoryMenuWrap">
            <button id="sidebarRepositoryMenuButton" class="sidebar-repository-menu-trigger" type="button" aria-label="仓库筛选菜单" aria-haspopup="menu" aria-expanded="false" title="仓库筛选菜单" onclick="toggleSidebarRepositoryMenu()"></button>
            <div class="sidebar-repository-menu menu-surface" id="sidebarRepositoryMenu" role="menu" hidden></div>
          </div>
        </div>

        <div class="repository-list" id="repositoryList" oncontextmenu="openRepositoryPanelContextMenu(event)"></div>

        <div class="sidebar-footer">
          <button class="sidebar-add-directory" aria-label="添加目录" title="添加目录" onclick="showToast('添加目录', '选择目录后将加入当前 Workspace。', 'plus')">
            <span id="addDirectoryIcon"></span>
            <span>添加目录</span>
          </button>
          <button class="icon-button" aria-label="重新扫描 Workspace" title="重新扫描 Workspace" id="rescanButton" onclick="runOperation('scan', event.currentTarget)"></button>
        </div>
      </aside>

      <section class="workbench">
        <div class="commandbar" id="commandbar"></div>
        <nav class="context-tabs" id="contextTabs" aria-label="上下文导航"></nav>
        <div class="content-frame">
          <main class="main-content" id="mainContent" tabindex="-1"></main>
          <button class="inspector-backdrop" aria-label="关闭详情面板" onpointerdown="rememberInspectorBackdropPointer(event)" onpointerup="closeInspectorFromBackdrop(event)"></button>
          <aside class="inspector" id="inspector"></aside>
        </div>
      </section>
    </div>

    <footer class="statusbar">
      <span class="statusbar-item"><span class="online-dot"></span>Git 2.53.0</span>
      <span class="statusbar-item" id="statusWorkspace"></span>
      <span class="statusbar-item" id="statusOperation"></span>
      <span class="statusbar-spacer"></span>
      <span class="statusbar-item" id="statusWatcher"></span>
      <span class="statusbar-item">本地只读快照 · 未 Fetch · 不执行 Git 命令</span>
    </footer>
  </div>

  <div id="workspaceContextMenuMount"></div>

  <div class="command-overlay" id="commandOverlay" role="presentation" aria-hidden="true" inert onpointerdown="rememberPaletteBackdropPointer(event)" onpointerup="closePaletteFromBackdrop(event)">
    <div class="command-palette" role="dialog" aria-modal="true" aria-labelledby="commandPaletteTitle">
      <span id="commandPaletteTitle" hidden>GitNest 命令面板</span>
      <div class="command-input-wrap">
        <span id="paletteSearchIcon"></span>
        <input id="commandInput" name="command-search" class="command-input" aria-label="搜索仓库、分支或命令" autocomplete="off" spellcheck="false" placeholder="搜索仓库、分支或执行命令…" oninput="renderCommandResults()" onkeydown="handleCommandInputKeydown(event)" />
        <kbd class="command-key">Esc</kbd>
      </div>
      <div class="command-results" id="commandResults"></div>

    function resolveMenuPlacement(
      anchorRect,
      menuRect,
      {
        align = "start",
        gap = 4,
        side = "right",
        viewportPadding = 8
      } = {}
    ) {
      const sideFits = {
        right:
          anchorRect.right + gap + menuRect.width <=
          window.innerWidth - viewportPadding,
        left:
          anchorRect.left - gap - menuRect.width >=
          viewportPadding,
        bottom:
          anchorRect.bottom + gap + menuRect.height <=
          window.innerHeight - viewportPadding,
        top:
          anchorRect.top - gap - menuRect.height >=
          viewportPadding
      };
      const oppositeSide = {
        right: "left",
        left: "right",
        bottom: "top",
        top: "bottom"
      };
      const resolvedSide = sideFits[side]
        ? side
        : oppositeSide[side];
      const alignPosition = (start, end, size) => {
        if (align === "end") return end - size;
        if (align === "center") {
          return start + (end - start - size) / 2;
        }
        return start;
      };
      const crossAxisPosition =
        resolvedSide === "left" || resolvedSide === "right"
          ? alignPosition(
              anchorRect.top,
              anchorRect.bottom,
              menuRect.height
            )
          : alignPosition(
              anchorRect.left,
              anchorRect.right,
              menuRect.width
            );
      const rawLeft =
        resolvedSide === "right"
          ? anchorRect.right + gap
          : resolvedSide === "left"
            ? anchorRect.left - menuRect.width - gap
            : crossAxisPosition;
      const rawTop =
        resolvedSide === "bottom"
          ? anchorRect.bottom + gap
          : resolvedSide === "top"
            ? anchorRect.top - menuRect.height - gap
            : crossAxisPosition;
      const clampToViewport = (value, size, viewportSize) => {
        const maximum = Math.max(
          viewportPadding,
          viewportSize - size - viewportPadding
        );
        return Math.min(
          maximum,
          Math.max(viewportPadding, value)
        );
      };

      return {
        left: clampToViewport(
          rawLeft,
          menuRect.width,
          window.innerWidth
        ),
        side: resolvedSide,
        top: clampToViewport(
          rawTop,
          menuRect.height,
          window.innerHeight
        )
      };
    }

      menu.style.position = "fixed";
      menu.style.left = `${placement.left}px`;
      menu.style.top = `${placement.top}px`;
      menu.dataset.menuSide = placement.side;

    function handleMenuKeyboard(event) {
      if (!(event.target instanceof Element)) return false;
      const menu = event.target.closest(".menu-surface");
      if (!menu) return false;

      const items = [
        ...menu.querySelectorAll(
          '[role^="menuitem"]:not(:disabled)'
        )
      ].filter(
        (item) => item.closest(".menu-surface") === menu
      );
      if (!items.length) return false;

      const currentIndex = items.indexOf(event.target);
      let nextIndex = null;
      if (event.key === "ArrowDown") {
        nextIndex = (currentIndex + 1) % items.length;
      } else if (event.key === "ArrowUp") {
        nextIndex =
          (currentIndex - 1 + items.length) % items.length;
      } else if (event.key === "Home") {
        nextIndex = 0;
      } else if (event.key === "End") {
        nextIndex = items.length - 1;
      }

      if (nextIndex === null) return false;
      event.preventDefault();
      items[nextIndex].focus();
      return true;
    }

    function renderDiffPreview(selected) {
      const lines = selected ? diffPreviewLines(selected) : [];

      const input = document.getElementById("diffSearchInput");

      } else if (typeof cursorPosition === "number" && typeof input.setSelectionRange === "function") {
        const nextPosition = Math.min(cursorPosition, input.value.length);
        input.setSelectionRange(nextPosition, nextPosition);
      }

      if (
        state.view !== "repository" ||
        state.tab !== "changes" ||
        !state.selectedFile

        return;

      state.diffSearchOpen = true;
      renderChanges();
      focusDiffSearchInput(state.diffSearchQuery.length, true);
      scrollToCurrentDiffSearchMatch();

    function updateDiffSearch(value, cursorPosition = value.length) {

    function moveDiffSearchMatch(direction) {
      const selected = currentChangedFiles().find(
        (file) => file.path === state.selectedFile

      const matches = collectDiffSearchMatches(
        selected ? diffPreviewLines(selected) : [],
        state.diffSearchQuery

      if (!matches.length) return;

      state.diffSearchActiveMatch += direction;
      renderChanges();
      focusDiffSearchInput();
      scrollToCurrentDiffSearchMatch();
    }

    function handleDiffSearchKeydown(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        event.stopPropagation();
        moveDiffSearchMatch(event.shiftKey ? -1 : 1);

        event.preventDefault();
        event.stopPropagation();
        closeDiffSearch();

    function currentCommits() {
      const repo = currentRepo();
      const overrides = recentCommitOverrides[repo.id];
      const seededCommits = overrides
        ? overrides.map((override) => repoCommit(repo, override))
        : [
            repoCommit(repo),
            repoCommit(repo, {
              hash: `${repo.head.slice(0, 5)}a1`,
              subject: `chore(${repo.name}): 更新仓库配置`,
              date: "2026-09-01T10:20:00+08:00"
            }),
            repoCommit(repo, {
              hash: `${repo.head.slice(0, 5)}b2`,
              subject: `fix(${repo.name}): 补充状态检查`,
              date: "2026-08-30T16:45:00+08:00"
            })
          ];
      const subjects = [
        `refactor(${repo.name}): 优化模块边界`,
        `docs(${repo.name}): 更新开发说明`,
        `feat(${repo.name}): 完善工作流`,
        `test(${repo.name}): 补充回归用例`,
        `chore(${repo.name}): 同步依赖版本`
      ];
      const authors = [
        repo.lastAuthor,
        "niliang",
        "hls",
        "刘俊鑫",
        "jakcychen"
      ];

      return [
        ...seededCommits,
        ...Array.from(
          { length: Math.max(0, 50 - seededCommits.length) },
          (_, offset) => {
            const index = seededCommits.length + offset;
            const date = new Date(repo.lastDate);
            date.setDate(date.getDate() - index);
            return repoCommit(repo, {
              hash: `${repo.head.slice(0, 4)}${String(index + 1).padStart(3, "0")}`,
              author: authors[offset % authors.length],
              date: date.toISOString(),
              subject: subjects[offset % subjects.length]
            });
          }
        )
      ];
    }

    function filteredHistoryCommits(commits = currentCommits()) {
      const query = (state.historyFilter || "").trim().toLowerCase();
      if (!query) return commits;

      return commits.filter((commit) => [
        commit.subject,
        commit.author,
        commit.hash,
        commit.refs.join(" "),
        commit.time
      ].join(" ").toLowerCase().includes(query));

    const tapdKeywordStorageKey =
