    const normalizeTapdKeyword = (value) =>
      String(value || "")
        .trim()
        .replace(/\s+/g, " ");
    function applyTapdKeywordToCommitMessage(message, keyword) {
      const normalizedKeyword = normalizeTapdKeyword(keyword);
      if (!normalizedKeyword) {
        return message;
      }

      const normalizedMessage = String(message || "").trim();
      if (!normalizedMessage) {
        return message;
      }

      const lines = normalizedMessage.split(/\r?\n/);
      if (lines.some((line) => line.trim() === normalizedKeyword)) {
        return normalizedMessage;
      }
      if (lines.length === 1) {
        return `${lines[0]}\n${normalizedKeyword}`;
      }
      return [
        lines[0],
        normalizedKeyword,
        ...lines.slice(1)
      ].join("\n");
    }

            !state.removedRepositoryIds.has(repo.id)
        )
      );
    }

    function renderSidebarRepositoryMenu() {
      const menu = document.getElementById("sidebarRepositoryMenu");
      const trigger = document.getElementById("sidebarRepositoryMenuButton");
      if (!menu || !trigger) return;

      trigger.setAttribute(
        "aria-expanded",
        String(state.sidebarRepositoryMenuOpen)
      );
      menu.hidden = !state.sidebarRepositoryMenuOpen;
      if (!state.sidebarRepositoryMenuOpen) {
        menu.innerHTML = "";
        return;
      }

      const repositoryFilterOption = state.sidebarChangedRepositoriesOnly
        ? renderMenuItem({
            label: "全部仓库",
            leading: icon("layers", 15),
            attributes:
              'onclick="toggleSidebarChangedRepositories()"'
          })
        : renderMenuItem({
            label: "变更仓库",
            leading: icon("fileCode", 15),
            attributes:
              'onclick="toggleSidebarChangedRepositories()"'
          });
      const groups = sidebarRepositoryGroupNames();
      const hasExpandedGroup = groups.some(
        (group) => !state.collapsedGroups.has(group)
      );
      const groupActionOption = groups.length
        ? renderMenuItem({
            label: hasExpandedGroup ? "收起分组" : "展开分组",
            leading: icon(
              hasExpandedGroup ? "chevronRight" : "chevronDown",
              15
            ),
            attributes: `onclick="setAllRepoGroupsCollapsed(${hasExpandedGroup})"`
          })
        : "";

      menu.innerHTML = `${repositoryFilterOption}${groupActionOption}`;
      positionAnchoredMenu(menu, trigger, {
        side: "bottom"
      });
    }

    function toggleSidebarRepositoryMenu() {
      state.sidebarRepositoryMenuOpen = !state.sidebarRepositoryMenuOpen;
      renderSidebarRepositoryMenu();
    }

    function closeSidebarRepositoryMenu() {
      if (!state.sidebarRepositoryMenuOpen) return;
      state.sidebarRepositoryMenuOpen = false;
      renderSidebarRepositoryMenu();
    }

    function persistSidebarRepositoryPreferences() {
      try {
        localStorage.setItem(
          sidebarRepositoryPreferencesStorageKey,
          JSON.stringify({
            changedRepositoriesOnly:
              state.sidebarChangedRepositoriesOnly,
            collapsedGroups: [...state.collapsedGroups]
          })
        );
      } catch {
        // 本地预览在受限环境下仍可正常工作，只是不保存偏好。
      }
    }

    function toggleSidebarChangedRepositories() {
      state.sidebarChangedRepositoriesOnly =
        !state.sidebarChangedRepositoriesOnly;
      persistSidebarRepositoryPreferences();
      closeSidebarRepositoryMenu();
      renderSidebar();
    }

    function hydrateStaticIcons() {

      document.getElementById("workspaceRail").insertAdjacentHTML("afterbegin", icon("workspace"));

        leading: icon("plus", 14),

    function orderSidebarGroups(groups) {
      const knownGroups = new Set(groups);
      const savedGroups = state.groupOrder.filter((group) =>
        knownGroups.has(group)
      );
      const savedSet = new Set(savedGroups);
      return [
        ...savedGroups,
        ...groups.filter((group) => !savedSet.has(group))
      ];
    }

    function sidebarGroupNames(groupRepositories) {
      return orderSidebarGroups([
        ...new Set([
          ...groupRepositories.map((repo) => repositoryGroupName(repo)),
          ...state.groupOrder,
          ...Object.keys(state.groupDisplayNames)
        ])
      ]).filter(
        (group) => !state.removedEmptyGroupNames.has(group)
      );
    }

    function clearGroupDragClasses() {
      document.querySelectorAll(
        ".group-header.dragging, .group-header.drag-over-before, .group-header.drag-over-after"
      ).forEach((header) => {
        header.classList.remove(
          "dragging",
          "drag-over-before",
          "drag-over-after"
        );
      });
    }

    function startGroupDrag(event, trigger) {
      const group = trigger.dataset.group;
      if (!group) return;

      state.draggedGroup = group;
      state.dragOverGroup = "";
      state.dragOverPosition = "";
      state.groupDragSuppressUntil = Date.now() + 800;
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", group);
      clearGroupDragClasses();
      trigger.classList.add("dragging");
    }

    function dragOverGroup(event, trigger) {
      const source = state.draggedGroup;
      const target = trigger.dataset.group;
      if (!source || !target || source === target) return;

      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      const bounds = trigger.getBoundingClientRect();
      const position = event.clientY < bounds.top + bounds.height / 2
        ? "before"
        : "after";
      state.dragOverGroup = target;
      state.dragOverPosition = position;
      clearGroupDragClasses();
      document.querySelector(
        `.group-header[data-group="${CSS.escape(source)}"]`
      )?.classList.add("dragging");
      trigger.classList.add(`drag-over-${position}`);
    }

    function endGroupDrag() {
      clearGroupDragClasses();
      state.draggedGroup = "";
      state.dragOverGroup = "";
      state.dragOverPosition = "";
    }

    function dropGroup(event, trigger) {
      event.preventDefault();
      const source = state.draggedGroup;
      const target = trigger.dataset.group;
      if (!source || !target || source === target) {
        endGroupDrag();
        return;
      }

      const groups = sidebarGroupNames(
        repositories.filter(
          (repo) =>
            repo.id !== "workspace-root" &&
            !repo.standalone &&
            !state.removedRepositoryIds.has(repo.id)
        )
      );
      const nextGroups = groups.filter((group) => group !== source);
      const targetIndex = nextGroups.indexOf(target);
      if (targetIndex < 0) {
        endGroupDrag();
        return;
      }

      const insertIndex = targetIndex +
        (state.dragOverPosition === "after" ? 1 : 0);
      nextGroups.splice(insertIndex, 0, source);
      state.groupOrder = nextGroups;
      endGroupDrag();
      renderSidebar();
    }

    function renderSidebar() {
      const showChangedRepositoriesOnly =
        state.sidebarChangedRepositoriesOnly;
      const query = (document.getElementById("repoSearch")?.value || "").trim().toLowerCase();
      const entrySearchText = `${workspaceEntryDisplayName("workspace-root")} ${workspaceSnapshot.rootPath}`.toLowerCase();
      const entryMatches = !query || entrySearchText.includes(query);
      const sidebarRepositories = repositories.filter((repo) =>
        !repo.standalone &&
        !state.removedRepositoryIds.has(repo.id)
        && (!showChangedRepositoriesOnly || hasLocalRepositoryChanges(repo))
      );
      const standaloneRepositories = repositories.filter((repo) =>
        repo.standalone &&
        (!showChangedRepositoriesOnly || hasLocalRepositoryChanges(repo))
      );
      const groups = sidebarGroupNames(sidebarRepositories);
      const groupsHtml = groups.map((group, groupIndex) => {
          const repos = sidebarRepositories.filter((repo) =>
          repositoryGroupName(repo) === group && (entryMatches || `${repo.name} ${repo.branch} ${repo.path}`.toLowerCase().includes(query))
        );
        if (!repos.length && (query || showChangedRepositoriesOnly)) return "";
        const isCollapsed = state.collapsedGroups.has(group);
        const groupBodyId = `repo-group-body-${groupIndex}`;
        return `
          <section class="repo-group ${isCollapsed ? "collapsed" : ""}">
            <button type="button" class="group-header" draggable="true" aria-expanded="${!isCollapsed}" aria-controls="${groupBodyId}" data-group="${escapeHtml(group)}" onclick="toggleRepoGroup(event.currentTarget)" oncontextmenu="openGroupContextMenu(event, '${escapeHtml(group)}')" ondragstart="startGroupDrag(event, event.currentTarget)" ondragover="dragOverGroup(event, event.currentTarget)" ondrop="dropGroup(event, event.currentTarget)" ondragend="endGroupDrag()">
              ${icon("chevronDown")}
              <span>${escapeHtml(groupDisplayName(group))}</span>
              <span class="group-count">${repos.length}</span>
            </button>
            <div class="repo-group-body" id="${groupBodyId}" aria-hidden="${isCollapsed}" ${isCollapsed ? "inert" : ""}>
              <div class="repo-group-inner">
                ${repos.length
                  ? repos.map((repo) => renderRepoRow(repo, "workspace-root", repo.id)).join("")
                  : `<div class="repo-group-empty">暂无仓库</div>`}
              </div>
            </div>
          </section>
        `;
      }).join("");

      const workspaceRootVisible = !state.removedEntryIds.has("workspace-root");
      const workspaceRootHtml = workspaceRootVisible && (entryMatches || groupsHtml)
        ? `
          <section class="workspace-root selected ${state.workspaceRootCollapsed ? "collapsed" : ""}">
            <button type="button" class="workspace-root-heading" aria-current="true" aria-expanded="${!state.workspaceRootCollapsed}" aria-haspopup="menu" aria-controls="workspace-root-body" onclick="toggleWorkspaceRoot()" oncontextmenu="openWorkspaceContextMenu(event, 'workspace-root')">
              <span class="workspace-root-icon">${icon("folder", 15)}</span>
              <span class="workspace-root-copy">
                <strong>${workspaceEntryDisplayName("workspace-root")}</strong>
                <small title="${workspaceSnapshot.rootPath}">${workspaceSnapshot.rootPath}</small>
              </span>
              <span class="workspace-root-toggle" aria-hidden="true">${icon(state.workspaceRootCollapsed ? "chevronRight" : "chevronDown", 14)}</span>
            </button>
            <div class="workspace-root-body" id="workspace-root-body" aria-hidden="${state.workspaceRootCollapsed}" ${state.workspaceRootCollapsed ? "inert" : ""}>
              <div class="workspace-root-body-inner">
                ${groupsHtml}
              </div>
            </div>
          </section>
        `
        : "";

      const standaloneHtml = standaloneRepositories
        .filter((repo) => !state.removedEntryIds.has(repo.id))
        .filter((repo) => {
          const text = `${workspaceEntryDisplayName(repo.id)} ${repo.name} ${repo.branch} ${repo.path}`.toLowerCase();
          return !query || text.includes(query);
        })
        .map((repo) => {
          const selected = state.view === "repository" && state.repoId === repo.id;
          const bodyId = `standalone-repo-body-${repo.id}`;
          return `
            <section class="workspace-root standalone-workspace-root ${selected ? "selected" : ""}">
              <button type="button" class="workspace-root-heading" ${selected ? 'aria-current="true"' : ""} aria-expanded="true" aria-haspopup="menu" aria-controls="${bodyId}" onclick="openStandaloneEntry('${repo.id}')" oncontextmenu="openWorkspaceContextMenu(event, '${repo.id}')">
                <span class="workspace-root-icon">${icon("repository", 15)}</span>
                <span class="workspace-root-copy">
                  <strong>${workspaceEntryDisplayName(repo.id)}</strong>
                  <small title="${repoAbsolutePath(repo)}">${repoAbsolutePath(repo)}</small>
                </span>
                <span class="workspace-root-toggle" aria-hidden="true">${icon("chevronDown", 14)}</span>
              </button>
              <div class="workspace-root-body" id="${bodyId}">
                <div class="workspace-root-body-inner">
                  <div class="repo-group">
                    <div class="repo-group-body">
                      <div class="repo-group-inner">
                        ${renderRepoRow(repo, repo.id)}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          `;
        })
        .join("");

      const html = workspaceRootHtml;
      document.getElementById("repositoryList").innerHTML = html || `
        <div class="empty-state">
          <div>
            <div class="empty-state-icon">${icon("search", 22)}</div>
            <div class="empty-state-title">没有匹配的仓库</div>
            <div class="empty-state-description">当前筛选条件未匹配仓库，请修改关键词或清除筛选。</div>
            <div class="empty-state-actions">
              ${renderButton({
                label: "清除筛选",
                size: "small",
                variant: "default",
                attributes: 'onclick="clearRepositoryFilter()"'
              })}
            </div>
          </div>
        </div>
      `;
      renderWorkspaceSwitcherMenu();
      renderWorkspaceContextMenu();
    }

    function hasLocalRepositoryChanges(repo) {
      return repo.changes > 0 || repo.conflicts > 0;
    }

    function setAllRepoGroupsCollapsed(collapsed) {
      const groups = sidebarRepositoryGroupNames();
      state.collapsedGroups.clear();
      if (collapsed) {
        groups.forEach((group) => state.collapsedGroups.add(group));
      }
      persistSidebarRepositoryPreferences();
      closeSidebarRepositoryMenu();
      renderSidebar();
    }

    function toggleWorkspaceRoot() {
      withCommitDraftGuard(() => {
        state.repoId = "workspace-root";
        state.view = "workspace";
        state.tab = "overview";
        state.workspaceRootCollapsed = !state.workspaceRootCollapsed;
        renderMain();
      });
    }

    function toggleRepoGroup(trigger) {
      if (Date.now() < state.groupDragSuppressUntil) {
        state.groupDragSuppressUntil = 0;
        return;
      }
      const section = trigger.closest(".repo-group");
      const group = trigger.dataset.group;
      if (!section || !group) return;

      const nextCollapsed = !section.classList.contains("collapsed");
      const body = section.querySelector(".repo-group-body");
      section.classList.toggle("collapsed", nextCollapsed);
      trigger.setAttribute("aria-expanded", String(!nextCollapsed));
      if (body) {
        body.setAttribute("aria-hidden", String(nextCollapsed));
        body.inert = nextCollapsed;
      }

      if (nextCollapsed) state.collapsedGroups.add(group);
      else state.collapsedGroups.delete(group);
      persistSidebarRepositoryPreferences();
    }

    function renderRepoRow(repo, entryId = "workspace-root", targetRepoId = null) {
      const status = repo.conflicts
        ? `<span class="repo-status conflict">${icon("alert", 11)}${repo.conflicts}</span>`
        : repo.changes
          ? `<span class="repo-status dirty">M ${repo.changes}</span>`
        : repo.behind
          ? `<span class="repo-status behind">↓ ${repo.behind}</span>`
          : repo.ahead
            ? `<span class="repo-status ahead">↑ ${repo.ahead}</span>`
              : "";

      return `
        <button type="button" class="repo-row ${state.view === "repository" && state.repoId === repo.id ? "active" : ""}" aria-label="打开仓库 ${repo.name}" aria-haspopup="menu" ${state.view === "repository" && state.repoId === repo.id ? 'aria-current="page"' : ""} onclick="openRepository('${repo.id}')" oncontextmenu="openWorkspaceContextMenu(event, '${entryId}', '${escapeHtml(repo.name)}', ${targetRepoId ? `'${targetRepoId}'` : "null"})">
          <span class="repo-icon ${repo.status}">${icon("repository", 14)}</span>
          <span class="repo-main">
            <span class="repo-name">${repo.name}</span>
            <span class="repo-branch">${icon("branch", 11)}<span>${repo.branch}</span></span>
          </span>
          ${status}
        </button>
      `;
    }

    function getWorkspaceContextMenuPosition(event, menuWidth, menuHeight) {
      const viewportPadding = 8;
      const maxX = Math.max(viewportPadding, window.innerWidth - menuWidth - viewportPadding);
      const maxY = Math.max(viewportPadding, window.innerHeight - menuHeight - viewportPadding);

      return {
        x: Math.max(viewportPadding, Math.min(event.clientX, maxX)),
        y: Math.max(viewportPadding, Math.min(event.clientY, maxY))
      };
    }

    function openWorkspaceContextMenu(event, entryId, targetName = "", targetRepoId = null) {
      event.preventDefault();
      event.stopPropagation();

      const entry = workspaceEntryDetails(entryId);
      if (!entry || state.removedEntryIds.has(entryId)) return;

      const menuWidth = 222;
      const menuHeight = entryId === "workspace-root" ? 176 : 136;
      const position = getWorkspaceContextMenuPosition(event, menuWidth, menuHeight);
      state.contextMenuReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      state.contextMenu = {
        entryId,
        targetName: targetName || "",
        targetRepoId,
        ...position
      };
      renderWorkspaceContextMenu();
    }

    function openGroupContextMenu(event, groupName) {
      event.preventDefault();
      event.stopPropagation();

      const menuWidth = 222;
      const menuHeight = 104;
      const position = getWorkspaceContextMenuPosition(event, menuWidth, menuHeight);
      state.contextMenuReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      state.contextMenu = {
        entryId: "workspace-root",
        groupName,
        ...position
      };
      renderWorkspaceContextMenu();
    }

    function openRepositoryPanelContextMenu(event) {
      if (event.target !== event.currentTarget) return;

      event.preventDefault();
      event.stopPropagation();

      const menuWidth = 222;
      const menuHeight = 50;
      const position = getWorkspaceContextMenuPosition(
        event,
        menuWidth,
        menuHeight
      );
      state.contextMenuReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      state.contextMenu = {
        entryId: "workspace-root",
        panel: true,
        ...position
      };
      renderWorkspaceContextMenu();
    }

    function openChangeFileContextMenu(event, filePath) {
      event.preventDefault();
      event.stopPropagation();

      const repo = currentRepo();
      const file = (changedFilesByRepo[repo.id] || []).find(
        (item) => item.path === filePath
      );
      if (!file) return;

      const menuWidth = 222;
      const menuHeight = 52;
      const position = getWorkspaceContextMenuPosition(
        event,
        menuWidth,
        menuHeight
      );
      state.selectedFile = file.path;
      state.contextMenuReturnFocus =
        document.activeElement instanceof HTMLElement
          ? document.activeElement
          : null;
      state.contextMenu = {
        filePath: file.path,
        repoId: repo.id,
        ...position
      };
      renderChanges();
      renderWorkspaceContextMenu();
    }

    let contextOpenInCloseTimer = null;

    function openContextOpenInSubmenu(container) {
      if (contextOpenInCloseTimer !== null) {
        clearTimeout(contextOpenInCloseTimer);
        contextOpenInCloseTimer = null;
      }
      container?.classList.add("submenu-open");
      positionAnchoredMenu(
        container?.querySelector(
          ".workspace-context-open-in-submenu"
        ),
        container?.closest(".workspace-context-menu")
      );
    }

    function scheduleContextOpenInSubmenuClose(container) {
      if (contextOpenInCloseTimer !== null) {
        clearTimeout(contextOpenInCloseTimer);
      }
      contextOpenInCloseTimer = setTimeout(() => {
        contextOpenInCloseTimer = null;
        container?.classList.remove("submenu-open");
      }, 120);
    }

    function renderWorkspaceContextMenu() {
      const mount = document.getElementById("workspaceContextMenuMount");
      if (!mount) return;

      const context = state.contextMenu;
      if (context?.filePath) {
        mount.innerHTML = `
          <div class="workspace-context-menu menu-surface" role="menu" aria-label="${escapeHtml(context.filePath)} 文件操作" style="left:${context.x}px;top:${context.y}px">
            <div class="workspace-context-open-in" onmouseenter="openContextOpenInSubmenu(event.currentTarget)" onmouseleave="scheduleContextOpenInSubmenuClose(event.currentTarget)" onfocusin="openContextOpenInSubmenu(event.currentTarget)" onfocusout="scheduleContextOpenInSubmenuClose(event.currentTarget)">
              ${renderMenuItem({
                label: "打开方式",
                leading: icon("external", 14),
                trailing: icon("chevronRight", 14),
                className: "workspace-context-open-in-trigger",
                title: "选择用于打开此文件的应用",
                attributes: 'aria-haspopup="menu"'
              })}
              <div class="workspace-context-open-in-submenu menu-surface" role="menu" aria-label="选择用于打开此文件的应用">
                ${renderMenuHeading("Open in")}
                ${openInApplications.map((application) =>
                  renderMenuItem({
                    label: application.label,
                    leading: openInApplicationIcon(application.kind),
                    attributes: `onclick="openContextFileWithApplication('${application.kind}')"`
                  })
                ).join("")}
              </div>
            </div>
          </div>
        `;
        requestAnimationFrame(() => {
          mount.querySelector("button")?.focus();
        });
        return;
      }

      if (context?.groupName) {
        const title = groupDisplayName(context.groupName);
        const repositoryCount = getGroupRepositoryCount(
          context.groupName
        );
        const canDelete = repositoryCount === 0;
        mount.innerHTML = `
          <div class="workspace-context-menu menu-surface" role="menu" aria-label="${escapeHtml(title)} 分组操作" style="left:${context.x}px;top:${context.y}px">
            ${renderMenuItem({
              label: "重命名分组",
              leading: icon("settings", 14),
              attributes: 'onclick="renameContextGroup()"'
            })}
            ${renderMenuSeparator()}
            ${renderMenuItem({
              label: "删除分组",
              leading: icon("alert", 14),
              className: "danger",
              disabled: !canDelete,
              title: canDelete
                ? "删除空分组"
                : "分组中仍有仓库，无法删除",
              attributes: 'onclick="removeContextGroup()"'
            })}
          </div>
        `;
        requestAnimationFrame(() => {
          mount.querySelector("button")?.focus();
        });
        return;
      }

      if (context?.panel) {
        mount.innerHTML = `
          <div class="workspace-context-menu menu-surface" role="menu" aria-label="仓库面板操作" style="left:${context.x}px;top:${context.y}px">
            ${renderMenuItem({
              label: "添加分组",
              leading: icon("plus", 14),
              attributes:
                'onclick="addRepositoryGroupFromContext()"'
            })}
          </div>
        `;
        requestAnimationFrame(() => {
          mount.querySelector("button")?.focus();
        });
        return;
      }

      const entry = context ? workspaceEntryDetails(context.entryId) : null;
      if (!context || !entry) {
        mount.innerHTML = "";
        return;
      }

      const title = context.targetName || entry.displayName;
      mount.innerHTML = `
        <div class="workspace-context-menu menu-surface" role="menu" aria-label="${escapeHtml(title)} 操作" style="left:${context.x}px;top:${context.y}px">
          ${renderMenuItem({
            label: "修改显示名称",
            leading: icon("settings", 14),
            attributes: 'onclick="renameContextWorkspaceEntry()"'
          })}
          ${context.entryId === "workspace-root" ? renderMenuItem({
            label: "设置 TAPD 关键字",
            leading: icon("tag", 14),
            title: state.tapdKeyword
              ? `当前关键字：${state.tapdKeyword}`
              : "为当前 Workspace 配置 TAPD 关键字",
            attributes: 'onclick="configureTapdKeywordFromContext()"'
          }) : ""}
          ${renderMenuItem({
            label: "重新扫描",
            leading: icon("refresh", 14),
            attributes: 'onclick="rescanContextWorkspaceEntry()"'
          })}
          ${renderMenuSeparator()}
          ${renderMenuItem({
            label: "移出 Workspace",
            leading: icon("alert", 14),
            className: "danger",
            attributes: 'onclick="removeContextWorkspaceEntry()"'
          })}
        </div>
      `;
      requestAnimationFrame(() => {
        mount.querySelector("button")?.focus();
      });
    }

    function closeWorkspaceContextMenu({ restoreFocus = true } = {}) {
      const returnFocus = state.contextMenuReturnFocus;
      state.contextMenu = null;
      state.contextMenuReturnFocus = null;
      renderWorkspaceContextMenu();
      if (restoreFocus && returnFocus?.isConnected) returnFocus.focus();
    }

    function addRepositoryGroupFromContext() {
      closeWorkspaceContextMenu({ restoreFocus: false });
      showToast("添加分组", "将在当前 Workspace 中创建新的仓库分组。", "plus");
    }

    function openContextFileWithApplication(kind) {
      const context = state.contextMenu;
      if (!context?.filePath) return;

      const application = openInApplications.find(
        (candidate) => candidate.kind === kind
      );
      if (!application) {
        showErrorToast("无法打开本地应用", "所选应用当前不可用。");
        return;
      }

      const repo =
        repositories.find((item) => item.id === context.repoId) ||
        currentRepo();
      const filePath = context.filePath;
      const absolutePath =
        `${repoAbsolutePath(repo)}\\${filePath.replace(/\//g, "\\")}`;
      setOpenInPreference(application.kind, "file");
      closeWorkspaceContextMenu({ restoreFocus: false });
      renderCommandbar();
      showToast(
        `已使用 ${application.label} 打开`,
        `${absolutePath}（交互原型，不会实际启动本地程序）`,
        application.kind === "file-explorer"
          ? "folder"
          : application.kind === "terminal" ||
              application.kind === "git-bash"
            ? "terminal"
            : "external"
      );
    }

    function renameContextGroup() {
      const context = state.contextMenu;
      if (!context?.groupName) return;

      const returnFocus = state.contextMenuReturnFocus || document.activeElement;
      closeWorkspaceContextMenu({ restoreFocus: false });
      openRenameGroupDialog(context.groupName, returnFocus);
    }

    function getGroupRepositoryCount(groupName) {
      return repositories.filter(
        (repo) =>
          !repo.standalone &&
          !state.removedEntryIds.has(repo.id) &&
          !state.removedRepositoryIds.has(repo.id) &&
          repositoryGroupName(repo) === groupName
      ).length;
    }

    function removeContextGroup() {
      const context = state.contextMenu;
      if (!context?.groupName) return;

      const groupName = context.groupName;
      const title = groupDisplayName(groupName);
      if (getGroupRepositoryCount(groupName) > 0) return;

      closeWorkspaceContextMenu({ restoreFocus: false });
      state.removedEmptyGroupNames.add(groupName);
      state.collapsedGroups.delete(groupName);
      state.groupOrder = state.groupOrder.filter(
        (group) => group !== groupName
      );
      delete state.groupDisplayNames[groupName];
      persistSidebarRepositoryPreferences();
      renderSidebar();
      showToast(
        "分组已删除",
        `“${title}”已从当前 Workspace 的本地视图中移除。`,
        "check"
      );
    }

    function renameContextWorkspaceEntry() {
      const context = state.contextMenu;
      const entry = context ? workspaceEntryDetails(context.entryId) : null;
      if (!context || !entry) return;

      const returnFocus = state.contextMenuReturnFocus || document.activeElement;
      closeWorkspaceContextMenu({ restoreFocus: false });
      openRenameEntryDialog(entry.id, returnFocus);
    }

    function rescanContextWorkspaceEntry() {
      const context = state.contextMenu;
      if (!context) return;
      closeWorkspaceContextMenu({ restoreFocus: false });
      runOperation("scan");
    }

    function configureTapdKeywordFromContext() {
      const context = state.contextMenu;
      if (!context || context.entryId !== "workspace-root") return;

      const returnFocus =
        state.contextMenuReturnFocus || document.activeElement;
      closeWorkspaceContextMenu({ restoreFocus: false });
      openTapdKeywordDialog(returnFocus);
    }

    function removeContextWorkspaceEntry() {
      const context = state.contextMenu;
      const entry = context ? workspaceEntryDetails(context.entryId) : null;
      if (!context || !entry) return;

      closeWorkspaceContextMenu({ restoreFocus: false });
      const targetRepository = context.targetRepoId
        ? repositories.find((repo) => repo.id === context.targetRepoId)
        : null;
      const targetName = targetRepository?.name || entry.displayName;
      const targetPath = targetRepository
        ? repoAbsolutePath(targetRepository)
        : entry.path;
      openConfirmDialog({
        title: `移出 ${targetName}？`,
        description: `设计预览只会将“${targetName}”从 Workspace 配置中移除，不会删除磁盘上的目录、仓库或提交。`,
        actionLabel: "确认移出",
        onConfirm: () => {
          if (targetRepository) {
            state.removedRepositoryIds.add(targetRepository.id);
          } else {
            state.removedEntryIds.add(entry.id);
          }
          if (state.repoId === targetRepository?.id || state.repoId === entry.id || entry.id === "workspace-root") {
            state.repoId = "workspace-root";
            state.view = "workspace";
            state.tab = "overview";
          }
          renderSidebar();
          renderMain();
          showToast("已移出 Workspace", `${targetName} 已从设计预览配置中移除。`, "check");
        }
      });
    }

    function persistTapdKeyword() {
      try {
        if (state.tapdKeyword) {
          localStorage.setItem(tapdKeywordStorageKey, state.tapdKeyword);
        } else {
          localStorage.removeItem(tapdKeywordStorageKey);
        }
      } catch {
        // 文件预览环境可能禁用持久化。
      }
    }

    function openTapdKeywordDialog(returnFocus = null) {
      const overlay = document.getElementById("tapdKeywordOverlay");
      const input = document.getElementById("tapdKeywordInput");
      if (!overlay || !input) return;

      state.tapdKeywordReturnFocus =
        returnFocus instanceof HTMLElement ? returnFocus : null;
      document.getElementById("tapdKeywordDescription").textContent =
        `${workspaceEntryDisplayName("workspace-root")} · ${workspaceSnapshot.rootPath}`;
      document.getElementById("tapdKeywordIcon").innerHTML = icon("tag", 22);
      input.value = state.tapdKeyword;
      document.querySelector(".app-shell").inert = true;
      overlay.inert = false;
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
      focusAfterInertSettles(input, state.tapdKeywordReturnFocus);
    }

    function rememberTapdKeywordBackdropPointer(event) {
      state.tapdKeywordPointerDownOnBackdrop =
        event.target === event.currentTarget;
    }

    function closeTapdKeywordFromBackdrop(event) {
      const shouldClose =
        state.tapdKeywordPointerDownOnBackdrop &&
        event.target === event.currentTarget;
      state.tapdKeywordPointerDownOnBackdrop = false;
      if (shouldClose) closeTapdKeywordDialog();
    }

    function closeTapdKeywordDialog({ restoreFocus = true } = {}) {
      const overlay = document.getElementById("tapdKeywordOverlay");
      if (!overlay || !overlay.classList.contains("open")) return;

      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      overlay.inert = true;
      document.querySelector(".app-shell").inert = false;
      document.body.classList.remove("modal-open");
      const returnFocus = state.tapdKeywordReturnFocus;
      state.tapdKeywordReturnFocus = null;
      if (restoreFocus && returnFocus?.isConnected) returnFocus.focus();
    }

    function saveTapdKeyword(event) {
      event.preventDefault();
      const input = document.getElementById("tapdKeywordInput");
      if (!input) return;

      const value = normalizeTapdKeyword(input.value);
      if (value.length > 120) {
        showErrorToast("TAPD 关键字无效", "请输入不超过 120 个字符的单行关键字。");
        input.focus();
        return;
      }

      state.tapdKeyword = value;
      persistTapdKeyword();
      const returnFocus = state.tapdKeywordReturnFocus;
      closeTapdKeywordDialog({ restoreFocus: false });
      renderSidebar();
      showToast(
        value ? "TAPD 关键字已保存" : "TAPD 关键字已清除",
        value
          ? `AI 生成提交信息时将自动添加“${value}”。`
          : "AI 生成提交信息时不再自动添加关键字。",
        "check"
      );
      if (returnFocus?.isConnected) returnFocus.focus();
    }

    function openStandaloneEntry(repoId) {
      const repository = repositories.find((repo) => repo.id === repoId && repo.standalone);
      if (!repository || state.removedEntryIds.has(repoId)) return;

      withCommitDraftGuard(() => {
        state.repoId = repoId;
        state.view = "repository";
        state.tab = "overview";
        renderSidebar();
        renderMain();
      });
    }

    function openRenameEntryDialog(entryId, returnFocus = null) {
      const entry = workspaceEntryDetails(entryId);
      const overlay = document.getElementById("renameEntryOverlay");
      if (!entry || !overlay) return;

      state.renameEntryId = entryId;
      state.renameGroupName = null;
      state.renameReturnFocus = returnFocus instanceof HTMLElement ? returnFocus : null;
      document.getElementById("renameEntryTitle").textContent = "修改显示名称";
      document.getElementById("renameEntryDescription").textContent = `${entry.kind} · ${entry.path}`;
      document.getElementById("renameEntryIcon").innerHTML = icon("settings", 22);
      document.getElementById("renameEntryFieldLabel").textContent = "显示名称";
      document.getElementById("renameEntryHelp").textContent = "仅修改 Workspace 中的显示名称，不会改动磁盘路径或仓库内容。";
      document.getElementById("renameEntryAction").textContent = "保存名称";
      const input = document.getElementById("renameEntryInput");
      input.value = entry.displayName;
      document.querySelector(".app-shell").inert = true;
      overlay.inert = false;
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
      focusAfterInertSettles(input, state.renameReturnFocus);
    }

    function openRenameGroupDialog(groupName, returnFocus = null) {
      const overlay = document.getElementById("renameEntryOverlay");
      if (!overlay) return;

      state.renameEntryId = null;
      state.renameGroupName = groupName;
      state.renameReturnFocus = returnFocus instanceof HTMLElement ? returnFocus : null;
      document.getElementById("renameEntryTitle").textContent = "重命名分组";
      document.getElementById("renameEntryDescription").textContent = `自动识别名称：${groupName}`;
      document.getElementById("renameEntryIcon").innerHTML = icon("folder", 22);
      document.getElementById("renameEntryFieldLabel").textContent = "分组名称";
      document.getElementById("renameEntryHelp").textContent = "默认使用包含多个仓库的目录名，也可以修改为更易读的名称。";
      document.getElementById("renameEntryAction").textContent = "保存分组名称";
      const input = document.getElementById("renameEntryInput");
      input.value = groupDisplayName(groupName);
      document.querySelector(".app-shell").inert = true;
      overlay.inert = false;
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
      focusAfterInertSettles(input, state.renameReturnFocus);
    }

    function rememberRenameBackdropPointer(event) {
      state.renamePointerDownOnBackdrop = event.target === event.currentTarget;
    }

    function closeRenameFromBackdrop(event) {
      const shouldClose = state.renamePointerDownOnBackdrop && event.target === event.currentTarget;
      state.renamePointerDownOnBackdrop = false;
      if (shouldClose) closeRenameEntryDialog();
    }

    function closeRenameEntryDialog({ restoreFocus = true } = {}) {
      const overlay = document.getElementById("renameEntryOverlay");
      if (!overlay || !overlay.classList.contains("open")) return;

      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      overlay.inert = true;
      document.querySelector(".app-shell").inert = false;
      document.body.classList.remove("modal-open");
      const returnFocus = state.renameReturnFocus;
      state.renameEntryId = null;
      state.renameGroupName = null;
      state.renameReturnFocus = null;
      if (restoreFocus && returnFocus?.isConnected) returnFocus.focus();
    }

    function saveWorkspaceEntryName(event) {
      event.preventDefault();
      const entryId = state.renameEntryId;
      const groupName = state.renameGroupName;
      const input = document.getElementById("renameEntryInput");
      const entry = entryId ? workspaceEntryDetails(entryId) : null;
      const value = input.value.trim();
      if (!entry && !groupName) return;
      if (!value || value.length > 120) {
        showErrorToast("显示名称无效", "请输入 1 到 120 个字符。");
        input.focus();
        return;
      }

      if (groupName) {
        state.groupDisplayNames[groupName] = value;
        const returnFocus = state.renameReturnFocus;
        closeRenameEntryDialog({ restoreFocus: false });
        renderSidebar();
        showToast("分组名称已更新", `${groupName} 已更新为 ${value}。`, "check");
        if (returnFocus?.isConnected) returnFocus.focus();
        return;
      }

      state.entryDisplayNames[entry.id] = value;
      const returnFocus = state.renameReturnFocus;
      closeRenameEntryDialog({ restoreFocus: false });
      document.getElementById("statusWorkspace").innerHTML = `${icon("workspace")}${workspaceEntryDisplayName("workspace-root")}`;
      renderSidebar();
      renderMain();
      showToast("显示名称已更新", `${entry.displayName} 已更新为 ${value}。`, "check");
      if (returnFocus?.isConnected) returnFocus.focus();
    }

    function renderCommandbar() {
      closeOpenInMenu();
      if (
        state.view === "settings" ||
        state.view === "operations"
      ) {
        document.getElementById("commandbar").replaceChildren();
        return;
      }

      const repo = currentRepo();
      const isWorkspace = state.view === "workspace";
      const commandbar = document.getElementById("commandbar");

      commandbar.innerHTML = isWorkspace ? `
        <div class="context-identity">
          <span class="context-icon">${icon("workspace", 18)}</span>
          <span>
            <div class="context-title">${workspaceEntryDisplayName("workspace-root")}</div>
            <div class="context-subtitle" title="${escapeHtml(workspaceSnapshot.rootPath)}">${icon("folder", 11)}<span>${escapeHtml(workspaceSnapshot.rootPath)}</span></div>
          </span>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-actions-group">
          ${renderOpenInControl("workspace")}
          <div class="toolbar-actions">
            <button class="toolbar-button" aria-label="预览刷新 Workspace" onclick="runOperation('scan', event.currentTarget)">${icon("refresh")}<span>刷新</span></button>
            <button class="toolbar-button" aria-label="预览 Pull 全部仓库" onclick="runOperation('pull-all', event.currentTarget)">${icon("arrowDown")}<span>Pull</span><span class="toolbar-count">${workspaceSnapshot.totalRepositories}</span></button>
            <button class="toolbar-button" aria-label="预览 Push 全部仓库" onclick="runOperation('push-all', event.currentTarget)">${icon("arrowUp")}<span>Push</span></button>
            <button class="toolbar-button" aria-label="预览 Fetch 全部仓库" onclick="runOperation('fetch-all', event.currentTarget)">${icon("download")}<span>Fetch</span></button>
            <button class="icon-button" aria-label="切换详情面板" aria-pressed="${state.inspectorOpen}" onclick="toggleInspector()">${icon("panel")}</button>
          </div>
        </div>
      ` : `
        <div class="context-identity">
          <span class="context-icon">${icon("repository", 18)}</span>
          <span>
            <div class="context-title">${repo.name}</div>
            <div class="context-subtitle" title="${escapeHtml(repoAbsolutePath(repo))}">${icon("folder", 11)}<span>${escapeHtml(repoAbsolutePath(repo))}</span></div>
          </span>
        </div>
        <div class="toolbar-divider"></div>
        <button class="branch-selector" aria-haspopup="dialog" onclick="openBranchSwitchDialog(event.currentTarget)">${icon("branch")}<span>${repo.branch}</span>${icon("chevronDown", 12)}</button>
        <div class="toolbar-actions-group">
          ${renderOpenInControl("repository")}
          <div class="toolbar-actions">
            <button class="toolbar-button" aria-label="预览 Pull ${repo.name}${repo.behind ? `，本地跟踪引用显示落后 ${repo.behind} 个提交` : ""}" onclick="runOperation('pull', event.currentTarget)">${icon("arrowDown")}<span>Pull</span>${repo.behind ? `<span class="toolbar-count">${repo.behind}</span>` : ""}</button>
            <button class="toolbar-button" aria-label="预览 Push ${repo.name}${repo.ahead ? `，领先 ${repo.ahead} 个提交` : ""}" onclick="runOperation('push', event.currentTarget)">${icon("arrowUp")}<span>Push</span>${repo.ahead ? `<span class="toolbar-count">${repo.ahead}</span>` : ""}</button>
            <button class="toolbar-button" aria-label="预览 Fetch ${repo.name}" onclick="runOperation('fetch', event.currentTarget)">${icon("download")}<span>Fetch</span></button>
            <button class="icon-button" aria-label="切换详情面板" aria-pressed="${state.inspectorOpen}" onclick="toggleInspector()">${icon("panel")}</button>
          </div>
        </div>
      `;
    }

    function persistToolPreferences() {
      try {
        localStorage.setItem(
          toolPreferencesStorageKey,
          JSON.stringify({
            defaultTerminal: state.toolPreferences.defaultTerminal,
            workspaceApplication: state.toolPreferences.workspaceApplication,
            repositoryApplication: state.toolPreferences.repositoryApplication,
            fileApplication: state.toolPreferences.fileApplication,
            commitPanelHeight: state.commitPanelHeight
          })
        );
      } catch {
        // 文件预览环境可能禁用持久化。
      }
    }

    function applyCommitPanelHeightToDom(height) {
      const composer = document.querySelector(".commit-composer");
      if (!composer) return;
      composer.style.height = `${height}px`;
      composer
        .querySelector(".commit-resize-handle")
        ?.setAttribute("aria-valuenow", String(height));
    }

    function setCommitPanelHeightPreference(value) {
      const nextHeight = clampDiffCommitPanelHeight(value);
      if (nextHeight === state.commitPanelHeight) {
        applyCommitPanelHeightToDom(nextHeight);
        return nextHeight;
      }
      state.commitPanelHeight = nextHeight;
      persistToolPreferences();
      applyCommitPanelHeightToDom(nextHeight);
      return nextHeight;
    }

    let commitPanelResizeSession = null;

    function startCommitPanelResize(event) {
      if (event.button !== 0) return;
      const handle = event.currentTarget;
      const composer = handle?.closest(".commit-composer");
      if (!composer) return;
      commitPanelResizeSession = {
        composer,
        handle,
        pointerId: event.pointerId,
        startY: event.clientY,
        startHeight: state.commitPanelHeight
      };
      handle.setPointerCapture?.(event.pointerId);
      document.body.classList.add("is-resizing-commit-panel");
      event.preventDefault();
    }

    function moveCommitPanelResize(event) {
      const session = commitPanelResizeSession;
      if (!session || event.pointerId !== session.pointerId) return;
      const nextHeight = clampDiffCommitPanelHeight(
        session.startHeight + session.startY - event.clientY
      );
      session.composer.style.height = `${nextHeight}px`;
      session.handle.setAttribute("aria-valuenow", String(nextHeight));
      event.preventDefault();
    }

    function finishCommitPanelResize(event) {
      const session = commitPanelResizeSession;
      if (
        !session ||
        (event?.pointerId != null && event.pointerId !== session.pointerId)
      ) {
        return;
      }
      const renderedHeight = Number.parseFloat(session.composer.style.height);
      const nextHeight = clampDiffCommitPanelHeight(
        Number.isFinite(renderedHeight)
          ? renderedHeight
          : state.commitPanelHeight
      );
      if (session.handle.hasPointerCapture?.(session.pointerId)) {
        session.handle.releasePointerCapture(session.pointerId);
      }
      commitPanelResizeSession = null;
      document.body.classList.remove("is-resizing-commit-panel");
      setCommitPanelHeightPreference(nextHeight);
    }

    function handleCommitPanelResizeKeydown(event) {
      const step = event.shiftKey ? 32 : 8;
      let nextHeight = state.commitPanelHeight;
      if (event.key === "ArrowUp") {
        nextHeight += step;
      } else if (event.key === "ArrowDown") {
        nextHeight -= step;
      } else if (event.key === "Home") {
        nextHeight = diffCommitPanelHeightMin;
      } else if (event.key === "End") {
        nextHeight = diffCommitPanelHeightMax;
      } else {
        return;
      }
      event.preventDefault();
      setCommitPanelHeightPreference(nextHeight);
    }

    function openInPreferenceKey(scope) {
      return scope === "workspace"
        ? "workspaceApplication"
        : scope === "file"
          ? "fileApplication"
          : "repositoryApplication";
    }

    function preferredOpenInKind(scope) {
      const key = openInPreferenceKey(scope);
      return (
        state.toolPreferences?.[key] ||
        state.openInPreferred ||
        openInApplications[0].kind
      );
    }

    function setOpenInPreference(kind, scope) {
      if (!openInApplications.some((application) => application.kind === kind)) {
        return;
      }
      state.toolPreferences[openInPreferenceKey(scope)] = kind;
      if (scope === "repository") {
        state.openInPreferred = kind;
      }
      persistToolPreferences();
    }

    function allTerminalTools() {
      return terminalTools;
    }

    function terminalToolByKind(kind) {
      return allTerminalTools().find((tool) => tool.kind === kind);
    }

    function setDefaultTerminal(kind) {
      const tool = terminalToolByKind(kind);
      if (!tool) return;
      state.toolPreferences.defaultTerminal = kind;
      persistToolPreferences();
      renderSettingsPage();
      showToast("默认终端已更新", `${tool.label} 将用于打开新的终端会话。`, "terminal");
    }

    function openDefaultTerminal(scope) {
      const tool = terminalToolByKind(state.toolPreferences.defaultTerminal);
      if (!tool) return;
      const targetPath =
        scope === "workspace"
          ? workspaceSnapshot.rootPath
          : repoAbsolutePath(currentRepo());
      showToast(
        `已准备使用 ${tool.label} 打开终端`,
        `${targetPath} · ${tool.path}（交互原型，不会实际启动本地程序）`,
        "terminal"
      );
    }

    function renderOpenInControl(scope) {
      const preferred = openInApplications.find((application) => application.kind === preferredOpenInKind(scope))
        || openInApplications[0];
      const contextLabel = scope === "workspace" ? "Workspace 根目录" : "当前 Worktree";
      return `
        <div class="open-in-control" data-open-in-control data-open-in-scope="${scope}">
          <button
            type="button"
            class="open-in-primary"
            aria-label="Open in ${preferred.label}"
            title="使用 ${preferred.label} 打开${contextLabel}"
            onclick="openPreferredExternalApplication('${scope}', event.currentTarget)"
          >
            ${openInApplicationIcon(preferred.kind)}
            <span class="open-in-label">Open in ${preferred.label}</span>
          </button>
          <button
            type="button"
            class="open-in-menu-trigger"
            aria-label="选择打开方式"
            aria-haspopup="menu"
            aria-expanded="${state.openInMenuOpen}"
            title="选择另一个本地应用"
            onclick="toggleOpenInMenu(event.currentTarget)"
          >${icon("chevronDown", 12)}</button>
        </div>
      `;
    }

    function openInApplicationIcon(kind) {
      const application = openInApplications.find((candidate) => candidate.kind === kind);
      if (application?.icon) {
        return `<img aria-hidden="true" class="open-in-app-icon" src="${application.icon}" alt="">`;
      }
      const icons = {
        vscode: `<svg aria-hidden="true" class="open-in-app-icon" viewBox="0 0 24 24"><path d="M17.25 2.8 7.57 11.6 3.4 8.43 1.5 9.5v5l1.9 1.08 4.17-3.18 9.68 8.8L22.5 19V5l-5.25-2.2Zm-.2 5.08v8.24L11.75 12l5.3-4.12Z" fill="#23a9f2"/></svg>`,
        cursor: `<svg aria-hidden="true" class="open-in-app-icon" viewBox="0 0 24 24"><rect fill="#f7f7f7" height="22" rx="5" width="22" x="1" y="1"/><path d="m12 3.5 8.5 8.5-8.5 8.5L3.5 12 12 3.5Z" fill="#111"/><path d="m12 8 4 4-4 4-4-4 4-4Z" fill="#f7f7f7"/></svg>`,
        "intellij-idea": `<svg aria-hidden="true" class="open-in-app-icon" viewBox="0 0 24 24"><rect fill="#ff2d8d" height="22" rx="4" width="22" x="1" y="1"/><path d="M1 14 14 1h9v8L9 23H1v-9Z" fill="#6b45ff"/><path d="m12 23 11-11v11H12Z" fill="#22c7e8"/><rect fill="#090909" height="14" width="14" x="5" y="5"/><path d="M8 8h1.6v6H8V8Zm3 0h4v1.4h-2.35v2.8c0 .45-.1.85-.3 1.18-.2.34-.48.6-.84.78-.35.18-.77.27-1.25.27H10v-1.4h.25c.25 0 .44-.07.57-.2.13-.14.2-.34.2-.61V8Z" fill="#fff"/><path d="M8 16h6" stroke="#fff" stroke-width="1.2"/></svg>`,

      };
      return icons[kind] || icon("external", 16);
    }

    function toggleOpenInMenu(trigger) {
      const control = trigger.closest("[data-open-in-control]");
      if (!control) return;
      if (state.openInMenuOpen) {
        closeOpenInMenu();
        return;
      }
      const scope = control.dataset.openInScope;
      const contextLabel = scope === "workspace" ? "Workspace 根目录" : "当前 Worktree";
      const menu = document.createElement("div");
      menu.id = "openInFloatingMenu";
      menu.className = "open-in-menu menu-surface";
      menu.setAttribute("role", "menu");
      menu.setAttribute("aria-label", `选择用于打开${contextLabel}的应用`);
      menu.innerHTML = [
        renderMenuHeading("Open in"),
        ...openInApplications.map((application) =>
          renderMenuItem({
            label: application.label,
            leading: openInApplicationIcon(application.kind),
            attributes: `onclick="openExternalApplication('${application.kind}', '${scope}')"`
          })
        )
      ].join("");
      menu.hidden = true;
      document.body.appendChild(menu);
      dropdownManager.register({
        id: "open-in",
        trigger,
        menu,
        placement: {
          align: "end",
          side: "bottom"
        },
        onOpen: () => {
          state.openInMenuOpen = true;
        },
        onClose: (controller) => {
          state.openInMenuOpen = false;
          controller.menu?.remove();
        }
      });
      dropdownManager.get("open-in")?.open();
    }

    function closeOpenInMenu({ restoreFocus = false } = {}) {
      dropdownManager.get("open-in")?.close({ restoreFocus });
      dropdownManager.unregister("open-in", { close: false });
      state.openInMenuOpen = false;
      document.getElementById("openInFloatingMenu")?.remove();
      document.querySelectorAll("[data-open-in-control]").forEach((control) => {
        const trigger = control.querySelector(".open-in-menu-trigger");
        if (trigger) trigger.setAttribute("aria-expanded", "false");
      });
    }

    function openPreferredExternalApplication(scope) {
      openExternalApplication(preferredOpenInKind(scope), scope);
    }

    function openExternalApplication(kind, scope) {
      const application = openInApplications.find((candidate) => candidate.kind === kind);
      if (!application) {
        showErrorToast("无法打开本地应用", "所选应用当前不可用。");
        return;
      }
      setOpenInPreference(application.kind, scope);
      closeOpenInMenu();
      renderCommandbar();
      const targetPath = scope === "workspace"
        ? workspaceSnapshot.rootPath
        : repoAbsolutePath(currentRepo());
      showToast(
        `已使用 ${application.label} 打开`,
        `${targetPath}（交互原型，不会实际启动本地程序）`,
        application.kind === "file-explorer"
          ? "folder"
          : application.kind === "terminal" || application.kind === "git-bash"
            ? "terminal"
            : "external"
      );
    }

    function renderTabs() {
      const contextTabs = document.getElementById("contextTabs");
      if (state.view === "settings" || state.view === "operations") {
        contextTabs.innerHTML = "";
        contextTabs.removeAttribute("role");
        return;
      }

      const tabs = state.view === "workspace"
        ? [
            ["overview", "workspace", "概览", ""],
            ["repositories", "repository", "仓库", String(workspaceSnapshot.totalRepositories)],
            ["activity", "history", "活动", String(repositories.length)],
            ["worktrees", "worktree", "Worktrees", String(workspaceSnapshot.worktrees)]
          ]
        : [
            ["overview", "workspace", "概览", ""],
            ["changes", "fileCode", "变更", String(currentRepo().changes || "")],
            ["history", "history", "历史", "1"],
            ["branches", "branch", "分支", "1"],
            ["worktrees", "worktree", "Worktrees", String(currentRepo().worktrees)]
          ];

      contextTabs.setAttribute("role", "tablist");
      contextTabs.innerHTML = tabs.map(([id, iconName, label, count]) => `
        <button type="button" id="contextTab-${id}" role="tab" aria-controls="mainContent" aria-selected="${state.tab === id}" tabindex="${state.tab === id ? "0" : "-1"}" class="context-tab ${state.tab === id ? "active" : ""}" onclick="${state.view === "workspace" ? `setWorkspaceTab('${id}')` : `setRepoTab('${id}')`}" onkeydown="handleContextTabKeydown(event)">
          ${icon(iconName)}
          <span>${label}</span>
          ${count ? `<span class="tab-count">${count}</span>` : ""}
        </button>
      `).join("");
    }

    function renderMain() {
      document.title = state.view === "workspace"
        ? `GitNest · ${workspaceEntryDisplayName("workspace-root")}`
        : state.view === "settings"
          ? "设置 · GitNest"
          : state.view === "operations"
            ? "操作中心 · GitNest"
          : `${currentRepo().name} · GitNest`;
      document.querySelector(".workbench").classList.toggle("settings-view", state.view === "settings");
      document.querySelector(".workbench").classList.toggle("operations-view", state.view === "operations");
      renderCommandbar();
      renderTabs();
      updateNavigationState();

      if (state.view === "workspace") {
        if (state.tab === "repositories") renderWorkspaceRepositories();
        else if (state.tab === "activity") renderWorkspaceActivity();
        else if (state.tab === "worktrees") renderWorkspaceWorktrees();
        else renderWorkspaceOverview();
      } else if (state.view === "settings") {
        renderSettingsPage();
      } else if (state.view === "operations") {
        renderOperationCenter();
      } else {
        if (state.tab === "changes") renderChanges();
        else if (state.tab === "history") renderHistory();
        else if (state.tab === "branches") renderBranches();
        else if (state.tab === "worktrees") renderWorktrees();
        else renderRepositoryOverview();
      }

      renderSidebar();
      updateInspectorState();
      syncAccessibleHints();
    }

    function updateNavigationState() {
      const workspaceRail = document.getElementById("workspaceRail");
      const sidebarToggleRail = document.getElementById("sidebarToggleRail");
      const fullPageView =
        state.view === "operations" ||
        state.view === "settings";
      const sidebarHidden =
        state.sidebarCollapsed || fullPageView;
      const sidebarLabel = sidebarHidden ? "展开仓库目录" : "折叠仓库目录";
      if (sidebarHidden && state.workspaceSwitcherOpen) {
        closeWorkspaceSwitcher();
      }
      workspaceRail.classList.toggle("active", state.view === "workspace");
      workspaceRail.setAttribute("aria-current", state.view === "workspace" ? "page" : "false");
      sidebarToggleRail.classList.remove("active");
      sidebarToggleRail.setAttribute("aria-label", sidebarLabel);
      sidebarToggleRail.setAttribute("aria-pressed", String(sidebarHidden));
      sidebarToggleRail.title = sidebarLabel;
      sidebarToggleRail.innerHTML = icon(
        sidebarHidden ? "sidebarExpand" : "sidebarCollapse",
        18
      );
      document.getElementById("operationRail").classList.toggle("active", state.view === "operations");
      document.getElementById("settingsRail").classList.toggle("active", state.view === "settings");
      document.getElementById("operationRail").setAttribute("aria-current", state.view === "operations" ? "page" : "false");
      document.getElementById("settingsRail").setAttribute("aria-current", state.view === "settings" ? "page" : "false");
      document.querySelector(".workspace-frame").classList.toggle("sidebar-collapsed", sidebarHidden);
      document.querySelector(".workspace-frame").classList.toggle("operations-view", state.view === "operations");
      document.querySelector(".workspace-frame").classList.toggle("settings-view", state.view === "settings");
    }

    const settingsSections = [
      { id: "general", label: "通用", subtitle: "应用行为与偏好", iconName: "settings" },
      { id: "ai", label: "AI 提交信息", subtitle: "生成提交信息", iconName: "sparkle" },
      { id: "git", label: "Git", subtitle: "运行环境与 Fetch", iconName: "branch" },
      { id: "account", label: "账号与认证", subtitle: "凭据与仓库绑定", iconName: "repository" }
    ];

    function openSettings() {
      withCommitDraftGuard(() => {
        state.view = "settings";
        state.settingsSection = state.settingsSection || "general";
        state.inspectorOpen = false;
        renderMain();
      });
    }

    function setSettingsSection(section) {
      if (!settingsSections.some((item) => item.id === section)) return;
      withCommitDraftGuard(() => {
        state.view = "settings";
        state.settingsSection = section;
        renderMain();
      });
    }

    function toggleSetting(key, label) {
      if (typeof state[key] !== "boolean") return;
      state[key] = !state[key];
      renderSettingsPage();
      showToast("设置已更新", `${label}已${state[key] ? "开启" : "关闭"}。`, state[key] ? "check" : "settings");
    }

    function selectSettingOption(key, value, label) {
      state[key] = value;
      renderSettingsPage();
      showToast("设置已更新", `${label}已切换。`, "check");
    }

    function saveSettings() {
      showToast("设置已保存", "界面偏好已更新。", "check");
    }

    function persistAiSettings() {
      try {
        localStorage.setItem(
          aiSettingsStorageKey,
          JSON.stringify({
            enabled: state.aiSettings.enabled,
            url: state.aiSettings.url,
            model: state.aiSettings.model,
            apiKey: state.aiSettings.apiKey,
            prompt: state.aiSettings.prompt
          })
        );
      } catch {
        // 文件预览环境可能禁用持久化。
      }
    }

    function captureAiSettings() {
      const url = document.getElementById("aiCommitUrl");
      const model = document.getElementById("aiCommitModel");
      const apiKey = document.getElementById("aiCommitApiKey");
      const prompt = document.getElementById("aiCommitPrompt");
      if (url) state.aiSettings.url = url.value;
      if (model) state.aiSettings.model = model.value;
      if (apiKey) state.aiSettings.apiKey = apiKey.value;
      if (prompt) state.aiSettings.prompt = prompt.value;
    }

    function toggleAiSettings() {
      captureAiSettings();
      state.aiSettings.enabled = !state.aiSettings.enabled;
      persistAiSettings();
      renderSettingsPage();
      showToast(
        "AI 提交信息设置已更新",
        state.aiSettings.enabled ? "提交区域将显示 AI 生成入口。" : "提交区域将隐藏 AI 生成入口。",
        state.aiSettings.enabled ? "sparkle" : "settings"
      );
    }

    function saveAiSettings() {
      captureAiSettings();
      persistAiSettings();
      showToast(
        "AI 设置已保存",
        state.aiSettings.apiKey
          ? "URL、模型、提示词和 API Key 已保存。"
          : "URL、模型和提示词已保存，请填写 API Key 后再测试连接。",
        "check"
      );
    }

    function clearAiApiKey() {
      captureAiSettings();
      if (!state.aiSettings.apiKey) {
        showToast("无需清空", "当前没有已保存的 AI API Key。", "settings");
        return;
      }
      openConfirmDialog({
        title: "清空 AI API Key？",
        description: "生成和连接测试将不可用，直到再次保存 Key。API URL、模型和提示词不会被删除。",
        actionLabel: "确认清空 Key",
        onConfirm: () => {
          state.aiSettings.apiKey = "";
          persistAiSettings();
          renderSettingsPage();
          showToast("AI API Key 已清空", "其他 AI 设置已保留。", "check");
        }
      });
    }

    function confirmPreviewAccountRemoval() {
      openConfirmDialog({
        title: "删除 GitHub 账号？",
        description: "删除前会展示受影响的仓库绑定；正式应用始终要求确认。",
        actionLabel: "确认删除",
        onConfirm: () =>
          showToast(
            "账号删除预览完成",
            "原型未删除真实账号或凭据。",
            "alert"
          )
      });
    }

    function testAiConnection() {
      captureAiSettings();
      if (!state.aiSettings.url.trim()) {
        showErrorToast("无法测试 AI 连接", "请先填写 API URL。");
        return;
      }
      if (!state.aiSettings.model.trim()) {
        showErrorToast("无法测试 AI 连接", "请先填写模型。");
        return;
      }
      if (!state.aiSettings.apiKey.trim()) {
        showErrorToast("无法测试 AI 连接", "请先填写 API Key。");
        return;
      }
      showToast(
        "AI 连接测试完成",
        `${state.aiSettings.url.trim()} 已完成连接测试。`,
        "check"
      );
    }

    function generateCommitMessageWithAI() {
      updateCommitDraft();
      captureAiSettings();
      if (!state.aiSettings.enabled) {
        showErrorToast("AI 生成未启用", "请先在设置的“AI 提交信息”中启用。");
        return;
      }
      if (!state.aiSettings.url.trim() || !state.aiSettings.model.trim() || !state.aiSettings.apiKey.trim()) {
        showErrorToast("AI 配置不完整", "请先填写 API URL、模型和 API Key。");
        return;
      }
      if (
        currentRepo().staged <= 0 &&
        currentRepo().unstaged + currentRepo().untracked <= 0
      ) {
        showErrorToast("没有可提交变更", "请先修改、暂存或新增要提交的文件。");
        return;
      }
      const summary =
        currentRepo().staged > 0
          ? "feat: 更新已暂存变更"
          : "feat: 更新工作区变更";
      const details =
        currentRepo().staged > 0
          ? "根据当前提交范围和 AI 提交提示词生成的提交说明。"
          : "根据未暂存和未跟踪变更以及 AI 提交提示词生成的提交说明。";
      state.commitDraft.message = applyTapdKeywordToCommitMessage(
        `${summary}\n\n${details}`,
        state.tapdKeyword
      );
      state.commitDirty = true;
      renderChanges();
      showToast(
        "AI 提交信息已生成",
        "已填入提交信息。",
        "sparkle"
      );
    }

    function settingsToggle(label, description, key) {
      const enabled = Boolean(state[key]);
      return `
        <div class="settings-setting-row">
          <div>
            <div class="settings-setting-title">${label}</div>
            <div class="settings-setting-description">${description}</div>
          </div>
          <button type="button" class="settings-switch ${enabled ? "active" : ""}" aria-label="${label}" aria-pressed="${enabled}" onclick="toggleSetting('${key}', '${label}')">
            <span class="settings-switch-thumb"></span>
          </button>
        </div>
      `;
    }

    function settingsOption(key, value, iconName, title, description) {
      const selectedValue = state[key];
      const active = selectedValue === value;
      const action = `selectSettingOption('${key}', '${value}', '${title}')`;
      return `
        <button type="button" class="settings-option ${active ? "active" : ""}" aria-pressed="${active}" onclick="${action}">
          <span class="settings-option-head">
            <span class="settings-option-icon">${icon(iconName, 15)}</span>
            <span class="settings-option-title">${title}</span>
          </span>
          <span class="settings-option-description">${description}</span>
        </button>
      `;
    }

    function settingsNavItems(sections) {
      return sections.map((section) => `
        <button type="button" class="settings-nav-item ${state.settingsSection === section.id ? "active" : ""}" aria-current="${state.settingsSection === section.id ? "page" : "false"}" onclick="setSettingsSection('${section.id}')">
          ${icon(section.iconName, 16)}
          <span class="settings-nav-item-copy">
            <span class="settings-nav-item-title">${section.label}</span>
            <span class="settings-nav-item-subtitle">${section.subtitle}</span>
          </span>
        </button>
      `).join("");
    }

    function renderSettingsPage() {
      const activeSection = settingsSections.find((item) => item.id === state.settingsSection) || settingsSections[0];
      state.settingsSection = activeSection.id;
      document.getElementById("mainContent").innerHTML = `
        <div class="page-scroll settings-page-scroll">
          <div class="settings-page">
            <div class="page-heading">
              <div>
                <div class="eyebrow">${icon("settings", 14)}应用偏好</div>
                <h1 class="page-title">设置</h1>
                <p class="page-description">管理应用行为、AI 提交信息、Git 同步策略以及账号认证。</p>
              </div>
              <div class="page-actions">
                ${renderButton({
                  label: "保存设置",
                  size: "small",
                  variant: "primary",
                  icon: icon("check"),
                  attributes: 'onclick="saveSettings()"'
                })}
              </div>
            </div>

            <div class="settings-layout">
              <nav class="settings-nav panel" aria-label="设置分组">
                <div class="settings-nav-label">GitNest</div>
                ${settingsNavItems(settingsSections)}
              </nav>

              <section class="settings-content" aria-live="polite">
                ${renderSettingsSection(activeSection.id)}
              </section>
            </div>
          </div>
        </div>
      `;
      syncAccessibleHints();
    }

    function renderSettingsSection(section) {
      if (section === "ai") {
        return `
          <section class="panel settings-card">
            <div class="settings-card-header">
              <div>
                <div class="settings-card-title">AI 提交信息</div>

              </div>
              <button type="button" class="settings-switch ${state.aiSettings.enabled ? "active" : ""}" aria-label="启用 AI 生成入口" aria-pressed="${state.aiSettings.enabled}" onclick="toggleAiSettings()">
                <span class="settings-switch-thumb"></span>
              </button>
            </div>
            <div class="settings-card-body">
              <div class="settings-ai-field-grid">
                <label class="settings-ai-field">
                  API URL
                  <input id="aiCommitUrl" autocomplete="url" placeholder="https://api.example.com/v1" spellcheck="false" type="url" value="${escapeHtml(state.aiSettings.url)}" oninput="captureAiSettings()" />

                <label class="settings-ai-field">
                  模型

              ${renderTextarea({
                id: "aiCommitPrompt",
                value: state.aiSettings.prompt,
                label: "提交信息提示词",
                size: "large",
                fullWidth: true,
                fieldClassName: "settings-ai-prompt",
                maxLength: 8000,
                placeholder: "告诉 AI 如何根据变更生成提交信息。",

              <div class="settings-inline-note">${icon("check", 14)}可填写基础地址或完整的 /chat/completions 地址；基础地址会自动补全端点。</div>
              <div class="settings-ai-actions">
                <div class="settings-ai-actions-buttons">

                })}
              </div>

      if (section === "account") {
        return `
          <section class="panel settings-card">
            <div class="settings-card-header">
              <div>
                <div class="settings-card-title">添加 GitNest 账号</div>
                <div class="settings-card-description">使用 HTTPS Token，或继续交由系统 SSH 和 Credential Helper 认证。</div>
              </div>
            </div>
            <div class="settings-card-body">
              <div class="settings-ai-field-grid">
                <label class="settings-ai-field">
                  主机
                  <input autocomplete="url" placeholder="github.com" spellcheck="false" type="text" value="github.com" />
                </label>
                <label class="settings-ai-field">
                  认证方式
                  <select>
                    <option>HTTPS Token</option>
                    <option>系统 SSH / Credential Helper</option>
                  </select>
                </label>
              </div>
              <div class="settings-ai-field-grid single">
                <label class="settings-ai-field">
                  Token
                  <input autocomplete="new-password" placeholder="输入访问令牌" type="password" />

              <div class="settings-inline-note">${icon("alert", 14)}正式应用会把 Token 存入系统凭据存储；不会写入普通 JSON、日志或 Git 参数。</div>
              <div class="settings-ai-actions">
                <span></span>
                ${renderButton({
                  label: "保存账号",
                  size: "small",
                  variant: "primary",
                  icon: icon("check", 13),

                })}
              </div>

          <section class="panel settings-card">
