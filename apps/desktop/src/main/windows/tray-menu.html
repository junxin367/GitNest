<!doctype html>
<html lang="zh-CN" data-theme="__THEME__">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'; base-uri 'none'; form-action 'none'">
    <title>GitNest 托盘菜单</title>
    <style>
      /*__TOKENS__*/
      *, *::before, *::after {
        box-sizing: border-box;
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      body {
        color: var(--text);
        font-family: var(--font-sans);
        user-select: none;
      }
      .tray-menu {
        width: 100%;
        height: 100%;
        padding: var(--space-1);
        border: 1px solid var(--border);
        border-radius: var(--radius-regular);
        background: var(--surface);
        overflow: hidden;
      }
      button {
        display: block;
        width: 100%;
        height: var(--control-compact);
        padding: 0 var(--space-2);
        border: 0;
        border-radius: var(--radius-regular);
        background: transparent;
        color: var(--text-soft);
        text-align: left;
        font: inherit;
        font-size: var(--font-size-caption);
      }
      button:focus { outline: none; }
      [role="separator"] { height: 1px; margin: var(--space-1) 0; background: var(--border); }
    </style>
  </head>
  <body>
    <div class="tray-menu" role="menu" aria-label="GitNest 托盘菜单">
      <button type="button" role="menuitem" data-tray-action="show" tabindex="-1">显示 GitNest</button>
      <div role="separator"></div>
      <button type="button" role="menuitem" data-tray-action="quit" tabindex="-1">退出 GitNest</button>
    </div>
  </body>
</html>
