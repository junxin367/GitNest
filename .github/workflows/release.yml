name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to build or republish
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GITNEST_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Validate release version
        run: node scripts/validate-release-version.mjs "$env:GITNEST_RELEASE_TAG"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture boundaries
        run: pnpm check:architecture

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build Windows release
        run: pnpm dist:win

      - name: Create draft release when missing
        shell: pwsh
        run: |
          gh release view $env:GITNEST_RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITNEST_RELEASE_TAG `
              --draft `
              --generate-notes `
              --title "GitNest $env:GITNEST_RELEASE_TAG" `
              --verify-tag
          }

      - name: Synchronize updater release notes
        shell: pwsh
        run: |
          gh release view $env:GITNEST_RELEASE_TAG `
            --json body `
            --jq .body |
            Set-Content -LiteralPath release-notes.md -Encoding utf8NoBOM
          node scripts/generate-update-manifest.mjs `
            --tag $env:GITNEST_RELEASE_TAG `
            --notes-file release-notes.md

      - name: Upload release assets
        shell: pwsh
        run: |
          $version = $env:GITNEST_RELEASE_TAG.Substring(1)
          gh release upload $env:GITNEST_RELEASE_TAG `
            "release/GitNest-Setup-$version-x64.exe" `
            "release/GitNest-Portable-$version-x64.exe" `
            "release/SHA256SUMS.txt" `
            "release/release-manifest.json" `
            --clobber

      - name: Upload updater manifest last
        run: gh release upload "$env:GITNEST_RELEASE_TAG" "release/latest.json" --clobber

      - name: Publish release
        run: gh release edit "$env:GITNEST_RELEASE_TAG" --draft=false --latest
